# BOHEMIA — PAGES DEPLOY (8/6/26)
#
# THE DEADLOCK THIS EXISTS TO BREAK.
# GitHub's built-in Pages builder CANCELS an in-flight build the moment another push
# lands. Measured 8/6: FIVE consecutive builds cancelled, every one killed by the next
# lane's push, because the lanes push to main roughly every THIRTEEN MINUTES and a build
# takes longer than that. Start, killed, restart, killed — for over an hour, and NO BUILD
# EVER REACHED THE FINISH LINE. The push worked every single time, which is exactly why
# nobody could see it from inside their own lane.
#
# The 7/20 BUILD STAMP + DEPLOY VERIFY law names this ("parallel-session push storms make
# GitHub Pages CANCEL in-flight builds") but writes it as a delay to wait out. At this
# cadence it is not a delay, it is a standing deadlock: the site cannot update while every
# lane is working, and every lane is always working.
#
# THE ONE LINE THAT FIXES IT is `cancel-in-progress: false` below. A second push QUEUES
# behind the running deploy instead of killing it, so a build always finishes and the
# newest one deploys after it. Nothing about how anybody pushes has to change — which
# matters, because no lane can make the other lanes slow down.
#
# AND IT ONLY PUBLISHES WHAT IS SERVED. The built-in builder was copying the entire
# repository and timing out at thirty minutes. This assembles a site from the three
# folders a slice actually loads from — the same set `_config.yml` declares, and
# `gates/pages_publish_gate.js` fails if the two ever disagree. NOTHING IS DELETED from
# the repo; it is simply not copied into the published site.
#
# THE ONE-LINK LAW is unaffected: slices/ lands at the same path, so
# https://paolosarn.github.io/bohemia/slices/BOHEMIA_ALPHA_0_9.html never changes.
name: pages

# *** ONLY BUILD WHEN SOMETHING PUBLISHED ACTUALLY CHANGED (PLUMBER 9/22, row
# [list loads]). THIS IS THE 8/6 DEADLOCK BACK IN A NEW FORM AND IT COST PAOLO A
# BROKEN TAB. ***
# Measured off the Actions API on 9/22: NINE `pages` runs in a row cancelled, every
# one with ZERO JOBS, each cancelled at the exact second the next push created the
# next one (2314 cancelled 08:35:50, 2315 created 08:35:49). The last SUCCESSFUL
# deploy was run 2306 at 01:03 -- SEVEN AND A HALF HOURS EARLIER.
# That is not `cancel-in-progress` failing. `concurrency` keeps at most ONE run
# PENDING per group and a newer push supersedes it; cancel-in-progress:false protects
# a run that is RUNNING, and these never reached a runner. The lanes were pushing
# every 10 to 40 seconds after he voted, so the pending slot was overwritten before a
# runner was ever free and the chain never settled.
# While that loop holds, OUR builder never lands and the live site is whatever
# GitHub's Jekyll builder published -- which carries no records/ and no *.json. That
# is why his VOTE tab said THE LIST DID NOT LOAD.
# THE MEASURED FIX: 58% of the last 60 pushes to main changed NOTHING that is
# published (35 of 60, almost all of them VAMILY.md board edits). Those pushes were
# rebuilding and re-deploying an identical site, and worse, each one was flushing the
# queue. Building only when a published path changes cuts the trigger rate by more
# than half and lets the queue settle.
# The real fix is still Paolo's one click (Settings -> Pages -> Source: GitHub
# Actions), which stops the Jekyll builder existing. This makes the storm survivable
# until then, and gates/the_live_site_is_current_gate.js goes red if it ever stops
# being survivable, so nobody has to find out from his phone again.
on:
  push:
    branches: [main]
    paths:
      - 'slices/**'            # the product: the alpha and every tab it opens
      - 'engine/**'            # four un-inlined dev slices load ../engine/*.js
      - 'records/target/**'    # the ART tab, and the VOTE registry he taps
      - '_config.yml'          # changes what the other builder publishes
      - '.github/workflows/pages.yml'
      - 'tools/bohemia_cut_the_demo.js'   # the demo is cut AT DEPLOY by this
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # 9/22: to see GitHub's own "pages build and deployment" run and wait it out (below)

# THE DEADLOCK FIX. Queue, never cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PUBLISHED SET — kept in step with _config.yml's exclude list by the gate.
      #   slices/          the product: the alpha and every tab it opens
      #   engine/          four un-inlined dev slices load ../engine/*.js as script tags
      #   records/target/  the ART tab loads its target screens from there
      # THE DEMO IS CUT AT DEPLOY, SO IT CAN NEVER BE STALE IN PRODUCTION (8/26).
      # slices/BOHEMIA_DEMO.html is generated FROM the alpha by
      # tools/bohemia_cut_the_demo.js -- the law says the demo is cut from the
      # workshop and never a fork. The committed copy is real and gated, but it
      # goes stale the moment ANY lane edits the alpha, and "somebody remembers
      # to regenerate it" is exactly the manual step that left the run slice
      # four days behind engine/ without anybody noticing.
      # So the deploy re-cuts it. `set -e` means a cutter that REFUSES (it exits
      # 2 when the alpha changes shape under it) fails this build loudly rather
      # than publishing a half-demo to strangers.
      - name: cut the demo from the workshop
        run: node tools/bohemia_cut_the_demo.js

      - name: assemble the published site
        run: |
          set -e
          mkdir -p _site/records
          cp -r slices _site/slices
          cp -r engine _site/engine
          cp -r records/target _site/records/target
          touch _site/.nojekyll
          echo "published $(du -sh _site | cut -f1) out of a $(du -sh --exclude=.git . | cut -f1) tree"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # TWO BUILDERS RACE (coordinator 9/22, records/BOHEMIA_TWO_DEPLOYS_RACE_9_22_26.md).
      # GitHub's own "pages build and deployment" (workflow 314926822, Jekyll, reading
      # _config.yml) fires on the same push and, since about 9/21, SUCCEEDS in ~80 s.
      # Whichever deploy finishes LAST is the live site, and the Jekyll one carries no
      # records/ and no *.json, so when it wins the VOTE tab's registry 404s ("THE LIST
      # DID NOT LOAD", Paolo 9/22, twice) and the demo is the committed cut. Until the
      # repo's Pages source is switched to GitHub Actions (his click), THIS build waits
      # for that one to finish before it deploys, so it always lands last and always wins.
      - name: wait for GitHub's own builder so this deploy lands last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/314926822/runs?per_page=5" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get("workflow_runs",[]) if r.get("status") in ("queued","in_progress","pending","waiting","requested")))' 2>/dev/null || echo 0)
            echo "other builder runs still going: $busy (check $i)"
            [ "$busy" = "0" ] && break
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4

      # THE DEPLOY IS ONLY TRUE IF THE LIVE SITE SERVES WHAT HE TAPS (9/22). A 404 goes
      # red here instead of on his phone.
      - name: the live site serves the vote list, the alpha and the demo
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          sleep 20
          for p in records/target/BOHEMIA_VOTE_REGISTRY.json slices/BOHEMIA_ALPHA_0_9.html slices/BOHEMIA_DEMO.html slices/BOHEMIA_VOTE_TAB.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$base/$p")
            echo "$code  $p"
            [ "$code" = "200" ] || { echo "LIVE SITE DOES NOT SERVE $p (HTTP $code)"; exit 1; }
          done

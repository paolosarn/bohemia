# BOHEMIA — PAGES DEPLOY (8/6/26)
#
# THE DEADLOCK THIS EXISTS TO BREAK.
# GitHub's built-in Pages builder CANCELS an in-flight build the moment another push
# lands. Measured 8/6: FIVE consecutive builds cancelled, every one killed by the next
# lane's push, because the lanes push to main roughly every THIRTEEN MINUTES and a build
# takes longer than that. Start, killed, restart, killed — for over an hour, and NO BUILD
# EVER REACHED THE FINISH LINE. The push worked every single time, which is exactly why
# nobody could see it from inside their own lane.
#
# The 7/20 BUILD STAMP + DEPLOY VERIFY law names this ("parallel-session push storms make
# GitHub Pages CANCEL in-flight builds") but writes it as a delay to wait out. At this
# cadence it is not a delay, it is a standing deadlock: the site cannot update while every
# lane is working, and every lane is always working.
#
# THE ONE LINE THAT FIXES IT is `cancel-in-progress: false` below. A second push QUEUES
# behind the running deploy instead of killing it, so a build always finishes and the
# newest one deploys after it. Nothing about how anybody pushes has to change — which
# matters, because no lane can make the other lanes slow down.
#
# AND IT ONLY PUBLISHES WHAT IS SERVED. The built-in builder was copying the entire
# repository and timing out at thirty minutes. This assembles a site from the three
# folders a slice actually loads from — the same set `_config.yml` declares, and
# `gates/pages_publish_gate.js` fails if the two ever disagree. NOTHING IS DELETED from
# the repo; it is simply not copied into the published site.
# AND FROM 11/6 ONLY WHAT THE PAGES LOAD INSIDE THEM (PLUMBER 5, rule 411's round). Those
# three folders, copied whole, had grown to 1,858 MB in 32,040 files, over GitHub Pages'
# 1 GB limit, and 3 of the last 8 deploys died at actions/deploy-pages' 10-minute timeout.
# The copy is now tools/bohemia_publish_list.js's list, computed HERE from the committed
# tree after the demo is cut: what the alpha, the demo and the VOTE tab name, followed to
# the end; every folder the code builds names in, whole; the cards the VOTE tab can draw.
# Measured 11/6: 831 MB in 16,198 files. gates/the_site_serves_what_the_game_loads_gate.js
# plays the game on a server that answers only the list, and goes red on any file it asks
# for that the list left out.
#
# AND FROM 11/6 (PLUMBER 6, rule 418(e)) A DEPLOY THAT TIMES OUT ON GITHUB'S SIDE TRIES AGAIN BY ITSELF: three fresh
# deployments of the same upload in one run, then one fresh run sent by the workflow itself, then a red that says THE SITE IS
# BEHIND and which build is live. The live check reads the site's own BOHEMIA_SITE_SHA.txt, so it knows WHICH build answers.
# PROVEN FOR REAL 11/7: run 4295's three tries all hung at 'syncing_files'; it sent run 4298, whose third try landed and whose
# live check read its commit back (records/BOHEMIA_PLUMBER_LIGHT_AS_A_FLASH_GAME_11_6_26.md).
#
# THE ONE-LINK LAW is unaffected: slices/ lands at the same path, so
# https://paolosarn.github.io/bohemia/slices/BOHEMIA_ALPHA_0_9.html never changes.
name: pages

# *** ONLY BUILD WHEN SOMETHING PUBLISHED ACTUALLY CHANGED (PLUMBER 9/22, row
# [list loads]). THIS IS THE 8/6 DEADLOCK BACK IN A NEW FORM AND IT COST PAOLO A
# BROKEN TAB. ***
# Measured off the Actions API on 9/22: NINE `pages` runs in a row cancelled, every
# one with ZERO JOBS, each cancelled at the exact second the next push created the
# next one (2314 cancelled 08:35:50, 2315 created 08:35:49). The last SUCCESSFUL
# deploy was run 2306 at 01:03 -- SEVEN AND A HALF HOURS EARLIER.
# That is not `cancel-in-progress` failing. `concurrency` keeps at most ONE run
# PENDING per group and a newer push supersedes it; cancel-in-progress:false protects
# a run that is RUNNING, and these never reached a runner. The lanes were pushing
# every 10 to 40 seconds after he voted, so the pending slot was overwritten before a
# runner was ever free and the chain never settled.
# While that loop holds, OUR builder never lands and the live site is whatever
# GitHub's Jekyll builder published -- which carries no records/ and no *.json. That
# is why his VOTE tab said THE LIST DID NOT LOAD.
# THE MEASURED FIX: 58% of the last 60 pushes to main changed NOTHING that is
# published (35 of 60, almost all of them VAMILY.md board edits). Those pushes were
# rebuilding and re-deploying an identical site, and worse, each one was flushing the
# queue. Building only when a published path changes cuts the trigger rate by more
# than half and lets the queue settle.
# The real fix is still Paolo's one click (Settings -> Pages -> Source: GitHub
# Actions), which stops the Jekyll builder existing. This makes the storm survivable
# until then, and gates/the_live_site_is_current_gate.js goes red if it ever stops
# being survivable, so nobody has to find out from his phone again.
on:
  push:
    branches: [main]
    paths:
      - 'slices/**'            # the product: the alpha and every tab it opens
      - 'engine/**'            # four un-inlined dev slices load ../engine/*.js
      - 'records/target/**'    # the ART tab, and the VOTE registry he taps
      - '_config.yml'          # changes what the other builder publishes
      - '.github/workflows/pages.yml'
      - 'tools/bohemia_cut_the_demo.js'   # the demo is cut AT DEPLOY by this
      - 'tools/bohemia_bake_the_demo_cast.js'   # and the cut bakes the demo's six map people with this
      - 'tools/bohemia_publish_list.js'   # the list of what is published (11/6): a change to it changes the site
  # *** 11/6 PLUMBER 6, rule 418(e), THE PUBLISH NEVER BREAKS HIS FLOW (Paolo 11/6: 'I need to be able to play it too, and you're
  # fucking with the flow'). Two inputs, both empty on a push. retry_of: set ONLY by this workflow when every deploy try of a run
  # timed out and it sends itself again; a run that carries it never sends another (one fresh run per failure, never a loop).
  # rehearse_timeouts: the first N deploy tries give up after one second, so the retry and the re-send are proven on a real run
  # on demand (records/BOHEMIA_PLUMBER_THE_PUBLISH_NEVER_BREAKS_HIS_FLOW_11_6_26.md). ***
  workflow_dispatch:
    inputs:
      retry_of:
        description: 'set by the deploy itself: the run whose three tries all timed out (a run that carries this never re-sends)'
        required: false
        default: ''
      rehearse_timeouts:
        description: 'PLUMBER rehearsal: how many of the first deploy tries are made to time out after one second (0 to 3)'
        required: false
        default: '0'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # 9/22: to see GitHub's own "pages build and deployment" run and wait it out (below); 11/6: and to send this
                  # workflow again, once, when every deploy try timed out on GitHub's side (a GITHUB_TOKEN dispatch starts a run)

# THE DEADLOCK FIX. Queue, never cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    runs-on: ubuntu-latest
    # three deploy tries of at most 10 minutes each, two 4-minute pauses, the build before them about 3 minutes, the live check about 2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # PUBLISHED SET — the publish list, drawn from three roots (kept in step with _config.yml by the gate):
      #   slices/          the product: the alpha and every tab it opens
      #   engine/          the scripts the pages load as ../engine/*.js
      #   records/target/  the VOTE registry, the ART tab's target screens, the game's data
      # THE DEMO IS CUT AT DEPLOY, SO IT CAN NEVER BE STALE IN PRODUCTION (8/26).
      # slices/BOHEMIA_DEMO.html is generated FROM the alpha by
      # tools/bohemia_cut_the_demo.js -- the law says the demo is cut from the
      # workshop and never a fork. The committed copy is real and gated, but it
      # goes stale the moment ANY lane edits the alpha, and "somebody remembers
      # to regenerate it" is exactly the manual step that left the run slice
      # four days behind engine/ without anybody noticing.
      # So the deploy re-cuts it. `set -e` means a cutter that REFUSES (it exits
      # 2 when the alpha changes shape under it) fails this build loudly rather
      # than publishing a half-demo to strangers.
      # THE DEMO'S SIX MAP PEOPLE ARE BAKED BY THE CUT (RUN 10/13, [ten seconds to play] round four): baking them on
      # every boot was 1.0 s of a phone's wait for BEGIN at full speed (about 4 s at 4x). The cut bakes them once with
      # a browser (tools/bohemia_bake_the_demo_cast.js) into slices/BOHEMIA_DEMO_CAST.json, keyed to the workshop it
      # was cut from, so a re-cut here after any lane's push needs a browser to re-bake. No browser, or a failed bake:
      # the file is removed and the demo bakes them live, exactly as before; this step can never fail the deploy.
      - name: a browser for the cut's baked map people
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock --silent playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: cut the demo from the workshop
        run: node tools/bohemia_cut_the_demo.js

      # RUN TWO [his yeses in the demo], 10/19: the VOTE tab's foot lists every YES since 10/16, IN THE DEMO or NOT YET,
      # measured against THIS cut (what it loads) from the committed carriers (git's, made by the same tool). No git
      # needed here; a failure leaves the committed list and never stops a deploy.
      - name: his yeses against this demo
        continue-on-error: true
        run: node tools/bohemia_run2_yes_in_the_demo.js status

      # ONLY WHAT THE PAGES LOAD (11/6). Runs after the cut and the yes-list, so the fresh demo and the fresh
      # list are what it reads. It never deletes a file from the repo; it copies the list into _site.
      - name: assemble the published site (only what the pages load)
        run: |
          set -e
          node tools/bohemia_publish_list.js --copy _site
          touch _site/.nojekyll
          # 11/6 (rule 418(e)): the commit this site was built from, so the live check (and anyone) can read WHICH build is live,
          # not only that a page answers 200. Never in the repo; written here, at the site's root.
          echo "$GITHUB_SHA" > _site/BOHEMIA_SITE_SHA.txt
          echo "copied $(du -sh _site | cut -f1) in $(find _site -type f | wc -l) files, out of a $(du -sh --exclude=.git . | cut -f1) tree"

      # 11/14 (PLUMBER 8, the coordinator's rule 447 round): the PNGs in the site squeezed LOSSLESSLY (the same pixels, measured on
      # every one of 400; 11 to 15% smaller), never in the repo. A cache by content means only what changed is squeezed again.
      # tools/bohemia_squeeze_site.py never fails a deploy: no oxipng, a bad file or its time budget spent, and that file ships as copied.
      - name: the squeeze's cache
        uses: actions/cache@v4
        with:
          path: ~/.bohemia_squeeze
          key: bohemia-squeeze-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bohemia-squeeze-
      - name: squeeze the site's PNGs (lossless, never the repo)
        run: |
          pip install -q pyoxipng || echo "no oxipng: the site ships as copied"
          python3 tools/bohemia_squeeze_site.py _site --cache ~/.bohemia_squeeze --budget 300 || true
          echo "published $(du -sh _site | cut -f1) in $(find _site -type f | wc -l) files"

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 11/6: THE UPLOAD IS NAMED FOR ITS ATTEMPT. A re-run of a failed run kept the first attempt's upload and added its own, and
      # deploy-pages refused both: 'Multiple artifacts named "github-pages" were unexpectedly found for this workflow run. Artifact
      # count is 2.' (run 42209558695, attempt 2). One name per attempt, and every deploy try below asks for that name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # TWO BUILDERS RACE (coordinator 9/22, records/BOHEMIA_TWO_DEPLOYS_RACE_9_22_26.md).
      # GitHub's own "pages build and deployment" (workflow 314926822, Jekyll, reading
      # _config.yml) fires on the same push and, since about 9/21, SUCCEEDS in ~80 s.
      # Whichever deploy finishes LAST is the live site, and the Jekyll one carries no
      # records/ and no *.json, so when it wins the VOTE tab's registry 404s ("THE LIST
      # DID NOT LOAD", Paolo 9/22, twice) and the demo is the committed cut. Until the
      # repo's Pages source is switched to GitHub Actions (his click), THIS build waits
      # for that one to finish before it deploys, so it always lands last and always wins.
      - name: wait for GitHub's own builder so this deploy lands last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/314926822/runs?per_page=5" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get("workflow_runs",[]) if r.get("status") in ("queued","in_progress","pending","waiting","requested")))' 2>/dev/null || echo 0)
            echo "other builder runs still going: $busy (check $i)"
            [ "$busy" = "0" ] && break
            sleep 10
          done

      # *** THE DEPLOY TRIES THREE TIMES, THEN SENDS ITSELF AGAIN (PLUMBER 6, 11/6, rule 418(e)). ***
      # MEASURED: actions/deploy-pages timed out at its 10-minute limit on runs 4270, 4272, 4274, 4287 and 4288, every one
      # stuck at 'Current status: syncing_files' on GitHub's side (the upload took 20-25 s; 4288's 823 MB was the same size,
      # to 0.02%, as 4286's that landed in under a minute). The 10 minutes cannot be raised: the action caps its own timeout
      # input at MAX_TIMEOUT = 600000 (src/internal/deployment.js), and at the limit it CANCELS the deployment itself. A
      # cancelled deployment can be made again for the same commit, so each try below is a FRESH deployment of the same upload.
      # Every try may fail without failing the job (continue-on-error); the step after them decides, and says so plainly.
      # (30 s, then 90 s, between tries at first; two minutes after run 4292; four minutes after run 4298, below.)
      - id: try1
        name: deploy, try 1 of 3
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 1 && '1000' || '600000' }}
          reporting_interval: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 1 && '1000' || '5000' }}

      # MEASURED 11/7: a try made soon after a cancel reads the cancelled deployment back ('Deployment cancelled.' within seconds;
      # the deployment's id IS the commit, so the new one answers with the old one's state): 30 s after (run 4292, rehearsed) and
      # 120 s after (run 4298, a real hang); cleared by 90 s once and by 246 s the other time. So every retry waits four minutes.
      - name: try 1 did not land; four minutes before a fresh deployment
        if: steps.try1.outcome == 'failure'
        run: |
          echo "::warning title=DEPLOY TRY 1 DID NOT LAND::GitHub's deploy step gave up (its own 10-minute limit, or an error on its side). Trying again with a fresh deployment in four minutes."
          sleep 240

      - id: try2
        name: deploy, try 2 of 3
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 2 && '1000' || '600000' }}
          reporting_interval: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 2 && '1000' || '5000' }}

      - name: try 2 did not land; four minutes before the last try
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: |
          echo "::warning title=DEPLOY TRY 2 DID NOT LAND::Second time GitHub's deploy step gave up. One more fresh deployment in four minutes."
          sleep 240

      - id: try3
        name: deploy, try 3 of 3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 3 && '1000' || '600000' }}
          reporting_interval: ${{ fromJSON(inputs.rehearse_timeouts || '0') >= 3 && '1000' || '5000' }}

      - id: landed
        name: did a try land
        env:
          T1: ${{ steps.try1.outcome }}
          T2: ${{ steps.try2.outcome }}
          T3: ${{ steps.try3.outcome }}
        run: |
          n=0
          for t in "$T1" "$T2" "$T3"; do
            n=$((n+1))
            if [ "$t" = "success" ]; then
              echo "landed=yes" >> "$GITHUB_OUTPUT"; echo "try=$n" >> "$GITHUB_OUTPUT"
              echo "THE DEPLOY LANDED on try $n of 3 (tries: $T1 / ${T2:-not needed} / ${T3:-not needed})"
              echo "### The deploy landed on try $n of 3" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "landed=no" >> "$GITHUB_OUTPUT"
          echo "NO TRY LANDED (tries: $T1 / $T2 / $T3)"

      # THE DEPLOY IS ONLY TRUE IF THE LIVE SITE SERVES WHAT HE TAPS (9/22). A 404 goes
      # red here instead of on his phone. 11/6: the map, the fight and the town pages, and the
      # fight's two indexes, are asked too, now that the site is a list and not three whole folders.
      # 11/6 (rule 418(e)): AND IT IS THIS BUILD. A 200 says a page answers, not which build answers; the site's own
      # BOHEMIA_SITE_SHA.txt must read this run's commit (asked past the CDN's 10-minute copy, up to three minutes).
      - name: the live site serves the vote list, the alpha and the demo, and it is this build
        if: steps.landed.outputs.landed == 'yes'
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          base="${base%/}"
          sleep 20
          for p in records/target/BOHEMIA_VOTE_REGISTRY.json records/target/BOHEMIA_VOTE_TRIAGE.json slices/BOHEMIA_ALPHA_0_9.html slices/BOHEMIA_DEMO.html slices/BOHEMIA_VOTE_TAB.html slices/sw.js slices/BOHEMIA_CITY_WORLD.html slices/BOHEMIA_FIGHT.html slices/BOHEMIA_SETTLEMENT_SCREEN.html slices/fight_rig/fight_rig.json slices/fight_ground/fight_ground.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$base/$p")
            echo "$code  $p"
            [ "$code" = "200" ] || { echo "::error title=THE LIVE SITE IS MISSING A PAGE::$p answers HTTP $code"; exit 1; }
          done
          live=""
          for i in $(seq 1 18); do
            live=$(curl -s -H 'Cache-Control: no-cache' "$base/BOHEMIA_SITE_SHA.txt?check=$GITHUB_RUN_ID-$i" | tr -dc '0-9a-f' | head -c 40)
            [ "$live" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          echo "the live site says it is $live; this run built $GITHUB_SHA"
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error title=THE SITE IS BEHIND::the deploy said it landed, but three minutes later the live site still says it is ${live:-nothing}, not ${GITHUB_SHA}"; exit 1; }
          echo "### LIVE: the site is ${GITHUB_SHA:0:8} (try ${{ steps.landed.outputs.try }} of 3)" >> "$GITHUB_STEP_SUMMARY"

      # *** NO TRY LANDED: SEND A FRESH RUN ONCE, OR SAY THE SITE IS BEHIND, IN THOSE WORDS. *** A fresh run is a new runner, a
      # new upload and a new deployment, on main's newest commit (so it also carries anything pushed while these tries waited).
      # It queues in the 'pages' group behind this run; a push that lands meanwhile takes its place, which deploys newer work.
      - name: no try landed - send a fresh run once, or say plainly the site is behind
        if: steps.landed.outputs.landed == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_OF: ${{ inputs.retry_of }}
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          base="${BASE%/}"
          live=$(curl -s -H 'Cache-Control: no-cache' "$base/BOHEMIA_SITE_SHA.txt?check=$GITHUB_RUN_ID-behind" | tr -dc '0-9a-f' | head -c 40)
          live="${live:-an older build that does not say its commit}"
          if [ -z "$RETRY_OF" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"retry_of\":\"$GITHUB_RUN_ID\"}}")
            if [ "$code" = "204" ]; then
              msg="THE SITE IS BEHIND FOR NOW. GitHub's deploy step gave up 3 times on its own side. A FRESH RUN WAS SENT (it deploys main's newest commit). The live site is still ${live}; this run built ${GITHUB_SHA}."
            else
              msg="THE SITE IS BEHIND. GitHub's deploy step gave up 3 times, and sending a fresh run failed (HTTP ${code}). The live site is still ${live}; this run built ${GITHUB_SHA}. Run the pages workflow again by hand."
            fi
          else
            msg="THE SITE IS BEHIND. Six tries over two runs (this one and run ${RETRY_OF}) all timed out on GitHub's side. The live site is still ${live}; main is ${GITHUB_SHA}. Check githubstatus.com, then run the pages workflow again."
          fi
          echo "::error title=THE SITE IS BEHIND::$msg"
          echo "## $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

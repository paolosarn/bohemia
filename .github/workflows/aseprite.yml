# BOHEMIA — ASEPRITE ON THE FREE RUNNER (10/18/26, PLUMBER, VAMILY row [aseprite in the pipe])
#
# Paolo bought Aseprite (10/11, his one word). Its source is public and its EULA lets us compile it for our own
# use but never hand the build out, so THE BINARY IS BUILT HERE AND CACHED HERE, never committed:
#
#   1. the headless build (no UI: batch mode and Lua scripting, tools/aseprite/build_headless.sh) at the pinned
#      tag and commit, only when the cache misses; the cache is keyed on the tag, the commit and the build script;
#   2. the job scripts (tools/aseprite/*.lua) run end to end on his pack tile and on the rig's robot
#      (tools/aseprite/bohemia_aseprite_proof.py), and the pipe gate holds what they wrote;
#   3. the proof is the 'aseprite-proof' artifact; nothing is written back to the repo.
#
# It runs when a job script, the build script or this file changes, and on demand. Read access only.
name: aseprite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/aseprite/**'
      - 'gates/aseprite_pipe_gate.py'
      - '.github/workflows/aseprite.yml'

permissions:
  contents: read

concurrency:
  group: aseprite
  cancel-in-progress: false

env:
  ASEPRITE_TAG: v1.3.18.6
  ASEPRITE_COMMIT: 331e898ef405d919539c03fd1675691cfa16c3a3
  ASEPRITE_PATH: ${{ github.workspace }}/tools/aseprite/bin/aseprite

jobs:
  aseprite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            tools/aseprite
            tools/aseprite_mcp
            gates
            reference/art_bank/road
            reference/art_bank/prop
            reference/art_pipe
            records/target/master_rig/robot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: the gate's library (the container's version)
        run: python -m pip install --quiet pillow==12.3.0

      - name: the cached build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: tools/aseprite/bin
          key: aseprite-headless-${{ env.ASEPRITE_TAG }}-${{ env.ASEPRITE_COMMIT }}-${{ hashFiles('tools/aseprite/build_headless.sh') }}

      - name: build Aseprite headless from its source (only when the cache missed)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake ninja-build libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
          git clone --quiet --depth 1 --branch "$ASEPRITE_TAG" --recurse-submodules --shallow-submodules https://github.com/aseprite/aseprite "$RUNNER_TEMP/aseprite"
          test "$(git -C "$RUNNER_TEMP/aseprite" rev-parse HEAD)" = "$ASEPRITE_COMMIT"
          start=$(date +%s)
          tools/aseprite/build_headless.sh "$RUNNER_TEMP/aseprite" tools/aseprite/bin
          echo "built in $(( $(date +%s) - start )) s" | tee tools/aseprite/bin/BUILT.txt

      - name: keep the build (saved the moment it runs, whatever the proof says after)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/aseprite/bin
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: the build on this box
        run: |
          "$ASEPRITE_PATH" --version
          cat tools/aseprite/bin/BUILT.txt 2>/dev/null || true

      - name: the jobs, end to end (his pack tile round-tripped, the rig's robot cleaned)
        run: python tools/aseprite/bohemia_aseprite_proof.py --out "$RUNNER_TEMP/proof"

      - name: THE PIPE GATE, with Aseprite on the box
        env:
          BOHEMIA_ASEPRITE_PROOF: ${{ runner.temp }}/proof
        run: |
          set -o pipefail
          python gates/aseprite_pipe_gate.py | tee "$RUNNER_TEMP/pipe_gate.txt"

      - name: the summary
        if: always()
        run: |
          { echo '## THE PIPE GATE with Aseprite'; echo '```'; cat "$RUNNER_TEMP/pipe_gate.txt" 2>/dev/null || echo 'the gate did not run'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-proof
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/proof/
            tools/aseprite/bin/BUILT.txt

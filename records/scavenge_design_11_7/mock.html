<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Casing;src:url('file:///home/user/bohemia/slices/fonts/BohemiaCasing-Regular.woff2') format('woff2')}
@font-face{font-family:Rom;src:url('file:///home/user/bohemia/slices/fonts/BohemiaROM-Regular.woff2') format('woff2')}
body{margin:0;background:#111}
</style></head>
<body><canvas id="c"></canvas>
<script>
/* SCAVENGE design round 11/7: the STAND-IN frame strip. The board, the men, the houses and the phone are the game's own
   pixels (a real laid board, the fight's camera, a phone 390 x 844). Drawn over them, as a stand-in: the lit spots, the
   old dial (its wedge, ticks, blue / amber / ember bands and needle, the same proportions as the fight's dial code:
   LIM 60 deg, ARC_MULT 1.11, hZ 0.05, vZ 0.12, hitZ 0.26), the car (the fight's own cover_car_kerb piece, because no
   board carries a dead car today), and the phone's scavenge plate. */
const BASE = 'board_phone.png';   /* node shoot_spots.js <this folder> '[80,60]' writes it here; it is not committed */
const CAR = 'file:///home/user/bohemia/slices/fight_ground/cover_car_kerb.webp';
const FW = 1170, FH = 2532, SC = 0.5, CAP = 176;           // a frame is drawn at full phone pixels, then halved
const W = FW * SC * 2, H = (FH * SC + CAP) * 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const D2R = Math.PI / 180, LIM = 60 * D2R, AM = 1.11, HZ = 0.05 * AM, VZ = 0.12 * AM, HIT = 0.26 * AM;
function load(src) { return new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; }); }
function txt(s, x, y, size, col, font, align, weight) { g.font = (weight || '') + ' ' + size + 'px ' + (font || 'Casing'); g.fillStyle = col; g.textAlign = align || 'left'; g.fillText(s, x, y); }
function wrap(s, x, y, size, col, maxw, lh) { g.font = size + 'px Casing'; const words = s.split(' '); let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxw && line) { txt(line, x, y, size, col); y += lh; line = w; } else line = t; }
  if (line) txt(line, x, y, size, col); }
function plate(x, y, w, h, fill, line) { g.fillStyle = fill; g.fillRect(x, y, w, h); if (line) { g.strokeStyle = line; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3); } }
function tag(s, x, y, col) {                                   // a small label on the ground, the fight's plank look
  g.font = '34px Casing'; const w = g.measureText(s).width + 28;
  plate(x - w / 2, y - 40, w, 54, 'rgba(236,228,208,0.94)', col || '#2a2520'); txt(s, x, y - 1, 34, '#2a2520', 'Casing', 'center');
}
/* THE OLD DIAL, drawn the way the fight drew it (the wedge, the dark track, 24 ticks, the three bands, the centre line, the needle) */
function dial(cx, cy, R, base, needle, o) {
  o = o || {};
  const span = LIM * AM;
  g.save();
  g.fillStyle = 'rgba(12,10,8,0.42)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R * 1.04, base - span, base + span); g.closePath(); g.fill();
  g.fillStyle = 'rgba(200,200,200,0.06)'; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, base - span, base + span); g.closePath(); g.fill();
  g.lineCap = 'butt'; g.lineWidth = 7; g.strokeStyle = o.hidden ? 'rgba(186,170,132,0.35)' : 'rgba(120,108,86,0.55)';
  if (o.hidden) g.setLineDash([14, 12]);
  g.beginPath(); g.arc(cx, cy, R * 0.97, base - span, base + span); g.stroke(); g.setLineDash([]);
  for (let i = 0; i <= 24; i++) { const a = base - span + 2 * span * i / 24, maj = i % 6 === 0, tl = maj ? 26 : 14;
    g.strokeStyle = maj ? 'rgba(186,170,132,0.75)' : 'rgba(140,128,100,0.5)'; g.lineWidth = maj ? 4 : 2.5;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * (R * 0.97 - tl), cy + Math.sin(a) * (R * 0.97 - tl)); g.lineTo(cx + Math.cos(a) * R * 0.97, cy + Math.sin(a) * R * 0.97); g.stroke(); }
  function band(half, col, w, glow) { g.save(); g.lineWidth = w; g.strokeStyle = col; if (glow) { g.shadowBlur = glow; g.shadowColor = col; }
    g.beginPath(); g.arc(cx, cy, R * 0.97, base - half, base + half); g.stroke(); g.restore(); }
  if (!o.hidden) {
    band(HIT, 'rgba(96,150,182,0.85)', 9);
    band(VZ, 'rgba(230,168,74,0.95)', 12);
    band(HZ, 'rgba(255,150,92,1)', 18, 26);
    g.strokeStyle = 'rgba(255,242,214,0.9)'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(cx + Math.cos(base) * R * 0.80, cy + Math.sin(base) * R * 0.80); g.lineTo(cx + Math.cos(base) * R * 1.02, cy + Math.sin(base) * R * 1.02); g.stroke();
  }
  (o.ghosts || []).forEach((ga, k) => { g.strokeStyle = 'rgba(255,236,200,' + (0.18 + 0.1 * k) + ')'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(base + ga) * R * 0.93, cy + Math.sin(base + ga) * R * 0.93); g.stroke(); });
  const na = base + needle;
  if (o.beam) { const bg = g.createRadialGradient(cx, cy, 10, cx, cy, R * 1.5); bg.addColorStop(0, 'rgba(255,236,190,0.30)'); bg.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = bg; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R * 1.5, na - 0.07, na + 0.07); g.closePath(); g.fill(); }
  g.save(); g.shadowBlur = o.glow || 10; g.shadowColor = 'rgba(255,230,180,0.9)';
  g.strokeStyle = '#fff4dc'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(na) * R * 1.0, cy + Math.sin(na) * R * 1.0); g.stroke(); g.restore();
  g.fillStyle = '#fff4dc'; g.beginPath(); g.arc(cx, cy, 10, 0, 7); g.fill();
  g.restore();
}
function beats(x, y, lit, label) {                             // the bar of four, the ONE marked
  for (let i = 0; i < 4; i++) { const on = lit.indexOf(i) >= 0;
    g.fillStyle = on ? (i === 0 ? '#ff965c' : '#e6a84a') : 'rgba(30,26,22,0.8)'; g.strokeStyle = '#ece4d0'; g.lineWidth = 3;
    g.beginPath(); g.arc(x + i * 54, y, i === 0 ? 20 : 15, 0, 7); g.fill(); g.stroke(); }
  if (label) txt(label, x + 4 * 54 - 10, y + 11, 30, '#ece4d0', 'Casing');
}
function thumb(x, y, s, hold) {                                // where the thumb goes: anywhere on the glass
  g.save(); g.strokeStyle = 'rgba(255,244,220,0.9)'; g.lineWidth = 5;
  for (let r = 0; r < (hold ? 1 : 3); r++) { g.globalAlpha = 1 - r * 0.3; g.beginPath(); g.arc(x, y, 34 + r * 26, 0, 7); g.stroke(); }
  g.globalAlpha = 1; g.fillStyle = 'rgba(255,244,220,0.25)'; g.beginPath(); g.arc(x, y, 34, 0, 7); g.fill(); g.restore();
  tag(s, x, y + 120);
}
/* the phone's plate, the same frame he knows, saying scavenge instead of fight */
function phone(sel, finds) {
  plate(790, 1858, 330, 470, 'rgba(38,30,26,0.97)');
  plate(800, 1866, 310, 82, '#ece4d0', '#7a6a52'); txt('SCAVENGE', 822, 1922, 40, '#2a2520');
  const kinds = [['HOUSE', 2], ['GROUND', 2], ['CAR', 1]];
  kinds.forEach((k, i) => { const y = 1990 + i * 62, on = sel === i;
    plate(800, y - 40, 310, 54, on ? '#e6a84a' : 'rgba(236,228,208,0.12)', on ? '#ffd9a0' : null);
    txt(k[0], 818, y, 32, on ? '#2a2520' : '#ece4d0'); txt('x' + k[1], 1090, y, 32, on ? '#2a2520' : '#ece4d0', 'Casing', 'right'); });
  txt('FOUND', 810, 2210, 28, '#a89c84');
  (finds || []).forEach((f, i) => { plate(810 + i * 64, 2224, 54, 54, '#ece4d0', '#7a6a52'); txt(f, 837 + i * 64, 2262, 26, '#2a2520', 'Casing', 'center'); });
  plate(960, 2290, 150, 28, 'rgba(236,228,208,0.14)'); txt('LEAVE', 1035, 2313, 26, '#ece4d0', 'Casing', 'center');
}
function lit(x, y, w, h, s) {                                  // a lit spot: a thin warm outline, on the beat
  g.save(); g.strokeStyle = '#ffcf7a'; g.lineWidth = 6; g.shadowBlur = 18; g.shadowColor = '#ffb050';
  g.setLineDash([22, 10]); g.strokeRect(x, y, w, h); g.restore(); if (s) tag(s, x + w / 2, y - 10);
}
function ground(x, y, r, s) {
  g.save(); g.strokeStyle = '#ffcf7a'; g.lineWidth = 6; g.shadowBlur = 18; g.shadowColor = '#ffb050'; g.setLineDash([18, 12]);
  g.beginPath(); g.ellipse(x, y, r, r * 0.55, 0, 0, 7); g.stroke(); g.restore(); if (s) tag(s, x, y - r * 0.55 - 14);
}
function frame(img, car, n, title, sub, secs, fx, fy, draw) {
  g.save(); g.translate(fx, fy);
  plate(0, 0, FW * SC, CAP, '#141210');
  txt(n, 16, 58, 50, '#ff965c', 'Casing');
  txt(title, 58, 54, 29, '#ece4d0', 'Casing');
  wrap(sub, 16, 92, 21, '#a89c84', FW * SC - 32, 26);
  txt(secs, FW * SC - 16, 162, 21, '#e6a84a', 'Casing', 'right');
  g.translate(0, CAP); g.beginPath(); g.rect(0, 0, FW * SC, FH * SC); g.clip();
  g.scale(SC, SC); g.drawImage(img, 0, 0, FW, FH);
  /* the car: the fight's own dead-car piece, set on the road at ground scale (stand-in: no board carries one yet) */
  g.drawImage(car, 640, 760, 230, 117);
  draw();
  plate(18, 2420, 330, 64, 'rgba(110,106,98,0.92)'); txt('STAND-IN', 34, 2466, 40, '#f2ece1', 'Casing');
  g.restore();
}
(async () => {
  await document.fonts.load('40px Casing'); await document.fonts.load('40px Rom');
  const img = await load(BASE), car = await load(CAR);
  g.fillStyle = '#141210'; g.fillRect(0, 0, W, H);
  const fw = FW * SC, fh = FH * SC + CAP;
  frame(img, car, '1', 'THE MAP PICKS THE SPOTS', 'houses where there are houses, the detector on open ground, the siphon at a car', 'you tap one; the nearest man walks there on the beat', 0, 0, () => {
    lit(24, 252, 222, 182, 'SEARCH');
    lit(452, 306, 206, 150, 'SEARCH');
    ground(420, 1250, 130, 'DETECTOR');
    ground(250, 2050, 110, 'DETECTOR');
    lit(630, 750, 252, 140, 'SIPHON');
    phone(-1, []);
  });
  frame(img, car, '2', 'A HOUSE: TAP ON THE ONE', 'the needle is his torch; you SEE the bands; one tap, anywhere on the glass', 'about 6 seconds', fw, 0, () => {
    lit(24, 252, 222, 182);
    dial(250, 640, 260, -90 * D2R, 2.0 * D2R, { beam: true, ghosts: [-30 * D2R, -16 * D2R] });
    beats(40, 980, [0], ' the middle lands on the ONE');
    tag('DEAD CENTRE: the best thing in the house', 585, 1130, '#ff965c');
    tag('AMBER: a thing    BLUE: scraps    OUT: nothing', 585, 1210);
    thumb(600, 1560, 'TAP');
    phone(0, ['M']);
  });
  frame(img, car, '3', 'OPEN GROUND: THE DETECTOR, BY EAR', 'no bands are drawn; the beeps fill in as the coil nears the cache', 'about 6 seconds', 0, fh, () => {
    ground(420, 1250, 130);
    dial(420, 1170, 330, -90 * D2R, -1.5 * D2R, { hidden: true, glow: 30, ghosts: [-40 * D2R, -22 * D2R, -10 * D2R] });
    /* the ear's bar: far one beep a beat, nearer two, nearer four, on it one long tone */
    const bx = 70, by = 600, cw = 62;
    plate(bx - 20, by - 70, 16 * cw + 40, 190, 'rgba(20,17,14,0.88)', '#7a6a52');
    txt('WHAT HE HEARS, ONE BAR AT A TIME', bx, by - 22, 30, '#ece4d0');
    const steps = [1,0,0,0, 1,0,1,0, 1,1,1,1, 2,2,2,2];
    steps.forEach((s, i) => { g.fillStyle = s === 2 ? '#ff965c' : s ? '#e6a84a' : 'rgba(236,228,208,0.12)';
      g.fillRect(bx + i * cw, by + 10, cw - 10, s === 2 ? 70 : 50); });
    txt('far', bx, by + 110, 26, '#a89c84'); txt('near', bx + 4 * cw, by + 110, 26, '#a89c84'); txt('nearer', bx + 8 * cw, by + 110, 26, '#a89c84'); txt('ON IT: TAP', bx + 12 * cw, by + 110, 26, '#ff965c');
    tag('DEAD CENTRE: the best thing buried here', 585, 1620, '#ff965c');
    thumb(320, 1900, 'TAP ON THE TONE');
    phone(1, ['M', 'B']);
  });
  frame(img, car, '4', 'A CAR: HOLD, LET GO ON THE ONE', 'hold and the can fills a gulp a beat; let go when the needle sits in the ember', 'about 5 seconds', fw, fh, () => {
    lit(630, 750, 252, 140);
    dial(860, 600, 300, -90 * D2R, -4 * D2R, { ghosts: [-60 * D2R, -45 * D2R, -30 * D2R, -15 * D2R] });
    beats(420, 1010, [0, 1, 2, 3], ' gulp x3, LET GO');
    tag('EMBER: a full can   EARLY: a little', 585, 1160, '#ff965c');
    tag('TOO LATE: a mouthful, nothing', 585, 1240);
    thumb(560, 1660, 'HOLD ... LET GO', true);
    phone(2, ['M', 'B', 'G']);
  });
  document.title = 'done';
})();
</script></body></html>

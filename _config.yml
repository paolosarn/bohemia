# BOHEMIA — GITHUB PAGES BUILD CONFIG (8/6/26)
#
# THE LINK STOPPED BEING TRUE, AND THIS IS WHY.
# GitHub Pages had failed to publish THREE COMMITS RUNNING. The last build that
# concluded SUCCESS was c8cf238 on 8/5; ba913e6 cancelled, 65a84f9 failed, b09f3ab
# ran for THIRTY MINUTES and failed. Thirty minutes is not an error, it is a
# TIMEOUT — the build was being asked to copy the entire repository.
#
# The push kept working the whole time, which is exactly why nobody caught it:
# every lane's gates went green, every commit landed on main, and the page Paolo
# taps simply stopped changing. The ONE-LINK LAW says the link is the door, and
# the door was opening on a build from the day before.
#
# WHAT PAGES ACTUALLY HAS TO SERVE: slices/ — that is the whole product surface.
# The repo is 496 MB of working tree and 106 MB of it is slices/. Everything else
# — 261 MB of art banks, the questbook, the tools, the gates, the laws — was being
# published to the open internet for NO REASON AT ALL, on every single push.
#
# NOTHING IS DELETED. This file does not remove one byte from the repository; it
# only stops Pages from COPYING those bytes into the built site. Every bank, every
# judgement, every record is exactly where it was. A green bought by deleted
# evidence is worse than the red, and that is a rule this repo learned the hard way.
#
# WHAT IS KEPT, AND WHY EACH ONE:
#   slices/          the product. The alpha and every tab it opens.
#   engine/          four slices still load ../engine/*.js as real script tags
#                    (RUN_SLICE, SOCIAL_PHONE, QUEST_DEMO are the un-inlined dev
#                    templates; they must keep working).
#   records/target/  the ART tab (slices/BOHEMIA_ART_CURRENT.html) loads its
#                    target screens straight out of ../records/target/.
#
# Verified before writing this: there is not a single `{{` or `{%` anywhere in the
# shipped slices, so letting Jekyll process the site cannot mangle the inline JS.
#
# IF A NEW SLICE EVER REACHES OUTSIDE THESE THREE FOLDERS, add that folder here or
# the page will 404 in production while working perfectly on disk. That is the one
# way this file can bite, so it is written down at the top of it.

# TWO BUILDERS PUBLISH THIS SITE AND THEY RACE (coordinator 9/22, records/BOHEMIA_TWO_DEPLOYS_RACE_9_22_26.md).
# GitHub's own "pages build and deployment" (Jekyll, reading THIS file) fires on every push
# beside .github/workflows/pages.yml and, since about 9/21, SUCCEEDS in ~80 s. Whichever
# finishes last is the live site. The Jekyll build obeys the exclude list below, so it
# publishes NO records/ and NO *.json: on the pushes it wins, the VOTE tab's registry 404s
# ("THE LIST DID NOT LOAD"), which is what Paolo hit. The real fix is the repo setting
# (Settings -> Pages -> Source: GitHub Actions), which stops the Jekyll build firing at all.
# Until that is flipped, `include` below forces the one file the VOTE tab fetches into the
# Jekyll build too, so the list loads whichever builder wins. Jekyll checks include before
# exclude, so this beats both `records/` and `*.json`.
include:
  - records/target/BOHEMIA_VOTE_REGISTRY.json

exclude:
  - .claude/        # session config -- Jekyll drops dotfolders anyway, but the publish
                    # gate reads THIS list as the source of truth, so it is named here
  - banks/          # 261 MB of art banks — read by the cook tools, never by a page
  - questbook/      # 8.5 MB of quest study corpus
  - uibook/         # the UI study corpus (8/26). NOT published, on purpose: the
                    # UI tab does not read these files, it renders
                    # records/BOHEMIA_UIBOOK_LAW_INDEX.json, which the generator
                    # inlines at build time. Same shape as questbook/.
  - archive/        # superseded files; history, never current
  - tools/          # generators and cooks — they run in a session, not in a browser
  - gates/          # the regression machines
  - laws/           # the law masters
  - exports/        # documents written for people outside the project (the playbook, 9/21); a page never loads them
  - quests/         # .bq canon quest sources (inlined into the slice at build time)
  - records/       # NOT PUBLISHED, with ONE carve-out: .github/workflows/pages.yml
                   # copies records/target by name (the ART tab loads its target
                   # screens from there). This used to name five subfolders and
                   # KEEP the rest, which meant 41 MB -- tileforms_proofs, the
                   # valley aerial, the words book, the questbook index -- was
                   # published by this list while the workflow never copied a byte
                   # of it. Corrected 8/20: the workflow is the source of truth,
                   # this file agrees with it, and pages_publish_gate.js now fails
                   # if a folder is HALF published (kept here, partly copied there).
  - graveyard/      # KILLED WORK AND ITS POST-MORTEMS. Created by COOK on 9/15
                    # ([car recook] r6, d8e1f43, the twenty barrels), and never named
                    # here -- so this file KEPT it while the workflow copied three
                    # folders and never a byte of it, which is exactly the half-published
                    # state pages_publish_gate.js exists to refuse. It has been red since.
                    # 24 KB of dead shapes and the write-ups of why they died: read by
                    # hair_graveyard_gate.js and by people, never by a page. The list that
                    # is wrong is THIS one, not the workflow's, so the fix adds a line
                    # here rather than a megabyte to a published surface already at
                    # 255 MB of a 260 MB cap. (COOK 9/20, cleaning up after itself.)
  - reference/      # third-party study corpora (Rogue Fable school, 8/17) — reference
                    # only, cited by records/, and NEVER published: not ours to serve
  - "*.md"          # CLAUDE.md, the handoff, the backlog, the masters
  - "*.txt"
  - "*.json"

# Pages serves files verbatim; nothing here is a Jekyll site in the blogging sense.
plugins: []

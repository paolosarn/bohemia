<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Is Data</title>
<style>:root{--bg:#0b0d0c;--ink:#cfd6cc;--dim:#6f7a70;--red:#d8352a;--amber:#d9a441;--ok:#7fb069;--line:#1d2320}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}h1{font-size:20px;letter-spacing:.08em;margin:6px 0 2px;text-transform:uppercase}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}.flip{display:flex;gap:8px;margin:10px 0}
.flip button{flex:1;padding:12px 4px;background:#141816;color:var(--ink);border:1px solid var(--line);font:inherit;letter-spacing:.08em}.flip button.on{border-color:var(--red);color:#fff;background:#1c1210}
.big{font-size:40px;line-height:1;color:var(--ok)}.red{color:var(--red)}.k{color:var(--dim);font-size:12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.row span{color:var(--dim);text-align:right;font-size:11px}
.card{border:1px solid var(--line);padding:10px;margin:8px 0;background:#0e1110}.top{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:bold}
.sev{flex:none;font-size:10px;padding:1px 6px;border:1px solid;color:var(--amber)}.sev.f{color:#f0908a}.who{color:var(--dim);font-size:11px;margin:4px 0}.t{font-size:13px}
.hid{display:none}</style></head><body><div class="wrap">
<h1>What is data, what is not</h1><div class="sub">MODS audit of the demo. Nothing changed in the game. Tap a list.</div>
<div class="flip"><button id="b1" class="on">IN A DATA FILE</button><button id="b2">STILL IN CODE</button></div>
<div id="l1"></div><div id="l2" class="hid"></div></div>
<script>var DATA=[{"f":"GROUND_EDGES.json","rows":6,"by":[]},{"f":"ai.json","rows":5,"by":["new fight"]},{"f":"armor.json","rows":7,"by":["new fight"]},{"f":"backgrounds.json","rows":77,"by":["new fight"]},{"f":"enemies.json","rows":160,"by":["new fight"]},{"f":"injuries.json","rows":59,"by":["new fight"]},{"f":"origins.json","rows":3,"by":["new fight","demo shell"]},{"f":"ours.json","rows":27,"by":["new fight"]},{"f":"party_math.json","rows":8,"by":["map"]},{"f":"perk_translation.json","rows":50,"by":["new fight"]},{"f":"perks.json","rows":50,"by":["new fight"]},{"f":"rules.json","rows":15,"by":["new fight"]},{"f":"weapon_lines.json","rows":15,"by":["new fight"]},{"f":"weapons.json","rows":126,"by":["new fight"]}];var CODE=[{"sev":"FIX FIRST","t":"The demo drops a new origin","who":"RUN","w":"The start screen holds a fixed list of the same 15 origins and only fills them in from the data file. An origin a modder adds to the file has no slot in that list, so it is thrown away. Every other kind of change works."},{"sev":"TWO TRUTHS","t":"The old fight is still in the demo","who":"COMBAT and RUN","w":"A sealed copy of the old fight (17 big tables, 39 KB, 0 data files) can still be opened from the combat tab and from a handoff. Edit the weapons file and only the new fight changes. Retire it or feed it from the same files."},{"sev":"COPIES","t":"Three tables repeat a data file","who":"WORLD and PEOPLE","w":"The map keeps its own backgrounds list (WAS_WORDS), its own origins list (ORIGINS) and its own roster numbers (ROSTER) next to files that already hold them. They can drift. Three more tables named RULES (35 KB) look like rules.json; a lane should check."},{"sev":"LOOSE","t":"The map holds 245 big tables, 775 KB","who":"WORLD, ECONOMY, WORDS","w":"Exchanges (36 KB), lines (33 KB), asking (13 KB), bosses (12 KB), reactions (11 KB) and more. This is the game's trading and talking content. None of it is in a data file."},{"sev":"NOT RULES","t":"The demo shell is sound, music and art","who":"SOUNDS, COOK, ANIMATION","w":"52 big tables, 657 KB: sound recipes (108 KB), tiles (96 KB), cutscenes (53 KB), music (52 KB), poses (41 KB). Almost no game rules live here, so a modder looking for a number will not find one in the shell."},{"sev":"ALMOST CLEAN","t":"The new fight has one loose table","who":"COMBAT and SOUNDS","w":"Only its sound table (SND, 930 characters) is in code. It reads 12 of 14 data files. This is the model for the rest."}];
function e(t,c,x){var d=document.createElement(t);if(c)d.className=c;if(x!==undefined)d.textContent=x;return d;}
var l1=document.getElementById('l1');var tot=DATA.reduce(function(a,b){return a+b.rows;},0);
var h=e('div','big',DATA.length+' files');l1.appendChild(h);l1.appendChild(e('div','k','in records/target/bb. The new fight reads 12 of them. The demo start screen reads 1. The map reads 1. Rows are what a modder can edit.'));
DATA.forEach(function(d){var r=e('div','row');r.appendChild(e('b','',d.f.replace('.json','')+'  '+d.rows+' rows'));r.appendChild(e('span','',d.by.length?'read by '+d.by.join(', '):'a build input, not read live'));l1.appendChild(r);});
var l2=document.getElementById('l2');l2.appendChild(e('div','big red',CODE.length+' findings'));l2.appendChild(e('div','k','sorted by what hurts a modder first. The owner is the lane that moves it.'));
CODE.forEach(function(c){var d=e('div','card');var t=e('div','top');t.appendChild(e('span','nm',c.t));t.appendChild(e('span','sev'+(c.sev==='FIX FIRST'?' f':''),c.sev));d.appendChild(t);d.appendChild(e('div','who','OWNER: '+c.who));d.appendChild(e('div','t',c.w));l2.appendChild(d);});
function sw(a){document.getElementById('b1').className=a?'on':'';document.getElementById('b2').className=a?'':'on';l1.className=a?'':'hid';l2.className=a?'hid':'';}
document.getElementById('b1').onclick=function(){sw(true)};document.getElementById('b2').onclick=function(){sw(false)};</script></body></html>

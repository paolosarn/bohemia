<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three Loading Screens</title>
<!-- UI 5, 11/3/26 (asks 338 and 340): THE LOADING SCREEN, THREE WAYS, for the VOTE tab (the 9/21 votes: the tab shows the thing,
     animations and sounds play, two or three options). His 11/2 vote: NO on the box with the tin robot. Rule 66a: the loading shown
     as the camera's own feed, never a bar. Each feed is the game's own sheet (slices/crashbox/feed_<x>.webp, made through the master
     rig by tools/bohemia_ui_the_first_minute_feeds.py), played here exactly as the title plays it: twelve keys a bar at 120 BPM, the
     camera's readout of a load that runs 0 to 6 over eight seconds and holds READY for three. A tap on a feed plays its own sound
     (slices/crashbox/feed_<x>.mp3, CC0 recordings), and stops the others. Words are draft:true. -->
<style>
@font-face{font-family:'BohemiaROM';src:url(fonts/BohemiaROM-Regular.woff2) format('woff2');font-display:block}
@font-face{font-family:'BohemiaCasing';src:url(fonts/BohemiaCasing-Regular.woff2) format('woff2');font-display:block}
:root{--ground:#0b0a09;--ink:#e7dcc6;--gold:#e2bd6a;--plastic:#1d1e20}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'BohemiaROM',ui-monospace,monospace;-webkit-text-size-adjust:100%}
main{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:'BohemiaCasing',ui-sans-serif,sans-serif;font-weight:400;font-size:20px;letter-spacing:2px;margin:4px 0 6px}
p.lead{font-size:10px;line-height:16px;margin:0 0 14px;max-width:70ch}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt canvas{width:100%;aspect-ratio:390/520;display:block;image-rendering:pixelated;background:#050403;cursor:pointer}
.opt h2{font-family:'BohemiaCasing',ui-sans-serif,sans-serif;font-weight:400;font-size:20px;letter-spacing:1.5px;margin:0}
.opt h2 b{color:var(--gold);font-weight:400;margin-right:10px}
.opt p{font-size:10px;line-height:15px;margin:0}
.opt button{min-height:44px;border:1px solid #050505;background:var(--plastic);color:var(--ink);font:10px 'BohemiaROM',monospace;letter-spacing:1px;
  box-shadow:inset 0 1px 0 #4a4c51,inset 0 -2px 0 #0b0b0c;cursor:pointer}
.opt button.on{background:var(--gold);color:#140e05;box-shadow:inset 0 1px 0 #f6dc9a,inset 0 -2px 0 #8d6a26}
.opt .tag{font-size:10px;color:var(--gold)}
</style></head>
<body><main>
<h1>THE LOADING SCREEN, THREE WAYS</h1>
<p class="lead">You voted the box with the tin robot NO. These are three new ones. Each is a camera filming the valley while the game loads; the camera's own numbers show how much is loaded, never a bar. Tap a picture to hear it. B is in the game now.</p>
<div class="row" id="row"></div>
</main>
<script>
(function () {
  'use strict';
  var W = 390, H = 520, KEYS = 12, BEAT = 500;
  var OPTS = [
    { k: 'a', name: 'THE CAMP ON TAPE', what: 'Your crew\'s camp on an old camcorder: the fire in a barrel, the truck, the tyres. The battery charges as the game loads. You hear the fire and the wind.', reading: 'battery', top: 'rec', corner: 'counter' },
    { k: 'b', name: 'THE NIGHT CAMERA', what: 'A security camera over the pawn shop\'s lot: one streetlight dying, a coyote in the light. The picture tears until the signal comes in. You hear crickets, the lamp ticking, a siren far off.', reading: 'signal', top: 'cam', corner: 'clock', tear: true, inGame: true },
    { k: 'c', name: 'THE ROAD IN', what: 'The camera on your truck\'s dash on the dead highway into Vegas, one tower still lit. The miles count down as the game loads. You hear the diesel from inside the cab.', reading: 'miles', top: 'rec', corner: 'counter' }
  ];
  var T0 = performance.now(), FONT = false, audio = null, playing = null;
  try { document.fonts.load('10px BohemiaROM').then(function () { FONT = true; }); } catch (e) {}
  var row = document.getElementById('row');
  OPTS.forEach(function (o) {
    var d = document.createElement('div'); d.className = 'opt';
    d.innerHTML = '<h2><b>' + o.k.toUpperCase() + '</b>' + o.name + '</h2><canvas width="' + W + '" height="' + H + '" role="img" aria-label="' + o.name + ', moving"></canvas>'
      + '<p></p><button type="button">HEAR IT</button>' + (o.inGame ? '<span class="tag">IN THE GAME NOW</span>' : '');
    d.querySelector('p').textContent = o.what;
    o.cv = d.querySelector('canvas'); o.btn = d.querySelector('button');
    o.img = new Image(); o.img.src = 'crashbox/feed_' + o.k + '.webp';
    var hear = function () { toggle(o); };
    o.cv.addEventListener('click', hear); o.btn.addEventListener('click', hear);
    row.appendChild(d);
  });
  function toggle(o) {
    if (playing === o) { audio.pause(); playing = null; paintBtns(); return; }
    if (audio) audio.pause();
    audio = new Audio('crashbox/feed_' + o.k + '.mp3'); audio.loop = true; audio.play().catch(function () {}); playing = o; paintBtns();
  }
  function paintBtns() { OPTS.forEach(function (o) { o.btn.classList.toggle('on', playing === o); o.btn.textContent = playing === o ? 'STOP' : 'HEAR IT'; }); }
  function txt(g, s, x, y, al) {
    g.font = '10px ' + (FONT ? 'BohemiaROM' : 'monospace'); g.textBaseline = 'top'; g.textAlign = al || 'left';
    g.fillStyle = '#050403'; [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(function (q) { g.fillText(s, x + q[0], y + q[1]); });
    g.fillStyle = '#efe6d2'; g.fillText(s, x, y); g.textAlign = 'left';
  }
  function rec(g, x, y, on) { g.fillStyle = on ? '#d8341f' : '#3a1a14'; g.fillRect(x, y + 1, 7, 7); txt(g, 'REC', x + 13, y); }
  var LINES = ['WARMING THE TUBE', 'CHECKING STREETS FOR LIGHT', 'COUNTING THE TOWNS', 'PUTTING PEOPLE ON IT', 'DEVELOPING THE PICTURE', 'READY'];
  function frame() {
    var t = performance.now() - T0, beat = t / BEAT, key = Math.floor(beat * KEYS / 4) % KEYS;
    var cyc = (t / 1000) % 11, n = Math.min(6, Math.floor(cyc / (8 / 6))), ready = cyc >= 8, f = ready ? 1 : n / 6, on = Math.floor(beat) % 4 < 2;
    OPTS.forEach(function (o) {
      var g = o.cv.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#050403'; g.fillRect(0, 0, W, H);
      if (o.img.complete && o.img.naturalWidth) {
        g.drawImage(o.img, 0, key * H, W, H, 0, 0, W, H);
        if (o.tear && !ready) { var bh = 36, y0 = Math.round(((beat * 0.37) % 1) * (H - bh)), amp = 1 - f;
          for (var r = 0; r < bh; r += 2) { var off = Math.round(amp * Math.sin(r / bh * Math.PI) * (6 + 4 * Math.sin(beat * 3.1))); g.drawImage(o.img, 0, key * H + y0 + r, W, 2, off, y0 + r, W, 2); } }
      }
      var top = 12, pad = 12, bot = H - 22;
      if (o.top === 'rec') rec(g, pad, top, on); else { txt(g, 'CAM 03', pad, top); txt(g, 'PAWN · LOT', pad, top + 14); rec(g, W - pad - 34, top + 16, on); }
      if (o.reading === 'battery') { var m = ready ? 4 : Math.min(3, Math.floor(f * 4)), bx = W - pad - 26;
        g.fillStyle = '#efe6d2'; g.fillRect(bx, top, 23, 9); g.fillRect(bx + 23, top + 3, 2, 3); g.fillStyle = '#050403'; g.fillRect(bx + 1, top + 1, 21, 7);
        for (var i = 0; i < 4; i++) { g.fillStyle = i < m ? (ready ? '#efe6d2' : '#e2bd6a') : '#2a2620'; g.fillRect(bx + 2 + i * 5, top + 2, 4, 5); }
        txt(g, ready ? 'CHARGED' : 'CHARGING', bx - 6, top, 'right'); }
      else if (o.reading === 'signal') { var s = ready ? 4 : Math.min(3, Math.floor(f * 4)), sx = W - pad - 22;
        for (var j = 0; j < 4; j++) { var hh = 3 + j * 2; g.fillStyle = j < s ? '#efe6d2' : '#2a2620'; g.fillRect(sx + j * 6, top + 9 - hh, 4, hh); }
        txt(g, ready ? 'SIGNAL' : 'NO SIGNAL', sx - 6, top, 'right'); }
      else txt(g, 'LAS VEGAS  ' + (ready ? 0 : Math.max(1, 6 - n)) + ' MI', W - pad, top, 'right');
      var secs = Math.floor(t / 1000), d = new Date();
      txt(g, o.corner === 'clock' ? ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) : '0:' + ('0' + Math.floor(secs / 60) % 60).slice(-2) + ':' + ('0' + secs % 60).slice(-2), pad, bot);
      txt(g, LINES[Math.min(5, ready ? 5 : n)], W - pad, bot, 'right');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>

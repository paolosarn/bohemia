<!doctype html>
<html lang="en">
<head>

<title>The Spoils</title>
<!-- ============================================================================
     THE SPOILS  (RUN TWO, row [the end of the fight, the loot, the stash], 10/24/26, VAMILY rule 156)

     PAOLO 10/24: "I've been killing enemies all this time, winning battles, but there isn't an end of battle
     quick summary of who got experience, who leveled up, and what loot I'm able to take, with a loot button;
     and if my inventory is full it loots as much as it can and stops, similar to Battle Brothers... there's a
     whole inventory and bag screen you're just missing."

     MEASURED BEFORE THIS PAGE: the fight already counted every man's XP (20% to the killer, 80% shared, the
     wiki's rule) and its recap card showed it for FOUR BEATS, two seconds, before the game took him home on its
     own; nothing any beaten man carried ever reached him.

     NOW, Battle Brothers' way ('the after-combat-report always leads the player to the loot screen before
     allowing him to return to the worldmap', the library's dev blog): after every won fight this one screen,
     and it waits for him.
       YOUR CREW: each man once, his face, the XP he got on a bar, LEVEL UP when he climbed (and PICK A PERK,
         which opens the one crew screen on him: the perk is his choice there, Battle Brothers' tree), who is
         laid up how many days with what, who fell for good.
       WHAT THEY LEFT: what the dead carried, through Battle Brothers' own drop conditions (records/target/bb/
         loot.json: a weapon 90%, a shield 90%, a helmet 70%, armour only with a quarter of it left), as pieces;
         and what is not a thing you wear as a COUNT that takes no room: batteries (the money), rounds and scrap
         (resources). TAP A PIECE to take it, LOOT ALL takes as much as the stash holds and STOPS when it is full.
       YOUR STASH n / 36: the company's one bag (bohemia.bag.v1, the market fills it, the crew screen equips
         from it, the shops buy and sell from it); tap a piece in it to put it back on the ground.
       LEAVE: the counts ride home in your pockets; what is still on the ground stays there.

     HOW THE GAME PLUGS IT IN: frame this page and post {type:'BOHEMIA_SPOILS_OPEN', fight:<the fight's
     BOHEMIA_FIGHT_OVER message>, day?, seed?}. It posts back {type:'BOHEMIA_SPOILS', act:'counts', batteries,
     resources, seq} once the counts are taken, act:'stash' {bag} on every change, act:'leave'. Standalone it
     shows a sample fight. Gate: gates/the_spoils_gate.js
     ============================================================================ -->
<style>
:root{--bg:#120e0a;--plate:#2a2119;--plate2:#1c1611;--ink:#e9dcc4;--dim:#a8977c;--gold:#d9a85a;--line:#3a2f24;--red:#c8553d;--green:#8fb06a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent;user-select:none}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px;background:var(--plate2);border-bottom:1px solid var(--line)}
#bar .t{flex:1;font-weight:700;letter-spacing:1px;color:var(--gold)}
#bar .r{color:var(--dim);font-size:11px}
.h{margin:12px 12px 6px;font-size:11px;letter-spacing:1px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.h b{color:var(--ink);font-weight:700}
#crew{margin:0 12px}
.man{display:flex;gap:10px;align-items:flex-start;padding:8px;margin-bottom:6px;background:var(--plate2);border:1px solid var(--line);border-radius:6px}
.man.up{border-color:var(--gold)}
.man.dead{opacity:.6}
.man canvas{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:4px;background:#0b0907;image-rendering:pixelated}
.man .w{flex:1;min-width:0}
.man .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700;letter-spacing:1px}
.man .lv{color:var(--dim);font-weight:400;white-space:nowrap}
.man.up .lv{color:var(--gold);font-weight:700}
.xpbar{position:relative;height:8px;margin-top:5px;background:#16110c;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.xpbar i{position:absolute;top:0;bottom:0;left:0;background:#7a6040}
.xpbar u{position:absolute;top:0;bottom:0;background:var(--gold);text-decoration:none}
.xp{margin-top:3px;font-size:11px;color:var(--dim)}
.xp b{color:var(--gold)}
.state{margin-top:3px;font-size:11px}
.state.hurt{color:var(--red)}
.state.gone{color:var(--red);font-weight:700}
.perk{margin-top:6px;min-height:44px;padding:0 14px;background:var(--gold);color:#1a120a;border:0;border-radius:6px;font:inherit;font-weight:700;letter-spacing:1px}
#counts{display:flex;flex-wrap:wrap;gap:6px;margin:0 12px 6px}
.count{min-height:44px;padding:4px 12px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(#2e241a,#1d1610);border:1px solid #4a3b2c;border-radius:6px;color:var(--ink);font:inherit;text-align:left}
.count b{color:var(--gold);font-size:15px}
.count span{font-size:9px;color:var(--dim);letter-spacing:1px}
.count.taken{opacity:.45;border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 12px}
.slot{position:relative;aspect-ratio:1;min-height:44px;background:#16110c;border:1px solid var(--line);border-radius:3px;color:var(--ink);font:inherit;font-size:9px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.slot.full{background:linear-gradient(#2e241a,#1d1610);border-color:#4a3b2c;box-shadow:none;cursor:pointer}
.slot.new{border-color:var(--gold)}
.slot i{font-style:normal;font-size:15px;color:var(--gold);line-height:1}
.slot img.pk{width:auto;height:22px;max-width:90%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 0 #000)}
.slot span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot em{position:absolute;right:2px;top:1px;font-style:normal;font-size:8px;color:var(--dim)}
#ground .slot.full{border-color:#6e5a3c}
#ground.empty{display:block;margin:0 12px;color:var(--dim);font-size:11px}
#lootall{display:block;width:calc(100% - 24px);margin:8px 12px 0;min-height:52px;background:var(--gold);color:#1a120a;border:0;border-radius:6px;font:inherit;font-size:15px;font-weight:700;letter-spacing:2px}
#lootall:disabled{background:var(--plate);color:var(--dim)}
#said{margin:6px 12px 0;min-height:18px;color:var(--ink);font-size:12px}
#said.full{color:var(--red);font-weight:700}
#stash .slot.full{cursor:pointer}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--plate2);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
#foot .left{flex:1;font-size:11px;color:var(--dim)}
#leave{min-width:120px;min-height:52px;background:var(--plate);color:var(--ink);border:1px solid #4a3b2c;border-radius:6px;font:inherit;font-weight:700;letter-spacing:2px}
@media (min-width:700px){
  #cols{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.3fr);gap:0 8px;align-items:start}
  .grid{grid-template-columns:repeat(9,minmax(40px,56px));justify-content:start}
}
</style>
</head>
<body>
<div id="bar"><span class="t" id="head">THE FIGHT IS WON</span><span class="r" id="rounds"></span></div>
<div id="cols">
  <div>
    <div class="h"><span>YOUR CREW</span><span id="crewn"></span></div>
    <div id="crew"></div>
  </div>
  <div>
    <div class="h"><span>WHAT THEY LEFT</span><span id="fromn"></span></div>
    <div id="counts"></div>
    <div id="ground" class="grid"></div>
    <button id="lootall" type="button">LOOT ALL</button>
    <div id="said"></div>
    <div class="h"><span>YOUR STASH <b id="stashn">0 / 36</b></span><span>TAP ONE TO PUT IT BACK</span></div>
    <div id="stash" class="grid"></div>
  </div>
</div>
<div id="foot"><span class="left" id="left"></span><button id="leave" type="button">LEAVE</button></div>
<script src="../engine/bohemia_roster.js"></script>
<script src="../engine/bohemia_spoils.js"></script>
<script src="../engine/bohemia_people_mix.js"></script>
<script src="../engine/bohemia_crew_faces.js"></script>
<script src="../engine/bohemia_crew_door.js"></script>
<script src="bohemia_ui_materials.js"></script>
<script>
(function(){
'use strict';
var C = window.BohemiaRoster, SP = window.BohemiaSpoils, BAGKEY = 'bohemia.bag.v1', CKEY = 'bohemia.climb.v1', AKEY = 'bohemia.fight.after.v1';
var S = { ready:false, L:null, cap:36, fight:null, ground:[], stash:[], counts:null, countsTaken:false, men:[], looks:{}, seq:0, standalone:(window.parent === window), log:[] };
function post(act, o){ var m = {type:'BOHEMIA_SPOILS', act:act}; for(var k in (o||{})) m[k] = o[k]; S.log.push(m);
  if(!S.standalone) try{ window.parent.postMessage(m, '*'); }catch(e){} }
function sfx(ev){ S.log.push({type:'BOHEMIA_SFX', ev:ev}); if(!S.standalone) try{ window.parent.postMessage({type:'BOHEMIA_SFX', ev:ev}, '*'); }catch(e){} }
function say(t, full){ var el = document.getElementById('said'); el.textContent = t; el.className = full ? 'full' : ''; }
function readJ(k, d){ try{ var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }
function saveStash(){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.stash)); }catch(e){} post('stash', {bag:S.stash.slice()}); }
/* the same seeded dice for the same fight: a reload of this screen finds the same things on the ground */
function dice(seed){ var x = (seed >>> 0) || 1; return function(){ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }
function hash(s){ var h = 2166136261; for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- YOUR CREW: who grew, who is hurt, who fell ---------- */
function climbs(rows){
  var climb = readJ(CKEY, {}) || {}, q = readJ(AKEY, []) || [];
  /* fights the crew screen has not read yet count first (the last one kept is this one: the shell keeps it before this opens) */
  var prior = {}, mine = q.length && q[q.length - 1] && JSON.stringify((q[q.length - 1].rows || []).map(function(r){ return r.name + r.xpGained; })) === JSON.stringify(rows.map(function(r){ return r.name + (r.xpGained | 0); }));
  q.slice(0, mine ? -1 : q.length).forEach(function(f){ (f.rows || []).forEach(function(r){ prior[r.name] = (prior[r.name] || 0) + (r.xpGained | 0); }); });
  var adj = {};
  rows.forEach(function(r){ var c = climb[r.name]; if(!c && !prior[r.name]) return;
    var lv = c && c.level ? c.level : Math.max(1, r.level | 0), xp = (c && c.xp != null ? c.xp : C.xpFor(lv)) + (prior[r.name] || 0);
    adj[r.name] = {xp:xp, level:Math.max(lv, C.levelOf(xp))}; });
  return SP.grew(rows, adj, C.xpFor, C.levelOf);
}
function faceCanvas(name){
  var cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  var look = S.looks[name] || (S.men.filter(function(m){ return m.name === name && m.main; })[0] ? 'you' : null);
  var x = cv.getContext('2d'), miss = function(){ x.fillStyle = '#2a2119'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#a8977c'; x.font = 'bold 28px monospace'; x.textAlign = 'center'; x.fillText(String(name || '?').charAt(0), 32, 42); };
  try{ if(look && window.BohemiaCrewFaces) BohemiaCrewFaces.draw(x, look, 64, miss); else miss(); }catch(e){ miss(); }
  return cv;
}
function drawCrew(){
  var el = document.getElementById('crew'); el.textContent = '';
  var ups = 0;
  S.men.forEach(function(m){
    var d = document.createElement('div'); d.className = 'man' + (m.up ? ' up' : '') + (m.dead ? ' dead' : ''); d.dataset.man = m.name;
    d.appendChild(faceCanvas(m.name));
    var w = document.createElement('div'); w.className = 'w';
    var nm = document.createElement('div'); nm.className = 'nm';
    var a = document.createElement('span'); a.textContent = m.main ? 'YOU' : m.name; nm.appendChild(a);
    var lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = m.up ? 'LEVEL ' + m.from + ' > ' + m.to + '  LEVEL UP!' : 'LEVEL ' + m.to; nm.appendChild(lv);
    w.appendChild(nm);
    if(!m.dead){
      var span = Math.max(1, m.next - m.base), was = Math.max(0, Math.min(1, (Math.max(m.xpFrom, m.base) - m.base) / span)), now = Math.max(0, Math.min(1, (m.xpTo - m.base) / span));
      var bar = document.createElement('div'); bar.className = 'xpbar';
      var i0 = document.createElement('i'); i0.style.width = (was * 100) + '%'; bar.appendChild(i0);
      var u = document.createElement('u'); u.style.left = (was * 100) + '%'; u.style.width = (Math.max(0, now - was) * 100) + '%'; bar.appendChild(u);
      w.appendChild(bar);
      var xp = document.createElement('div'); xp.className = 'xp'; xp.innerHTML = '<b>+' + m.gained + ' XP</b>  ' + (m.xpTo - m.base) + ' of ' + span + ' to level ' + (m.to + 1); w.appendChild(xp);
    }
    var st = null;
    if(m.dead){ st = document.createElement('div'); st.className = 'state gone'; st.textContent = 'FELL. HE IS DEAD.'; }
    else if(m.down && m.main){ st = document.createElement('div'); st.className = 'state hurt'; st.textContent = 'WENT DOWN. UP AGAIN AFTER.'; }
    else if(m.down && m.injury){ st = document.createElement('div'); st.className = 'state hurt'; st.textContent = 'LAID UP ' + m.days + ' DAYS: ' + String(m.injury.name || '').toUpperCase(); }
    if(st) w.appendChild(st);
    if(m.up && !m.dead){ ups++;
      var b = document.createElement('button'); b.className = 'perk'; b.type = 'button'; b.textContent = 'PICK A PERK'; b.dataset.perk = m.name;
      b.addEventListener('click', function(){ openCrew(m.name); }); w.appendChild(b); }
    d.appendChild(w); el.appendChild(d);
  });
  var fell = S.men.filter(function(m){ return m.dead; }).length, hurt = S.men.filter(function(m){ return m.down && !m.dead && !m.main; }).length;
  document.getElementById('crewn').textContent = (ups ? ups + ' CLIMBED' : 'NOBODY CLIMBED') + (hurt ? ', ' + hurt + ' HURT' : '') + (fell ? ', ' + fell + ' DEAD' : '');
}
/* PICK A PERK: the one crew screen, over this one; it reads this fight (kept by the shell) and opens on the man with a point */
function openCrew(name){
  if(!window.BohemiaCrewDoor) return;
  sfx('equip');
  BohemiaCrewDoor.open({ base:'', onDone:function(){ S.stash = readJ(BAGKEY, []) || []; drawStash(); say('Back to the spoils.'); } });
  say((name ? name + ' climbed. ' : '') + 'Pick his perk, then DONE.');
}

/* ---------- WHAT THEY LEFT ---------- */
function itemFor(f){
  var it = C.itemOf(f.kind, f.id); if(!it) return null;
  it.cond = f.cond; it.condMax = f.max; it.from = f.from; it.looted = true;
  return it;
}
var PACK_ICON = {dagger:'w_pistol', mace:'w_pipe', hammer:'w_sledge', crossbow:'w_rifle', firearm:'w_shotgun', throwing:'w_bottles', throwable_item:'w_bottles',
  sword:'w_machete', axe:'w_axe', spear:'w_spear', cleaver:'w_cleaver', flail:'w_chain', polearm:'w_pole'};
var GLYPH = {weapon:'⚔', body:'⛨', head:'∩', shield:'▣'};
function pic(it, px){
  var f = it.kind === 'weapon' && PACK_ICON[it.cls];
  if(f){ var im = document.createElement('img'); im.className = 'pk'; im.alt = ''; im.src = 'market_icons/' + f + '.png'; return im; }
  try{ if(window.BohemiaMaterials && BohemiaMaterials.itemIcon) return BohemiaMaterials.itemIcon(it, px || 26); }catch(e){}
  var g = document.createElement('i'); g.textContent = GLYPH[it.kind] || '◆'; return g;
}
function shortName(it){ return it.name.replace(/^(a|an) /, '').split(' ').slice(-1)[0]; }
function condPct(it){ return it.condMax > 0 ? Math.round(100 * it.cond / it.condMax) : 100; }
function slotFor(it, where, i){
  var b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (it ? ' full' : '');
  if(!it) return b;
  b.appendChild(pic(it, 26));
  var n = document.createElement('span'); n.textContent = shortName(it); b.appendChild(n);
  if(it.condMax > 0 && condPct(it) < 100){ var e = document.createElement('em'); e.textContent = condPct(it) + '%'; b.appendChild(e); }
  b.setAttribute('aria-label', it.name + (it.from ? ', off ' + it.from : ''));
  b.dataset.where = where; b.dataset.i = i; b.dataset.id = it.id;
  if(where === 'stash' && it.looted && it.fresh) b.className += ' new';
  b.addEventListener('click', function(){ where === 'ground' ? takeOne(i) : putBack(i); });
  return b;
}
function drawCounts(){
  var el = document.getElementById('counts'); el.textContent = '';
  var c = S.counts || {batteries:0, rounds:0, scrap:0};
  [['batteries', 'BATTERIES', 'THE MONEY', 'BATTERY'], ['rounds', 'ROUNDS', 'OUT OF THEIR GUNS', 'ROUND'], ['scrap', 'SCRAP', 'WHAT WAS LEFT OF IT', 'SCRAP']].forEach(function(k){
    if(!(c[k[0]] > 0)) return; if(c[k[0]] === 1) k[1] = k[3];
    var b = document.createElement('button'); b.type = 'button'; b.className = 'count' + (S.countsTaken ? ' taken' : ''); b.dataset.count = k[0];
    b.innerHTML = '<b>+' + c[k[0]] + ' ' + k[1] + '</b><span>' + (S.countsTaken ? 'TAKEN' : k[2]) + '</span>';
    b.addEventListener('click', function(){ takeCounts(); }); el.appendChild(b); });
}
function drawGround(){
  var el = document.getElementById('ground'); el.textContent = '';
  if(!S.ground.length){ el.className = 'empty'; el.textContent = S.found && S.found.items.length ? 'Nothing left on the ground.' : 'Nothing they wore was worth carrying.'; }
  else { el.className = 'grid'; S.ground.forEach(function(it, i){ el.appendChild(slotFor(it, 'ground', i)); }); }
  var la = document.getElementById('lootall'), any = S.ground.length > 0 || (!S.countsTaken && hasCounts());
  la.disabled = !any; la.textContent = any ? 'LOOT ALL' : 'ALL TAKEN';
  document.getElementById('fromn').textContent = S.found ? 'OFF ' + S.found.from + ' DEAD' : '';
  var lf = document.getElementById('left'); lf.textContent = S.ground.length ? S.ground.length + ' STILL ON THE GROUND' : '';
}
function drawStash(){
  var el = document.getElementById('stash'); el.textContent = '';
  for(var i = 0; i < S.cap; i++) el.appendChild(slotFor(S.stash[i] || null, 'stash', i));
  document.getElementById('stashn').textContent = S.stash.length + ' / ' + S.cap;
}
function draw(){ drawCrew(); drawCounts(); drawGround(); drawStash(); }
function hasCounts(){ var c = S.counts || {}; return (c.batteries | 0) + (c.rounds | 0) + (c.scrap | 0) > 0; }
/* the counts take no room: batteries to the purse, rounds and scrap to its resources (the shell credits them) */
function takeCounts(){
  if(S.countsTaken || !hasCounts()) return false;
  S.countsTaken = true; var c = S.counts;
  post('counts', {batteries:c.batteries | 0, resources:(c.rounds | 0) + (c.scrap | 0), rounds:c.rounds | 0, scrap:c.scrap | 0, seq:S.seq});
  sfx('equip'); drawCounts(); drawGround(); return true;
}
function takeOne(i){
  var it = S.ground[i]; if(!it) return;
  var r = SP.take(S.stash, S.ground, i, S.cap);
  if(!r.ok){ say('Your stash is full (' + S.cap + ' of ' + S.cap + '). Put one back, or leave it.', true); return; }
  it.fresh = true; saveStash(); sfx('equip'); say('Took ' + it.name + (it.from ? ', off ' + titled(it.from) : '') + '.'); drawGround(); drawStash();
}
function putBack(i){
  var it = S.stash[i]; if(!it) return;
  S.stash.splice(i, 1); S.ground.push(it); saveStash(); say('Put ' + it.name + ' on the ground.'); drawGround(); drawStash();
}
function lootAll(){
  var gotCounts = takeCounts();
  var n0 = S.ground.length, r = SP.takeAll(S.stash, S.ground, S.cap);
  S.stash.slice(S.stash.length - r.took).forEach(function(it){ it.fresh = true; });
  if(r.took) saveStash();
  if(r.took || gotCounts) sfx('equip');
  if(r.left) say('Took ' + r.took + ' of ' + n0 + '. Your stash is full: ' + r.left + ' left on the ground.', true);
  else say(r.took ? 'Took all ' + r.took + '. Stash ' + S.stash.length + ' of ' + S.cap + '.' : gotCounts ? 'Took the counts.' : 'Nothing to take.');
  drawGround(); drawStash();
  return r;
}
function titled(s){ return String(s || '').toLowerCase().replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); }
function leave(){
  takeCounts();   /* the counts take no room: they always ride home */
  S.stash.forEach(function(it){ delete it.fresh; }); saveStash();
  post('leave', {left:S.ground.length, stash:S.stash.length});
}

/* ---------- open ---------- */
function open(o){
  o = o || {};
  if(!S.ready){ S.pending = o; return; }
  var f = o.fight || {};
  S.fight = f; S.seq = o.seq || Date.now();
  S.stash = (readJ(BAGKEY, []) || []).slice(0, S.cap);
  S.looks = {}; ((f.spoils && f.spoils.looks) || []).forEach(function(l){ if(l && l.name) S.looks[l.name] = l.look; });
  S.men = climbs(Array.isArray(f.crew) ? f.crew : []);
  var seed = o.seed != null ? o.seed : hash(JSON.stringify((f.spoils && f.spoils.bodies) || []) + ':' + (f.rounds | 0));
  S.found = SP.found(f.spoils, S.L, dice(seed));
  S.ground = S.found.items.map(itemFor).filter(Boolean);
  S.counts = S.found.counts; S.countsTaken = false;
  document.getElementById('rounds').textContent = f.rounds ? f.rounds + (f.rounds === 1 ? ' ROUND' : ' ROUNDS') : '';
  document.getElementById('head').textContent = 'THE FIGHT IS WON';
  draw();
  say(S.ground.length ? 'Tap a piece to take it, or LOOT ALL.' : hasCounts() ? 'Take what was in their pockets.' : '');
  S.opened = (S.opened | 0) + 1;
}

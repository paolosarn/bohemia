<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Spoils</title>
<!-- ============================================================================
     THE SPOILS  (RUN TWO, row [the end of the fight, the loot, the stash], 10/24/26, VAMILY rule 156)

     PAOLO 10/24: "I've been killing enemies all this time, winning battles, but there isn't an end of battle
     quick summary of who got experience, who leveled up, and what loot I'm able to take, with a loot button;
     and if my inventory is full it loots as much as it can and stops, similar to Battle Brothers... there's a
     whole inventory and bag screen you're just missing."

     MEASURED BEFORE THIS PAGE: the fight already counted every man's XP (20% to the killer, 80% shared, the
     wiki's rule) and its recap card showed it for FOUR BEATS, two seconds, before the game took him home on its
     own; nothing any beaten man carried ever reached him.

     NOW, Battle Brothers' way ('the after-combat-report always leads the player to the loot screen before
     allowing him to return to the worldmap', the library's dev blog): after every won fight this one screen,
     and it waits for him.
       YOUR CREW: each man once, his face, the XP he got on a bar, LEVEL UP when he climbed (and CHOOSE HIS LEVEL-UP,
         which opens the one crew screen on him: there he picks which stats rise from what each rolled, and his perk, Battle Brothers' way, rule 162), who is
         struck down with what (one hitpoint, still in the crew: rule 234, never laid up), who fell for good.
       WHAT THEY LEFT: what the dead carried, through Battle Brothers' own drop conditions (records/target/bb/
         loot.json: a weapon 90%, a shield 90%, a helmet 70%, armour only with a quarter of it left), as pieces;
         and what is not a thing you wear as a COUNT that takes no room: batteries (the money), rounds and TAPE
         (what is left of a wrecked piece; it was 'scrap' until rule 276(a), RUN FOUR 10/26: it goes into the company's tape). TAP A PIECE to take it, LOOT ALL takes as much as the stash holds and STOPS when it is full.
       YOUR STASH n / 36: the company's one bag (bohemia.bag.v1, the market fills it, the crew screen equips
         from it, the shops buy and sell from it); tap a piece in it to put it back on the ground.
       LEAVE: the counts ride home in your pockets; what is still on the ground stays there.

     HOW THE GAME PLUGS IT IN: frame this page and post {type:'BOHEMIA_SPOILS_OPEN', fight:<the fight's
     BOHEMIA_FIGHT_OVER message>, day?, seed?}. It posts back {type:'BOHEMIA_SPOILS', act:'counts', batteries,
     resources, rounds, tape, seq} once the counts are taken (resources is the rounds; the tape is already in bohemia.supplies.v1), act:'stash' {bag} on every change, act:'leave'. Standalone it
     shows a sample fight. Gate: gates/the_spoils_gate.js
     ============================================================================ -->
<style>
/* THE END OF THE FIGHT IN THE KIT (RUN TWO 10/25, rule 164 items 25 and 28; rule 130(b) THE UI GOES CRASHBOX): the bar, the
   sheets and every man's plate are corrugated board, what you press is tin (amber for LOOT ALL and a level-up), what the game
   prints is thermal receipt, a slot is a pocket of cracked glass: UI's rendered pieces (slices/ui_kit/), laid on by
   BohemiaMaterials.kit() below, the same pieces the crew screen wears. The words are the casing face and the ROM face. */
@font-face{font-family:'BohemiaCasing';src:url(fonts/BohemiaCasing-Regular.woff2) format('woff2');font-display:block}
@font-face{font-family:'BohemiaROM';src:url(fonts/BohemiaROM-Regular.woff2) format('woff2');font-display:block}
:root{--bg:#0f0c09;--plate:#2a2119;--plate2:#1c1611;--ink:#efe3c8;--dim:#a8977c;--gold:#e2bd6a;--line:#3a2f24;--red:#d0644a;--green:#9fc38f;--paper:#1f1710;
  --casing:'BohemiaCasing',ui-sans-serif,sans-serif;--rom:'BohemiaROM',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 var(--rom);-webkit-tap-highlight-color:transparent;user-select:none}
html{animation:in 280ms ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font-family:var(--rom)}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:var(--plate2);border-bottom:1px solid var(--line)}
#bar .word{font:30px/1 var(--casing);letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #000}
#bar.lost .word{color:var(--red)}
#bar .sub{flex:1;min-width:140px;font:13px/1.2 var(--casing);letter-spacing:1.5px;color:var(--ink)}
#tally{display:flex;gap:14px;align-items:baseline;padding:7px 12px 9px;color:var(--paper);font-size:11px;letter-spacing:.5px}
#tally b{font:16px/1 var(--casing);letter-spacing:1px}
.lines{margin:10px 14px 0}
.lines p{margin:0 0 4px;font:13px/1.35 var(--casing);letter-spacing:1px;color:var(--ink)}
.quote{display:flex;gap:10px;align-items:center;margin:10px 14px 0;padding:8px 12px 10px;color:var(--paper);font-size:12px}
.quote canvas{width:36px;height:36px;flex:0 0 36px;border-radius:3px;image-rendering:pixelated;background:#0b0907}
.quote q{font-style:italic;flex:1}
.quote b{font:12px var(--casing);letter-spacing:1px}
.h{margin:16px 14px 8px;font:12px/1 var(--casing);letter-spacing:2px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.h b{color:var(--ink);font-weight:400}
.h span:last-child{font:10px var(--rom);letter-spacing:.5px}
#crew{margin:0 14px}
.man{display:flex;gap:12px;align-items:flex-start;padding:10px 12px 12px;margin-bottom:8px;background:var(--plate2);border:1px solid var(--line);border-radius:6px}
.man.up{outline:2px solid var(--gold);outline-offset:-2px}
.man.dead{opacity:.62}
.man .face{flex:0 0 56px;width:56px;height:56px;padding:4px;border-radius:4px;background:#0b0907}
.man canvas{display:block;width:48px;height:48px;border-radius:2px;background:#0b0907;image-rendering:pixelated}
.man .w{flex:1;min-width:0}
.man .nm{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.man .nm span:first-child{font:15px/1.1 var(--casing);letter-spacing:1.5px}
.man .lv{color:var(--dim);white-space:nowrap;font-size:11px}
.man.up .lv{color:var(--gold);font:13px var(--casing);letter-spacing:1px}
.xpbar{position:relative;height:9px;margin-top:6px;background:#0d0a07;border:1px solid #4a3b2c;border-radius:2px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.xpbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#8a6c44,#5f4a2e)}
.xpbar u{position:absolute;top:0;bottom:0;background:linear-gradient(#f0cf83,#c9993f);text-decoration:none}
.xp{margin-top:4px;font-size:11px;color:var(--dim)}
.xp b{color:var(--gold);font-weight:400}
.nums{display:flex;gap:12px;margin-top:5px;font-size:11px;color:var(--dim)}
.nums b{color:var(--ink);font-weight:400}
.state{margin-top:4px;font-size:11px}
.state.hurt{color:var(--red)}
.state.gone{color:var(--red);font:12px var(--casing);letter-spacing:1px}
.perk{margin-top:8px;min-height:44px;padding:0 16px;background:var(--gold);color:#1a120a;border:0;border-radius:6px;font-size:12px;letter-spacing:1px}
#counts{display:flex;flex-wrap:wrap;gap:8px;margin:0 14px 8px}
html body #counts .count[data-count=tape]::before{background-image:url(supply_icons/tape.png)}   /* rule 276(a): the roll of tape off the bar, beside its count */
.count{min-height:44px;padding:6px 14px 8px;display:flex;flex-direction:column;justify-content:center;background:#ddd4bd;border:0;border-radius:2px;color:var(--paper);text-align:left}
.count b{font:16px/1.1 var(--casing);letter-spacing:1px;font-weight:400}
.count span{font-size:9px;letter-spacing:.5px;opacity:.75}
.count.taken{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 14px}
.slot{position:relative;aspect-ratio:1;min-height:44px;background:#16110c;border:1px solid var(--line);border-radius:3px;color:var(--ink);font-size:9px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.slot.full{cursor:pointer}
.slot.new::after{content:'';position:absolute;inset:2px;border:2px solid var(--gold);border-radius:3px;pointer-events:none}
.slot i{font-style:normal;font-size:16px;color:var(--gold);line-height:1}
.slot img.pk{width:auto;height:26px;max-width:88%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 0 #000)}
.slot canvas{max-width:80%;height:auto}
.slot span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
.slot em{position:absolute;right:4px;top:3px;font-style:normal;font-size:8px;color:var(--gold);text-shadow:0 1px 0 #000}
/* what is left of a worn piece is a fill along the box's foot, not a number (rule 224); the number is a long press or a hover away */
.slot .cw{position:absolute;left:5px;right:5px;bottom:3px;height:3px;background:rgba(0,0,0,.65);border-radius:1px;overflow:hidden;pointer-events:none}
.slot .cw i{display:block;height:100%;background:#8fb27a}
.slot .cw.mid i{background:#d8a64a}.slot .cw.low i{background:#c0553c}
#ground.empty{display:block;margin:0 14px;color:var(--dim);font-size:12px}
/* LOOT ALL and, beside it, OPTIMIZE LOOT (RUN FOUR [optimize loot], rule 244): one row, the two the same size */
#lootrow{display:flex;gap:8px;margin:10px 14px 0}
#lootall{display:block;flex:1 1 0;min-width:0;min-height:54px;background:var(--gold);color:#1a120a;border:0;border-radius:6px;font:17px/1 var(--casing);letter-spacing:3px}
#lootall:disabled{color:var(--dim)}
#optimize{flex:1 1 0;min-width:0;min-height:54px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--gold);color:#1a120a;border:0;border-radius:6px;font:17px/1 var(--casing);letter-spacing:3px}
#optimize[hidden]{display:none}
#optimize small{display:flex;align-items:center;gap:4px;font:13px/1 var(--casing);letter-spacing:1px}
#optimize small img,#said img.bat{height:16px;width:auto;image-rendering:pixelated}
#optimize.undo{background:var(--plate);color:var(--paper)}
#optimize:disabled{color:var(--dim)}
.gup{color:#2f6b25;font-style:normal}.gdn{color:#9a2d1c;font-style:normal}
/* THE STRIP (rules 249, 250): one line that is always there at one size: what he said, the piece he picked, what OPTIMIZE did */
#said{margin:8px 14px 0;height:58px;overflow:hidden;padding:6px 10px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12px;line-height:1.3;border-radius:3px;background:#16110c}
#said.full{color:var(--red)}
#said .pk,#said canvas{flex:0 0 auto;height:34px;width:auto;max-width:44px;object-fit:contain;image-rendering:pixelated}
#said .fx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#said .fx b{font:13px/1.1 var(--casing);letter-spacing:1px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#said .fx span{font-size:10px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#said .cbar{display:inline-block;width:46px;height:6px;margin-right:4px;vertical-align:middle;background:#0d0a07;border:1px solid #4a3b2c;border-radius:2px;overflow:hidden}
#said .cbar i{display:block;height:100%;background:#7f9a62}
#said .sell{flex:0 0 auto;display:flex;align-items:center;gap:3px;font:15px/1 var(--casing)}
#said .kp{font:10px/1 var(--casing);letter-spacing:1px;padding:2px 4px;border:1px solid currentColor;border-radius:2px}
#said .rep{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;min-width:0}
#said .rep .pk,#said .rep canvas{height:24px;max-width:30px}
#said .rep i{font:16px/1 var(--casing)}
.slot.sel{outline:3px solid #fff2c2;outline-offset:-1px;box-shadow:0 0 0 2px rgba(226,189,106,.55),inset 0 0 14px rgba(255,236,170,.28)}
.slot.out::before{content:'';position:absolute;inset:2px;border:2px dashed #b04a33;border-radius:3px;pointer-events:none}
#nothing{margin:0 14px;padding:10px 12px 12px;color:var(--ink);font:13px/1.4 var(--casing);letter-spacing:1px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:var(--plate2);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
#foot .left{flex:1;font-size:11px;color:var(--dim)}
#leave{min-width:150px;min-height:54px;background:var(--plate);color:var(--paper);border:0;border-radius:6px;font:16px/1 var(--casing);letter-spacing:3px}
.lost #loot{display:none}
.man .xp,.man .nums,.man .lv{color:#c4b190}
/* a phone: LOOT ALL rides the bottom bar beside LEAVE, one tap without a scroll however long the crew is (mobile first, rule 164 item 16) */
@media (max-width:699px){
  #lootrow{position:fixed;z-index:7;left:14px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 28px - 160px);margin:0;gap:6px}
  #lootall{min-height:54px;font-size:15px;letter-spacing:2px}
  #lootall:disabled{display:none}
  #optimize{font-size:14px;letter-spacing:1px;padding:4px 2px}
  /* OPTIMIZE beside LOOT ALL on the bar: LEAVE gives up a little room while the two stand there */
  body.opt #lootrow{width:calc(100% - 28px - 116px)}
  body.opt #leave{min-width:106px}
  /* the strip rides just over the bar, where his thumb is */
  #said{position:fixed;z-index:6;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));margin:0;border-radius:0;padding:6px 14px;border-top:1px solid var(--line)}
  body{padding-bottom:calc(144px + env(safe-area-inset-bottom))}
  #foot .left{visibility:hidden}
  body:not(.lost) #loot .h:first-child{margin-top:18px}
}
@media (min-width:700px){
  #ground.grid{grid-template-columns:repeat(6,minmax(64px,80px))}
  #ground .slot img.pk{height:34px}
  #cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,1.2fr);gap:0 10px;align-items:start;max-width:1240px;margin:0 auto}
  .grid{grid-template-columns:repeat(9,minmax(44px,60px));justify-content:start}
  #bar{padding-left:max(14px,calc((100vw - 1240px) / 2 + 14px));padding-right:max(14px,calc((100vw - 1240px) / 2 + 14px))}
}
</style>
</head>
<body>
<div id="bar"><span class="word" id="word">YOU WON</span><span class="sub" id="head">THE FIGHT IS WON</span><span id="tally"><span id="rounds"></span></span></div>
<div id="lines" class="lines"></div>
<div id="cols">
  <div>
    <div class="h"><span>YOUR CREW</span><span id="crewn"></span></div>
    <div id="crew"></div>
  </div>
  <div>
    <div id="callw"></div>
    <div id="loot">
      <div class="h"><span>WHAT THEY LEFT</span><span id="fromn"></span></div>
      <div id="counts"></div>
      <div id="ground" class="grid"></div>
      <div id="lootrow"><button id="lootall" type="button">LOOT ALL</button><button id="optimize" type="button" hidden>OPTIMIZE LOOT</button></div>
      <div id="said"></div>
      <div class="h"><span>YOUR STASH <b id="stashn">0 / 36</b></span><span id="stashhow">TAP TWICE TO PUT IT BACK</span></div>
      <div id="stash" class="grid"></div>
    </div>
    <div id="nothing" hidden></div>
  </div>
</div>
<div id="foot"><span class="left" id="left"></span><button id="leave" type="button">LEAVE</button></div>
<script src="../engine/bohemia_roster.js"></script>
<script src="../engine/bohemia_spoils.js"></script>
<script src="../engine/bohemia_camp.js"></script>  <!-- RUN TWO [the camp and the retinue]: the stash grows with the cart -->
<script src="../engine/bohemia_people_mix.js"></script>
<script src="../engine/bohemia_crew_faces.js"></script>
<script src="../engine/bohemia_crew_door.js"></script>
<script src="bohemia_ui_materials.js"></script>
<script>
(function(){
'use strict';
var C = window.BohemiaRoster, SP = window.BohemiaSpoils, BAGKEY = 'bohemia.bag.v1', CKEY = 'bohemia.climb.v1', AKEY = 'bohemia.fight.after.v1';
var S = { ready:false, L:null, cap:36, fight:null, nums:{}, rc:null, won:true, ground:[], stash:[], counts:null, countsTaken:false, men:[], looks:{}, seq:0, standalone:(window.parent === window), log:[],
  sel:null, tap:{it:null, at:0}, undo:null, out:[], at:{} };   /* RUN FOUR: the piece he picked, his last tap, OPTIMIZE's UNDO, what it left, the town's prices */
var FINE = !!(window.matchMedia && matchMedia('(pointer:fine)').matches);   /* a mouse: a double click or a right click; a finger: two taps */
function post(act, o){ var m = {type:'BOHEMIA_SPOILS', act:act}; for(var k in (o||{})) m[k] = o[k]; S.log.push(m);
  if(!S.standalone) try{ window.parent.postMessage(m, '*'); }catch(e){} }
function sfx(ev){ S.log.push({type:'BOHEMIA_SFX', ev:ev}); if(!S.standalone) try{ window.parent.postMessage({type:'BOHEMIA_SFX', ev:ev}, '*'); }catch(e){} }
function say(t, full){ var el = document.getElementById('said'); el.textContent = t; el.className = full ? 'full' : ''; }
function readJ(k, d){ try{ var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }
function saveStash(){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.stash)); }catch(e){} post('stash', {bag:S.stash.slice()}); }
/* the same seeded dice for the same fight: a reload of this screen finds the same things on the ground */
function dice(seed){ var x = (seed >>> 0) || 1; return function(){ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }
function hash(s){ var h = 2166136261; for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- YOUR CREW: who grew, who is hurt, who fell ---------- */
function climbs(rows){
  var climb = readJ(CKEY, {}) || {}, q = readJ(AKEY, []) || [];
  /* fights the crew screen has not read yet count first (the last one kept is this one: the shell keeps it before this opens) */
  var prior = {}, mine = q.length && q[q.length - 1] && JSON.stringify((q[q.length - 1].rows || []).map(function(r){ return r.name + r.xpGained; })) === JSON.stringify(rows.map(function(r){ return r.name + (r.xpGained | 0); }));
  q.slice(0, mine ? -1 : q.length).forEach(function(f){ (f.rows || []).forEach(function(r){ prior[r.name] = (prior[r.name] || 0) + (r.xpGained | 0); }); });
  var adj = {};
  rows.forEach(function(r){ var c = climb[r.name]; if(!c && !prior[r.name]) return;
    var lv = c && c.level ? c.level : Math.max(1, r.level | 0), xp = (c && c.xp != null ? c.xp : C.xpFor(lv)) + (prior[r.name] || 0);
    adj[r.name] = {xp:xp, level:Math.max(lv, C.levelOf(xp))}; });
  return SP.grew(rows, adj, C.xpFor, C.levelOf);
}
function faceCanvas(name){
  var cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  var look = S.looks[name] || (S.men.filter(function(m){ return m.name === name && m.main; })[0] ? 'you' : null);
  var x = cv.getContext('2d'), miss = function(){ x.fillStyle = '#2a2119'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#a8977c'; x.font = 'bold 28px monospace'; x.textAlign = 'center'; x.fillText(String(name || '?').charAt(0), 32, 42); };
  try{ if(look && window.BohemiaCrewFaces) BohemiaCrewFaces.draw(x, look, 64, miss); else miss(); }catch(e){ miss(); }
  return cv;
}
function drawCrew(){
  var el = document.getElementById('crew'); el.textContent = '';
  var ups = 0;
  S.men.forEach(function(m){
    var d = document.createElement('div'); d.className = 'man' + (m.up ? ' up' : '') + (m.dead ? ' dead' : ''); d.dataset.man = m.name;
    var fw = document.createElement('div'); fw.className = 'face'; fw.appendChild(faceCanvas(m.name)); d.appendChild(fw);
    var w = document.createElement('div'); w.className = 'w';
    var nm = document.createElement('div'); nm.className = 'nm';
    var a = document.createElement('span'); a.textContent = m.main ? 'YOU' : m.name; nm.appendChild(a);
    var lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = m.up ? 'LEVEL ' + m.from + ' > ' + m.to + '  LEVEL UP!' : 'LEVEL ' + m.to; nm.appendChild(lv);
    w.appendChild(nm);
    if(!m.dead){
      var span = Math.max(1, m.next - m.base), was = Math.max(0, Math.min(1, (Math.max(m.xpFrom, m.base) - m.base) / span)), now = Math.max(0, Math.min(1, (m.xpTo - m.base) / span));
      var bar = document.createElement('div'); bar.className = 'xpbar';
      var i0 = document.createElement('i'); i0.style.width = (was * 100) + '%'; bar.appendChild(i0);
      var u = document.createElement('u'); u.style.left = (was * 100) + '%'; u.style.width = (Math.max(0, now - was) * 100) + '%'; bar.appendChild(u);
      w.appendChild(bar);
      var xp = document.createElement('div'); xp.className = 'xp'; xp.innerHTML = '<b>+' + m.gained + ' XP</b>  ' + (m.xpTo - m.base) + ' of ' + span + ' to level ' + (m.to + 1); w.appendChild(xp);
    }
    var fn = S.nums[m.name];   /* what he did in it, off the fight's own recap card: kills, blood drawn, blood taken */
    if(fn){ var nu = document.createElement('div'); nu.className = 'nums';
      nu.innerHTML = '<span><b>' + fn.kills + '</b> ' + (fn.kills === 1 ? 'KILL' : 'KILLS') + '</span><span><b>' + fn.dealt + '</b> BLOOD DRAWN</span><span><b>' + fn.taken + '</b> TAKEN</span>';
      w.appendChild(nu); }
    var st = null;
    if(m.dead){ st = document.createElement('div'); st.className = 'state gone'; st.textContent = 'FELL. HE IS DEAD.'; }
    else if(m.down && m.main){ st = document.createElement('div'); st.className = 'state hurt'; st.textContent = 'WENT DOWN. UP AGAIN AFTER.'; }

/* ---------- open ---------- */
function open(o){

  S.at = o.sell && typeof o.sell === 'object' ? { add:+o.sell.add || 0, mult:o.sell.mult != null ? +o.sell.mult : 1 } : {};   /* the nearest town's standing and trait, when the game hands them over */

  if(S.won) say(S.ground.length ? (FINE ? 'Click a piece to see it. Double click to take it, or LOOT ALL.' : 'Tap a piece to see it. Tap it twice to take it, or LOOT ALL.') : hasCounts() ? 'Take what was in their pockets.' : '');
  S.opened = (S.opened | 0) + 1;
}
var SAMPLE = { type:'BOHEMIA_FIGHT_OVER', result:'won', rounds:6,

         {name:'TERESA', level:2, xpGained:410, dead:false, down:false, perks:[]} ],
  spoils:{ faction:'brigands', looks:[{name:'YOU', look:'you'}, {name:'MARCO', look:'cast_longcoat'}, {name:'TERESA', look:'cast_skirt'}],
    bodies:[ {name:'THUG', dead:true, weapon:{id:'knife', cls:'dagger', durability:32, gun:true, ammo:3, ammoMax:5}, body:{id:'padded_surcoat', now:44, max:50}, head:{id:'full_leather_cap', now:38, max:45}},
             {name:'RAIDER', dead:true, weapon:{id:'wooden_stick', cls:'mace', durability:32}, shield:{id:'wooden_shield', durability:24}, body:{id:'leather_tunic', now:6, max:30}},
             {name:'RUNNER', dead:false, fled:true, weapon:{id:'knife', cls:'dagger', durability:32}} ],

dress(); document.addEventListener('DOMContentLoaded', dress);
window.BohemiaSpoilsScreen = { open:open, dress:dress, state:S, lootAll:lootAll, takeOne:takeOne, putBack:putBack, leave:leave, takeCounts:takeCounts, SAMPLE:SAMPLE,
  optimize:optimize, undo:undo, draw:draw, pick:pick };
document.getElementById('lootall').addEventListener('click', lootAll);
document.getElementById('optimize').addEventListener('click', optimize);

  if(S.pending){ var p = S.pending; S.pending = null; open(p); }
  else if(S.standalone){ var smp = JSON.parse(JSON.stringify(SAMPLE)), q = location.search;   /* ?lost, ?ran, ?wipe: the other ends, for a look */
    if(/lost|ran|wipe/.test(q)){ smp.result = 'lost'; smp.retreat = /ran/.test(q); smp.wipe = /wipe/.test(q); smp.spoils.recap.head = smp.wipe ? 'WIPED OUT' : smp.retreat ? 'YOU PULLED OUT' : 'YOUR CREW IS DOWN'; smp.spoils.recap.call = null;

<script>
var DATA = {"quests": [{"file": "S01_THE_METER_READER.bq", "id": "bq_meter_reader", "title": "The Meter Reader", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Put the current back myself. The block has light tonight. Nobody was told.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Handed the tap to the trades. They patched it in daylight, names on the work order.", "factions": [{"faction": "TRADES", "delta": 8, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Cut the skim line in front of the whole block. Sparks, a crowd, and a message sent up.", "factions": [], "posture": ["NETWORK"]}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Left it alone. The block goes dark again tonight, same hour.", "factions": [], "posture": []}]}, {"file": "S02_THE_SAME_CRATE_TWICE.bq", "id": "bq_same_crate", "title": "The Same Crate Twice", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Delivered to the reds, clean, as promised. The blues heard I kept my word to someone else.", "factions": [{"faction": "REDS", "delta": 10, "rung": "NEUTRAL"}], "posture": ["BLUES"]}, {"stage": 31, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Doubled it to the blues. Quiet money. The reds will spend a year finding out it was me.", "factions": [{"faction": "BLUES", "delta": 12, "rung": "NEUTRAL"}], "posture": ["REDS"]}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Kept the crate for my own block and told both gangs to their faces. Two enemies, one night.", "factions": [], "posture": ["REDS", "BLUES"]}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Put the crate down and walked. Both sides remember the ones who flinch.", "factions": [], "posture": []}]}, {"file": "S03_ONE_MORE_SET.bq", "id": "bq_one_more_set", "title": "One More Set", "endings": [{"stage": 20, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Killed the amp and sat close while they played it acoustic. A dozen people, very quiet.", "factions": [], "posture": []}, {"stage": 21, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Found a charged cell and got a crowd to stay. They played the whole set. People filmed it in text.", "factions": [{"faction": "COLORFUL", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 22, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Spliced the amp straight into a live street line. Full volume, sparks, the whole block came. Loud and dumb and glorious.", "factions": [{"faction": "COLORFUL", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 23, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Told them to pack it in. The amp died on the downbeat and the crowd drifted off.", "factions": [], "posture": []}]}, {"file": "S04_WHAT_CRIES_IN_THE_DEEP.bq", "id": "bq_deep_cry", "title": "What Cries in the Deep", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Talked them up out of the deep, slow, in the dark, one word at a time. They walked out on their own feet.", "factions": [{"faction": "HOMELESS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Ended it loud in the deep, for the bounty. The crying stopped. Something far below noticed the noise.", "factions": [{"faction": "HOMELESS", "delta": 8, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Sealed the deep tunnel and told the elders it is gone. It is not gone. It is just quieter now, and walled in.", "factions": [{"faction": "HOMELESS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Could not do any of it. Left the crying where it was. The elders will find someone with a harder stomach.", "factions": [], "posture": []}]}, {"file": "S05_THE_STANDING_BOUNTY.bq", "id": "bq_standing_bounty", "title": "The Standing Bounty", "endings": [{"stage": 20, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Took the clean name off the board. A raider who had it coming. Got paid in medicine and slept fine.", "factions": [{"faction": "REMNANTS", "delta": 5, "rung": "NEUTRAL"}], "posture": []}, {"stage": 21, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Took the ugly name for the double pay. Not a raider. A debtor who ran. Did it anyway. Slept less fine.", "factions": [{"faction": "REMNANTS", "delta": 9, "rung": "NEUTRAL"}], "posture": []}, {"stage": 22, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Walked away from the board. My block goes a week shorter on medicine. My stomach stays where it is.", "factions": [], "posture": []}]}, {"file": "S06_BEHIND_THE_FENCE.bq", "id": "bq_behind_fence", "title": "Behind the Fence", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "He has a daughter. Kept hidden the whole time, until the wall and the trust were real. I held it quiet. The deepest bond, and nobody will ever know it happened.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Told the compound there is a child here now. More eyes, more followers, and the one thing he protected is no longer his secret. He thanked me and did not mean it.", "factions": [], "posture": []}, {"stage": 32, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Took the reveal badly, and he saw my face do it. He took it back. There is no daughter, he said. The wall might as well have stayed up.", "factions": [], "posture": []}]}, {"file": "S07_SAY_IT_BACK.bq", "id": "bq_say_it_back", "title": "Say It Back", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Carried her words, plain and true, to the man who earned none of them. He wept. Nobody else ever knew.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Brought them together in front of the whole block. A reconciliation with an audience. She got to see it land.", "factions": [{"faction": "CHURCH", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Delivered it as a curse instead of a blessing. Loud, in the open. He will not sleep, and neither, later, will I.", "factions": [], "posture": []}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Could not carry it. She died with the words still in her mouth. I will wonder about that for a long time.", "factions": [], "posture": []}]}, {"file": "S08_THE_TOLL_ROAD.bq", "id": "bq_toll_road", "title": "The Toll Road", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Paid the toll out of my own pocket and got the medicine moving. Quiet, forgettable, and a family lives.", "factions": [{"faction": "CARAVANS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Brokered a standing rate in the open, both sides shaking on it. The road stays paid but it stays open.", "factions": [{"faction": "CARAVANS", "delta": 8, "rung": "NEUTRAL"}, {"faction": "CARTEL", "delta": 4, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Turned the lieutenant against the boss. Quiet knife-work in the dark. The checkpoint has a new owner and owes me.", "factions": [], "posture": ["CARTEL"]}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Broke the checkpoint loud, guns and fire and a crowd. The medicine rolls tonight. The cartel now knows my face.", "factions": [{"faction": "CARAVANS", "delta": 10, "rung": "NEUTRAL"}], "posture": ["CARTEL"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Left the caravan sitting. The medicine spoils in the sun and a block does without.", "factions": [], "posture": []}]}, {"file": "S09_THE_BACK_DOOR.bq", "id": "bq_back_door", "title": "The Back Door", "endings": [{"stage": 20, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Boarded the front and side and let him keep the back to himself, no questions. He will not forget it. The wall feels closer.", "factions": [], "posture": []}, {"stage": 21, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Got the job done but drew a crowd to his door doing it. Solid house, rattled man. Eyes on his place is the one thing he did not want.", "factions": [], "posture": []}, {"stage": 22, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Pushed to see the back room. He shut down hard. Whatever trust was building took a step back tonight.", "factions": [], "posture": []}]}, {"file": "S10_THE_COUNT_THAT_DOES_NOT_ADD.bq", "id": "bq_the_count", "title": "The Count That Does Not Add", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Gave the true number, plainly, and let it go up. The block eats. The block is also on a page now.", "factions": [{"faction": "VOLUNTEERS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Handed up a short number. The ones who cannot be on any list stayed off it, and everyone eats a little less for that.", "factions": [{"faction": "VOLUNTEERS", "delta": 3, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Read the page out loud on the street first, every name, so nobody could be listed without knowing they were listed.", "factions": [], "posture": ["NETWORK"]}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Nobody got counted. Nobody gets crates either. The block cuts its meals in half and calls it dignity.", "factions": [], "posture": []}]}, {"file": "S11_SIXTY_SECONDS_OF_RAIN.bq", "id": "bq_sixty_seconds", "title": "Sixty Seconds Of Rain", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Went down myself and walked them out with a hand on each shoulder. It came through eight minutes later. Nobody up top ever knew.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Rang the market bell. Half the block came to help and a few came to see what got left unattended. Everyone in the culvert got out.", "factions": [{"faction": "BLUES", "delta": 8, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Broke the grate off the culvert mouth with a crowd watching, screaming into a hole in the ground. They got out. So did everything that lived down there.", "factions": [{"faction": "BLUES", "delta": 4, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Waited to be sure. It was sunny the whole time, right up until the wash filled. Nobody watched me decide nothing.", "factions": [], "posture": []}]}, {"file": "S12_THE_LAST_GOOD_DOCTOR.bq", "id": "bq_last_good_doctor", "title": "The Last Good Doctor", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Gave the whole course to the one it could actually save. Never told anyone how I picked. I will not forget how I picked.", "factions": [{"faction": "VOLUNTEERS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Put it to the block, out loud, and let them choose in front of both families. Nobody can say it was done in the dark. Both families heard every word.", "factions": [{"faction": "VOLUNTEERS", "delta": 9, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Took the crate. Both of them live, the clinic runs another month, and somewhere a ledger has my name in it waiting for a use.", "factions": [{"faction": "CARTEL", "delta": 10, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Split the course down the middle so neither family could say I chose. They both got a good week. Then it came back, and it came back stronger than it started.", "factions": [], "posture": []}]}, {"file": "S13_THE_PAPER_THAT_SAYS_SO.bq", "id": "bq_paper_says_so", "title": "The Paper That Says So", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Brokered it in a stairwell. He gets paid in work and light, they keep the door. No witnesses, no precedent, no trouble.", "factions": [{"faction": "REDS", "delta": 5, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Wrote a new paper in the street with the block watching and every name on it. Now there is a precedent, and precedents are the thing his faction actually owns.", "factions": [{"faction": "TRADES", "delta": 8, "rung": "NEUTRAL"}, {"faction": "REDS", "delta": -6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Honored the deed. Four families out by the weekend, the paper intact, and a man who owes me a favor I will not enjoy spending.", "factions": [{"faction": "REDS", "delta": 12, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Burned the deed in his hands in front of everybody. The building is theirs tonight. Paper is cheap. Being the person who burns paper is not.", "factions": [{"faction": "REDS", "delta": -15, "rung": "NEUTRAL"}], "posture": ["REDS"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Stayed out of it. They were out by the weekend anyway and I got to keep my hands clean and my walk to the market quiet.", "factions": [], "posture": []}]}, {"file": "S14_WHAT_THE_DOG_KNOWS.bq", "id": "bq_what_the_dog_knows", "title": "What The Dog Knows", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Sat on the step for two hours saying nothing until it took food out of my hand. Buried him behind the wall. The dog walks with me now.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Called the crew. Catchpole, blanket, the whole procedure, done properly with people watching. The dog eats every day now and works for somebody again.", "factions": [{"faction": "REMNANTS", "delta": 9, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Carried him out through the middle of the block in daylight with the dog behind me, so the whole valley could see how one of theirs ended and how long it took anyone to notice.", "factions": [{"faction": "REMNANTS", "delta": -6, "rung": "NEUTRAL"}], "posture": ["REMNANTS"]}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Left it alone. Three days later the stairwell was quiet, the landing was empty, and nobody will tell me which part of that they did.", "factions": [], "posture": []}]}, {"file": "S15_THE_LIGHTS_GO_OUT_AT_NINE.bq", "id": "bq_lights_at_nine", "title": "The Lights Go Out At Nine", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Settled it in a back room. The crew gets paid weekly, the lights never blinked, and nobody had to be seen losing.", "factions": [{"faction": "TRADES", "delta": 8, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Got the rate painted on the wall by the door where every crew in the valley can read it. He hated the paint more than the number.", "factions": [{"faction": "TRADES", "delta": 12, "rung": "NEUTRAL"}, {"faction": "MOB", "delta": -5, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Killed the marquee at nine on the fullest night of the week. Four blocks went dark and quiet and everybody learned exactly whose hand is on that switch.", "factions": [{"faction": "MOB", "delta": -12, "rung": "NEUTRAL"}], "posture": ["MOB"]}, {"stage": 33, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Took his money to keep the lights on and let the crew find out the slow way. The corner is bright and I walk the long way around it now.", "factions": [{"faction": "MOB", "delta": 12, "rung": "NEUTRAL"}], "posture": []}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Nothing agreed. The crew broke up over it inside a month and the lights are run by two frightened kids who will not ask for anything.", "factions": [{"faction": "TRADES", "delta": -8, "rung": "NEUTRAL"}], "posture": []}]}, {"file": "S16_THE_VOICE_AT_THREE.bq", "id": "bq_voice_at_three", "title": "The Voice At Three", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Taught her to be short and to be somewhere else. Four minutes a night, a different roof, no pattern. She is still on the air and nobody has ever written it down.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Gave her one long night with the whole valley listening, then took the set apart at dawn and buried the pieces. One broadcast everybody heard once and nobody will ever hear again.", "factions": [{"faction": "ANARCHISTS", "delta": 10, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Walked the finder crew a false bearing and watched them believe me. She got weeks out of it. I got a face in somebody's notebook.", "factions": [], "posture": ["NETWORK"]}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Put their own method on the air. Live, at three, in plain words, so every roof in the valley knows exactly how a voice gets found. She is safer now. So is nobody else who works for them.", "factions": [{"faction": "ANARCHISTS", "delta": 14, "rung": "NEUTRAL"}], "posture": ["NETWORK"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Told her to go dark and she did. The band is static at three now, and the people who used to sit up for it do not talk about it.", "factions": [], "posture": []}]}, {"file": "S17_THE_SEED_THAT_DOES_NOT_COME_BACK.bq", "id": "bq_seed_no_return", "title": "The Seed That Does Not Come Back", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "One small sack for this winter, planted on the far side of the ridge where the pollen cannot reach her line. Nobody eats well and nobody loses anything permanent.", "factions": [{"faction": "BLUES", "delta": 5, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Got the whole block to sign a thin year on purpose. All saved seed, smaller plates, and a line that still belongs to them in ten years. Everybody had to agree out loud, which is why it will hold.", "factions": [{"faction": "BLUES", "delta": 12, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Took the full load on credit. Best harvest anyone has seen in nine years, a debt to people who travel, and a saved line the pollen got into. Next year we buy again. So does everyone.", "factions": [{"faction": "CARAVANS", "delta": 12, "rung": "NEUTRAL"}, {"faction": "BLUES", "delta": -6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Told his buyers, standing in his own yard, that the second generation of what he sells is worthless. True, loud, and it cost him the season and me a road.", "factions": [{"faction": "CARAVANS", "delta": -15, "rung": "NEUTRAL"}], "posture": ["CARAVANS"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Nothing settled, and the planting window closed while everyone was still being reasonable at each other.", "factions": [], "posture": []}]}, {"file": "S18_THE_PATCH_UNDER_THE_COLLAR.bq", "id": "bq_patch_under_collar", "title": "The Patch Under The Collar", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Told him off the job with nobody watching. No speech, no yard, no crowd. He took his tools and went and there was nothing for anyone to rally around.", "factions": [{"faction": "TRADES", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Put it to the crew in daylight and let them write the line themselves. He stays under terms every hand can see and enforce, and the terms are the crew's, not mine.", "factions": [{"faction": "TRADES", "delta": 10, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Kept him and kept it quiet. The job finishes on time and I own every part of what happens the day it comes out, and it will come out.", "factions": [{"faction": "TRADES", "delta": 4, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Pulled the collar down in the middle of the yard. Everybody saw it, and now everybody has to have an opinion, and half of them found out today which half they are.", "factions": [{"faction": "TRADES", "delta": -8, "rung": "NEUTRAL"}], "posture": ["TRADES"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Said nothing to anybody. Two hands stopped showing up and neither of them will tell me why, and I already know why.", "factions": [{"faction": "TRADES", "delta": -10, "rung": "NEUTRAL"}], "posture": []}]}, {"file": "S19_THE_MIDWIFES_HOUR.bq", "id": "bq_midwifes_hour", "title": "The Midwife's Hour", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Burned the hour on hot water and washed hands and did the whole thing by two candles. Nobody watched. She is fine and so is he.", "factions": [{"faction": "VOLUNTEERS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Lit the room and filled it and let them sing her through it, and boiled what we could before the fuel went. She asked for the singing. Everyone on the block heard him arrive.", "factions": [{"faction": "CHURCH", "delta": 10, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Took the fuel out of the church store without asking anybody. Water boiled, lamps lit, both of them alive, and a door that will be locked to this block from tomorrow.", "factions": [{"faction": "CHURCH", "delta": -12, "rung": "NEUTRAL"}, {"faction": "VOLUNTEERS", "delta": 4, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Argued about the room for forty minutes. It went the way it goes when the water is cold and the hands are not clean, and everybody was very reasonable the whole time.", "factions": [], "posture": []}]}, {"file": "S20_THE_NAME_ON_THE_COUNTERFEIT.bq", "id": "bq_name_on_counterfeit", "title": "The Name On The Counterfeit", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Walked the bad ones back to him and made him work them good, cell by cell, on his own time. Nobody in the market ever learned there was a reason to doubt a token.", "factions": [{"faction": "REDS", "delta": 8, "rung": "NEUTRAL"}], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Posted every bad serial on the market wall so anybody could check their own. Trust survived. Everyone holding a hollow one ate it in public, and most of them were holding the small ones.", "factions": [{"faction": "REDS", "delta": 12, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Handed him to the clearing house and took the finder's cut. They will make an example and the example will be very effective and I will not be watching it.", "factions": [{"faction": "REDS", "delta": 15, "rung": "WARM"}], "posture": []}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Told the whole market the token was only ever a promise on somebody else's battery. True, and by nightfall nobody was taking them, and the people with nothing but tokens had nothing.", "factions": [{"faction": "REDS", "delta": -18, "rung": "COLD"}], "posture": ["REDS"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Said nothing. The token died slowly over a month instead of in an afternoon, and everybody blamed the weather and the caravans and each other.", "factions": [{"faction": "REDS", "delta": -8, "rung": "NEUTRAL"}], "posture": []}]}, {"file": "S21_THE_ONE_WHO_CAME_BACK.bq", "id": "bq_one_who_came_back", "title": "The One Who Came Back", "endings": [{"stage": 30, "kind": "COMPLETE", "clout": "quiet", "followers": 8, "reach": 7, "log": "Sat him down with somebody who has walked a hundred miles of that road and let them talk for three hours. Whatever the two of them concluded stayed in that room, and people can go on deciding for themselves.", "factions": [], "posture": []}, {"stage": 31, "kind": "COMPLETE", "clout": "notable", "followers": 25, "reach": 12, "log": "Let him tell it in the square. The block got the best night it has had in a year and by morning four families were packing, and nobody can say whether that was a gift or the opposite.", "factions": [{"faction": "CARAVANS", "delta": 6, "rung": "NEUTRAL"}], "posture": []}, {"stage": 32, "kind": "COMPLETE", "clout": "risky", "followers": 55, "reach": 17, "log": "Held him at the gate until the story got smaller. It got smaller fast. That proved nothing about the road and quite a lot about the gate, and the gate is what everybody looked at afterward.", "factions": [{"faction": "REMNANTS", "delta": 10, "rung": "NEUTRAL"}], "posture": []}, {"stage": 33, "kind": "COMPLETE", "clout": "reckless", "followers": 110, "reach": 24, "log": "Walked thirty people out the east road on the word of one man with no proof, in daylight, with everybody watching them go.", "factions": [{"faction": "REMNANTS", "delta": -12, "rung": "NEUTRAL"}], "posture": ["REMNANTS"]}, {"stage": 34, "kind": "FAIL", "clout": "quiet", "followers": 8, "reach": 7, "log": "Did nothing with it. He left alone before dawn and nobody went with him and nobody knows, and the not knowing settled over the block like dust.", "factions": [], "posture": []}]}], "tiers": [{"tag": "quiet", "weight": 8, "reach": 7}, {"tag": "notable", "weight": 25, "reach": 12}, {"tag": "risky", "weight": 55, "reach": 17}, {"tag": "reckless", "weight": 110, "reach": 24}], "untagged": {"weight": 15, "reach": 9}};
(function(){
var SUN=false;
function P(){ return SUN
  ? {card:'#e5dfcc',line:'#c9c2ab',ink:'#3a3320',dim:'#6a6350',good:'#2f7a2f',hot:'#b05a12',body:'#3a3320'}
  : {card:'#141609',line:'#2a2a1f',ink:'#cdbd8a',dim:'#8f8770',good:'#7ac87a',hot:'#e0a060',body:'#ddd'}; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function paint(){
  var p=P(), h='';
  DATA.quests.forEach(function(q){
    h+='<div class="q">'+esc(q.title||q.id)+'</div>';
    q.endings.forEach(function(e){
      var loud = (e.clout==='reckless'||e.clout==='risky');
      h+='<div class="card" style="background:'+p.card+';border-color:'+p.line+'">';
      h+='<div class="who" style="color:'+p.dim+'">YOU <span style="opacity:.6">@you</span>';
      if(e.clout) h+='<span class="tag" style="background:'+(loud?p.hot:p.good)+';color:'+(SUN?'#fff':'#0d1a0d')+'">#'+e.clout+'</span>';
      if(e.kind==='FAIL') h+='<span class="tag" style="background:#5a2a2a;color:#ffd9d9">FAILED</span>';
      h+='</div>';
      h+='<div class="body" style="color:'+p.body+'">'+esc(e.log)+'</div>';
      h+='<div class="eng" style="color:'+p.dim+'"><span>'+(e.kind)+'</span>'
        +'<span style="color:'+p.good+'">+'+e.followers+' followers</span></div>';
      h+='<div class="fx" style="border-color:'+(SUN?'rgba(0,0,0,.08)':'rgba(255,255,255,.07)')+'">';
      h+='<div class="reach" style="color:'+p.dim+';opacity:.8">WORD CARRIED '+e.reach+' TILES</div>';
      e.factions.forEach(function(f){
        h+='<div class="hit" style="color:'+(f.delta>0?p.good:p.hot)+'">'+f.faction+' '
          +(f.delta>0?'+':'')+f.delta+' &middot; '+f.rung+'</div>';
      });
      e.posture.forEach(function(f){
        h+='<div class="hit" style="color:'+p.hot+'">'+f+' STIRRED UP</div>';
      });
      h+='</div></div>';
    });
  });
  document.getElementById('body').innerHTML=h;
  document.getElementById('foot').innerHTML =
    'How loud you were decides how far it carries: '
    + DATA.tiers.map(function(t){ return '#'+t.tag+' '+t.reach+' tiles'; }).join(' &middot; ')
    + ' (untagged '+DATA.untagged.reach+'). Same numbers the run uses &mdash; the phone\'s card '
    + 'calls the same reachOf() and reads the same live FactionWorld, so this page cannot show '
    + 'you something the game does not do.';
}
document.getElementById('sun').onclick=function(){
  SUN=!SUN; var b=document.getElementById('bd'), p=P();
  b.style.background=SUN?'#efe9d8':'#0d0f0a'; b.style.color=SUN?'#3a3320':'#ddd';
  document.getElementById('bar').style.background=SUN?'#efe9d8':'#0d0f0a';
  document.getElementById('hdr').style.color=SUN?'#3a3320':'#cdbd8a';
  ['lede','sub','foot'].forEach(function(id){ document.getElementById(id).style.color=SUN?'#6a6350':'#8f8770'; });
  [].forEach.call(document.querySelectorAll('.q'),function(e){ e.style.color=SUN?'#3a3320':'#cdbd8a'; });
  paint();
};
paint();
})();
</script>

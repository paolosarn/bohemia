<!-- ============================================================================
     THE SETTLEMENT SCREEN  (RUN 2, row [settlement screen], 10/1/26)

     Rule 37b (Paolo 9/27): "I like the settlement menu more... you see the settlement
     but you just click the building." Rule 55: RUN 2 builds the screen as ONE FILE that
     RUN 1 plugs into the arrival; RUN 2 never touches the map, travel or the cut.

     THE LAYOUT IS B from UI's 9/28 card (UI_HOW_YOU_PICK_A_BUILDING_9_28): the place is
     drawn and its buildings ARE the buttons (Battle Brothers straight), AND the same
     buildings sit as a row of big plates along the bottom where the thumb is. Picked by
     RUN 2 under EVERYTHING IS A THUMB: A puts every target up where the thumb is not, C
     is a phone app list and the least like Battle Brothers. He corrects it if he hates it.

     THE BUILDINGS are Battle Brothers' own list (GROK_20 / GROK_21, stamped), translated
     (rule 48): RECRUITS -> THE HALL (who wants work, through a mouth), the CONTRACT BOARD
     -> THE BOARD (one main quest, two contracts, rule 51), MARKETPLACE -> THE STALL,
     BARBER -> THE BARBER (CHARACTER's cost, a00bb5cf), plus our SCAVENGE (rule 37k,
     WORLD's engine). Every building speaks through a face (rule 32a: text comes from a
     mouth with a portrait; nothing pops up).

     THE ART is the approved storefront run (records/target/tileforms/TF-ART-008, our own
     street's walls), drawn at its own pixels, never smoothed. Analog horror at the source:
     the shop light hums and drops out on its own clock, the dark door stays dark.

     HOW RUN 1 PLUGS IT IN: load this page in a frame and post
       {type:'BOHEMIA_SETTLEMENT_OPEN', place:{name, tier:'camp'|'town'|'fortress',
        district, block}, batteries, contracts:[ids already held], hired:{}}
     The page posts back {type:'BOHEMIA_SETTLEMENT', act, ...} for every thing he does:
       'contract' {contract}, 'hire' {role}, 'barber' {opens}, 'buy' {good}, 'relation' {place, act, before, after, band},
       'scavenge' {result}, 'leave', 'needFace' {who}.
     A face arrives as {type:'BOHEMIA_SETTLEMENT_FACE', who, src(dataURL)}.
     Standalone (no parent) it runs on its own purse with 3 batteries so it can be played.
     Gate: gates/settlement_screen_gate.js
     ============================================================================ -->
<style>
:root{
  --bg:#120e0a; --plate:#2a2119; --plate2:#1c1611; --ink:#e9dcc4; --dim:#a8977c;
  --gold:#d9a85a; --red:#c4553f; --line:#3a2f24;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.35 ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent;
  overflow:hidden;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;
  background:var(--plate2);border-bottom:1px solid var(--line)}
#bar .name{font-weight:700;letter-spacing:1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .bat{color:var(--gold)}
#crew{min-width:64px;min-height:44px;margin-right:6px;background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:700}
#leave{min-width:76px;min-height:44px;background:var(--plate);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;font:inherit;font-weight:700}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0907}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.hot{position:absolute;border:1px dashed rgba(217,168,90,0);border-radius:3px;background:transparent;padding:0;
  min-width:44px;min-height:44px;cursor:pointer}
.hot span{position:absolute;left:50%;top:6px;max-width:none;transform:translateX(-50%);background:rgba(18,14,10,.86);
  color:var(--ink);font-size:11px;letter-spacing:1px;padding:3px 6px;border:1px solid var(--line);
  border-radius:3px;white-space:nowrap;pointer-events:none}
.hot:active,.hot.on{border-color:var(--gold)}
#shelf{display:flex;gap:6px;overflow-x:auto;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:var(--plate2);
  border-top:1px solid var(--line)}
.pl{flex:1 0 70px;min-width:70px;min-height:64px;background:linear-gradient(#33281e,#211a13);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;font:inherit;font-size:11px;letter-spacing:1px;padding:6px 2px;
  box-shadow:inset 0 1px 0 rgba(255,235,200,.12),0 2px 0 #000}
.pl b{display:block;font-size:12px}
.pl small{display:block;color:var(--dim);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.on{border-color:var(--gold)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:rgba(22,17,12,.97);
  border-top:2px solid var(--gold);padding:12px 12px 14px;transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
.who{display:flex;gap:10px;align-items:flex-start}
.face{width:72px;height:72px;flex:0 0 72px;border:1px solid var(--line);border-radius:4px;background:#0b0907;
  image-rendering:pixelated}
.say .nm{color:var(--gold);font-size:12px;letter-spacing:1px}
.say p{margin:4px 0 0}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.act{min-height:48px;text-align:left;background:var(--plate);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;font:inherit;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.act[disabled]{opacity:.45}
/* the client at the board: his face, his name, what he needs, the skulls and pay (RUN TWO 10/17) */
.act.client{justify-content:flex-start}
.act.client .face.small{width:48px;height:48px;flex:0 0 48px}
.act.client .cl{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.act.client .cn{font-style:normal;color:var(--gold);font-size:10px;letter-spacing:1px}
.act.client em{margin-left:auto}
.act em{font-style:normal;color:var(--gold);white-space:nowrap}
.slots{margin-top:10px;color:var(--dim);font-size:12px}
#close{position:absolute;right:8px;top:6px;min-width:44px;min-height:44px;background:none;border:0;color:var(--dim);font:inherit;font-size:20px}
/* the shelf and the bag: square slots, Battle Brothers' stash grid */
.gridh{margin:10px 0 4px;font-size:11px;letter-spacing:1px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:1;min-height:44px;background:#16110c;border:1px solid var(--line);border-radius:3px;color:var(--ink);
  font:inherit;font-size:9px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.slot.full{background:linear-gradient(#2e241a,#1d1610);border-color:#4a3b2c;box-shadow:inset 0 1px 0 rgba(255,235,200,.1),0 1px 0 #000}
.slot i{font-style:normal;font-size:16px;color:var(--gold);line-height:1}
.slot img.pk{width:auto;height:58%;max-width:84%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 0 #000)}
.act img.pk{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;margin-right:8px;vertical-align:middle;flex:none}
.slot span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot em{font-style:normal;color:var(--dim);font-size:9px}
/* the hire card: face, name, background, eight stats, the starred one gold, the price */
.hire{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;padding:6px;border:1px solid var(--line);border-radius:4px;background:#16110c;margin-top:6px}
.hire .face{width:64px;height:64px;flex:none}
canvas[data-face=fresh]{image-rendering:auto}   /* the fresh portrait is a render: a 128 at 72 css px scales smooth, never nearest at 1.7x (RUN TWO 10/18) */
.hire .nm{color:var(--gold);font-size:11px;letter-spacing:1px}
.hstats{display:grid;grid-template-columns:repeat(4,auto);gap:1px 8px;font-size:10px;color:var(--dim);margin-top:3px}
.hstats .star{color:var(--gold)}
.hire .act{grid-column:1 / -1;margin:0}
#heard{min-height:20px;padding:0 12px;color:var(--dim);font-size:12px;background:var(--plate2)}
/* THE ARRIVAL (RUN TWO 10/18, [the arrival]): the town's name on a torn tag, its tier, the elder's one line under
   his face, the town's opinion of you, its banner if it has one; two seconds over the picture, a tap skips */
#arrive{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:16px;background:rgba(9,7,5,.78);opacity:0;transition:opacity .18s steps(3)}
#arrive.on{opacity:1}
#arrive canvas.tag{image-rendering:pixelated;max-width:100%}
#arrive .who{max-width:340px;width:100%;background:rgba(22,17,12,.92);border:1px solid var(--line);border-radius:4px;padding:8px}
#arrive .op{max-width:340px;width:100%;font-size:11px;letter-spacing:1px;color:var(--dim)}
#arrive .op .rail{position:relative;height:10px;margin-top:4px;background:#16110c;border:1px solid var(--line);display:grid;grid-template-columns:repeat(9,1fr)}
#arrive .op .rail i{border-right:1px solid #2a2119}
#arrive .op .rail b{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--gold);box-shadow:0 1px 0 #000}
#arrive .op .bandw{color:var(--ink)}
#arrive .fac{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1px;color:var(--dim)}
#arrive .fac .sw{width:22px;height:22px;border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,235,200,.15)}
#arrive .fac img{width:40px;height:40px;image-rendering:pixelated;border:1px solid var(--line)}
</style>

<script src="../engine/bohemia_settlement_heard.js"></script>  <!-- SOUNDS [the settlement's sounds] round four (10/18): the real recordings and the desert bed, his 10/17 UP -->  <!-- UI [the settlement's labels]: the torn tag and the receipt lines (rule 71a) -->
<script>
(function(){
'use strict';
/* ROUND THREE (RUN TWO, 10/4; the sixth votes, rule 67, Paolo 10/2: 'the settlement screen
   looking real dogshit, look how Battle Brothers settlements work... the buildings will be the
   buttons, extra buttons not needed'; and 'always a 45-degree angle looking down').
   Battle Brothers' settlement is one painted picture of the town with its buildings standing in
   it; you click a building and its window opens; there is nothing else on the screen but the
   town's name and the way out. So: the town is a 3x3 plot of the game's OWN 45-degree buildings
   (the sixty the map's ground is painted with, HERO_SRC, copied to slices/settlement/), each one
   standing on its lot, and a tap on the building's own pixels opens it. The shelf of plates is
   gone. A place only has the buildings its size carries (Battle Brothers: a hamlet has fewer);
   an empty lot is bare ground. Translated names (rule 48). */
var B = {
  hall:   {spr:'chapel',      gx:0, gy:0, name:'THE HALL',   short:'who wants work'},
  board:  {spr:'cityhall',    gx:1, gy:0, name:'THE BOARD',  short:'contracts'},
  clinic: {spr:'medical',     gx:2, gy:0, name:'THE CLINIC', short:'heals faster'},
  stall:  {spr:'swapmeet',    gx:0, gy:1, name:'THE STALL',  short:'buy, sell'},
  barber: {spr:'commercial',  gx:2, gy:1, name:'THE BARBER', short:'1 battery'},
  train:  {spr:'firestation', gx:0, gy:2, name:'THE YARD',   short:'swap a mastery'},
  bar:    {spr:'truckstop',   gx:1, gy:2, name:'THE BAR',    short:'a round, a rumour'},
  arms:   {name:'GUNS AND PLATE', short:'buy, sell'},
  smith:  {name:'THE SMITH',     short:'weapons'},
  armourer:{name:'THE ARMOURER', short:'armour'},
  lot:    {spr:'boneyard',    gx:2, gy:2, name:'SCAVENGE',   short:'one thing or nothing'}
};

var TIERS = {
  camp:     ['hall','board','stall','lot'],
  town:     ['hall','board','stall','barber','bar','lot'],
  fortress: ['clinic','board','hall','stall','barber','bar','train','lot']
};
var ORDER = TIERS.town.slice();

/* ---------- A PLACE HAS TRAITS (rule 71, Paolo 10/4: 'settlements have traits too, depending on
   random variables'). Battle Brothers' situations, from records/target/settlement_traits.json: rolled
   per place by its name and the week, so a trait comes and goes; each changes the picture, the
   shelves' prices and stock, who stands at the posts, and what the keepers say first. ---------- */
var TRAITS = null, ARR = null;
fetch('../records/target/settlement_traits.json').then(function(r){ return r.json(); }).then(function(j){ TRAITS = j; placeTraits(); restock(); }).catch(function(){});
/* RUN TWO [the raid is a record] 10/18 (ECONOMY day 70: 190 of 624 place-weeks, 30.4 percent, read RAIDED with nobody
   raiding, and a real raid never reached the counter). A CAUSED trait (caused_by:'ledger' in the file: raided, conquered,
   well supplied) is never rolled: it stands only when FACTIONS' ledger (open({ledger, ledgerPlace})) has a mark on this
   place on the map's day, and its numbers are the ledger file's own (records/target/bb/arrival_traits.json, the wiki's
   cards: raided is half the shelf and half the men, no price). The dice keep the rest (rule 71, his 'random variables'). */
fetch('../records/target/bb/arrival_traits.json').then(function(r){ return r.json(); }).then(function(j){ ARR = j; if(window.BohemiaArrivalTraits) BohemiaArrivalTraits.set(j); placeTraits(); restock(); }).catch(function(){});
function caused(t){ return !!(t && t.caused_by); }
/* the dice (engine/bohemia_livingmap.js traitsFor rolls the same, line for line, for the map's crowd), then the ledger */
/* what happened here is said first, then who came here from it, then the dice. The map hands its dice as traits (the living map's
   roll at the gate) and its ledger beside them: a raid stands on top of the dice, never instead of the ledger (RUN TWO 10/18: before,
   handing traits switched the ledger off, so a raid the map handed with its crowd's roll would never have reached the counter) */
function placeTraits(){
  rollTraits();
  var has = function(t){ return S.traits.some(function(x){ return x.id === t.id; }); };
  refugeeTraits().forEach(function(t){ if(!has(t)) S.traits.unshift(t); });
  ledgerTraits().forEach(function(t){ if(!has(t)) S.traits.unshift(t); });
}
/* RUN TWO [the neighbour takes the refugees], 10/18 (ECONOMY day 70: 'the raided town is not dearer, it is EMPTY... the dear town
   is the one NEXT to it, where the people went'; South Africa 2021, Los Angeles 1992). While FACTIONS' ledger marks RAIDED on the
   town NEAREST this one on the map's own cells (slices/bohemia_bar_news.js refugeesAt, the seats the map arrives at), this town
   reads the wiki's Refugees card (page 1660) for the same days, and its people say whose they are and who burned them out. */
function refugeeTraits(){
  if(!S.ledger || !TRAITS || !window.BohemiaBarNews || !BohemiaBarNews.ready()) return [];
  var r = BohemiaBarNews.refugeesAt({here:S.ledgerPlace ? {id:S.ledgerPlace, name:S.ledgerPlace} : S.place, day:buildDay(), ledger:S.ledger});
  var card = TRAITS.traits.filter(function(t){ return t.id === 'refugees'; })[0];
  if(!r || !card) return [];
  return [Object.assign({}, card, {from:r.of, fromPlace:r.place, by:r.by, ago:r.ago})];
}
function rollTraits(){
  S.traits = []; S.traitSaid = {};
  if(!TRAITS) return;
  if(Array.isArray(S.forceTraits)){
    S.traits = TRAITS.traits.filter(function(t){ return S.forceTraits.indexOf(t.id) >= 0; });
    return;
  }
  var per = (TRAITS.roll && TRAITS.roll.period_days) || 7, R1 = rng(seedOf(S.place.name + ':traits:' + Math.floor((S.day||0)/per)));
  if(R1() < ((TRAITS.roll && TRAITS.roll.chance_any) || .7)){
    var pool = TRAITS.traits.filter(function(t){ return !t.caused_by; }), n = 1 + (R1() < .3 ? 1 : 0);
    for(var i=0; i<n && pool.length; i++) S.traits.push(pool.splice(Math.floor(R1()*pool.length), 1)[0]);
  }
}
function ledgerTraits(){
  if(!S.ledger || !ARR || !window.BohemiaArrivalTraits) return [];
  var ids = BohemiaArrivalTraits.active(S.ledger, S.ledgerPlace || S.place.id || S.place.name, buildDay());
  return ids.map(function(id){ return TRAITS.traits.filter(function(t){ return t.id === id; })[0] || {id:id, name:id.replace(/_/g,' ').toUpperCase(), caused_by:'ledger'}; });
}
/* the knobs: buy and sell apart (a card can move them opposite ways), the shelf, the men (a multiplier; none is 'nobody
   signs on'). A caused trait reads the ledger file's effects; a rolled one its own fields */
function traitMult(){
  var m = {buy:1, sell:1, stock:1, men:1, meds:1, food:1, foodStock:1, none:false};
  (S.traits||[]).forEach(function(t){
    if(caused(t) && t.caused_by === 'ledger'){
      var f = (ARR && ARR.traits[t.id] && ARR.traits[t.id].effects) || {}, v = function(k){ return f[k] ? f[k].value : 1; };
      m.buy *= v('buy_price_mult'); m.sell *= v('sell_price_mult'); m.stock *= v('items_mult'); m.men *= v('recruits_mult');
      return;
    }
    /* a rolled trait's own card (ECONOMY day 71): buy and sell apart, the shelf, the men, medicine alone (Sickness) */
    m.buy *= (t.buy_mult || t.price_mult || 1); m.sell *= (t.sell_mult || t.price_mult || 1); m.stock *= (t.stock_mult||1);
    m.men *= (t.recruits_mult||1); m.meds *= (t.medicine_buy_mult||1);
    m.food *= (t.food_buy_mult||1); m.foodStock *= (t.food_stock_mult||1);   /* the Refugees card: food dearer and scarcer */
    if((t.recruits||0) < 0) m.none = true;
  });
  return m;
}
/* a card that came from somewhere says where: {from} the town the people came from, {by} the crew, {ago} when */
function fillTrait(t, line){
  return String(line).replace(/\{from\}/g, t.from || 'a town up the road').replace(/\{by\}/g, t.by || 'crew').replace(/\{ago\}/g, t.ago || 'a few nights back');
}
function traitLine(k){
  for(var i=0;i<(S.traits||[]).length;i++){ var t = S.traits[i]; if(t.says && (t.says[k] || t.says.any)) return fillTrait(t, t.says[k] || t.says.any); }
  return null;
}
/* THE LOOK, drawn over the painted place until COMBAT TWO's trait pictures exist: a burnt house
   with smoke still rising, planks across the clinic's windows, a crowd round the stall. Each is
   placed on a building already in that tier's picture (picked by eye). */
var LOOKBOX = {burnt:{camp:[840,220,1000,420], town:[1600,0,2060,370], fortress:[1116,122,1631,486]}};
function drawTraitLooks(s){
  if(!VAR || !(S.traits||[]).length) return;
  var now = performance.now(), tier = S.place.tier;
  function box(b){ return {x:view.ox+b[0]*s, y:view.oy+b[1]*s, w:(b[2]-b[0])*s, h:(b[3]-b[1])*s}; }
  S.traits.forEach(function(t){
    if(t.look === 'burnt'){
      var b = box((LOOKBOX.burnt[tier]||LOOKBOX.burnt.town));
      cx.save(); cx.globalCompositeOperation = 'multiply'; cx.fillStyle = 'rgb(70,52,40)'; cx.fillRect(b.x, b.y, b.w, b.h); cx.restore();
      cx.fillStyle = 'rgba(20,14,10,.55)'; for(var i=0;i<14;i++){ var px = b.x + ((i*37)%100)/100*b.w, py = b.y + ((i*61)%100)/100*b.h; cx.fillRect(px, py, b.w*.12, b.h*.08); }
      /* smoke, still rising: slow puffs on the beat, never a glow */
      for(var j=0;j<6;j++){ var ph = ((now/1000*.25) + j/6) % 1; cx.fillStyle = 'rgba(60,56,52,' + (0.35*(1-ph)).toFixed(3) + ')';
        cx.beginPath(); cx.arc(b.x + b.w*.55 + Math.sin(j*2+now/1400)*b.w*.06, b.y - ph*b.h*.9, (6 + ph*22)*s*3, 0, 7); cx.fill(); }
    }
    if(t.look === 'boarded' && VAR.boxes.clinic){

/* RUN TWO [the shelf restocks] 10/18: Battle Brothers' marketplace 'refreshes about every 3 days'
   (reference/library/grok/GROK_21_WIKI_ROUND_01_2026_09_30.md line 17). The shelf is rolled from the place's name AND
   the game's day / 3 (the map's clock, open({day}); never the phone's, never the scavenge hours), so the same visit
   reads the same shelf, a bought piece stays gone until the next delivery, and three days on the shelf is a new roll
   at the same tier, the sold-out slot refilled. Day 0 to 2 keep the old seed, so nothing already shown moves. */
var RESTOCK_DAYS = 3;
/* RUN TWO [the sell price by the bar] 10/18: a town that likes you charges less and pays more (the wiki's Market prices
   page, numbers in settlement_traits.json relation_prices): from Neutral 50 to Allied 100 the buy side drops up to 15% of
   worth and the sell side gains up to 2% of worth, both added before the situations multiply; below 50 the page is
   silent, so nothing moves. */
function relPrice(){
  var R = TRAITS && TRAITS.relation_prices, out = {buySub:0, sellAdd:0};
  if(!R || typeof opinionNow !== 'function') return out;

  out.buySub = R.buy_sub_at_100 * f; out.sellAdd = R.sell_add_at_100 * f; return out;
}
function restockPeriod(){ return Math.floor(((typeof S.mapDay === 'number') ? S.mapDay : 0) / RESTOCK_DAYS); }

/* the shelf: what a place this size carries, rolled from its name so it is the same every visit */
function restock(){

  /* each shelf rolls on its own stream, so a trait that takes or adds items never reshuffles the rest */
  function pick(rows, n, key){
    var per = restockPeriod(), R0 = rng(seedOf(S.place.name + ':stock:' + key + (per ? ':' + per : '')));
    var sorted = rows.filter(function(r){ return r.value != null; }).sort(function(a,b){ return a.value-b.value; });
    var lo = Math.floor(sorted.length*band[0]), hi = Math.max(lo+1, Math.floor(sorted.length*band[1])), out = [], seen = {};
    for(var t=0; t<60 && out.length<n; t++){ var r = sorted[lo + Math.floor(R0()*(hi-lo))]; if(r && !seen[r.id]){ seen[r.id]=1; out.push(r); } }
    return out;

  var rp = relPrice();
  for(var sk in S.stock) S.stock[sk].forEach(function(it){ it.base = it.price; it.price = Math.max(1, Math.round(it.price * (1 - rp.buySub) * tm.buy)); });

}

    if(px >= b[0] && px <= b[2] && py >= b[1] && py <= b[3]){ var a = (b[2]-b[0])*(b[3]-b[1]); if(a < area){ area = a; best = k; } } });

/* ---------- A MOUTH WITH A FACE ---------- */
/* RUN TWO [portraits when they talk], 10/11 (his ninth and tenth votes: 'can these people start getting portraits
   when you click and talk to them'): nobody speaks with a blank head. AMENDED 10/19 ([the 3D models on your screens],
   rule 121(e): a portrait is a render of the rig's own head, the two never combined): the old painted 64 off a body sheet
   (slices/fight_people) is never drawn again; every look has PORTRAIT's 3D head, and if its file fails the head is the
   dim shape, never the old paint */
function sheetFace(x, look){ dimHead(x); }
/* RUN TWO [the fresh portraits wired in], 10/18 (rule 115(h) amended; his 'I liked it when it was the portrait, not when
   you zoom in on the creepy model's face... it has to be made fresh portrait'): a look PORTRAIT has made wears its fresh
   portrait (engine/bohemia_crew_faces.js, 128 px, its own camera and light), never a crop of a body; true if it does */
function crewFace(c, look){
  var F = window.BohemiaCrewFaces; if(!F || !F.has(look)) return false;
  c.width = c.height = F.SIZE; c.dataset.face = 'fresh'; c.dataset.look = look;
  return F.draw(c.getContext('2d'), look, F.SIZE, function(){ c.dataset.face = 'none'; c.width = c.height = 64; dimHead(c.getContext('2d')); });
}
/* RUN TWO [every speaker has a face], 10/18 (his 'why can't all our characters that are speaking to us have a portrait'):
   a keeper tapped before the street's people are in (lookOf has nobody yet) still speaks under a fresh face, one of the
   cast looks by the place and who he is, never the dim head */
function stand(who){
  var F = window.BohemiaCrewFaces; if(!F || !who) return null;
  var cast = GANG_LOOKS.filter(function(l){ return F.has(l); });   /* 10/19: the valley's people, the looks the posts' bodies wear */
  return cast.length ? cast[seedOf(String(S.place.name) + ':' + who) % cast.length] : null;
}
/* and when he speaks, the mouth says the line on the beat */
function mouth(c, line){ if(c && c.dataset.face === 'fresh') BohemiaCrewFaces.talk(c, c.dataset.look, line); return c; }
function dimHead(x){
  x.fillStyle='#1a1410'; x.fillRect(0,0,64,64);
  x.fillStyle='#3b3026'; x.fillRect(11,7,14,16); x.fillRect(7,26,22,10);
  x.fillStyle='#120e0a'; x.fillRect(14,13,2,2); x.fillRect(20,13,2,2);
}
function lookOf(k){ var L = folkList(), p = L.filter(function(q){ return q.keeper && q.k === k; })[0]; return p ? p.look : null; }
/* PEOPLE [the names wired in]: this place's keeper, one person: the face the place drew for him and a name from the
   county's mix that reads as that face, the same every visit */
function keeperName(k){
  var kp = KEEPERS[k]; if(!kp) return '';
  if(kp.name) return kp.name;
  if(!window.BohemiaNames) return kp.role;
  var look = lookOf(k);
  return (BohemiaNames.roll('keeper:' + S.place.name + ':' + k, {sex: look ? BohemiaNames.faceReads(look) : null}).full + ', ' + kp.role).toUpperCase();
}
function face(k, who, look){
  var c = document.createElement('canvas'); c.width = 64; c.height = 64; c.className = 'face';
  var kp = KEEPERS[k] || {who:who};
  var x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  look = look || lookOf(k) || (kp.who === 'you' ? 'you' : null) || stand(kp.who);
  /* PORTRAIT's 3D head, always: a face the game hands back (BOHEMIA_SETTLEMENT_FACE, the demo's painted face road) is the
     old paint and is kept, never drawn (RUN TWO 10/18, rule 115h amended; 10/19, rule 121(e)) */
  if(look && crewFace(c, look)) post('needFace',{who:kp.who, look:look});
  else {
    /* no 3D head for him: ask the game for it (the same road the city uses) and
       hold a dim head shape meanwhile, never a blank box and never the old paint */
    post('needFace',{who:kp.who, look:look || undefined});
    dimHead(x);
    c.dataset.face = 'none';
  }
  return c;
}
function speak(k, line){

  var p = document.createElement('p'); p.textContent = line; s.appendChild(p);

}
/* THE CLIENT AT THE BOARD (RUN TWO 10/17, [the offer is a mouth]): a person, not a line of text. The button
   is his face, his name and where he is from, what he needs in a word, and the skulls and pay at the right
   (the phone's board and the loop gates read the title span and the em, so they stay first and last). */
function clientWho(o){ return 'settle-client:' + o.id; }
function clientName(o){ return (o.client.name + ', ' + o.client.from).toUpperCase(); }
function clientAct(o, full){

/* HE SPEAKS IT: two sentences, the pay in the second, under his own face; Take it or Not now */
function offerSpeak(o){

/* ---------- SCAVENGE: WORLD's engine, on this place's own lot ---------- */
var LOTN = 6;
function lotWorld(){
  var d = S.place.district || 'commercial', cells = [];
  for(var i=0;i<LOTN;i++){ cells.push(i,0); }
  var block = S.place.block && S.place.block.cells ? S.place.block : {i:0, cells:cells};
  return {m:{at:function(){ return {district:d}; }}, blocks:{blocks:[block]}, block:block};
}
function left(){
  var w = lotWorld(), Sc = window.BohemiaScavenge;
  return Sc ? Sc.leftOn(S.scav, w.m, w.block) : {left:0,total:0};
}
/* RUN TWO [the scavenge button] 10/18 (his 9/27 'a scavenge button, you only wanna do this if you're extremely low
   on food or medicine or batteries, then test your luck', and 9/29 'it's not a great way to get resources').
   WORLD's engine decides WHETHER (the share of the lot left, a ratio of two counts) and ships WHICH empty, so the
   screen names it with the most boring rule there is: one of the six supplies, each as likely, from the same seed,
   ONE of it (EVERYTHING COSTS ONE): four hours for one thing the stall sells for a battery, worse than buying.
   HIS BONUS ('a recent battle: more ammo'): the game hands open({fights:[{day, fallen}]}); every man who fell here is
   one more thing in the lot, and it is ROUNDS, found for certain, until each body is searched. A count, not a dial:
   no chance or day-window is typed here (TUNING owns those if one is ever wanted). Food lands in the purse like the
   stall's; the rest is posted, like the stall's water and meds. */
var FIND = ['food', 'medicine', 'battery', 'tape', 'ammo', 'water'];
var FIND_GOOD = {food:'food', medicine:'meds', battery:'batteries', tape:'tape', ammo:'rounds', water:'water'};
var FIND_SAYS = {food:'A can of beans under a car seat. One ration.', medicine:'A first-aid kit with one dose still sealed.',
  battery:'A battery out of a dead flashlight. Still holds a charge.', tape:'Half a roll of tape in a toolbox.',
  ammo:'Six rounds loose in a jacket pocket.', water:'A gallon jug, cap still on. Four litres.'};   /* draft:true, YOU speak them (the player is not Spanglish) */
function fightKey(f){ return S.place.name + ':' + (f.day|0); }
function deadLeft(){ var n = 0; (S.fights||[]).forEach(function(f){ n += Math.max(0, (f.fallen|0) - ((S.deadTaken||{})[fightKey(f)]|0)); }); return n; }
function searchBody(){ S.deadTaken = S.deadTaken || {}; var fs = S.fights||[];
  for(var i=0;i<fs.length;i++){ var k = fightKey(fs[i]); if(((S.deadTaken[k]|0)) < (fs[i].fallen|0)){ S.deadTaken[k] = (S.deadTaken[k]|0) + 1; return; } } }
function scavenge(){
  var w = lotWorld(), r;
  S.day++;
  if(deadLeft() > 0){ searchBody(); r = {ok:true, found:true, fromFight:true, got:'ammo', left:left().left, spent:'time'}; }
  else {
    r = BohemiaScavenge.search({map:w.m, blocks:w.blocks, state:S.scav, block:w.block, day:S.day});
    if(r && r.found) r.got = FIND[seedOf(S.place.name + ':find:' + r.taken) % FIND.length];
  }
  if(r && r.got === 'food') P.credit(S.purse, 'resources', 1, 'scavenge:food', S.place.name, S.day);
  if(r && r.got === 'battery') P.credit(S.purse, 'electricity', 1, 'scavenge:battery', S.place.name, S.day);
  if(r && r.got) r.good = FIND_GOOD[r.got];
  return r;
}

/* ---------- THE ARRIVAL (RUN TWO 10/18, [the arrival]) ----------
   THE OVERWORLD IS BATTLE BROTHERS: in its game you reach a town and its name, its size and what it thinks of you
   come first, then the picture. Ours, before a building is touched: the town's name on a torn tag (UI's receipt
   paper and tape, the settlement's own labels' material), its tier, ONE line spoken by the place's elder under his
   face (the trait's line when a trait stands, else the tier's; draft, rule 8/11), the opinion bar on the wiki's nine
   relation bands (records/target/bb/relations.json, FACTIONS [beef]; the game hands open({opinion}), a place it does
   not name sits at the wiki's start, 50, Neutral), and the holding faction's colour and name and face when the game
   hands open({faction:{name, hex, face}}). Two seconds, then the picture; a tap skips. Once per new place. Not a
   card: the words are a mouth with a portrait, the tag is the town's own sign. Posts 'arrive'. */
var ARRIVE_MS = 2000;
var TIER_WORD = {camp:'A CAMP', town:'A TOWN', fortress:'A FORTRESS'};
var TIER_LINE = {
  camp: 'Not much out here, mijo. A board, a stall, and whoever is still standing.',
  town: 'Bienvenido. Batteries talk here, so keep yours where we can hear them.',
  fortress: 'You are inside the walls now. Behave, and the walls are yours too.'
};
var REL = null;
fetch('../records/target/bb/relations.json').then(function(r){ return r.json(); }).then(function(j){ REL = j; if(window.BohemiaRelations) BohemiaRelations.set(j); }).catch(function(){});
/* RUN TWO [the opinion moves] 10/18: Battle Brothers moves a town's bar for what you do there. When the game hands no
   opinion, the screen keeps one bar per place (bohemia.relations.v1, FACTIONS' engine and file, read only): a round at
   the bar is the wiki's +0.1, a contract settled (open({settled:[{place, act}]}), act a row of relations.json: done +10,
   poor +5, failed -20, cancelled -10, betrayed -100) moves the bar of the place it was taken from, and the bar drifts
   back toward 50 by the wiki's 0.25 a dawn between visits on the game's day. The map's own number wins when handed. */
var RELKEY = 'bohemia.relations.v1';
function relRec(){ if(!S.rel){ try{ S.rel = JSON.parse(localStorage.getItem(RELKEY) || 'null'); }catch(e){} if(!S.rel || !S.rel.bars) S.rel = {bars:{}, seen:{}}; S.rel.seen = S.rel.seen || {}; } return S.rel; }
function relSave(){ try{ localStorage.setItem(RELKEY, JSON.stringify(S.rel)); }catch(e){} }
function relId(p){ return String((p && (p.id || p.name)) || S.place.id || S.place.name); }
function relMove(place, act){
  if(!window.BohemiaRelations || !REL) return null;
  var r = BohemiaRelations.apply(relRec(), relId(place), act); if(r.applied){ relSave(); post('relation', {place:relId(place), act:act, before:r.before, after:r.after, band:r.band}); } return r;
}
function relDawn(){
  if(!window.BohemiaRelations || !REL || typeof S.mapDay !== 'number') return;
  var R = relRec(), id = relId(), last = R.seen[id];
  if(typeof last === 'number' && S.mapDay > last && id in R.bars){ var one = {bars:{}}; one.bars[id] = R.bars[id]; BohemiaRelations.dawn(one, S.mapDay - last); R.bars[id] = one.bars[id]; }
  R.seen[id] = S.mapDay; relSave();
}
function opinionNow(){
  if(typeof S.opinion === 'number') return Math.max(0, Math.min(100, S.opinion));
  if(window.BohemiaRelations && REL) return BohemiaRelations.score(relRec(), relId());
  return (REL && REL.start && REL.start.value) || 50;
}
function bandOf(v){
  var b = REL && REL.bands && REL.bands.value;
  var B9 = b || [{id:'hostile',lo:0,hi:9},{id:'threatening',lo:10,hi:19},{id:'unfriendly',lo:20,hi:29},{id:'cold',lo:30,hi:39},
    {id:'neutral',lo:40,hi:59},{id:'open',lo:60,hi:69},{id:'friendly',lo:70,hi:79},{id:'very_friendly',lo:80,hi:89},{id:'allied',lo:90,hi:100}];
  for(var i=0;i<B9.length;i++) if(v >= B9[i].lo && v <= B9[i].hi + .999) return B9[i].id;
  return v < 0 ? B9[0].id : B9[B9.length-1].id;
}
function arrivalLine(){ return traitLine('board') || TIER_LINE[S.place.tier] || TIER_LINE.town; }
function arrivalTag(title, line){
  var F1 = '22px "BohemiaCasing", ui-sans-serif, sans-serif', F2 = '12px "BohemiaROM", ui-monospace, monospace';
  var c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = F1; var w1 = x.measureText(title).width; x.font = F2; var w2 = x.measureText(line).width;
  var pw = Math.min(Math.ceil(Math.max(w1, w2) + 40), Math.max(160, (view.W || 360) - 32)), ph = 70;
  c.width = pw + 4; c.height = ph + 12; c.className = 'tag';
  x.imageSmoothingEnabled = false;
  var M = window.BohemiaMaterials, px = 2, py = 8;
  function path(){
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + pw, py);
    for(var yy = py + 4; yy < py + ph; yy += 4) x.lineTo(px + pw - ((yy/4) % 2 ? 2 : 0), yy);
    for(var xx = px + pw; xx > px; xx -= 4) x.lineTo(xx, py + ph - ((xx/4) % 2 ? 0 : 4));
    for(yy = py + ph; yy > py; yy -= 4) x.lineTo(px + ((yy/4) % 2 ? 2 : 0), yy);
    x.closePath();
  }
  x.translate(0, 2); path(); x.fillStyle = 'rgba(0,0,0,.85)'; x.fill(); x.translate(0, -2);   /* the contact edge */
  path(); x.save(); x.clip();
  if(M && M.receipt){ x.drawImage(M.receipt(), px, py, pw, ph); x.fillStyle = 'rgba(255,250,236,.45)'; x.fillRect(px, py, pw, ph); }
  else { x.fillStyle = '#e4dcc6'; x.fillRect(px, py, pw, ph); }
  x.restore();
  if(M && M.tape) x.drawImage(M.tape(), Math.round(px + pw/2 - 30), 0, 60, 16);
  x.fillStyle = '#1f1710'; x.textBaseline = 'alphabetic';
  x.font = F1; x.fillText(title, px + 16, py + 33, pw - 28);
  x.font = F2; x.fillText(line, px + 16, py + 55, pw - 28);
  c.dataset.title = title; c.dataset.line = line;
  return c;
}
function arrive(){
  S.arrivePending = false;
  var sc = document.getElementById('scene'), old = document.getElementById('arrive'); if(old) old.remove();
  var tier = S.place.tier || 'town', tw = TIER_WORD[tier] || 'A PLACE';
  var traits = (S.traits||[]).map(function(t){ return t.name || t.id; });
  var op = opinionNow();
  var band = bandOf(op), line = arrivalLine();
  var o = document.createElement('div'); o.id = 'arrive'; o.dataset.place = S.place.name; o.dataset.tier = tier; o.dataset.band = band;
  o.appendChild(arrivalTag(String(S.place.name).toUpperCase(), tw + (traits.length ? '  ·  ' + traits.join(', ').toUpperCase() : '')));
  var w = speak('board', line); w.dataset.line = line; o.appendChild(w);
  var opd = document.createElement('div'); opd.className = 'op';
  opd.innerHTML = 'WHAT THEY THINK OF YOU: <span class="bandw"></span><div class="rail"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>';
  opd.querySelector('.bandw').textContent = band.replace(/_/g, ' ').toUpperCase();
  opd.querySelector('.rail b').style.left = op + '%';
  o.appendChild(opd);
  if(S.faction && S.faction.name){
    var f = document.createElement('div'); f.className = 'fac';
    if(S.faction.face){ var im = document.createElement('img'); im.alt = ''; im.src = S.faction.face; f.appendChild(im); }
    var sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = S.faction.hex || '#6d5c42'; f.appendChild(sw);
    var fn = document.createElement('span'); fn.textContent = 'HELD BY ' + String(S.faction.name).toUpperCase(); f.appendChild(fn);
    o.appendChild(f);
  }
  var gone = false;
  function off(how){ if(gone) return; gone = true; clearTimeout(t); o.classList.remove('on'); setTimeout(function(){ o.remove(); }, 200); post('arrived', {how:how}); }
  o.addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); off('tap'); });
  sc.appendChild(o);
  requestAnimationFrame(function(){ o.classList.add('on'); });
  var t = setTimeout(function(){ off('time'); }, ARRIVE_MS);
  /* no sound of its own: SOUNDS' arrival cue already fires once per new town on the map (cf9b7d8b) */
  post('arrive', {tier:tier, traits:(S.traits||[]).map(function(t){ return t.id; }), opinion:op, band:band, faction:S.faction ? S.faction.name : null, line:line});
}
function arriveWhenReady(){ if((TRAITS && ARR && (!window.BohemiaBarNews || BohemiaBarNews.ready())) || S.arriveTries > 20){ arrive(); return; }   /* the refugees read the map's towns */ S.arriveTries = (S.arriveTries||0) + 1; setTimeout(arriveWhenReady, 50); }

/* ---------- OPEN ---------- */
function open(o){
  o = o || {};
  if(o.place) for(var k in o.place) S.place[k] = o.place[k];
  S.purse = o.purse || S.purse || P.create({id:'player'});
  if(typeof o.batteries === 'number'){
    var d = o.batteries - bats();
    if(d>0) P.credit(S.purse,'electricity',d,'settle:sync',null,0);
    if(d<0) P.debit(S.purse,'electricity',-d,'settle:sync',null,0);
  }
  if(o.contracts) S.held = o.contracts.slice(0,SLOTS);
  if(o.hired) S.hired = o.hired;
  if(o.met && typeof o.met === 'object'){ S.met = o.met; metSave(); }   /* PEOPLE [ask the crowd]: the game's save hands who you have asked */
  if(typeof o.crewSize === 'number') S.crewSize = o.crewSize;
  if(o.place){ S.rounds = 0; S.heardIds = {}; S.freeSaid = false; }   /* a new visit, a new night at the bar, a new free one */
  if(Array.isArray(o.bag)) S.stash = o.bag.slice(0, BAG_SLOTS); else if(!S.bagLoaded){ bagLoad(); }
  S.bagLoaded = true;
  if(o.wounded) S.wounded = o.wounded.slice();
  if(o.veterans) S.veterans = o.veterans.slice();
  if(typeof o.night === 'boolean') view.night = o.night;
  S.build = null;   /* __BUILD_ON_THE_SCREEN__: a new place, its own lots */
  if(o.held !== undefined) S.mine = !!o.held;   /* __BUILD_ON_THE_SCREEN__: the map says whether this place is yours */
  if(typeof o.day === 'number') S.mapDay = o.day;   /* __BUILD_ON_THE_SCREEN__: the map's day */
  if(o.traits !== undefined) S.forceTraits = o.traits;   /* the game (or the VOTE shot) can name them */
  if(Array.isArray(o.fights)) S.fights = o.fights.slice(); else if(o.place) S.fights = [];   /* RUN TWO [the scavenge button]: fights at this place; a searched body stays searched (S.deadTaken) */
  if(o.ledger !== undefined) S.ledger = o.ledger;   /* RUN TWO [the raid is a record]: FACTIONS' raid ledger ({marks}) and this place's id in it */
  if(o.ledgerPlace !== undefined) S.ledgerPlace = o.ledgerPlace; else if(o.place) S.ledgerPlace = null;
  view.cx = null; pickVariant();
  S.scav = S.scav || BohemiaScavenge.create({id:S.place.name});
  if(typeof o.opinion === 'number') S.opinion = o.opinion; else if(o.place) S.opinion = undefined;
  if(Array.isArray(o.settled)) o.settled.forEach(function(c){ if(c && c.act) relMove(c.place ? {id:c.place} : null, c.act); });   /* [the opinion moves] */
  if(o.place) relDawn();
  restock();   /* [the sell price by the bar]: the shelves price on this visit's bar */
  if(o.faction !== undefined) S.faction = o.faction; else if(o.place) S.faction = null;
  hide(); shelf(); layout();
  if(window.BohemiaHeard) BohemiaHeard.night(view.night);   /* SOUNDS 10/18: the bed follows the screen's own hour */
  /* THE ARRIVAL: once per new place, before the picture is touched. It plays when the GAME sends a place (the
     BOHEMIA_SETTLEMENT_OPEN message, arrival:false skips it); the page's own open() is the screen at rest */
  if(o.place && o.arrival === true && S.arrivedAt !== S.place.name){ S.arrivedAt = S.place.name; S.arriveTries = 0; arriveWhenReady(); }
}
/* THE CREW BUTTON (RUN TWO [equip from the stash]): the company screen over the place, the stash as its bag; closing it
   re-reads the bag the roster changed */
document.getElementById('crew').addEventListener('click', function(){ if(!window.BohemiaCrewDoor) return;
  BohemiaCrewDoor.open({ onDone: function(m){ bagLoad(); if(S.open === 'person' && S.person) openPerson(S.person); else if(S.open) openB(S.open); post('crew', {company:m.company, formation:m.formation}); } }); });
window.BohemiaSettlement = {personAt:function(x,y){ return personAt(x,y); }, scale:function(){ return {door:DOOR_PX[S.place.tier] || 136, person:personH(), s:view.s}; }, _view:function(){ return {ox:view.ox, oy:view.oy, s:view.s, W:view.W, H:view.H, pw:picW(), ph:picH()}; }, folk:function(){ return folkList(); }, recruits:function(){ return recruitsHere(); }, turnAt:function(i, ms){ var L = folkList(); return L[i] ? turnOf(L[i], ms) : null; }, crowdCount:function(){ return crowdCount(); }, traitsNow:function(){ return (S.traits||[]).map(function(t){ return t.id; }); }, bagSlots:BAG_SLOTS, where:where, ready:function(){ return !!(VAR && PIC.day && PIC.day.complete); }, open:open, state:S, buildings:B, tiers:TIERS, offers:OFFERS, order:function(){ return ORDER.slice(); }};

window.addEventListener('message', function(e){
  var d = e.data || {};
  if(d.type==='BOHEMIA_SETTLEMENT_OPEN') open(Object.assign({}, d, {arrival: d.arrival !== false}));
  if(d.type==='BOHEMIA_SETTLEMENT_FACE' && d.who){ S.faces[d.who] = d.src; if(S.open === 'person' && S.person) openPerson(S.person); else if(S.open) openB(S.open); }
});
document.getElementById('close').addEventListener('click', hide);
document.getElementById('leave').addEventListener('click', function(){ post('leave',{}); if(window.BohemiaHeard) BohemiaHeard.left(); heard('You head back out to the map.'); });
window.addEventListener('resize', layout);

var q = new URLSearchParams(location.search);
/* the page's own first open is the screen at rest; the arrival plays when the game sends a place (?arrival=1 plays it here) */
open({place:{name:q.get('place')||S.place.name, tier:q.get('tier')||S.place.tier}, batteries: S.standalone ? 3 : undefined, arrival: q.get('arrival') === '1'});
/* window.BohemiaSettlement.order() is the open buildings; where(k) is the middle of a building's own tappable pixels */
requestAnimationFrame(loop);
})();
</script>

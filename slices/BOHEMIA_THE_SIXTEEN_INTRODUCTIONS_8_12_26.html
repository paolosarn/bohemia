sixteen. This is them running. <b>Nothing here needs a verdict</b> &mdash; it is your canon, wired.</div>

var LOOK={"REDS": {"color": "#dc2820"}, "CARTEL": {"color": "#5c302a"}, "CHURCH": {"color": "#ffd75c"}, "MOB": {"color": "#b08a2a"}, "CARAVANS": {"color": "#caa05a"}, "BLUES": {"color": "#2e6fae"}, "ANARCHISTS": {"color": "#c026a0"}, "NETWORK": {"color": "#1fbf9c"}, "TRADES": {"color": "#d07a2a"}, "VOLUNTEERS": {"color": "#5aae6a"}, "REMNANTS": {"color": "#9aa23a"}, "HOMELESS": {"color": "#b8642a"}};

 {label:'YOU PRESSED ASK', st:{asked:true}},

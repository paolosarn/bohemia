<!-- ============================================================================
     BOHEMIA — THE FIRST CONNECTED RUN  (RUN lane, 7/26/26)
     One loop, start to finish, one thumb, iPhone portrait:
       wake up INSIDE your house -> walk out the real front door -> walk the dead
       block -> pull up on the lineman -> he gives you S01 THE METER READER ->
       follow the skimmed line down the block to the fixer -> resolve it (quiet,
       in daylight, or LOUD) -> a loud resolution hands off to the REAL combat
       frame through the existing BOHEMIA_ENCOUNTER bridge -> walk home -> your
       phone posts the finished quest to the feed with its real CLOUT weight.

     STITCHING ONLY. Nothing here invents a system:
       - the block, the houses, the doors, the interiors  = engine/bohemia_suburb.js
                                                            + engine/bohemia_floorplan.js
       - the neighbours living on it                      = engine/bohemia_agents.js
       - the quest, its dialogue, its forks, its endings  = quests/bq/S01 + engine/bohemia_bq.js
                                                            + engine/bohemia_quest_runtime.js
       - who you can talk to, clout, the feed, followers  = engine/bohemia_loop.js
                                                            (talkablesNear / talkTo /
                                                             buildFeed / socialProfile / cloutWeight)
       - the fight                                        = the alpha's COMBAT frame,
                                                            over the existing postMessage bus
       - the dressed look (doors/roofs/yards/walls)       = lifted verbatim, in the
                                                            builder, from the APPROVED
                                                            slices/BOHEMIA_SUBURB_WALK_7_18_26.html

     SELF-CONTAINED OUTPUT: tools/build_run_slice.js inlines every engine/ module
     (canonical order, byte-identical to engine/) into slices/BOHEMIA_RUN_CURRENT.html,
     which is what the alpha's RUN tab loads. Never edit the generated file.
     ========================================================================= -->
<style>
  :root{
    --bg:#0c0a07; --surface:#16110a; --line:#2c2317; --ink:#ece2cf; --dim:#9c8f76;
    --faint:#6c614f; --gold:#d8a742; --gold-soft:#372a10; --good:#86ac52;
    --teal:#61a89f; --amber:#d47a30; --danger:#d9563a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#050403; color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden; }
  #run{ position:relative; display:flex; flex-direction:column; height:100%;
    max-width:480px; margin:0 auto; background:#0b0d09; overflow:hidden; }

  /* ---- OBJECTIVE BAR: the one line telling you what you are doing ---- */
  #obj{ flex:none; display:flex; align-items:center; gap:8px; padding:9px 12px;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.3px; color:#e6c887;
    background:linear-gradient(90deg,var(--gold-soft),transparent);
    border-bottom:1px solid var(--line); min-height:38px; }
  #obj .ring{ color:var(--gold); }
  #obj #mus{ margin-left:auto; flex:none; font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:1px; padding:5px 9px; border:0; border-radius:3px; background:#241d12;
    color:var(--faint); box-shadow:inset 0 0 0 1px var(--line); text-transform:none; }
  #obj #mus.on{ background:var(--gold-soft); color:var(--gold); }
  #obj #menu{ margin-left:6px; flex:none; font-family:var(--mono); font-size:12px; font-weight:700;
    padding:4px 10px; border:0; border-radius:3px; background:#241d12; color:var(--dim);
    box-shadow:inset 0 0 0 1px var(--line); }
  #obj b{ color:var(--ink); font-weight:700; }

  /* ---- THE WORLD ---- */
  #stage{ flex:1; position:relative; min-height:0; }
  #cv{ display:block; width:100%; height:100%; background:#12140f; }
  #where{ position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.6px; color:rgba(236,226,207,.62); background:rgba(6,7,5,.55);
    padding:3px 7px; border-radius:3px; pointer-events:none; }
  #toast{ position:absolute; left:10px; right:10px; bottom:10px; font-family:var(--mono);
    font-size:12px; line-height:1.45; color:#e6c887; background:rgba(8,7,5,.86);
    border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:4px;
    padding:9px 11px; display:none; pointer-events:none; }

  /* ---- ONE-THUMB CONTROLS: THE NAV CLUSTER (7/27, Paolo) ----
     "on the run should be using the same movement ui s the combat shit ... the
      arrows taking up half the screen is dog shit man".
     What was here: a #ctl BAR, a flex sibling of the stage, holding a full-width
     ACT button and four 74x52 arrows. ~125px of chrome that did not float over
     the world - it SHRANK the canvas, so the game was played in what the buttons
     left over. This is the cluster the game already uses twice: COMBAT's
     buildMoveRing (8 buttons on a 66px radius around the fire button) grown into
     CITY's #nav (8 round buttons around an 80px portrait). Same UI, third
     surface, floating in the thumb corner over a full-screen world. */
  #nav{ position:absolute; right:6px; z-index:9;
    bottom:calc(6px + env(safe-area-inset-bottom)); width:180px; height:180px; }
  #pad{ position:absolute; inset:0; }
  .pb{ position:absolute; width:42px; height:42px; border-radius:50%; padding:0;
    background:radial-gradient(circle at 50% 38%,#241d12,#0f0c07 75%);
    border:1px solid var(--line); color:var(--gold); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; }
  .pb:active{ border-color:#c8b892; color:#fff; }
  /* the one contextual action button is now also where your face is */
  #act{ position:absolute; left:50px; top:50px; width:80px; height:80px; padding:0;
    border:0; border-radius:999px; overflow:hidden; z-index:10;
    background:radial-gradient(circle at 50% 38%,#3a342a,#15120d 72%);
    box-shadow:0 0 0 1px #4a4030,0 6px 22px rgba(0,0,0,.6); }
  #act:active:enabled{ box-shadow:0 0 0 1px var(--gold),0 6px 22px rgba(0,0,0,.6); }
  #actface{ position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; border-radius:999px; }
  /* the verb rides ABOVE the ring, not inside it: the run's verbs are whole
     sentences ("SLEEP (8 HOURS, SAVES)") and an 80px circle with overflow:hidden
     ate them. It is allowed to be wider than the cluster - it is a HUD line. */
  #actlbl{ position:absolute; left:-96px; right:0; top:-4px; text-align:center;
    font-family:var(--mono); font-size:10px; letter-spacing:1px; font-weight:700;
    line-height:1.3; color:var(--gold); text-shadow:0 1px 4px #000,0 0 9px #000,0 0 3px #000;
    pointer-events:none; z-index:11; }
  #nav.off #actlbl{ color:var(--faint); }

  /* ---- DIALOGUE SHEET ---- */
  #talk{ position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    justify-content:flex-end; background:rgba(4,4,3,.72); }
  #talkin{ background:var(--surface); border-top:1px solid var(--line);
    border-radius:10px 10px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:88%; overflow-y:auto; }
  .spkrow{ display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  #spkface{ width:52px; height:52px; flex:none; border-radius:4px; image-rendering:pixelated;
    background:#0c0a07; box-shadow:inset 0 0 0 1px var(--line); display:none; }
  #spk{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold); }
  #says p{ margin:0 0 9px; font-size:15.5px; line-height:1.46; }
  #says p.nv{ color:var(--faint); font-size:12.5px; font-style:italic; }
  #opts button{ display:block; width:100%; text-align:left; margin-top:8px; min-height:50px;
    padding:12px 13px; font-family:var(--sans); font-size:14.5px; font-weight:600;
    text-transform:none; letter-spacing:0; line-height:1.35; border:0; border-radius:5px;
    background:#241d12; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  #opts button.sil{ color:var(--dim); font-style:italic; font-weight:500; }
  #opts button:active{ background:#31280f; }

  /* ---- THE PHONE (end of the run: the post) ---- */
  #phone{ position:absolute; inset:0; z-index:30; display:none; flex-direction:column;
    background:linear-gradient(180deg,#0e0b07,#0a0806 60%,#0c0a07); overflow-y:auto;
    padding:16px 14px calc(20px + env(safe-area-inset-bottom)); }
  #phone .wm{ font-family:var(--mono); font-weight:800; letter-spacing:2px; font-size:12px;
    color:var(--gold); }
  #phone h3{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1.4px; color:var(--faint); margin:18px 2px 9px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:13px 14px; margin-bottom:10px; }
  .card .who{ font-weight:700; font-size:14px; }
  .card .who .at{ color:var(--dim); font-weight:500; font-family:var(--mono); font-size:12px; }
  .card .body{ font-size:15px; line-height:1.45; margin:9px 0 0; }
  .card .eng{ display:flex; gap:14px; align-items:center; margin-top:11px; padding-top:11px;
    border-top:1px solid var(--line); font-family:var(--mono); font-size:12px; color:var(--dim); }
  .card .eng .g{ color:var(--gold); font-weight:700; margin-left:auto; }
  .tag{ display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:3px; margin-left:6px; letter-spacing:.5px;
    background:var(--gold-soft); color:var(--gold); border:1px solid #43310f; }
  .stats{ display:flex; gap:26px; margin-top:12px; }
  .stat b{ font-size:21px; font-weight:800; display:block; line-height:1; font-family:var(--mono); }
  .stat span{ font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:1px; }
  .stat.foll b{ color:var(--gold); }
  #phone button{ width:100%; height:48px; margin-top:14px; font-family:var(--mono);
    font-size:13px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    border:0; border-radius:5px; background:#241d12; color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line); }

  /* ---- SAVE SHEET ---- */
  #save{ position:absolute; inset:0; z-index:26; display:none; flex-direction:column;
    justify-content:flex-end; background:rgba(4,4,3,.72); }
  #savein{ background:var(--surface); border-top:1px solid var(--line);
    border-radius:10px 10px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:90%; overflow-y:auto; }
  #savetitle{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; color:var(--gold);

  #savelist .slot{ display:flex; gap:10px; align-items:center; padding:9px 11px; margin-bottom:7px;

  #savelist .slot .when{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); }
  #savelist .none{ color:var(--faint); font-size:13px; margin-bottom:8px; }
  #saveacts button, #save .ghostbtn{ display:block; width:100%; min-height:48px; margin-top:8px;
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    border:0; border-radius:5px; background:var(--gold); color:#0c0a07; }
  #saveacts button.ghost, #save .ghostbtn{ background:#241d12; color:var(--ink);

  #saveacts button:disabled{ background:#241d12; color:var(--faint); box-shadow:none; }
  .walkrow{ margin:2px 0 12px; }
  .walkrow .wlab{ font-family:var(--mono); font-size:9.5px; letter-spacing:1.2px;
    color:var(--faint); margin-bottom:7px; }
  .walkbtn{ display:block; width:100%; text-align:left; min-height:46px; margin-top:6px;
    padding:8px 11px; border:0; border-radius:5px; background:#241d12; color:var(--dim);
    box-shadow:inset 0 0 0 1px var(--line); font-family:var(--sans); }
  .walkbtn b{ font-family:var(--mono); font-size:12px; letter-spacing:1.2px; color:var(--ink);
    display:block; }
  .walkbtn span{ font-size:11.5px; line-height:1.35; }
  .walkbtn.on{ background:var(--gold-soft); box-shadow:inset 0 0 0 1px #5a441a; }
  .walkbtn.on b{ color:var(--gold); }
  #savecode{ width:100%; height:72px; margin-top:10px; background:#0c0a07; color:var(--dim);
    border:1px solid var(--line); border-radius:5px; padding:8px; font-family:var(--mono);
    font-size:11px; resize:none; }

  /* ---- COMBAT HANDOFF CURTAIN ---- */
  #hand{ position:absolute; inset:0; z-index:25; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px;

  #hand .big{ font-family:var(--mono); font-size:17px; letter-spacing:2px; color:var(--danger);

  #hand .sub{ font-size:13.5px; line-height:1.5; color:var(--dim); max-width:320px; }
  #hand button{ min-width:220px; height:48px; font-family:var(--mono); font-size:13px;
    font-weight:700; letter-spacing:1.2px; text-transform:uppercase; border:0;
    border-radius:5px; background:#241d12; color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line); display:none; }
</style>

'use strict';
/* ===========================================================================
   THE RUN — one connected loop over systems that already exist.
   =========================================================================== */

/* ---- 1. THE ENGINE. One real booted context: real valley, real factions,
   real quest manager (world bridge + casting bridge), real save/ledger. ---- */
var CTX = BohemiaLoop.boot({ seed: 'bohemia' });

/* ===========================================================================
   2. THE BLOCK IS A REAL CELL OF THE REAL VALLEY.
   It used to be a standalone generate() with nothing on any side of it: walk to
   the edge and you hit nothing, forever. Now the run READS THE VALLEY the rest
   of the game runs on — the same seed, the same overmap, the same generators —
   one 128-tile cell at a time, and stepping off an edge really loads the
   neighbouring district.

   The read is the world model's own tile rung (w.tile), so the codes, what is
   SOLID and what LAYER a thing is on all come from the world rather than from a
   second copy of the rules living here. A suburb cell out of the valley produces
   exactly the codes the local generator did (0 yard, 1 road, 2 house, 3
   driveway, 4 wall, 5 gate, 6 garage, 9 upper), which is why every downstream
   thing — footprints, doors, interiors, the dressed look — works unchanged.
   =========================================================================== */
var SEED = 7;
var WORLD = CTX.worldMap && CTX.worldMap.real;
var T = (WORLD && WORLD.TILE_PER_CELL) || 128;
var W = T, H = T;
var G = [], SOLIDG = [], LAYERG = [], NAMEG = [], CELLNAME = '';
var CELL = null, feet = [];
/* WHERE YOU LIVE. Deterministic and real: the first suburb cell of the valley
   in scan order. Not a hand-typed coordinate — MAP LAW, and it survives a
   regeneration because it is derived, not written down. */
function findHomeCell(){
  if(!WORLD) return [0,0];
  var ds = (CTX.worldMap.districts||[]);
  for(var i=0;i<ds.length;i++){
    var p=String(ds[i].id||'').split(','), cx=+p[0], cy=+p[1];
    if(isNaN(cx)||isNaN(cy)) continue;
    var t=WORLD.tile(cx*T+(T>>1), cy*T+(T>>1));
    if(t && String(t.district)==='suburb') return [cx,cy];
  }
  return [0,0];
}
var HOME_CELL = findHomeCell();
/* Read one cell of the valley into the grids the run walks and draws on. */
function loadCell(cx,cy){
  CELL=[cx,cy]; G=[]; SOLIDG=[]; LAYERG=[]; NAMEG=[]; CELLNAME='';
  for(var y=0;y<T;y++){
    var gr=[], sr=[], lr=[], nr=[];
    for(var x=0;x<T;x++){
      var t = WORLD ? WORLD.tile(cx*T+x, cy*T+y) : null;
      gr.push(t && t.code!=null ? t.code : 0);
      sr.push(t ? !!t.solid : true);
      lr.push(t ? (t.layer||'ground') : 'ground');
      nr.push(t ? String(t.name||'') : '');
      if(t && !CELLNAME) CELLNAME = String(t.district||'');
    }
    G.push(gr); SOLIDG.push(sr); LAYERG.push(lr); NAMEG.push(nr);
  }
  feet = BohemiaSuburb.homeFootprints({ g:G, W:T, H:T });
  if(typeof deriveDoors==='function') deriveDoors();
  _fpc = {}; _garage = null; _depth = null; _top = null; _path = null;  /* all per-cell */
  return CELL;
}
loadCell(HOME_CELL[0], HOME_CELL[1]);
var HOME_CELLNAME = CELLNAME;
function isSuburbCell(){ return CELLNAME==='suburb'; }

/* ===========================================================================
   THE FRONT IS THE SOUTH FACE. ALWAYS.
   (Paolo 7/27: "every wall that hosts a door should be at the least three wall
   tiles tall".) The first cut put a door on the first house cell touching a
   driveway in scan order, and in this valley the driveways come in from the
   WEST, so the doors landed on NORTH and WEST edges. There is no north wall and
   no west wall in a three-quarter top-down view — you see the SOUTH wall of a
   mass and roof over everything else — so those doors were holes punched in a
   roof, which is exactly what the block looked like.
   A door can only live where a wall can be drawn: the south face. So the front
   door is the southmost HOUSE cell of a column whose ground below is open,
   preferring a column that fronts the driveway, then the road, then the yard.
   =========================================================================== */
var doorOf = {}, homeDoor = [];
function pref(x, y, want){ var nb=[[0,1],[0,-1],[1,0],[-1,0]];
  for(var k=0;k<4;k++){ var ax=x+nb[k][0], ay=y+nb[k][1];
    if(ax>=0&&ay>=0&&ax<W&&ay<H&&G[ay][ax]===want) return true; } return false; }
function deriveDoors(){
  doorOf = {}; homeDoor = [];
  feet.forEach(function(f,i){
    var pick=null, best=-1;
    for(var x=f.x; x<f.x+f.w && x<W; x++){
      /* walk this column up from the bottom of the footprint to its lowest
         house cell that has open ground under it */
      for(var y=Math.min(H-1,f.y+f.h-1); y>=f.y; y--){
        if(G[y][x]!==2) continue;
        if(isBody(x,y+1)) break;                       /* not the south face */
        var below = (y+1<H) ? G[y+1][x] : -1;
        var s = below===3 ? 4 : below===1 ? 3 : below===0 ? 2 : below===5 ? 2 : 0;
        /* a two-tall leaf needs a wall course above it to stand in */
        if(!isBody(x,y-1)) s = 0;
        if(s>best){ best=s; pick=[x,y]; }
        break;
      }
    }
    /* only if the mass genuinely has no drawable face (a one-row shed) do we
       fall back to the old any-edge rule, so a house is never unenterable */
    if(!pick || best<=0){ pick=null;
      for(var pass=0;pass<3&&!pick;pass++){ var want=[3,1,0][pass];
        for(var y2=f.y;y2<f.y+f.h&&!pick;y2++) for(var x2=f.x;x2<f.x+f.w;x2++){
          if(G[y2] && G[y2][x2]===2 && pref(x2,y2,want)){ pick=[x2,y2]; break; } } } }
    if(pick){ doorOf[pick[0]+','+pick[1]]=i; homeDoor[i]=pick; }
  });
}
deriveDoors();

/* ---- 3. WHICH HOUSE IS YOURS. Deterministic, never hand-placed: the home
   whose front door sits nearest the block's gate is the one you wake up in. --- */
var gateAt = null;
for(var gy=0; gy<H && !gateAt; gy++) for(var gx=0; gx<W; gx++) if(G[gy][gx]===5){ gateAt=[gx,gy]; break; }
var HOME = -1;
(function(){ var best=1e9;
  for(var i=0;i<feet.length;i++){ var d=homeDoor[i]; if(!d) continue;
    var dist = gateAt ? (Math.abs(d[0]-gateAt[0])+Math.abs(d[1]-gateAt[1])) : (d[0]+d[1]);
    if(dist<best || (dist===best && i<HOME)){ best=dist; HOME=i; } } })();
var HOME_DOOR = homeDoor[HOME] || [W>>1, H>>1];

/* ---- 4. WALKABILITY + the road graph (BFS, used for placement + the gate). ---- */
/* WHAT BLOCKS YOU IS THE WORLD'S OWN ANSWER. The run used to keep its own list
   of walkable suburb codes, which is a second copy of a rule the world model
   already owns and which said nothing at all about the other twenty districts.
   Now it asks the tile. A front door stays walkable because a door is a way in,
   not a wall. */
function passExt(x,y){ if(x<0||y<0||x>=W||y>=H) return false;
  if(doorOf[x+','+y]!=null) return true;
  return !SOLIDG[y][x]; }
function bfs(from){
  var dist={}, q=[from], k=from[0]+','+from[1]; dist[k]=0;
  while(q.length){ var cur=q.shift(), d=dist[cur[0]+','+cur[1]];
    var nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){ var nx=cur[0]+nb[i][0], ny=cur[1]+nb[i][1], nk=nx+','+ny;
      if(dist[nk]!=null || !passExt(nx,ny)) continue;
      /* never route THROUGH a front door (a door is an endpoint, not a corridor) */
      if(doorOf[nk]!=null && nk!==(from[0]+','+from[1])) { dist[nk]=d+1; continue; }
      dist[nk]=d+1; q.push([nx,ny]); } }

}
var DIST_HOME = bfs(HOME_DOOR);

/* ---- 5. WHERE THE QUEST STANDS. [PENDING Paolo — MAP LAW is his call.]

   the generator already made, chosen from the quest's own text:
     - the LINEMAN ("I have a name and a face and a family on this block") is put
       on the road tile nearest your own front door that fronts a NEIGHBOUR's
       driveway. He is your neighbour, one door down. Nothing closer is possible.
     - the FIXER ("it splits somewhere past the dead storefronts") is put at the
       FAR END OF THE LINEMAN'S OWN STREET — the last contiguous road tile of the
       run he is standing on. You literally follow the cable down his street, so

function roadTiles(){ var out=[];
  for(var y=0;y<H;y++) for(var x=0;x<W;x++) if(G[y][x]===1 && DIST_HOME[x+','+y]!=null) out.push([x,y]);
  return out; }
function frontsAnotherHome(x,y){
  var nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){ var ax=x+nb[i][0], ay=y+nb[i][1];
    if(ax<0||ay<0||ax>=W||ay>=H) continue;
    if(G[ay][ax]!==3) continue;                     /* a driveway */
    /* whose driveway: the nearest home footprint that isn't yours */
    for(var h=0;h<feet.length;h++){ if(h===HOME) continue; var f=feet[h];
      if(ax>=f.x-1 && ax<=f.x+f.w && ay>=f.y-1 && ay<=f.y+f.h+2) return true; } }

var ROADS = roadTiles();
var LINEMAN_AT = null, FIXER_AT = null;
(function(){
  var best=1e9;
  ROADS.forEach(function(t){ var d=DIST_HOME[t[0]+','+t[1]];
    if(d==null || !frontsAnotherHome(t[0],t[1])) return;
    if(d<best || (d===best && LINEMAN_AT && (t[1]<LINEMAN_AT[1] || (t[1]===LINEMAN_AT[1]&&t[0]<LINEMAN_AT[0])))){ best=d; LINEMAN_AT=t; } });
  if(!LINEMAN_AT){ /* no driveway-fronting road reachable: nearest road tile at all */
    ROADS.forEach(function(t){ var d=DIST_HOME[t[0]+','+t[1]];
      if(d!=null && d<best){ best=d; LINEMAN_AT=t; } }); }
  if(!LINEMAN_AT) LINEMAN_AT = HOME_DOOR;

     on both axes. The fixer is the far end of it. */

  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
    var x=LINEMAN_AT[0]+d[0], y=LINEMAN_AT[1]+d[1];
    while(x>=0&&y>=0&&x<W&&y<H&&G[y][x]===1){ street.push([x,y]); x+=d[0]; y+=d[1]; } });

    var d = Math.abs(t[0]-LINEMAN_AT[0])+Math.abs(t[1]-LINEMAN_AT[1]);
    if(d>far || (d===far && FIXER_AT && (t[1]<FIXER_AT[1] || (t[1]===FIXER_AT[1]&&t[0]<FIXER_AT[0])))){ far=d; FIXER_AT=t; } });
  if(!FIXER_AT) FIXER_AT = LINEMAN_AT;
})();

/* ---- 6. THE QUEST. S01 THE METER READER, the real canon bytes. ---- */
var S01_TEXT = null, QID = null;
(function(){
  for(var i=0;i<CANON_QUESTS.length;i++){
    try{ var Q = BQ.parse(CANON_QUESTS[i]);
      if(Q && Q.id === 'bq_meter_reader'){ S01_TEXT = CANON_QUESTS[i]; QID = Q.id; break; } }catch(_e){}
  }
})();
/* channel 'inperson': you pull up on him, you do not get this over the phone. */
if(S01_TEXT) CTX.quests.place(S01_TEXT, { x:LINEMAN_AT[0], y:LINEMAN_AT[1], channel:'inperson', speaker:'lineman' });
var RT = QID ? CTX.quests.get(QID) : null;

/* ---- 7. THE NEIGHBOURS. Homed + scheduled on the block (bohemia_agents.js),
   stepped one world-minute per player move: I-MOVE-YOU-MOVE. ---- */
var _fpc = {};
function fpOf(i){ if(_fpc[i]!==undefined) return _fpc[i]; var f=feet[i];
  _fpc[i] = f ? BOH_FLOORPLAN.generate((SEED^((i+1)*0x9E3779B1))>>>0, f.w, f.h, {zone:'residential',entrance:'S'}) : null;
  return _fpc[i]; }
var SIM = null;
/* the people who live on THIS cell. Rebuilt per cell, seeded from the cell's own
   coordinates so the same corner of the valley always holds the same lives. */
function buildSim(warm){
  try{
    var seed = (SEED ^ (CELL[0]*73856093) ^ (CELL[1]*19349663)) >>> 0;
    var _agents = BohemiaAgents.agentsForBlock(seed, feet, [], fpOf);
    SIM = BohemiaAgents.makeSim({ g:G, W:T, H:T }, feet, _agents,
      { fpOf:fpOf, doorOf:doorOf, startTurn:0 });
    SIM.playerAt = [px,py];
    for(var i=0;i<(warm||0);i++) SIM.step();
    FACES={}; _APOS={};
  }catch(e){ SIM = null; }
}

/* ---- 8. RUN STATE ---- */
var RUN = { phase:'home_inside', combatOutcome:null, clout:null, outcome:null, sentEncounter:null };
var mode='int', px=0, py=0, fp=null, fpDoor=null, backAt=null, curHouse=-1;
/* facings + walk-cycle frames, so bodies point where they are going and their
   legs move on the beat (I-MOVE-YOU-MOVE: one frame per committed step). */
var PFACE='S', PFRAME=0, PMOVING=false, _PIDLE=null;
var FACES={}, _APOS={}, NPC_LOOK_SEED=0x5eed;
function updateFaces(){
  if(!SIM) return;
  SIM.outAgents().forEach(function(a){
    var prev=_APOS[a.id], d=FACES[a.id]||{d:'S',f:0,moving:false};
    if(prev && (prev[0]!==a.loc.x || prev[1]!==a.loc.y)){
      d.d=dirOf(a.loc.x-prev[0], a.loc.y-prev[1]); d.f=(d.f+1)&3; d.moving=true;
    } else d.moving=false;
    FACES[a.id]=d; _APOS[a.id]=[a.loc.x,a.loc.y];
  });
}
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var OBJ=document.getElementById('objtxt'), WHERE=document.getElementById('where'),
    ACT=document.getElementById('act'), TOAST=document.getElementById('toast'),
    ACTLBL=document.getElementById('actlbl'), ACTFACE=document.getElementById('actface'),
    NAVEL=document.getElementById('nav');
/* NAV CLUSTER: your own face in the middle of the ring, the same baked
   portrait the parent alpha already sends over the cast bridge and the
   dialogue sheet already draws for speakers. Nothing is generated here; the
   run just stopped ignoring the copy it was handed. */
function drawYourFace(){
  if(!ACTFACE)return;
  var pf = CAST && CAST.portraits && CAST.portraits.you;
  var c2 = ACTFACE.getContext('2d'); c2.imageSmoothingEnabled=false;
  c2.clearRect(0,0,ACTFACE.width,ACTFACE.height);
  if(pf) c2.drawImage(pf,0,0,ACTFACE.width,ACTFACE.height);
}

function passInt(x,y){ if(!fp||x<0||y<0||x>=fp.W||y>=fp.H) return false;
  var c=fp.grid[y][x]; return c.g==='floor'||c.g==='door'; }

function enter(i){
  curHouse=i; var f=feet[i];
  fp = BOH_FLOORPLAN.generate((SEED^((i+1)*0x9E3779B1))>>>0, f.w, f.h, {zone:'residential',entrance:'S'});
  fpDoor = fp.doors.filter(function(d){ return d[0]===0||d[1]===0||d[0]===fp.W-1||d[1]===fp.H-1; })[0] || [fp.W>>1, fp.H-1];
  mode='int'; px=fpDoor[0]; py=Math.max(0,Math.min(fp.H-1,fpDoor[1]-1));
  if(!passInt(px,py)){ px=fpDoor[0]; py=fpDoor[1]; }
}
function leave(){ mode='ext'; if(backAt){ px=backAt[0]; py=backAt[1]; } else { px=HOME_DOOR[0]; py=HOME_DOOR[1]; } curHouse=-1; }

/* YOU START ASLEEP IN YOUR OWN BED, not on the curb and not standing in your

   IN; waking up is the one time you are already deep in the house, so the run
   walks you to a BED tile if the floorplan declares one, else the floor tile
   farthest from the door. (It also matters mechanically now: the one button
   offers what you are standing AT, so waking in the doorway would offer the
   doorway and you would never see SLEEP.) */
enter(HOME);
(function wakeInBed(){
  if(!fp) return;
  var best=null, bestScore=-1;
  for(var y=0;y<fp.H;y++) for(var x=0;x<fp.W;x++){
    var c=fp.grid[y][x]; if(!passInt(x,y) || c.g==='door') continue;
    if(fpDoor && x===fpDoor[0] && y===fpDoor[1]) continue;
    var d=Math.abs(x-fpDoor[0])+Math.abs(y-fpDoor[1]);
    var score=(c.role==='bed'? 1000 : 0) + d;
    if(score>bestScore){ bestScore=score; best=[x,y]; }
  }
  if(best){ px=best[0]; py=best[1]; }
})();
backAt = HOME_DOOR.slice();
buildSim(450);                 /* warm to ~07:30 so the street is already living */

/* ===========================================================================
   9. RENDER — THE BLOCK, LAID FROM THE VISUAL CONSTITUTION'S OWN TILES.
   Paolo verdicted the target screen CBB on 7/26 and the visual freeze lifted
   with it, so the run stops drawing coloured squares and speaks the target's
   language instead: its ground tiles, its stucco wall face with windows and
   boarded windows, its real hip roof, its garage face, its kerbs and gutters
   and lane dashes. Nothing here is cooked — every pixel is a tile out of the
   frozen bank, and the builder refuses to ship if that bank's md5 moves.

   HOW A HOUSE READS, exactly as the target frame reads it, bottom to top:
   the FRONT ROW of the building is its WALL FACE (windows, boarded windows,
   the door, the garage), the row above it is the EAVE, then roof slope, then
   the RIDGE, with hip corners where the roof turns. That stack is what makes
   a top-down block look like buildings instead of blocks of colour.
   =========================================================================== */
var TT={}, TT_READY=0;
(function(){ var ids=Object.keys(TARGET_TILES.tiles||{});
  ids.forEach(function(id){ var im=new Image();
    im.onload=function(){ TT_READY++; draw(); };
    im.src='data:image/png;base64,'+TARGET_TILES.tiles[id]; TT[id]=im; }); })();
function th(x,y,n){ return (((x*73856093)^(y*19349663))>>>0)%n; }
function tput(id,X,Y,S){ var im=TT[id];

/* the front row of a building: the face you actually see from the street */
function isFace(a,b){ return isBody(a,b) && !isBody(a,b+1); }
/* which ground tile a cell wears */
function groundTile(c,gx,gy){
  if(c===1){                                   /* street */
    if(!isRoad(gx,gy+1)||!isRoad(gx,gy-1)) return 'road_gutter';   /* against the kerb */
    return ['road_0','road_1','road_2'][th(gx,gy,3)];

  if(c===3) return ['concrete_0','concrete_1'][th(gx,gy,2)];       /* driveway */
  if(c===5) return 'concrete_0';                                    /* the gate mouth */
  /* RUN PERIMETER (7/28): this returned 'wall_base' - the SAME starter-tileset
     tile the run's own bodyTile() lays as the bottom course of a HOUSE. The
     suburb border wall and the house wall were literally one tile. Paolo judged
     61 candidates down to 13 border walls over two sessions
     (banks/BOHEMIA_PERIMETER_WALL_POOL_7_14_26.txt) and not one of them had ever
     existed in this renderer. It is drawn from that pool now, in drawPerim(),
     which is why this returns null - the draw handles it. */
  if(c===4) return null;
  /* dead ground: the block's yards, with the walk band where it meets the street */
  if(isRoad(gx,gy+1)||isRoad(gx,gy-1)||isRoad(gx+1,gy)||isRoad(gx-1,gy)) return 'walk_kerb';
  if(pathSet()[gx+','+gy]) return ['walk_0','walk_1','walk_2'][th(gx,gy,3)];
  return ['yard_0','yard_1','yard_2'][th(gx,gy,3)];
}
/* ==== RUN PERIMETER (7/28): PAOLO'S OWN SUBURB BORDER WALLS ================
   banks/BOHEMIA_PERIMETER_WALL_POOL_7_14_26.txt - 13 keys he passed out of 61
   candidates across two judging sessions (7/14 batch 1: 12 of 44; 7/17 batch 2:
   1 of 48). The builder inlines the tan half verbatim; nothing is re-cooked.

   ONE WALL PER COMMUNITY, his law, verbatim from
   banks/BOHEMIA_REAL_VEGAS_VERDICTS_R2_7_14_26.txt `paolo_laws`:
   "each plot = ONE wall design (seeded per plot); variety BETWEEN plots;
    per-cell wall shuffle BANNED"

   suburb layout itself is generated from - so a whole community wears one wall
   and the community next door wears a different one. ========================= */
var PERIM_IMG = (typeof PERIM_B64!=='undefined'?PERIM_B64:[]).map(function(b){
  var im=new Image(); im.src='data:image/png;base64,'+b; return im; });
function perimImg(){
  if(!PERIM_IMG.length) return null;
  var px=(CELL&&CELL[0]||0)>>2, py=(CELL&&CELL[1]||0)>>2;
  var h=(Math.imul(px,2654435761)^Math.imul(py,40503))>>>0;
  var im=PERIM_IMG[h%PERIM_IMG.length];

}
function drawPerim(X,Y,S){
  var im=perimImg(); if(!im) return false;
  ctx.drawImage(im,X,Y,S,S); return true;
}
/* ===========================================================================
   CONCRETE HAS TO BE GOING SOMEWHERE.
   (Paolo 7/27: "i dont know why theres so many sidewalk cement things spread
   around on the floor when it should be like wtf".)
   The yards used to run `th(gx,gy,7)===0 -> a sidewalk tile` and
   `th(gx,gy,11)===0 -> dirt`, which sprinkled single slabs of poured concrete
   at random across every lot on the block. A sidewalk is not a texture. It is a
   ROUTE, from somewhere to somewhere, and a slab in the middle of a gravel yard
   with nothing on either end of it is just litter.
   So concrete in a yard now happens for exactly one reason: it is the FRONT
   PATH, running from a front door straight out to whatever that house's ground
   actually meets - its driveway, the kerb band, the road, the block gate. If
   the path cannot reach any of them it is not drawn at all. The random dirt
   speckle went with it; yard_0/1/2 already carry the variation.
   =========================================================================== */
var _path = null, PATH_MAX = 26;
function pathSet(){
  if(_path) return _path;
  _path = {};
  Object.keys(doorOf).forEach(function(k){
    var p=k.split(',').map(Number), sx=p[0], sy=p[1]+1;
    if(sy>=H || isBody(sx,sy) || G[sy][sx]!==0) return;   /* already opens onto pavement */
    /* A FRONT PATH BENDS. Poured straight south it only got out for ten of the
       twenty-three doors on this block - the other thirteen face the back of
       the house in front of them, and a path that dead-ends into a wall is the
       same litter as a slab in the middle of a lawn. So it takes the SHORTEST
       real route across its own yard to whatever pavement the world already
       put there: the road, a driveway, the block's gate. If nothing is within
       PATH_MAX, that door has no front path and none is drawn. */
    var prev={}, seen={}, q=[[sx,sy]], head=0, done=null, dist={};
    seen[sx+','+sy]=1; dist[sx+','+sy]=0;
    while(head<q.length && !done){
      var cur=q[head++], cd=dist[cur[0]+','+cur[1]];
      if(cd>=PATH_MAX) continue;
      var d4=[[0,1],[1,0],[-1,0],[0,-1]];
      for(var i=0;i<4;i++){
        var nx=cur[0]+d4[i][0], ny=cur[1]+d4[i][1];
        if(nx<0||ny<0||nx>=W||ny>=H) continue;
        var c=G[ny][nx];
        if(c===1||c===3||c===5){ done=cur; break; }        /* arrived at real pavement */
        var kk=nx+','+ny;
        if(seen[kk]||c!==0||isBody(nx,ny)) continue;
        seen[kk]=1; dist[kk]=cd+1; prev[kk]=cur; q.push([nx,ny]);
      }
    }

function epx2(src){

  var S=src.getContext('2d').getImageData(0,0,w,h).data;

    var P=at(x,y),A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),E=at(x,y+1);
    var e0=P,e1=P,e2=P,e3=P;
    if(eq(C,A)&&!eq(C,E)&&!eq(A,B))e0=A;
    if(eq(A,B)&&!eq(A,C)&&!eq(B,E))e1=B;
    if(eq(E,C)&&!eq(E,B)&&!eq(C,A))e2=C;
    if(eq(B,E)&&!eq(B,A)&&!eq(E,C))e3=E;
    var o=(y*2*(w*2)+x*2)*4, o2=o+4, o3=o+(w*2)*4, o4=o3+4;

function draw(){

     front of you - the first cut fixed that by re-drawing whatever sat one and
     two rows north of you see-through over your head, which ghosted the
     character every time he stood in his own front yard with the house behind
     him. He is IN FRONT of that wall. He belongs opaque.
     You are UNDER something in exactly two places, and they are both real:
       - the tile you are standing on is on the OVERHEAD layer, the layer the
         dossier law defines as the one you pass under (canopy, deck, carport)

           A cell is drawn at CELL size with the tile scaled to it (integer blit,
           smoothing already off) — the mobile render contract's own rule. */
        /* GROUND UNDER EVERY BUILDING TILE. A hip tile is drawn as "the slope
           cuts in, and above the cut there is nothing" - so laying it on bare
           canvas punched a BLACK NOTCH into the top corner of every roof in the
           game. The dirt the house stands on goes down first and the cut shows
           the yard through it, which is what a hip is supposed to look like. */
        var body = isSuburbCell() && isBody(gx,gy2);

        if(isSuburbCell() && c===4){

/* ===========================================================================
   THE SENTENCE THE GAME SPEAKS (Paolo, after the lab: "walk somewhere, ONE
   contextual action button that changes by what you're standing at, act, spend
   time, the world resolves"). Every verb in the run goes through the ported,
   approved engine/bohemia_resolve.js — its REACH decides what is close enough
   and what you are facing, and its RESOLVER runs the world at every block of
   time you spend.

   THE MOMENTS ARE HIS. He named the sizes in the same breath: sleep 8, hang out
   1. He did not price EAT, so EAT is declared with NO spend and the button says
   so, because an action-cost table is canon and no lane writes one
   (laws/BOHEMIA_ADDENDUM_TIME_IS_SPENT_BY_ACTIONS_7_26_26.md sec 4).

   THE REACH NUMBER is not invented either: it is 1, the radius the run's own
   talk trigger has always used (BohemiaLoop.talkablesNear(ctx, x, y, 1)), now
   declared once instead of assumed in three places — which is the exact lesson
   the lab wrote REACH down for.
   =========================================================================== */
var REACH = BOH_RESOLVE.makeReach(1);
var MOMENTS = [ { name:'SLEEP', spends:8 }, { name:'HANGOUT', spends:1 }, { name:'EAT', spends:null } ];
var RESOLVER = BOH_RESOLVE.makeResolver({ moments: MOMENTS });
/* the compass the run draws in, mapped onto the resolver's four facings. A
   diagonal acts on whichever axis it leans hardest. */
function facingOf(f){
  if(f==='N'||f==='NE'||f==='NW') return BOH_RESOLVE.DIRS.UP;
  if(f==='S'||f==='SE'||f==='SW') return BOH_RESOLVE.DIRS.DOWN;
  return (f==='E') ? BOH_RESOLVE.DIRS.RIGHT : BOH_RESOLVE.DIRS.LEFT;
}
function reaches(tx,ty){ return REACH.canAct({x:px,y:py}, facingOf(PFACE), {x:tx,y:ty}); }

/* ---- THE WORLD RESOLVING. Declared steps, declared order, one per system.
   A step cannot see another step's report and a thrown step never eats the
   time the player spent — that is the resolver's contract, not ours. ---- */
RESOLVER.register('block-clock','WORLD', function(c, moment){
  /* TIME IS SPENT BY ACTIONS: the spend IS what advances the world. A moment
     with no ruled spend advances nothing, on purpose. */
  if(moment.spends == null) return { advanced:0, note:'no ruled cost yet' };
  var mins = moment.spends * 60, steps = 0;
  if(SIM){ for(var i=0;i<mins;i++){ SIM.step(); steps++; } }
  return { advanced: mins, simSteps: steps };
});
RESOLVER.register('neighbours','PEOPLE', function(){
  if(!SIM) return null;
  FACES={}; _APOS={}; updateFaces();
  return { onTheBlock: SIM.outAgents().length };
});
RESOLVER.register('doors','PLACES', function(c, moment){
  /* a night is long enough that every door you left swinging is shut again */
  if(moment.name!=='SLEEP') return null;
  var n=0; for(var k in DOORST){ if(DOORST[k].state!=='closed'){ DOORST[k]={f:0,state:'closed',t0:0}; n++; } }
  return { shut:n };
});
RESOLVER.register('journal','FEED', function(c, moment){
  return { objectives: CTX.quests.activeObjectives().length, moment: moment.name };
});
/* ONE CALL for every block of time the player spends. */
var LAST_RESOLVE=null;
function spendTime(momentName, label){
  var r = RESOLVER.resolve({ run:RUN, at:[px,py] }, { moment: momentName });
  LAST_RESOLVE = r;
  if(momentName==='SLEEP') sleepSave();          /* the ruled sleep-save */
  else autoSave('moment:'+momentName.toLowerCase());
  var adv = r.reports['block-clock'];
  toast(label + (adv && adv.advanced ? ' Time passes.' : ' (that one has no ruled cost yet)'));
  refresh(); draw();
  return r;
}

/* ---- 10. HUD + the one contextual action button ---- */
/* a line of prompting that clears itself after a few steps — it should never sit
   on the world telling you something you did eight moves ago. */
var _toastLife=0;
function toast(msg){ if(!msg){ TOAST.style.display='none'; _toastLife=0; return; }
  TOAST.textContent=msg; TOAST.style.display='block'; _toastLife=8; }
function talkables(){ return (mode==='ext') ? BohemiaLoop.talkablesNear(CTX, px, py, 1) : []; }
function objectiveLine(){
  if(RUN.phase==='done') return 'RUN COMPLETE — you posted it.';
  if(RUN.phase==='home_inside') return 'Get up. Walk out your front door.';
  if(RT && RT.state.done) return 'Quest done — GET HOME (your door is the gold-ringed one).';
  var objs = CTX.quests.activeObjectives();
  if(objs.length) return objs[0].text.replace(/^"|"$/g,'');
  return 'Walk the block. Find your neighbour.';
}
/* ===========================================================================
   ONE BUTTON. It is never a menu and never a list: it looks at what is in
   REACH of where you stand and what you FACE, and it becomes that one verb.
   talk / enter / use / sleep / hang out — the sentence the lab proved.
   =========================================================================== */
function contextVerb(){
  if(RUN.phase==='talking'||RUN.phase==='combat') return null;
  /* the phone, when the run has just landed you home */
  if(mode==='int' && curHouse===HOME && RUN.phase==='home_after')
    return { verb:'phone', label:'CHECK YOUR PHONE', act:function(){ openPhone(); } };
  var t = talkables();
  if(t.length){
    var p=CTX.quests._placed[QID];
    if(!p || reaches(p.x,p.y))
      return { verb:'talk', label:'TALK TO THE '+String(t[0].speaker||'stranger').toUpperCase(),
               act:openTalk };
  }
  if(mode==='ext'){
    /* a door you are standing at, yours or anyone's */
    for(var k in doorOf){ var c=k.split(','), dx=+c[0], dy=+c[1];
      if(reaches(dx,dy)){
        var mine=(doorOf[k]===HOME);
        return { verb:'enter', label: mine?'GO INSIDE (HOME)':'GO INSIDE',
                 act:function(){ var d0=doorKey(dx,dy);
                   if(!doorPassable(d0)){ openDoor(d0); refresh(); return; }
                   if(mine && RT && RT.state.done && RUN.phase!=='home_after'){
                     backAt=[px,py]; enter(HOME); RUN.phase='home_after'; autoSave('home'); openPhone(); draw(); return; }
                   backAt=[px,py]; enter(doorOf[k]); autoSave('inside'); refresh(); draw(); } };
      } }
    /* a neighbour standing near you: a block of time spent with somebody */
    if(SIM){ var outs=SIM.outAgents();
      for(var i=0;i<outs.length;i++){ var a=outs[i];
        if(reaches(a.loc.x,a.loc.y))
          return { verb:'hangout', label:'HANG OUT (1 HOUR)',
                   act:function(){ spendTime('HANGOUT','You spent an hour with a neighbour.'); } };
      } }
  } else {
    /* WHAT YOU ARE STANDING AT BEATS WHAT YOU COULD DO ANYWHERE. Standing in
       the doorway has to offer the doorway, or the one button stops being
       contextual and becomes a preference. */
    if(fpDoor && reaches(fpDoor[0],fpDoor[1]))
      return { verb:'enter', label:'WALK OUT THE DOOR',
               act:function(){ var ik=doorKey(fpDoor[0],fpDoor[1]);
                 if(!doorPassable(ik)){ openDoor(ik); refresh(); return; }
                 leave(); if(RUN.phase==='home_inside') RUN.phase='street';
                 autoSave('outside'); refresh(); draw(); } };
    /* anything the room is holding, right where you stand */
    if(propAt(px,py))
      return { verb:'use', label:'EAT WHAT YOU FOUND',
               act:function(){ spendTime('EAT','You ate.'); } };
    /* your own bed: the biggest block of time there is */
    if(curHouse===HOME)
      return { verb:'sleep', label:'SLEEP (8 HOURS, SAVES)',
               act:function(){ spendTime('SLEEP','You slept the night.'); } };
  }
  return null;
}
var VERB=null;
function refresh(){
  OBJ.textContent = objectiveLine();
  WHERE.textContent = (mode==='int')
    ? (curHouse===HOME ? 'YOUR HOUSE' : 'INSIDE #'+(curHouse+1))
    : (String(CELLNAME||'valley').toUpperCase() + ' · ' +
       (CELL[0]===HOME_CELL[0]&&CELL[1]===HOME_CELL[1] ? 'your block' : 'cell '+CELL[0]+','+CELL[1]));
  VERB = contextVerb();
  /* NAV CLUSTER: the button holds a portrait canvas now, so the verb goes in
     its own label instead of being the button's whole text content. */
  if(VERB){ ACT.disabled=false; ACTLBL.textContent=VERB.label; NAVEL.classList.remove('off'); }
  else { ACT.disabled=true; ACTLBL.textContent='—'; NAVEL.classList.add('off'); }
  drawYourFace();
}

/* ===========================================================================
   HOW WALKING FEELS — the lab's own three options, as things you can FEEL.
   records/lab/BOHEMIA_LAB_STARDEW_TOWNWALK_PATTERN_NOTE_7_26_26.md wrote them
   up and they were closed on paper; Paolo re-opened them as a thing to play,
   not a thing to read. So all three are here, switchable mid-walk:

     GRID    the turn lands and you are in the next cell. Today's feel.
     SLIDE   option 1: SAME rules, the body just slides across the cell over
             the beat instead of teleporting. The pattern note's cheapest
             option, and the ruling explicitly leaves how a spent action is
             DRAWN to us, so this changes no law.
     HYBRID  option 2: you walk freely while nothing is happening, and the
             instant something does (a talk, a fight) it snaps to the grid.
             The seam is real and you are meant to feel it.
     FREE    option 3: continuous everywhere. HONEST WARNING, because it is
             his to weigh: this is the one the TIME IS SPENT BY ACTIONS ruling
             called dead on arrival, since the world stops being something you
             advance by spending time. It is here to be felt, not to be canon.

   The world still advances ONE STEP PER CELL ENTERED in every mode. Nothing
   here lets the player slide around a world holding its breath.
   =========================================================================== */
var WALKMODES=['GRID','SLIDE','HYBRID','FREE'], WALKMODE='GRID';
var SLIDE={ on:false, fx:0, fy:0, t0:0 };          /* the drawn position, mid-step */
var FREEPOS=null;                                   /* continuous position, in cells */
function walkModeSet(m){
  if(WALKMODES.indexOf(m)<0) return;
  WALKMODE=m; SLIDE.on=false;
  FREEPOS = (m==='FREE'||m==='HYBRID') ? { x:px+0.5, y:py+0.5 } : null;
  toast('Walk feel: '+m+'.'); refresh(); draw();
}
/* where the body is DRAWN this frame, in cells, relative to the tile it owns */
function drawOffset(){
  if(FREEPOS && (WALKMODE==='FREE'||(WALKMODE==='HYBRID'&&!freeSnapped())))
    return { x:FREEPOS.x-0.5-px, y:FREEPOS.y-0.5-py };
  if(SLIDE.on){
    var k=Math.min(1,(Date.now()-SLIDE.t0)/BEAT);
    if(k>=1){ SLIDE.on=false; return {x:0,y:0}; }
    return { x:-SLIDE.fx*(1-k), y:-SLIDE.fy*(1-k) };
  }
  return { x:0, y:0 };
}
/* HYBRID's seam, and it has to be SOMETHING HAPPENING, not something merely
   OFFERED. The first cut tested "is a verb available", and a verb is nearly
   always available (that is the whole point of the one button), so FREE never
   actually ran and every nudge was a full grid step. The seam is a talk or a
   fight — the two things the pattern note itself named. */
function freeSnapped(){ return RUN.phase==='talking'||RUN.phase==='combat'; }
var _slideRAF=false;
function slideTick(){ if(!SLIDE.on&&!FREEPOS){ _slideRAF=false; return; } draw();
  if(SLIDE.on||FREEPOS) requestAnimationFrame(slideTick); else _slideRAF=false; }
function slideKick(){ if(!_slideRAF){ _slideRAF=true; requestAnimationFrame(slideTick); } }

/* FREE / HYBRID: a held direction moves a continuous body, and the WORLD only
   advances when that body enters a new cell — the ruling's own rule, kept. */
function freeNudge(dx,dy){
  if(!FREEPOS) return false;
  var SPEED=0.34;
  var nx=FREEPOS.x+dx*SPEED, ny=FREEPOS.y+dy*SPEED;
  var cx=Math.floor(nx), cy=Math.floor(ny);
  var pass = (mode==='ext') ? passExt(cx,cy) : passInt(cx,cy);
  if(!pass || doorOf[cx+','+cy]!=null){ /* a door is still a bump, never a slide-through */
    if(doorOf[cx+','+cy]!=null){ move(dx,dy); }
    return true; }
  FREEPOS.x=nx; FREEPOS.y=ny;
  if(cx!==px||cy!==py){ move(cx-px, cy-py); FREEPOS.x=nx; FREEPOS.y=ny; }
  else { PFACE=dirOf(dx,dy); PMOVING=true; PFRAME=(PFRAME+1)&3; refresh(); }
  slideKick();
  return true;
}

/* ---- 11. MOVEMENT. I-MOVE-YOU-MOVE: one player step = one world minute. ---- */
function move(dx,dy){
  if(RUN.phase==='talking'||RUN.phase==='combat'||RUN.phase==='done') return;
  /* you turn to face where you asked to go even when a wall stops you */
  musicKick();
  PFACE=dirOf(dx,dy); PFRAME=(PFRAME+1)&3; PMOVING=true;
  if(_PIDLE)clearTimeout(_PIDLE);
  _PIDLE=setTimeout(function(){ PMOVING=false; draw(); }, 320);
  var nx=px+dx, ny=py+dy;
  if(mode==='ext'){
    /* THE EDGE IS NOT A WALL ANY MORE. Step off this cell and the neighbouring
       district really loads: same valley, same generators, same seed. If there
       is nothing there (the rim of the map) you simply cannot go. */
    if(nx<0||ny<0||nx>=W||ny>=H){
      var ncx=CELL[0]+(nx<0?-1:nx>=W?1:0), ncy=CELL[1]+(ny<0?-1:ny>=H?1:0);
      var probe = WORLD ? WORLD.tile(ncx*T+(T>>1), ncy*T+(T>>1)) : null;
      if(!probe){ toast('The valley ends here.'); return; }
      loadCell(ncx,ncy);
      px = (nx<0)? W-1 : (nx>=W? 0 : px);
      py = (ny<0)? H-1 : (ny>=H? 0 : py);
      if(SOLIDG[py][px]){                      /* never land inside a wall */
        var got=false;
        for(var r=1;r<24&&!got;r++) for(var ddx=-r;ddx<=r&&!got;ddx++) for(var ddy=-r;ddy<=r&&!got;ddy++){
          var tx=px+ddx, ty=py+ddy;
          if(tx>=0&&ty>=0&&tx<W&&ty<H&&!SOLIDG[ty][tx]){ px=tx; py=ty; got=true; } }
      }
      buildSim(0);
      _footAt=null;   /* HOUSE SKINS: new cell, new footprints */
      toast('You crossed into the '+(CELLNAME||'valley')+'.');
      autoSave('cell');
      refresh(); draw(); return;
    }
    var d = doorOf[nx+','+ny];
    if(d!=null){
      /* YOU DO NOT WALK THROUGH A SHUT DOOR. First bump swings it open (the real
         9-frame clip, 2 beats); you are through once the leaf really is (frame>=5,
         the integration contract's own collision rule). */
      var k=doorKey(nx,ny);
      if(!doorPassable(k)){ openDoor(k); refresh(); return; }
      if(d===HOME && RT && RT.state.done && RUN.phase!=='home_after'){ backAt=[px,py]; enter(d); RUN.phase='home_after'; autoSave('home'); openPhone(); refresh(); draw(); return; }
      backAt=[px,py]; enter(d); autoSave('inside'); refresh(); draw(); return; }
    if(!passExt(nx,ny)) return; px=nx; py=ny;
  } else {
    if(nx===fpDoor[0] && ny===fpDoor[1]){
      var ik=doorKey(nx,ny);
      if(!doorPassable(ik)){ openDoor(ik); refresh(); return; }
      leave(); if(RUN.phase==='home_inside') RUN.phase='street';
      autoSave('outside'); refresh(); draw(); return; }
    if(!passInt(nx,ny)) return; px=nx; py=ny;
  }
  if(WALKMODE==='SLIDE'){ SLIDE.on=true; SLIDE.fx=dx; SLIDE.fy=dy; SLIDE.t0=Date.now(); slideKick(); }
  if(SIM){ SIM.playerAt = (mode==='ext') ? [px,py] : null; SIM.step(); updateFaces(); }
  if(_toastLife>0 && --_toastLife===0) toast(null);
  /* the continuous body follows a committed step; freeNudge overwrites this
     straight after when IT is the one driving, so this only catches the cases
     where the grid moved underneath it (a door bump, a load, a teleport). */
  if(FREEPOS){ FREEPOS.x=px+0.5; FREEPOS.y=py+0.5; }
  refresh(); draw();
}

/* ---- 12. TALK. The real runtime view, rendered as thumb-sized options. ---- */
var TALKEL=document.getElementById('talk'), SPK=document.getElementById('spk'),
    SAYS=document.getElementById('says'), OPTS=document.getElementById('opts');
/* WHICH NODE THE PERSON IN FRONT OF YOU OWNS. A .bq entry condition stays true
   once it is true (S01's `open` is entry=stage>=10 forever), so the runtime can
   legitimately report several begin-able nodes at once. The person you are
   standing next to decides: take the available node whose TALK speaker matches
   whoever the quest is currently bound to, else the latest-authored one. */
function nodeSpeaker(id){
  var t = ((RT&&RT.Q.talks)||[]).filter(function(x){ return x.id===id; })[0];
  return t ? t.speaker : null;
}
function pickTalk(list){
  var p = CTX.quests._placed[QID], want = p && p.speaker;
  if(want) for(var i=0;i<list.length;i++) if(nodeSpeaker(list[i].node)===want) return list[i];
  return list[list.length-1];
}
function openTalk(){
  var t = talkables(); if(!t.length) return;
  var pickd = pickTalk(t);
  var v = BohemiaLoop.talkTo(CTX, pickd.questId, pickd.node);
  if(!v) return;
  RUN.phase='talking'; TALKEL.style.display='flex'; renderTalk(v);
}
function renderTalk(v){
  if(!v || v.ended){ closeTalk(); return; }
  SPK.textContent = (v.speaker||'').replace(/_/g,' ');
  /* THE FACE YOU ARE TALKING TO: the real face system's render, the same 64x64
     portrait combat and the city tab already show. Not an avatar letter. */
  var pf = CAST && CAST.portraits.looks[NPC_LOOK_SEED % Math.max(1,CAST.portraits.looks.length)];
  var slot=document.getElementById('spkface');
  if(slot){ var c2=slot.getContext('2d'); c2.imageSmoothingEnabled=false;
    c2.clearRect(0,0,slot.width,slot.height);
    if(pf){ slot.style.display='block'; c2.drawImage(pf,0,0,slot.width,slot.height); }
    else slot.style.display='none'; }
  SAYS.innerHTML='';
  (v.says||[]).forEach(function(s){ var p=document.createElement('p'); p.textContent=s; SAYS.appendChild(p); });
  (v.noverbs||[]).forEach(function(n){ var p=document.createElement('p'); p.className='nv';
    p.textContent='(you cannot say: '+n+')'; SAYS.appendChild(p); });
  OPTS.innerHTML='';
  (v.options||[]).forEach(function(o){
    var b=document.createElement('button'); b.textContent=o.text; if(o.silence) b.className='sil';
    b.addEventListener('click', function(){ renderTalk(RT.choose(o.i)); });
    OPTS.appendChild(b); });
  if(!(v.options||[]).length){
    var b=document.createElement('button'); b.id='talkcont'; b.textContent='CONTINUE';
    b.addEventListener('click', closeTalk); OPTS.appendChild(b); }
}
function closeTalk(){
  TALKEL.style.display='none';
  RUN.phase = (RT && RT.state.done) ? 'resolved' : 'street';
  afterTalk();
}
/* THE MIDDLE OF THE RUN: once the lineman sends you after the split (stage 20),
   the quest RE-BINDS to the fixer's tile at the far end of the block, so
   objective 20 "Follow the skimmed line" is a walk, not a menu. */
var rebound=false;
function afterTalk(){
  autoSave('talk');
  if(RT && !RT.state.done && RT.state.stage>=20 && !rebound){
    rebound=true;
    CTX.quests.place(QID, { x:FIXER_AT[0], y:FIXER_AT[1], channel:'inperson', speaker:'fixer' });
    toast('The line splits somewhere past the dead storefronts. Follow the cable that runs warm.');
  }
  if(RT && RT.state.done && !RUN.outcome){
    RUN.outcome = RT.state.outcome;
    RUN.clout = BohemiaLoop.cloutTagFrom(RT.state.doneTags) || null;
    /* LOUD DEEDS DRAW PEOPLE. The run reads the completing stage's own CLOUT tag
       (canon: #quiet #notable #risky #reckless, loudness = exposure) — a risky or
       reckless resolution hands off into the REAL combat frame. A quiet fix does
       not. Nothing about the quest's text is changed to make this happen. */
    if(RUN.clout==='reckless' || RUN.clout==='risky') goLoud(RUN.clout);
    else toast('Done, and nobody heard it. Get home.');
  }
  refresh(); draw();
}

/* ---- 13. THE COMBAT HANDOFF. The existing bridge, nothing new:
   this frame -> parent alpha -> BOHEMIA_ENCOUNTER -> the combat frame,
   and BOHEMIA_COMBAT_END all the way back. ---- */
window.__RUN_SENT = [];
var HAND=document.getElementById('hand'), HANDSUB=document.getElementById('handsub'),
    HANDBTN=document.getElementById('handbtn'), HANDBIG=document.getElementById('handbig');
function bridgePost(msg){
  window.__RUN_SENT.push(msg);
  try{ if(window.parent) window.parent.postMessage(msg,'*'); }catch(_e){}
}
function goLoud(tag){
  RUN.phase='combat';
  /* roster size off the loudness the quest declared: reckless draws three,
     risky draws two. The combat frame owns everything else about the fight. */
  var n = (tag==='reckless') ? 3 : 2, roster=[];
  for(var i=0;i<n;i++) roster.push({ hp:60, arch:'human' });
  RUN.sentEncounter = { type:'BOHEMIA_RUN_ENCOUNTER', packageId:1, roster:roster,
                        questId:QID, clout:tag, playerHP:100 };
  HANDBIG.textContent='IT GOES LOUD';
  HANDSUB.textContent='Sparks, a crowd, and a message sent up. Somebody came to see who did it.';
  HANDBTN.style.display='none';
  HAND.style.display='flex';
  bridgePost(RUN.sentEncounter);
  /* if nothing answers (this page opened on its own, outside the alpha) say so
     out loud rather than pretending a fight happened. */
  setTimeout(function(){
    if(RUN.phase!=='combat') return;
    HANDBIG.textContent='COMBAT DID NOT ANSWER';
    HANDSUB.textContent='This page is open on its own. The fight lives in the alpha’s COMBAT frame — open THE RUN from the alpha to play it. The quest is already resolved.';
    HANDBTN.style.display='block';
  }, 9000);
}
HANDBTN.addEventListener('click', function(){ HAND.style.display='none'; RUN.phase='resolved'; refresh(); draw(); });
window.addEventListener('message', function(ev){
  var d = ev && ev.data; if(!d || !d.type) return;
  if(d.type==='BOHEMIA_RUN_CAST'){ castIn(d); return; }
  if(d.type==='BOHEMIA_RUN_MUSIC_STATE'){ MUSIC_ON=!!d.on; refreshMusicBtn(); return; }
  if(d.type==='BOHEMIA_RUN_ENCOUNTER_ACK'){
    HANDSUB.textContent='Handing you to the dial…'; return; }
  if(d.type==='BOHEMIA_RUN_COMBAT_END'){
    RUN.combatOutcome = { victory:!!d.victory, kills:d.kills|0, dead:d.dead|0,
                          spared:d.spared|0, fled:d.fled|0, playerHP:d.playerHP };
    RUN.phase='resolved'; HAND.style.display='none';
    if(!d.victory){
      /* DEATH IS A RELOAD, NOT A RESET (Paolo 7/26): you go back to the closest
         previous save. Never a wipe, never start-from-the-beginning. */
      if(loadClosest()) toast('You went down. Back to your last save.');
      else toast('You went down, and there was no save to go back to.');
      return; }
    autoSave('fight');
    toast('You walked out of it. '+(d.dead|0)+' down, '+(d.spared|0)+' left breathing. Get home.');
    refresh(); draw(); }
});

/* ---- 14. THE PHONE. The post is BUILT BY THE ENGINE (buildFeed over the real

/* ---- 14b. MUSIC. Paolo 7/26: "no music either." The songs are real and they

   CITY tab asks the parent to run when you walk the city. One AudioContext, in

var MUSIC_ON=false;

/* ===========================================================================
   14c. SAVE / LOAD — ONE PORTABLE BLOB.
   Ruled 7/26 by Paolo, twice, and built exactly to those two rulings:
     laws/BOHEMIA_ADDENDUM_SAVES_AND_CLOUD_7_26_26.md
       "BOTH kinds": sleep saves AND free manual saves AND a quiet autosave, all
       coexisting. ONE serializable, versioned, device-agnostic package;
       everything about the player's game in it; NOTHING device-specific in it;
       no system keeps its own private side-channel; version from day one and
       loaders migrate old versions forward, never reject them; export/import a
       save code so it travels between devices with no server (phase 1).
     laws/BOHEMIA_ADDENDUM_DEATH_IS_A_RELOAD_7_26_26.md
       death loads the CLOSEST PREVIOUS SAVE. Never a reset, never permadeath.

   THE BLOB is the engine's own versioned save (E.Save via BohemiaLoop) plus the
   run's surface state, inside ONE envelope that is itself versioned. The music
   toggle is deliberately NOT in it: that is a device preference and the law says
   device preferences never travel in the save.
   =========================================================================== */
var SAVE_ENV_VERSION=1, SAVE_KEY='bohemia.save.v1', SAVE_KEEP=6;
function saveBlob(label){
  return { env:SAVE_ENV_VERSION, kind:'BOHEMIA_SAVE', label:label||'save',
    /* stamped from the world's own clock, never wall-clock: a save has to mean
       the same thing on a device in another timezone */
    beat: CTX.clock ? CTX.clock.snapshot().beat : 0,
    step: SIM ? SIM.turn : 0,
    engine: JSON.parse(BohemiaLoop.captureSave(CTX)),
    run: { mode:mode, px:px, py:py, curHouse:curHouse, backAt:backAt&&backAt.slice(),
           phase:RUN.phase, outcome:RUN.outcome, clout:RUN.clout,
           combat:RUN.combatOutcome, rebound:rebound,
           doors:JSON.parse(JSON.stringify(DOORST)),
           npc:(function(){ var p=CTX.quests._placed[QID];
             return p?{x:p.x,y:p.y,speaker:p.speaker,channel:p.channel}:null; })() } };
}
/* loaders migrate forward, never reject (the law's own words) */
function migrateBlob(b){
  if(!b||b.kind!=='BOHEMIA_SAVE') return null;
  var v=b.env||1;
  /* v1 is current; each future bump adds one step here and never a rejection */
  while(v<SAVE_ENV_VERSION){ v++; b.env=v; }
  return b;
}
function applyBlob(b){
  b=migrateBlob(b); if(!b) return false;
  try{
    CTX = BohemiaLoop.boot({ saveText: JSON.stringify(b.engine) });
    RT = QID ? CTX.quests.get(QID) : null;
    if(!RT && S01_TEXT){ CTX.quests.place(S01_TEXT,{x:LINEMAN_AT[0],y:LINEMAN_AT[1],channel:'inperson',speaker:'lineman'}); RT=CTX.quests.get(QID); }
    var pl=b.run.npc;
    if(pl) CTX.quests.place(QID,{x:pl.x,y:pl.y,channel:pl.channel||'inperson',speaker:pl.speaker});
    mode=b.run.mode; px=b.run.px; py=b.run.py; backAt=b.run.backAt?b.run.backAt.slice():null;
    rebound=!!b.run.rebound;
    RUN.phase=b.run.phase; RUN.outcome=b.run.outcome; RUN.clout=b.run.clout;
    RUN.combatOutcome=b.run.combat||null;
    DOORST=b.run.doors||{};
    if(b.run.curHouse>=0){ var keepPX=px, keepPY=py; enter(b.run.curHouse); px=keepPX; py=keepPY; }
    else { curHouse=-1; fp=null; fpDoor=null; }
    /* the block sim is deterministic from the seed, so a save stores HOW FAR it
       ran, not a dump of every body: re-step it to the same world minute. */
    if(SIM){ try{ var _a=BohemiaAgents.agentsForBlock(SEED,feet,[],fpOf);
        SIM=BohemiaAgents.makeSim(res,feet,_a,{fpOf:fpOf,doorOf:doorOf,startTurn:0});
        SIM.playerAt=(mode==='ext')?[px,py]:null;
        for(var i=0;i<(b.step||0);i++)SIM.step();
        FACES={}; _APOS={}; updateFaces(); }catch(_e){} }
    PHONE.style.display='none'; TALKEL.style.display='none'; HAND.style.display='none';
    refresh(); draw(); return true;
  }catch(e){ return false; }
}
function saveSlots(){
  try{ var raw=localStorage.getItem(SAVE_KEY); if(!raw) return [];
    var a=JSON.parse(raw); return Array.isArray(a)?a:[]; }catch(_e){ return []; }
}
function writeSave(label){
  var a=saveSlots(); a.unshift(saveBlob(label));
  while(a.length>SAVE_KEEP) a.pop();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(a)); }catch(_e){}
  return a[0];
}
/* the three kinds, all coexisting per the ruling */
function manualSave(){ writeSave('manual'); toast('Saved.'); renderSaveSheet(); }
function sleepSave(){ writeSave('slept'); toast('You slept. Saved.'); renderSaveSheet(); }
function autoSave(why){ writeSave('auto:'+why); }
/* DEATH IS A RELOAD: the closest previous save, never a reset */
function loadClosest(){
  var a=saveSlots(); if(!a.length) return false;
  return applyBlob(a[0]);
}

/* ---- the save sheet ---- */
var SAVEEL=document.getElementById('save');
function renderSaveSheet(){
  var list=document.getElementById('savelist'), acts=document.getElementById('saveacts');
  var a=saveSlots();
  list.innerHTML='';
  if(!a.length) list.innerHTML='<div class="none">No saves on this device yet.</div>';
  a.forEach(function(b,i){
    var el=document.createElement('div'); el.className='slot';
    el.innerHTML='<span>'+(b.label==='slept'?'slept':(b.label==='manual'?'saved':'autosave'))+
      '</span><span class="when">beat '+(b.beat||0)+' · step '+(b.step||0)+'</span>';
    list.appendChild(el);
  });
  acts.innerHTML='';
  /* THE WALK QUESTION, as a thing to FEEL. Four buttons, switch mid-walk, and
     the one that would cost a law says so on its own face. */
  var wl=document.createElement('div'); wl.className='walkrow';
  wl.innerHTML='<div class="wlab">HOW WALKING FEELS — switch and go walk</div>';
  [['GRID','the turn lands, you are in the next cell'],
   ['SLIDE','same rules, the body slides across the cell'],
   ['HYBRID','free until something happens, then it snaps'],
   ['FREE','continuous everywhere (this one costs a law)']].forEach(function(m){
    var b=document.createElement('button'); b.className='walkbtn'+(WALKMODE===m[0]?' on':'');
    b.innerHTML='<b>'+m[0]+'</b><span>'+m[1]+'</span>';
    b.addEventListener('click',function(){ walkModeSet(m[0]); renderSaveSheet(); });
    wl.appendChild(b); });
  acts.appendChild(wl);
  function btn(txt,fn,ghost,off){ var b=document.createElement('button');
    b.textContent=txt; if(ghost)b.className='ghost'; if(off)b.disabled=true;
    else b.addEventListener('click',fn); acts.appendChild(b); return b; }
  var inOwnBed = (mode==='int' && curHouse===HOME);
  btn(inOwnBed?'SLEEP AND SAVE':'SLEEP AND SAVE (ONLY AT HOME)', sleepSave, false, !inOwnBed);
  btn('SAVE NOW', manualSave, true);
  btn('LOAD LAST SAVE', function(){ if(loadClosest()){ closeSave(); toast('Loaded.'); } }, true, !a.length);
  btn('EXPORT SAVE CODE (.txt)', function(){
    bridgePost({bohemiaExport:{name:'bohemia_save.txt',text:JSON.stringify(saveBlob('export'))}});
    toast('Save code sent to the export sheet.'); }, true);
  btn('LOAD FROM PASTED CODE', function(){
    var t=document.getElementById('savecode').value.trim(); if(!t)return;
    var ok=false; try{ ok=applyBlob(JSON.parse(t)); }catch(_e){ ok=false; }
    toast(ok?'Loaded that save.':'That save code did not read.');
    if(ok) closeSave(); }, true);
}
function openSave(){ renderSaveSheet(); SAVEEL.style.display='flex'; }
function closeSave(){ SAVEEL.style.display='none'; }
document.getElementById('menu').addEventListener('click', openSave);
document.getElementById('saveclose').addEventListener('click', closeSave);

/* ---- 15. INPUT: d-pad, keys, and tap-the-world (one thumb, arm's length). ---- */
/* ONE BUTTON, ONE VERB: whatever the context resolved to is what it does. */
ACT.addEventListener('click', function(){
  if(ACT.disabled || !VERB) return;
  musicKick();
  VERB.act();
});
/* HOLD TO WALK. A block is 128 tiles across; tapping once per step at arm's
   length is not a game, it is data entry. Press and hold and you keep walking:
   one step on press, a short grace, then a step every 110ms. */
var HOLD=null;
function holdStop(){ if(HOLD){ clearTimeout(HOLD.t); clearInterval(HOLD.i); HOLD=null; } }
/* NAV CLUSTER (7/27): four buttons became eight. The run's movement already
   spoke 8 - dirOf() has always returned SE/NE/SW/NW and DIRS8 has been sitting
   there - only the BUTTONS were four. */
var NAV8=[['u',0,-1],['ne',1,-1],['r',1,0],['se',1,1],['d',0,1],['sw',-1,1],['l',-1,0],['nw',-1,-1]];
NAV8.forEach(function(e){ var id=e[0], dx=e[1], dy=e[2];
  var b=document.getElementById('b'+id); if(!b) return;
  /* NO CORNER SQUEEZE: a diagonal through two solid orthogonal neighbours would
     let you slip between two building corners into a sealed yard. Turning
     diagonals on means owning that rule, so the step is refused unless at least
     one of the two sides is open. */
  var go=function(){
    if(dx&&dy&&mode==='ext'&&typeof SOLIDG!=='undefined'&&SOLIDG){
      var a=SOLIDG[py]&&SOLIDG[py][px+dx], c=SOLIDG[py+dy]&&SOLIDG[py+dy][px];
      if(a&&c){ PFACE=dirOf(dx,dy); draw(); return; }
    }
    if(FREEPOS && !freeSnapped()) freeNudge(dx,dy); else move(dx,dy); };
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); holdStop(); go();
    HOLD={ t:setTimeout(function(){ HOLD.i=setInterval(go, (FREEPOS&&!freeSnapped())?40:110); },220), i:0 }; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ b.addEventListener(ev, holdStop); });
});
window.addEventListener('blur', holdStop);
document.addEventListener('keydown', function(e){ var k=e.key;
  if(k==='ArrowUp'||k==='w') move(0,-1); else if(k==='ArrowDown'||k==='s') move(0,1);
  else if(k==='ArrowLeft'||k==='a') move(-1,0); else if(k==='ArrowRight'||k==='d') move(1,0);
  else return; e.preventDefault(); });
cv.addEventListener('click', function(e){
  var r=cv.getBoundingClientRect(), dx=(e.clientX-r.left)-r.width/2, dy=(e.clientY-r.top)-r.height/2;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0); else move(0,dy>0?1:-1);
});

function fit(){ cv.width=cv.clientWidth; cv.height=cv.clientHeight; draw(); }
window.addEventListener('resize', fit);
refresh(); fit(); updateFaces();
askForCast();   /* the real bodies, straight off the rig Paolo built */
autoSave('start');   /* death is a reload: there is always a save to land on */
toast('You woke up in your own house. Walk out the front door.');

/* ---- read-only introspection for gates/run_gate.js. Actions go through the
   real buttons; this only REPORTS where things are. ---- */
window.__RUN = {
  state: function(){ return { mode:mode, px:px, py:py, phase:RUN.phase, home:HOME,
    homeDoor:HOME_DOOR, lineman:LINEMAN_AT, fixer:FIXER_AT, curHouse:curHouse,
    questDone: !!(RT&&RT.state.done), outcome:RUN.outcome, clout:RUN.clout,
    stage: RT?RT.state.stage:null, sent: window.__RUN_SENT.slice(),
    combat: RUN.combatOutcome,
    npc: (function(){ var n=questNpcTile(); return n?[n.x,n.y]:null; })() }; },
  grid: function(){ var a=[];
    for(var y=0;y<H;y++){ var r=[]; for(var x=0;x<W;x++) r.push(passExt(x,y)); a.push(r); }
    return { W:W, H:H, pass:a, doorOf:doorOf }; },
  interior: function(){ if(!fp) return null; var a=[];
    for(var y=0;y<fp.H;y++){ var r=[]; for(var x=0;x<fp.W;x++) r.push(passInt(x,y)); a.push(r); }
    return { W:fp.W, H:fp.H, door:fpDoor, pass:a }; },
  talkables: function(){ return talkables(); },
  doors: function(){ return { clips:DOOR_IMGS.length, frames:DOOR_ANIM.framesPerClip,
    tileW:DOOR_ANIM.tileW, tileH:DOOR_ANIM.tileH, version:DOOR_ANIM.version,
    state:JSON.parse(JSON.stringify(DOORST)) }; },
  music: function(){ return MUSIC_ON; },
  /* the sentence, for gates/run_gate.js: what ONE button is offering right now,
     what the world did the last time time was spent, and how walking feels. */
  verb: function(){ return VERB ? { verb:VERB.verb, label:VERB.label } : null; },
  moments: function(){ return MOMENTS.map(function(m){ return {name:m.name,spends:m.spends}; }); },
  lastResolve: function(){ return LAST_RESOLVE; },
  reach: function(){ return { tiles:REACH.tiles, facing:PFACE,
    faced:REACH.facingTile(px,py,facingOf(PFACE)) }; },
  cell: function(){ return { at:CELL.slice(), name:CELLNAME, home:HOME_CELL.slice(),
    isHome:(CELL[0]===HOME_CELL[0]&&CELL[1]===HOME_CELL[1]), tiles:T, homes:feet.length }; },
  neighbours: function(){ var out={};
    [['E',1,0],['W',-1,0],['S',0,1],['N',0,-1]].forEach(function(d){
      var t=WORLD?WORLD.tile((CELL[0]+d[1])*T+(T>>1),(CELL[1]+d[2])*T+(T>>1)):null;
      out[d[0]]=t?String(t.district):null; });
    return out; },
  walkMode: function(){ return WALKMODE; },
  walkModes: function(){ return WALKMODES.slice(); },
  setWalkMode: function(m){ walkModeSet(m); return WALKMODE; },
  drawOffset: function(){ return drawOffset(); },
  /* save/load introspection for gates/run_gate.js — reports, never acts */
  saves: function(){ return saveSlots().map(function(b){
    return { label:b.label, env:b.env, beat:b.beat, step:b.step,
             hasEngine:!!b.engine, hasRun:!!b.run,
             /* the law: device preferences NEVER travel in the save */
             carriesDevicePrefs: JSON.stringify(b).indexOf('MUSIC_ON')>=0 }; }); },
  saveNow: function(label){ return !!writeSave(label||'manual'); },
  loadLast: function(){ return loadClosest(); },
  exportCode: function(){ return JSON.stringify(saveBlob('export')); },
  importCode: function(t){ try{ return applyBlob(JSON.parse(t)); }catch(_e){ return false; } },
  wipeSaves: function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(_e){} },
  cast: function(){ if(!CAST) return null;
    var d=Object.keys(CAST.player), any=CAST.player[d[0]];
    return { dirs:d.length, walkFrames:any?any.walk.length:0, looks:CAST.looks.length,
      lookDirs:CAST.looks.length?Object.keys(CAST.looks[0]).length:0,
      portrait:!!CAST.portraits.you, npcPortraits:CAST.portraits.looks.filter(Boolean).length,
      spriteW:any&&any.idle?any.idle.width:0, spriteH:any&&any.idle?any.idle.height:0 }; },
  /* THE BUILDING STACK, as facts a gate can check (Paolo 7/27's three). Reports
     what the renderer would actually lay on every cell of the loaded block. */
  look: function(){
    if(!isSuburbCell()) return null;
    var isRoof=function(id){ return id.indexOf('roof_')===0; },
        isWall=function(id){ return id.indexOf('wall_')===0; },
        isBay =function(id){ return id.indexOf('garage_bottom')===0; },
        isGar =function(id){ return id.indexOf('garage_')===0; };
    var o={ faceH:FACE_H, roofD:ROOF_D, band:BAND, doors:0, doorsOnSouthFace:0,
            minDoorWallCourses:99, bays:0, widestBay:0, tallestBayColumn:0,
            worstRoofRun:0, strayWallCaps:0, blackHipRisk:0 };
    var id=function(x,y){ return isBody(x,y) ? bodyTile(G[y][x],x,y) : null; };
    /* the doors */
    Object.keys(doorOf).forEach(function(k){
      var p=k.split(',').map(Number); o.doors++;
      if(!isBody(p[0],p[1]+1)) o.doorsOnSouthFace++;
      /* how many courses of real wall this door's column carries, the door's
         own two rows included: Paolo's "at the least three wall tiles tall" */
      var n=0, y=p[1];
      while(isBody(p[0],y) && (doorOf[p[0]+','+y]!=null || isWall(id(p[0],y)||''))){ n++; y--; }
      if(n<o.minDoorWallCourses) o.minDoorWallCourses=n;
    });
    if(o.doors===0) o.minDoorWallCourses=0;
    /* the garage bays: horizontal runs only, never a vertical stripe */
    var run=0;
    for(var y2=0;y2<H;y2++){ run=0;
      for(var x2=0;x2<W;x2++){
        var t=id(x2,y2);
        if(t&&isBay(t)) run++;
        else { if(run){ o.bays++; if(run>o.widestBay) o.widestBay=run; } run=0; } }
      if(run){ o.bays++; if(run>o.widestBay) o.widestBay=run; } }
    for(var x3=0;x3<W;x3++){ var col=0;
      for(var y3=0;y3<H;y3++){ var t3=id(x3,y3);
        if(t3&&isGar(t3)){ col++; if(col>o.tallestBayColumn) o.tallestBayColumn=col; } else col=0; } }
    /* CONCRETE HAS TO BE GOING SOMEWHERE. Every poured tile on open ground is
       either the kerb band, a driveway/gate the world itself put there, or a
       front path that reached the street. Anything else is a stray slab. */
    var ps=pathSet();
    o.pathCells=0; o.pathDoors=0; o.strayConcrete=0;
    for(var k2 in ps) o.pathCells++;
    Object.keys(doorOf).forEach(function(k3){
      var p3=k3.split(',').map(Number);
      if(ps[p3[0]+','+(p3[1]+1)]) o.pathDoors++;
    });
    for(var y5=0;y5<H;y5++) for(var x5=0;x5<W;x5++){
      if(isBody(x5,y5)) continue;
      var c5=G[y5][x5]; if(c5!==0) continue;              /* only the yards */
      var t5=groundTile(c5,x5,y5);
      if(t5.indexOf('walk_')!==0 && t5.indexOf('concrete_')!==0) continue;
      if(t5==='walk_kerb') continue;                      /* the band against the road */
      if(ps[x5+','+y5]) continue;                         /* a real front path */
      o.strayConcrete++;
    }
    /* the roof may never become a field, and a wall course may never cap a mass */
    for(var x4=0;x4<W;x4++){ var r=0;
      for(var y4=0;y4<H;y4++){ var t4=id(x4,y4);
        if(t4&&isRoof(t4)){ r++; if(r>o.worstRoofRun) o.worstRoofRun=r; } else r=0;
        if(t4&&isWall(t4)&&!isBody(x4,y4-1)) o.strayWallCaps++; } }
    return o;
  },
  /* what is drawn see-through OVER you where you stand right now */
  occluders: function(){
    var out={ overhead:0, inDoorway:(mode==='ext'&&doorOf[px+','+py]!=null),
              wallToTheNorth:(mode==='ext'&&isBody(px,py-1)) };
    if(mode==='ext') for(var up=0;up<=1;up++){ var oy=py-up;
      if(oy>=0 && LAYERG[oy] && LAYERG[oy][px]==='overhead') out.overhead++; }
    out.faded = out.overhead>0 || out.inDoorway;
    return out; },
  feed: function(){ return BohemiaLoop.buildFeed(CTX,{}); },
  profile: function(){ return BohemiaLoop.socialProfile(CTX); }
};
window.__RUN_READY = true;

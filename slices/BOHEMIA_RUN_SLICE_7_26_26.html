/* ===========================================================================
   THE SENTENCE THE GAME SPEAKS (Paolo, after the lab: "walk somewhere, ONE
   contextual action button that changes by what you're standing at, act, spend
   time, the world resolves"). Every verb in the run goes through the ported,
   approved engine/bohemia_resolve.js — its REACH decides what is close enough
   and what you are facing, and its RESOLVER runs the world at every block of
   time you spend.

   THE MOMENTS ARE HIS. He named the sizes in the same breath: sleep 8, hang out
   1. He did not price EAT, so EAT is declared with NO spend and the button says
   so, because an action-cost table is canon and no lane writes one
   (laws/BOHEMIA_ADDENDUM_TIME_IS_SPENT_BY_ACTIONS_7_26_26.md sec 4).

   THE REACH NUMBER is not invented either: it is 1, the radius the run's own
   talk trigger has always used (BohemiaLoop.talkablesNear(ctx, x, y, 1)), now
   declared once instead of assumed in three places — which is the exact lesson
   the lab wrote REACH down for.
   =========================================================================== */
var REACH = BOH_RESOLVE.makeReach(1);
var MOMENTS = [ { name:'SLEEP', spends:8 }, { name:'HANGOUT', spends:1 }, { name:'EAT', spends:null } ];
var RESOLVER = BOH_RESOLVE.makeResolver({ moments: MOMENTS });
/* the compass the run draws in, mapped onto the resolver's four facings. A
   diagonal acts on whichever axis it leans hardest. */
function facingOf(f){
  if(f==='N'||f==='NE'||f==='NW') return BOH_RESOLVE.DIRS.UP;
  if(f==='S'||f==='SE'||f==='SW') return BOH_RESOLVE.DIRS.DOWN;
  return (f==='E') ? BOH_RESOLVE.DIRS.RIGHT : BOH_RESOLVE.DIRS.LEFT;
}
function reaches(tx,ty){ return REACH.canAct({x:px,y:py}, facingOf(PFACE), {x:tx,y:ty}); }

/* ---- THE WORLD RESOLVING. Declared steps, declared order, one per system.
   A step cannot see another step's report and a thrown step never eats the
   time the player spent — that is the resolver's contract, not ours. ---- */
RESOLVER.register('block-clock','WORLD', function(c, moment){
  /* TIME IS SPENT BY ACTIONS: the spend IS what advances the world. A moment
     with no ruled spend advances nothing, on purpose. */
  if(moment.spends == null) return { advanced:0, note:'no ruled cost yet' };
  var mins = moment.spends * 60, steps = 0;
  if(SIM){ for(var i=0;i<mins;i++){ SIM.step(); steps++; } }
  return { advanced: mins, simSteps: steps };
});
/* ==== RUN PERSON FACTS (7/31) ==== */
/* THE HOOK A GATE DRIVES THE DAY WITH. Stepping the sim to a wall-clock minute
   is the only way to assert "the street empties at 13:00" on the real surface,
   and the run's own boot already does exactly this (buildSim(450) warms it to
   ~07:30 "so the street is already living"). No new simulation: it calls
   SIM.step(), which is the same tick the game runs. */
window.__RUN_PEOPLE = {
  ready: function(){ return !!(SIM && RUN_PEOPLE); },
  count: function(){ return SIM ? SIM.agents.length : 0; },
  outdoors: function(){ return SIM ? SIM.outAgents().length : 0; },
  drawn: function(){ return window.__RUN_PPL_DRAWN; },
  minute: function(){ return SIM ? (SIM.turn % 1440) : -1; },
  facts: function(){ return RUN_PEOPLE ? RUN_PEOPLE.map(function(p){
    return {id:p.id, ns:p.ns, archetype:p.archetype, heatTol:p.heatTol,
            earlyBy:p.earlyBy, nightOut:p.nightOut, darkStay:p.darkStay}; }) : null; },
  /* run the clock to a minute of the day and report what the sim did */
  runTo: function(min){
    if(!SIM) return null;
    var guard=0;
    while((SIM.turn%1440)!==(min|0) && guard++ < 3000) SIM.step();
    updateFaces(); draw();
    return {minute:SIM.turn%1440, outdoors:SIM.outAgents().length, drawn:window.__RUN_PPL_DRAWN};
  },
  recondition: function(){ return reconditionPeople(); }
};
/* ==== /RUN PERSON FACTS ==== */
RESOLVER.register('neighbours','PEOPLE', function(){
  if(!SIM) return null;
  FACES={}; _APOS={}; updateFaces();
  return { onTheBlock: SIM.outAgents().length };
});
RESOLVER.register('doors','PLACES', function(c, moment){
  /* a night is long enough that every door you left swinging is shut again */
  if(moment.name!=='SLEEP') return null;
  var n=0; for(var k in DOORST){ if(DOORST[k].state!=='closed'){ DOORST[k]={f:0,state:'closed',t0:0}; n++; } }
  return { shut:n };
});
RESOLVER.register('journal','FEED', function(c, moment){
  return { objectives: CTX.quests.activeObjectives().length, moment: moment.name };
});
/* ONE CALL for every block of time the player spends. */
var LAST_RESOLVE=null;
function spendTime(momentName, label){
  var r = RESOLVER.resolve({ run:RUN, at:[px,py] }, { moment: momentName });
  LAST_RESOLVE = r;
  if(momentName==='SLEEP') sleepSave();          /* the ruled sleep-save */
  else autoSave('moment:'+momentName.toLowerCase());
  var adv = r.reports['block-clock'];
  toast(label + (adv && adv.advanced ? ' Time passes.' : ' (that one has no ruled cost yet)'));
  refresh(); draw();
  return r;
}

/* ---- 10. HUD + the one contextual action button ---- */
/* a line of prompting that clears itself after a few steps — it should never sit
   on the world telling you something you did eight moves ago. */
var _toastLife=0;
function toast(msg){ if(!msg){ TOAST.style.display='none'; _toastLife=0; return; }
  TOAST.textContent=msg; TOAST.style.display='block'; _toastLife=8; }
function talkables(){ return (mode==='ext') ? BohemiaLoop.talkablesNear(CTX, px, py, 1) : []; }
function objectiveLine(){
  if(RUN.phase==='done') return 'RUN COMPLETE — you posted it.';
  if(RUN.phase==='home_inside') return 'Get up. Walk out your front door.';
  if(RT && RT.state.done) return 'Quest done — GET HOME (your door is the gold-ringed one).';
  var objs = CTX.quests.activeObjectives();
  if(objs.length) return objs[0].text.replace(/^"|"$/g,'');
  return 'Walk the block. Find your neighbour.';
}
/* ===========================================================================
   ONE BUTTON. It is never a menu and never a list: it looks at what is in
   REACH of where you stand and what you FACE, and it becomes that one verb.
   talk / enter / use / sleep / hang out — the sentence the lab proved.
   =========================================================================== */
function contextVerb(){
  if(RUN.phase==='talking'||RUN.phase==='combat') return null;
  /* the phone, when the run has just landed you home */
  if(mode==='int' && curHouse===HOME && RUN.phase==='home_after')
    return { verb:'phone', label:'CHECK YOUR PHONE', act:function(){ openPhone(); } };
  var t = talkables();
  if(t.length){
    var p=CTX.quests._placed[QID];
    if(!p || reaches(p.x,p.y))
      return { verb:'talk', label:'TALK TO THE '+String(t[0].speaker||'stranger').toUpperCase(),
               act:openTalk };
  }
  if(mode==='ext'){
    /* a door you are standing at, yours or anyone's */
    for(var k in doorOf){ var c=k.split(','), dx=+c[0], dy=+c[1];
      if(reaches(dx,dy)){
        var mine=(doorOf[k]===HOME);
        return { verb:'enter', label: mine?'GO INSIDE (HOME)':'GO INSIDE',
                 act:function(){ var d0=doorKey(dx,dy);
                   if(!doorPassable(d0)){ openDoor(d0); refresh(); return; }
                   if(mine && RT && RT.state.done && RUN.phase!=='home_after'){
                     backAt=[px,py]; enter(HOME); RUN.phase='home_after'; autoSave('home'); openPhone(); draw(); return; }
                   backAt=[px,py]; enter(doorOf[k]); autoSave('inside'); refresh(); draw(); } };
      } }
    /* PEOPLE:VERB */
    /* A NEIGHBOUR STANDING NEAR YOU IS A PERSON, NOT A TIME SINK. This branch
       used to be an anonymous HANG OUT (1 HOUR): you spent an hour with "a
       neighbour" and never learned which one. It is TALK now, and the hour is
       still on the table — it is an option inside the conversation, which is
       where hanging out with somebody belongs once you know who they are. */
    if(SIM){ var outs=SIM.outAgents();
      for(var i=0;i<outs.length;i++){ var a=outs[i];
        if(reaches(a.loc.x,a.loc.y)){
          var who=personFor(a);
          return { verb:'talk', label:BohemiaPeople.addressOf(who),
                   act:(function(ag){ return function(){ openPerson(ag); }; })(a) };
        }
      } }
    /* /PEOPLE:VERB */
  } else {
    /* WHAT YOU ARE STANDING AT BEATS WHAT YOU COULD DO ANYWHERE. Standing in
       the doorway has to offer the doorway, or the one button stops being
       contextual and becomes a preference. */
    if(fpDoor && reaches(fpDoor[0],fpDoor[1]))
      return { verb:'enter', label:'WALK OUT THE DOOR',
               act:function(){ var ik=doorKey(fpDoor[0],fpDoor[1]);
                 if(!doorPassable(ik)){ openDoor(ik); refresh(); return; }
                 leave(); if(RUN.phase==='home_inside') RUN.phase='street';
                 autoSave('outside'); refresh(); draw(); } };
    /* anything the room is holding, right where you stand */
    if(propAt(px,py))
      return { verb:'use', label:'EAT WHAT YOU FOUND',
               act:function(){ sfx('eat');   /* HIS EAT (8/2 ruling: "eat will be a different sound") */
                            spendTime('EAT','You ate.'); } };
    /* your own bed: the biggest block of time there is */
    if(curHouse===HOME)
      return { verb:'sleep', label:'SLEEP (8 HOURS, SAVES)',
               act:function(){ spendTime('SLEEP','You slept the night.'); } };
  }
  return null;
}
var VERB=null;
function refresh(){
  OBJ.textContent = objectiveLine();
  WHERE.textContent = (mode==='int')
    ? (curHouse===HOME ? 'YOUR HOUSE' : 'INSIDE #'+(curHouse+1))
    : (String(CELLNAME||'valley').toUpperCase() + ' · ' +
       (CELL[0]===HOME_CELL[0]&&CELL[1]===HOME_CELL[1] ? 'your block' : 'cell '+CELL[0]+','+CELL[1]));
  VERB = contextVerb();
  /* NAV CLUSTER: the button holds a portrait canvas now, so the verb goes in
     its own label instead of being the button's whole text content. */
  if(VERB){ ACT.disabled=false; ACTLBL.textContent=VERB.label; NAVEL.classList.remove('off'); }
  else { ACT.disabled=true; ACTLBL.textContent='—'; NAVEL.classList.add('off'); }
  drawYourFace();
}

/* ===========================================================================
   HOW WALKING FEELS — the lab's own three options, as things you can FEEL.
   records/lab/BOHEMIA_LAB_STARDEW_TOWNWALK_PATTERN_NOTE_7_26_26.md wrote them
   up and they were closed on paper; Paolo re-opened them as a thing to play,
   not a thing to read. So all three are here, switchable mid-walk:

     GRID    the turn lands and you are in the next cell. Today's feel.
     SLIDE   option 1: SAME rules, the body just slides across the cell over
             the beat instead of teleporting. The pattern note's cheapest
             option, and the ruling explicitly leaves how a spent action is
             DRAWN to us, so this changes no law.
     HYBRID  option 2: you walk freely while nothing is happening, and the
             instant something does (a talk, a fight) it snaps to the grid.
             The seam is real and you are meant to feel it.
     FREE    option 3: continuous everywhere. HONEST WARNING, because it is
             his to weigh: this is the one the TIME IS SPENT BY ACTIONS ruling
             called dead on arrival, since the world stops being something you
             advance by spending time. It is here to be felt, not to be canon.

   The world still advances ONE STEP PER CELL ENTERED in every mode. Nothing
   here lets the player slide around a world holding its breath.
   =========================================================================== */
var WALKMODES=['GRID','SLIDE','HYBRID','FREE'], WALKMODE='GRID';
var SLIDE={ on:false, fx:0, fy:0, t0:0 };          /* the drawn position, mid-step */
var FREEPOS=null;                                   /* continuous position, in cells */
function walkModeSet(m){
  if(WALKMODES.indexOf(m)<0) return;
  WALKMODE=m; SLIDE.on=false;
  FREEPOS = (m==='FREE'||m==='HYBRID') ? { x:px+0.5, y:py+0.5 } : null;
  toast('Walk feel: '+m+'.'); refresh(); draw();
}
/* where the body is DRAWN this frame, in cells, relative to the tile it owns */
function drawOffset(){
  if(FREEPOS && (WALKMODE==='FREE'||(WALKMODE==='HYBRID'&&!freeSnapped())))
    return { x:FREEPOS.x-0.5-px, y:FREEPOS.y-0.5-py };
  if(SLIDE.on){
    var k=Math.min(1,(Date.now()-SLIDE.t0)/rbBeatMs());   /* one BEAT of the real song */
    if(k>=1){ SLIDE.on=false; return {x:0,y:0}; }
    return { x:-SLIDE.fx*(1-k), y:-SLIDE.fy*(1-k) };
  }
  return { x:0, y:0 };
}
/* HYBRID's seam, and it has to be SOMETHING HAPPENING, not something merely
   OFFERED. The first cut tested "is a verb available", and a verb is nearly
   always available (that is the whole point of the one button), so FREE never
   actually ran and every nudge was a full grid step. The seam is a talk or a
   fight — the two things the pattern note itself named. */
function freeSnapped(){ return RUN.phase==='talking'||RUN.phase==='combat'; }
var _slideRAF=false;
function slideTick(){ if(!SLIDE.on&&!FREEPOS){ _slideRAF=false; return; } draw();
  if(SLIDE.on||FREEPOS) requestAnimationFrame(slideTick); else _slideRAF=false; }
function slideKick(){ if(!_slideRAF){ _slideRAF=true; requestAnimationFrame(slideTick); } }

/* FREE / HYBRID: a held direction moves a continuous body, and the WORLD only
   advances when that body enters a new cell — the ruling's own rule, kept. */
function freeNudge(dx,dy){
  if(!FREEPOS) return false;
  var SPEED=0.34;
  var nx=FREEPOS.x+dx*SPEED, ny=FREEPOS.y+dy*SPEED;
  var cx=Math.floor(nx), cy=Math.floor(ny);
  var pass = (mode==='ext') ? passExt(cx,cy) : passInt(cx,cy);
  if(!pass || doorOf[cx+','+cy]!=null){ /* a door is still a bump, never a slide-through */
    if(doorOf[cx+','+cy]!=null){ move(dx,dy); }
    return true; }
  FREEPOS.x=nx; FREEPOS.y=ny;
  if(cx!==px||cy!==py){ move(cx-px, cy-py); FREEPOS.x=nx; FREEPOS.y=ny; }
  else { PFACE=dirOf(dx,dy); PMOVING=true; PFRAME=(PFRAME+1)&3; refresh(); }
  slideKick();
  return true;
}

/* ---- 11. MOVEMENT. I-MOVE-YOU-MOVE: one player step = one world minute. ---- */
function move(dx,dy){
  if(RUN.phase==='talking'||RUN.phase==='combat'||RUN.phase==='done') return;
  /* you turn to face where you asked to go even when a wall stops you */
  musicKick();
  PFACE=dirOf(dx,dy); PFRAME=(PFRAME+1)&3; PMOVING=true;
  if(_PIDLE)clearTimeout(_PIDLE);
  _PIDLE=setTimeout(function(){ PMOVING=false; draw(); }, 320);
  var nx=px+dx, ny=py+dy;
  if(mode==='ext'){
    /* THE EDGE IS NOT A WALL ANY MORE. Step off this cell and the neighbouring
       district really loads: same valley, same generators, same seed. If there
       is nothing there (the rim of the map) you simply cannot go. */
    if(nx<0||ny<0||nx>=W||ny>=H){
      var ncx=CELL[0]+(nx<0?-1:nx>=W?1:0), ncy=CELL[1]+(ny<0?-1:ny>=H?1:0);
      var probe = WORLD ? WORLD.tile(ncx*T+(T>>1), ncy*T+(T>>1)) : null;
      if(!probe){ toast('The valley ends here.'); return; }
      loadCell(ncx,ncy);
      px = (nx<0)? W-1 : (nx>=W? 0 : px);
      py = (ny<0)? H-1 : (ny>=H? 0 : py);
      if(SOLIDG[py][px]){                      /* never land inside a wall */
        var got=false;
        for(var r=1;r<24&&!got;r++) for(var ddx=-r;ddx<=r&&!got;ddx++) for(var ddy=-r;ddy<=r&&!got;ddy++){
          var tx=px+ddx, ty=py+ddy;
          if(tx>=0&&ty>=0&&tx<W&&ty<H&&!SOLIDG[ty][tx]){ px=tx; py=ty; got=true; } }
      }
      buildSim(0);
      _footAt=null;   /* HOUSE SKINS: new cell, new footprints */
      toast('You crossed into the '+(CELLNAME||'valley')+'.');
      autoSave('cell');
      refresh(); draw(); return;
    }
    var d = doorOf[nx+','+ny];
    if(d!=null){
      /* YOU DO NOT WALK THROUGH A SHUT DOOR. First bump swings it open (the real
         9-frame clip, 2 beats); you are through once the leaf really is (frame>=5,
         the integration contract's own collision rule). */
      var k=doorKey(nx,ny);
      if(!doorPassable(k)){ openDoor(k); refresh(); return; }
      if(d===HOME && RT && RT.state.done && RUN.phase!=='home_after'){ backAt=[px,py]; enter(d); RUN.phase='home_after'; autoSave('home'); openPhone(); refresh(); draw(); return; }
      backAt=[px,py]; enter(d); autoSave('inside'); refresh(); draw(); return; }
    if(!passExt(nx,ny)) return; px=nx; py=ny;
  } else {
    if(nx===fpDoor[0] && ny===fpDoor[1]){
      var ik=doorKey(nx,ny);
      if(!doorPassable(ik)){ openDoor(ik); refresh(); return; }
      leave(); if(RUN.phase==='home_inside') RUN.phase='street';
      autoSave('outside'); refresh(); draw(); return; }
    if(!passInt(nx,ny)) return; px=nx; py=ny;
  }
  sfx(sfxGround(px,py));   /* HIS footstep, chosen by the ground (7/30) */
  if(WALKMODE==='SLIDE'){ SLIDE.on=true; SLIDE.fx=dx; SLIDE.fy=dy; SLIDE.t0=Date.now(); slideKick(); }
  if(SIM){ SIM.playerAt = (mode==='ext') ? [px,py] : null; SIM.step(); updateFaces(); }
  if(_toastLife>0 && --_toastLife===0) toast(null);
  /* the continuous body follows a committed step; freeNudge overwrites this
     straight after when IT is the one driving, so this only catches the cases
     where the grid moved underneath it (a door bump, a load, a teleport). */
  if(FREEPOS){ FREEPOS.x=px+0.5; FREEPOS.y=py+0.5; }
  refresh(); draw();
}

/* ---- 12. TALK. The real runtime view, rendered as thumb-sized options. ---- */
var TALKEL=document.getElementById('talk'), SPK=document.getElementById('spk'),
    SAYS=document.getElementById('says'), OPTS=document.getElementById('opts');
/* WHICH NODE THE PERSON IN FRONT OF YOU OWNS. A .bq entry condition stays true
   once it is true (S01's `open` is entry=stage>=10 forever), so the runtime can
   legitimately report several begin-able nodes at once. The person you are
   standing next to decides: take the available node whose TALK speaker matches
   whoever the quest is currently bound to, else the latest-authored one. */
function nodeSpeaker(id){
  var t = ((RT&&RT.Q.talks)||[]).filter(function(x){ return x.id===id; })[0];
  return t ? t.speaker : null;
}
function pickTalk(list){
  var p = CTX.quests._placed[QID], want = p && p.speaker;
  if(want) for(var i=0;i<list.length;i++) if(nodeSpeaker(list[i].node)===want) return list[i];
  return list[list.length-1];
}
function openTalk(){
  var t = talkables(); if(!t.length) return;
  var pickd = pickTalk(t);
  var v = BohemiaLoop.talkTo(CTX, pickd.questId, pickd.node);
  if(!v) return;
  RUN.phase='talking'; TALKEL.style.display='flex'; renderTalk(v);
}
function renderTalk(v){
  if(!v || v.ended){ closeTalk(); return; }
  SPK.textContent = (v.speaker||'').replace(/_/g,' ');
  /* THE PERSON IN FRONT OF YOU HAS A VOICE (8/11, SOUNDS lane). The run says
     WHO spoke and WHAT; the parent owns the voice, the AudioContext and the
     limiter, exactly as every other sound in this game works. Nothing here
     knows what a voice is. */
  try{ if(window.parent&&window.parent!==window&&v.says&&v.says.length)
    window.parent.postMessage({type:'BOHEMIA_VOICE', speaker:v.speaker||'',
                               text:v.says.join(' ')},'*'); }catch(_e){}
  /* THE FACE YOU ARE TALKING TO: the real face system's render, the same 64x64
     portrait combat and the city tab already show. Not an avatar letter. */
  var pf = CAST && CAST.portraits.looks[NPC_LOOK_SEED % Math.max(1,CAST.portraits.looks.length)];
  var slot=document.getElementById('spkface');
  if(slot){ var c2=slot.getContext('2d'); c2.imageSmoothingEnabled=false;
    c2.clearRect(0,0,slot.width,slot.height);
    if(pf){ slot.style.display='block'; c2.drawImage(pf,0,0,slot.width,slot.height); }
    else slot.style.display='none'; }
  SAYS.innerHTML='';
  (v.says||[]).forEach(function(s){ var p=document.createElement('p'); p.textContent=s; SAYS.appendChild(p); });
  (v.noverbs||[]).forEach(function(n){ var p=document.createElement('p'); p.className='nv';
    p.textContent='(you cannot say: '+n+')'; SAYS.appendChild(p); });
  OPTS.innerHTML='';
  (v.options||[]).forEach(function(o){
    var b=document.createElement('button'); b.textContent=o.text; if(o.silence) b.className='sil';
    b.addEventListener('click', function(){ renderTalk(RT.choose(o.i)); });
    OPTS.appendChild(b); });
  if(!(v.options||[]).length){
    var b=document.createElement('button'); b.id='talkcont'; b.textContent='CONTINUE';
    b.addEventListener('click', closeTalk); OPTS.appendChild(b); }
}
/* PEOPLE:RUNTIME */
/* ===========================================================================
   THE PEOPLE ON THE BLOCK ARE PEOPLE (7/31, PEOPLE lane).
   engine/bohemia_people.js derives WHO a scheduled body is from the same three
   numbers the body itself is derived from, so the identity survives the sim
   being thrown away and rebuilt on every save load. Everything below is
   RENDERING: not one fact on this card is invented here, and the NAME row says
   NOT NAMED YET because the named cast is Paolo's and its table ships empty.
   =========================================================================== */
var PEOPLE_MET = BohemiaPeople.makeLedger(null);   /* rides in the save blob */
var PERSON_OPEN = null;
/* HOW MANY EARNED NAMES THE SCREEN WILL EVER SHOW AT ONCE (PEOPLE:KNOWNNAMES).
   The viewport is only about four tiles either side of you so this is a
   backstop, not a normal condition - but a crowd of neighbours you all happen
   to know is exactly the case that would turn a good idea into nameplate soup,
   and the nearest few are the ones you would actually be looking at. */
var KNOWN_NAME_CAP = 4;
/* THE BLOCK'S OWN SEED, set by buildSim. NOT the world SEED (which is 7 for the
   whole valley) — keying people off that would hand house 3's second resident
   the same identity in every cell there is. */
var PEOPLE_SEED = 0;
/* THE BLOCK SEED FOR ANY CELL, by the same mix buildSim uses. */
function blockSeedFor(cx,cy){ return (SEED ^ (cx*73856093) ^ (cy*19349663)) >>> 0; }
/* WHOSE BLOCK NAMES THEM: a person is identified by where they LIVE, never by
   where they happen to be standing. A worker at the clinic is the same person as
   the neighbour in their own yard, so their key comes from their HOME cell - or
   you would ask somebody their name at work and be a stranger to them at home. */
function seedOfPerson(agent){
  return (agent && agent.visiting && agent.fromCell)
    ? blockSeedFor(agent.fromCell[0], agent.fromCell[1]) : PEOPLE_SEED;
}
function personFor(agent){
  var roster = (SIM && SIM.agents) ? SIM.agents : [agent];
  var sizes = {};
  roster.forEach(function(r){ var h=BohemiaPeople.seatOf(r).house; sizes[h]=(sizes[h]||0)+1; });
  var seed = seedOfPerson(agent);
  var key = BohemiaPeople.keyOf(seed, agent);
  return BohemiaPeople.personOf(seed, agent,
    { householdSize: sizes[BohemiaPeople.seatOf(agent).house],
      asked: PEOPLE_MET.asked(key) });
}
/* THE DAY YOU ARE ON. The meeting ledger remembers world-days, never wall-clock:
   a save has to mean the same thing on a device in another timezone (saveBlob's
   own rule), and the sim turn IS the world minute. */
function worldDay(){ return Math.floor((SIM?SIM.turn:0)/1440); }
/* OPENING a conversation is a meeting. RE-DRAWING the card after you ask their
   name is not, and counting it as one made asking somebody their name inflate how
   often you had met them - caught by the gate, on the real surface. */
function openPerson(agent){
  var who = personFor(agent);
  if(!who) return;
  /* meet() returns the record as it now stands, so the very meeting that makes
     it no longer the first time still reads FIRST TIME. */
  PEOPLE_MET.meet(who.key, worldDay());
  drawPerson(agent);
}
/* ---- THEY SAW YOU DO IT (8/12) -----------------------------------------------
   The whole point of a witness system, and the game has never once used it: somebody
   who was standing there when you did a thing should SAY SO. Everything this lane has
   built until now surfaces as a readout - a count, a rung, a colour. Information, not
   experience. This is the moment it becomes something that happens TO you.

   NOT ONE WORD OF IT IS WRITTEN HERE. The line they repeat is the quest's own @LOG for
   the stage you resolved - his sentence, in his voice, the same text the feed card
   shows. All this does is put it in the mouth of somebody who was close enough to have
   seen it happen.

   Weightless by construction: it reads RUN.sawList, which is a record of who was in
   reach, and moves no standing and touches no faction. */
function showRecognition(agent){
  var host=document.getElementById('idcard'); if(!host) return;
  var el=document.getElementById('recog');
  if(!el){ el=document.createElement('div'); el.id='recog'; }
  el.textContent=''; el.removeAttribute('style');
  if(el.parentNode!==host) host.appendChild(el);
  if(!RUN.sawList || !RUN.sawWhat) return;
  var w=null;
  for(var i=0;i<RUN.sawList.length;i++) if(RUN.sawList[i].id===agent.id){ w=RUN.sawList[i]; break; }
  if(!w) return;
  el.style.cssText='margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07)';
  var t=document.createElement('div');
  t.style.cssText='font:700 10px ui-monospace,monospace;letter-spacing:.08em;color:#e0a060';
  t.textContent = w.saw ? 'THEY SAW YOU DO IT' : 'THEY HEARD IT FROM INSIDE';
  var q=document.createElement('div');
  q.style.cssText='font:italic 12px/1.5 -apple-system,sans-serif;color:#cdbd8a;margin-top:3px';
  q.textContent='\u201c'+RUN.sawWhat+'\u201d';
  el.appendChild(t); el.appendChild(q);
}

/* ---- AND THEN THEY SAY SOMETHING ABOUT IT (8/13) ------------------------------
   showRecognition above puts the QUEST'S own @LOG line in a witness's mouth: his
   sentence, verbatim, about the one deed that just resolved. This is the other
   half, and it is the PERSON rather than the EVENT -- what they say to you now
   because of what you have done and where the two of you stand.

   NOT ONE FACT IS INVENTED HERE. Every field below is read out of a system that
   was already computing it and had nowhere to put it:
     saw / heard : RUN.sawList, which witnessResolution() fills with exactly who
                   was in reach and whether they were outdoors (SAW it) or behind
                   a wall (HEARD it). RUN.clout is the deed's own #tag.
     rung        : BohemiaStanding.opinionOf() over THIS person's own mind, run
                   through the module's own rungFor(). Per-person, not the faction
                   average the readout shows -- the person in front of you has
                   their own opinion and it is the one they speak with.
     met         : PEOPLE_MET.metState(), which lives on the ledger that owns the
                   bits, so no surface re-derives "have we met" for itself and
                   two screens can never disagree about the same person.
   All four are OPTIONAL. Anything the world has not produced comes back null and
   linesFor falls through to the ambient buckets, which is the honest answer: a
   stranger who has never heard of you talks about the weather.

   WHY IT IS HERE AND NOT IN THE MODULE: bohemia_people.js never reads the clock,
   the sim or the DOM (its own header rule, and the reason it runs in a gate at
   all). Handing it a plain object of four strings keeps that true. */
function reactionCtx(agent, who){
  var ctx = { saw:null, heard:null, rung:null, met:null };
  try { ctx.met = PEOPLE_MET.metState(who.key); } catch(_e){}
  /* WHAT THEY WATCHED YOU DO, AND THE WALL MATTERS. Outdoors within reach is
     SEEING; indoors within half reach is HEARING, and the two sets of lines are
     deliberately different -- the secondhand ones are vaguer and colder, because
     that is what secondhand knowledge is. */
  try {
    if(RUN.clout && RUN.sawList){
      for(var i=0;i<RUN.sawList.length;i++){
        if(RUN.sawList[i].id!==agent.id) continue;
        if(RUN.sawList[i].saw) ctx.saw = RUN.clout; else ctx.heard = RUN.clout;
        break;
      }
    }
  } catch(_e){}
  /* WHERE YOU STAND WITH THIS ONE PERSON. opinionOf sums the deeds THEY remember
     with THEIR own decay, so somebody who watched a reckless job last week and
     somebody who heard about it third-hand do not arrive at the same number. */
  try {
    if(typeof BohemiaStanding!=='undefined'){
      var minds = blockMinds(), mine = null;
      for(var k=0;k<minds.length;k++) if(minds[k].owner===agent.id){ mine=minds[k]; break; }
      if(mine && mine.deeds && mine.deeds.length){
        ctx.rung = BohemiaStanding.rungFor(
          BohemiaStanding.opinionOf(mine, 'PLAYER', (SIM?SIM.turn:0)|0));
      }
    }
  } catch(_e){}
  return ctx;
}

/* ---- WHO THEY RUN WITH (8/11) ------------------------------------------------
   Paolo picked 13 faction colours and 14 marks on 8/2 (FACTION_LOOK / FACTION_MOTIF),
   and the integration ledger has said "bodies are random colourways, not rank-dressed"
   ever since. The bodies on the street are REAL BAKED CHARACTERS -- re-costuming them
   is the clothes lane's pipeline, not mine to cut into. But the person you WALK UP TO
   can tell you, and that is NPC identity, which is this lane's own.

   NOTHING IS INVENTED AND NOTHING IS ASSIGNED HERE. Allegiance is derived by
   BohemiaAgents.factionOf() -- keyed to the SEAT so it survives a save, most people
   belong to nobody (AFFILIATED_RATE), and the split is even (gated, 50 claims). The
   colour and the mark are read out of his tables. If he retunes either, this follows.

   A person who runs with nobody says NOTHING rather than "unaffiliated": most of the
   valley is unaffiliated and a label on all of them is noise, not information. */
/* the faction a QUEST declares for the person standing on its placed tile. Read out
   of the quest's own @ROLE line; nothing is assigned here. */
function authoredFactionFor(agent){
  if(!agent||!agent.loc||!CTX||!CTX.quests) return null;
  var pl=[]; try{ pl=CTX.quests.placements()||[]; }catch(_e){ return null; }
  for(var i=0;i<pl.length;i++){
    var p=pl[i];
    if(p.x!==agent.loc.x||p.y!==agent.loc.y) continue;
    var rt=CTX.quests.get(p.questId);
    var Q=rt&&rt.Q; if(!Q) continue;
    var role=(Q.roles||[]).filter(function(r){ return r.name===p.speaker; })[0];
    if(!role) continue;
    var m=/faction\s*=\s*([A-Za-z_]+)/.exec(role.cond||'');
    if(m) return m[1];
  }
  return null;
}
/* WHO THIS PERSON RUNS WITH, in one place. Authored beats derived: if a quest
   placed them, the quest's own @ROLE faction= IS their faction; otherwise the
   ambient crowd answers from where they live and work. Two callers now depend on
   this (the allegiance line and the introduction), and two copies of it would
   have been two chances to disagree about the same person. */
function factionForPerson(agent){
  var fid = authoredFactionFor(agent);
  if(fid) return fid;
  if(typeof BohemiaAgents==='undefined' || !CTX || !CTX.factionBases) return null;
  if(typeof CELL==='undefined' || !CELL) return null;
  try { return BohemiaAgents.factionOf(agent, CELL, CTX.factionBases); }
  catch(_e){ return null; }
}
/* ---- THE SIXTEEN INTRODUCTIONS (8/12) ---------------------------------------
   Every faction dossier Paolo thumbed up on 8/2 has a WHEN YOU ASK THEIR NAME
   section and every one is a DIFFERENT MECHANIC. Until now the game did the same
   thing for all sixteen: one button, one full name, everybody. This is where his
   canon finally reaches the surface he plays.

   NOT ONE WORD OF IT IS WRITTEN HERE. engine/bohemia_introductions.js is baked
   from records/factions/*.md and refuses to build if a rule drifts off its
   dossier sentence. This function only supplies what the ENGINE already knows
   about the person -- their generated name, their role word, their work line --
   and asks the organ what the player has actually learned. */
/* WHAT YOU CALL SOMEBODY YOU ALREADY KNOW, from their key alone. Only ever used
   for the introducer, who by definition is somebody whose name you earned. */
function nameOfKey(key){
  var rows=tieRoster();
  for(var i=0;i<rows.length;i++){
    if(tieKeyOf(rows[i])!==key) continue;
    var p=personFor(rows[i].agent);
    return BohemiaPeople.nameOf(p) || BohemiaPeople.headingOf(p);
  }
  return 'SOMEBODY';
}
function introCtxFor(who){
  /* THE NAME BEHIND THE DOOR. The organ has to know the whole name to hand back a
     PIECE of it (a surname, a given name), so it is derived here whether or not
     the player has earned it -- exactly the same deterministic stream the card
     already uses, never a second pool. Nothing derived here is displayed unless
     the organ says the player learned it. */
  return { full:  who.name || BohemiaPeople.generatedName(who.key),
           trade: BohemiaPeople.ROLE_WORDS[who.role] || null,
           work:  (BohemiaPeople.workLineOf && BohemiaPeople.workLineOf(who)) || null };
}
/* HAS THE GROUP FORMED AN OPINION ABOUT YOU? The Blues rule, and the ONE unbuilt
   earning condition whose system already exists: "The personal name arrives only
   once you have done something the group has an opinion about - which means with
   the Blues the earned-name mechanic is gated by REPUTATION rather than by
   conversation" (records/factions/BOHEMIA_FACTION_BLUES.md, canon 8/2).

   AN OPINION, NOT AN APPROVAL. His sentence does not say they have to LIKE you, so
   this is standing OFF NEUTRAL in either direction -- a Blue who thinks you are a
   problem knows exactly who you are. Read off the same real FactionWorld the quest
   consequence line already reads; nothing new is computed. */
function groupHasAnOpinion(fid){
  if(!fid || !CTX || !CTX.factions) return false;
  var real=null, up=String(fid).toUpperCase();
  if(CTX.factions.factions.get(fid)) real=fid;
  else { var it=CTX.factions.factions.keys(), k;
         while(!(k=it.next()).done){ if(String(k.value).toUpperCase()===up){ real=k.value; break; } } }
  if(!real) return false;
  try { return CTX.factions.factions.get(real).standingWith('player') !== 0; }
  catch(_e){ return false; }
}
/* ---- WHO KNOWS WHO, ON THIS BLOCK (8/12) -------------------------------------
   engine/bohemia_ties.js reads the three foci the world already decided (roof, job
   site, outfit) and answers whether two people are acquainted. The run's job here
   is only to hand it the roster in the vocabulary the rest of this surface uses:
   the SAME faction answer factionForPerson gives, so the allegiance line, the
   introduction and the tie graph can never disagree about who somebody runs with.

   HONEST LIMIT, said out loud so nobody mistakes it for a fix: the roster is THIS
   BLOCK. Two Mob members twenty cells apart are not acquainted here, because the
   run only ever materialises one cell of the valley at a time. Household and job
   ties are unaffected (both are on-block by construction); a faction tie across
   blocks would need a valley-wide roster, which is a different lane's world model,
   not something to fake from here.

   AND IT IS DELIBERATELY NOT CACHED. The first version memoised this on
   (roster length + cell), which is wrong in the one way that matters: allegiance
   also changes when a QUEST places its cast, and a cached roster would then hold
   a different opinion about who somebody runs with than the allegiance line drawn
   two rows above it. That is the same two-systems-disagreeing bug D1 exists to
   catch, so the cache had to go rather than get a cleverer key. The cost is ~200
   cheap lookups per card on a fourteen-person block, which is nothing. */
function tieRoster(){
  if(!SIM || !SIM.agents) return [];
  return SIM.agents.map(function(a){
    return { id:a.id, seed:a.seed, job:a.job, faction:factionForPerson(a), agent:a };
  });
}
function tieKeyOf(row){ return BohemiaPeople.keyOf(seedOfPerson(row.agent), row.agent); }
/* the two sets the graph needs from the ledger: everybody you have MET, and the
   smaller set whose NAME you know. One bit each, both already persisted. */
function tieLedgerSets(){
  var met={}, known={}, all=PEOPLE_MET.serialize()||{};
  Object.keys(all).forEach(function(k){ met[k]=1; if(all[k].asked) known[k]=1; });
  return { met:met, known:known };
}
function introStateFor(who, fid){
  /* THREE of the eight earning conditions are honestly answerable today, and the
     organ treats every unanswered one as FALSE rather than assuming it met.
     hires/vouch/overheard arrive with the systems that own them; until then a
     Trades member stays SCAVENGER, which is the correct answer, not a gap. */
  var st = { asked:    !!PEOPLE_MET.asked(who.key),
             honest:   !!PEOPLE_MET.honest(who.key),
             standing: groupHasAnOpinion(fid) };
  /* THE TWO THIRD-PARTY CONDITIONS, finally answerable. Both were dead until this
     turn for one reason: nobody in the valley knew anybody. */
  if(typeof BohemiaTies!=='undefined' && typeof CELL!=='undefined' && CELL){
    var roster=tieRoster(), sets=tieLedgerSets();
    st.vouchedBy   = BohemiaTies.vouchFor(who.key, roster, CELL,
                       { keyOf:tieKeyOf, known:sets.known });
    st.overheardBy = BohemiaTies.overheardFrom(who.key, roster, CELL,
                       { keyOf:tieKeyOf, met:sets.met });
    st.vouched   = !!st.vouchedBy;
    st.overheard = !!st.overheardBy;
    /* what THEY could open for you, for the factions whose canon says they do
       (COLORFUL: "introduced onward to three people"). Counted, never named --
     you do not learn three strangers' names by being told they exist. */
    st.onward = BohemiaTies.onwardFrom(who.key, roster, CELL,
                  { keyOf:tieKeyOf, n:3, met:sets.met }).length;
  }
  return st;
}
function introFor(agent, who){
  if(typeof BohemiaIntros==='undefined') return null;
  var fid = factionForPerson(agent);

  var ctx = introCtxFor(who), st = introStateFor(who, fid);
  return { rule:rule, ctx:ctx, st:st, m:BohemiaIntros.meeting(rule, ctx, st) };
}
/* WHAT THE CARD SAYS YOU KNOW. bohemia_people.js's NAME row is the old uniform
   answer -- asked, therefore named -- and once the organ can hand back a SURNAME
   or a TRADE instead, leaving that row alone would put two different answers to
   the same question on the same card. That is the exact class of bug this lane
   shipped on 8/11 (two numbers, both right, one card), so the row is rewritten
   from the organ rather than sat next to it. */
function applyIntroToCard(rows, intro){
  if(!intro) return rows;
  var m=intro.m, out=[];
  rows.forEach(function(r){
    if(r.label!=='NAME'){ out.push(r); return; }
    if(m.isName){ out.push({label:'NAME', value:m.shown}); return; }
    if(m.shown){ out.push({label:'KNOWN AS', value:m.shown, soft:true}); return; }
    /* FROM HERE THE PLAYER HAS NOTHING, and the row must never fall back to
       people.js's answer: it hands over the full name the moment the ledger says
       you asked, and with the Cartel you asked and were refused. Printing it would
       show the exact name the organ just said you will never get. */
    if(m.used){ out.push({label:'NAME', value:'THEY USED YOURS. YOU NEVER GAVE IT.', soft:true}); return; }
    if(m.opener==='third-party'){ out.push({label:'NAME', value:'NOBODY HAS INTRODUCED YOU', soft:true}); return; }
    out.push({label:'NAME', soft:true,
              value: intro.st.asked ? 'YOU ASKED. YOU DID NOT GET IT.' : 'YOU HAVE NOT ASKED'});
  });
  /* WHO DID IT FOR YOU. A vouch that does not say whose word it was is just a
     flag flipping; the whole beat is that somebody you know STAKED SOMETHING. The
     introducer's name is one you already earned, so printing it gives nothing
     away. */
  var st=intro.st||{};
  if(m.isName && st.vouchedBy)
    out.push({label:'INTRODUCED BY', value:nameOfKey(st.vouchedBy.by)
                                    +' \u00b7 '+BohemiaTies.viaWords(st.vouchedBy.via)});
  else if(m.isName && st.overheardBy)
    out.push({label:'YOU HEARD IT FROM', value:nameOfKey(st.overheardBy.by)
                                    +' \u00b7 '+BohemiaTies.viaWords(st.overheardBy.via)});
  if(m.opens && st.onward)
    out.push({label:'CAN INTRODUCE YOU TO', value:st.onward+(st.onward===1?' PERSON':' PEOPLE')
                                    +' YOU HAVE NOT MET'});
  if(m.asks) out.push({label:'THEY ASKED YOU', value:m.asks});
  if(m.blocked) out.push({label:'WILL NOT SAY', value:m.blocked});
  if(m.cost) out.push({label:'AND', value:m.cost});
  if(m.remembers) out.push({label:'AND', value:'THEY WILL NOT FORGET YOU'});
  /* canon, AMALGAMATION: it must land as a haunting and NOTHING ON SCREEN MAY
     EXPLAIN IT. The organ blanks its own why; the hint line is suppressed here
     for the same reason, because a route out would be an explanation too. */
  if(!m.isName && m.next && m.explain) out.push({label:'HOW YOU GET THE REST', value:m.next});
  return out;
}

/* ---- WHAT THEY WANT FROM YOU (8/12) -----------------------------------------
   The last two turns built a door (sixteen ways to learn a name) and a lock (the
   Mob will not be asked). Walk through it and there was NOTHING IN THERE. This is
   what is in there, and every word of it is his, off the cards he thumbed up on
   8/2: what the outfit wants, what it holds, what it pays in, what it refuses,
   and whether it moves first.

   HOW FAR IN YOU ARE is Lave & Wenger's gradient, walked off a COUNT -- how many
   times you actually did the thing they want (save.meta.gave, incremented by the
   world bridge on an authored @DO faction X +N). Not standing. Standing is what
   they THINK of you and you can be well liked by an outfit you never turned up
   for; those are two different questions and this is the second one.

   OWNS ITS OWN NODE for the reason the allegiance line had to learn the hard way
   on 8/11: anything that writes into #idcard before cardFor() runs is wiped. */
/* HOW MANY TIMES YOU DID WHAT THIS OUTFIT WANTED. The lookup used to live here and
   it has moved into the organ, because the run is no longer the only reader: the
   world bridge writes the same number and the act below writes it too. The THREE
   SPELLINGS of a faction get folded in one place now instead of three -- they have
   already bitten this codebase three times. */
function gaveFor(fid){
  try { return BohemiaBelonging.gaveOf(CTX && CTX.save, fid); } catch(_e){ return 0; }
}
/* ARE YOU ON THEIR GROUND? Their base is a real district on the real map, and the
   world already declares how far a base's pull carries -- bohemia_agents.REACH_CELLS,
   the same number that decides who BELONGS to them. No new dial is minted here: it
   is [PENDING Paolo] on that module and if he retunes it, this follows. Returns
   null when the outfit has no base placed at all, which is not the same as being
   far from one and must not read as a refusal. */
function theirGround(fid){
  if(!fid || !CTX || !CTX.factionBases || typeof CELL==='undefined' || !CELL) return null;
  var want=String(fid).toUpperCase().replace(/[\s_]/g,''), base=null;
  for(var k in CTX.factionBases){
    if(String(k).toUpperCase().replace(/[\s_]/g,'')===want){ base=CTX.factionBases[k]; break; }
  }
  if(!base || base.x==null) return null;
  var reach=(typeof BohemiaAgents!=='undefined' && BohemiaAgents.REACH_CELLS) || 12;
  var d=Math.abs(base.x-CELL[0])+Math.abs(base.y-CELL[1]);
  return { base:base, dist:d, on:d<=reach, reach:reach };
}
/* HAVE YOU BEEN ANYWHERE THEY HAVE NOT HEARD ABOUT? Count the cells you have stood
   in against the count at the last time you told this outfit. You have to go and
   look, and come back. */
function seenCount(){
  try { return Object.keys((CTX.save.meta||{}).seen||{}).length; } catch(_e){ return 0; }
}
function toldCount(fid){
  try {
    var t=(CTX.save.meta||{}).told||{}, want=String(fid).toUpperCase().replace(/[\s_]/g,'');
    for(var k in t) if(String(k).toUpperCase().replace(/[\s_]/g,'')===want) return t[k]|0;
  } catch(_e){}
  return 0;
}
function actStateFor(fid){
  var g=theirGround(fid);
  return { gaveToday:      gaveTodayFor(fid),
           /* no base placed is not "far away": leave it unblocked rather than
              refusing for a reason that is really a gap in the world. */
           onTheirGround:  g ? g.on : true,
           somethingToTell: seenCount() > toldCount(fid) };
}
function gaveTodayFor(fid){
  try { return BohemiaBelonging.gaveDayOf(CTX && CTX.save, fid) === worldDay(); }
  catch(_e){ return false; }
}
function showBargain(host, fid){
  var el=document.getElementById('bargain');
  if(!el){ el=document.createElement('div'); el.id='bargain'; }
  el.textContent=''; el.removeAttribute('style');
  if(el.parentNode!==host) host.appendChild(el);
  if(typeof BohemiaBelonging==='undefined' || !fid) return;
  var rule=BohemiaBelonging.ruleOf(fid);
  var gave=gaveFor(fid);
  var b=BohemiaBelonging.bargain(rule, gave);
  if(!b) return;
  el.style.cssText='margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07);'
    +'font:11px/1.5 ui-monospace,monospace;color:#8b8272';
  function line(k,v,col){
    var d=document.createElement('div');
    d.style.cssText='display:flex;gap:7px;margin-top:2px';
    var a=document.createElement('span');
    a.style.cssText='flex:none;width:88px;letter-spacing:.05em;opacity:.75';
    a.textContent=k;
    var c=document.createElement('span');
    c.style.cssText='flex:1'+(col?(';color:'+col):'');
    c.textContent=v; d.appendChild(a); d.appendChild(c); el.appendChild(d);
  }
  line('THEY WANT', b.wantWord + (b.noOffer?'' : ''), '#cdbd8a');
  if(b.holds) line('THEY HOLD', b.holds.split('.')[0]);
  if(b.pays) line('PAID IN', b.pays);
  if(b.refuses) line('WILL NOT TAKE', b.refuses, '#e0a060');
  if(b.theyFirst) line('CAREFUL', 'THEY HELP YOU BEFORE YOU AGREE TO ANYTHING', '#e0a060');
  if(b.rung) line('YOU ARE', b.rung.word + (b.next? (' \u00b7 '+b.next.more+' MORE TO '+b.next.rung.word):''));
  var why=BohemiaBelonging.noActBecause(rule, actStateFor(fid));
  if(why) line('', why);
  /* AND WHERE THEIR GROUND ACTUALLY IS, because "go to them" without a direction
     is the hunting he banned. Read off the real base coords the world placed. */
  var g=theirGround(fid);
  if(g && !g.on){
    var dx=g.base.x-CELL[0], dy=g.base.y-CELL[1];
    var dir=(Math.abs(dy)>=Math.abs(dx)? (dy<0?'NORTH':'SOUTH') : (dx<0?'WEST':'EAST'));
    line('THEIR GROUND', g.dist+' CELLS ' + dir);
  }
}

/* ---- 13. THE COMBAT HANDOFF. The existing bridge, nothing new:
   this frame -> parent alpha -> BOHEMIA_ENCOUNTER -> the combat frame,
   and BOHEMIA_COMBAT_END all the way back. ---- */
window.__RUN_SENT = window.__RUN_SENT || [];
var HAND=document.getElementById('hand'), HANDSUB=document.getElementById('handsub'),
    HANDBTN=document.getElementById('handbtn'), HANDBIG=document.getElementById('handbig');
function bridgePost(msg){
  /* THE LOG CREATES ITSELF. `window.__RUN_SENT = []` is declared a thousand
     lines below this, at the very bottom of the file, while bridgePost is a
     hoisted function that boot-time code can and now does call - so the first
     caller found the array undefined and took the whole run's script down with
     it. The log is a gate affordance; it must never be able to break the game
     it is watching. */
  (window.__RUN_SENT = window.__RUN_SENT || []).push(msg);
  try{ if(window.parent) window.parent.postMessage(msg,'*'); }catch(_e){}
}
function goLoud(tag){
  RUN.phase='combat';
  /* roster size off the loudness the quest declared: reckless draws three,
     risky draws two. The combat frame owns everything else about the fight. */
  var n = (tag==='reckless') ? 3 : 2, roster=[];
  for(var i=0;i<n;i++) roster.push({ hp:60, arch:'human' });
  RUN.sentEncounter = { type:'BOHEMIA_RUN_ENCOUNTER', packageId:1, roster:roster,
                        questId:QID, clout:tag, playerHP:100 };
  HANDBIG.textContent='IT GOES LOUD';
  HANDSUB.textContent='Sparks, a crowd, and a message sent up. Somebody came to see who did it.';
  HANDBTN.style.display='none';
  HAND.style.display='flex';
  bridgePost(RUN.sentEncounter);
  /* if nothing answers (this page opened on its own, outside the alpha) say so
     out loud rather than pretending a fight happened. */

/* ---- 14. THE PHONE. The post is BUILT BY THE ENGINE (buildFeed over the real
   ledger the quest wrote), never hand-written here. ---- */
/* ---- WHO ACTUALLY SAW IT (8/12) ---------------------------------------------
   The witness organ - bohemia_standing.js (35 gated claims) and bohemia_deeds.js (27) -
   has been built, gated and inlined in this page since 8/9, and NOTHING HAS EVER CALLED
   IT. The consequence card showed WORD CARRIED n TILES, which is a derived radius: the
   distance the clout tag says a thing of that loudness travels. True, and not the same
   claim as "these people saw you".

   So the block gets minds. Not a new population - THE PEOPLE ALREADY STANDING THERE are
   the minds, keyed by their own id, given the one array bohemia_standing asks for. The
   deed is published at the resolving tile with the reach and the retelling budget the
   quest's own clout tag earned, and only the faction the act actually touched records
   it, which is how a Red standing in the same street correctly remembers nothing.

   DEED_WEIGHT is filled from HIS OWN CORPUS at first use (loadCorpus over the canon
   quests this page already carries), so every weight traces to a @DO faction line he
   wrote. Nothing is invented and nothing is authored here. */
var MINDS = null, DEEDS_READY = false;
function blockMinds(){
  var roster = (SIM && SIM.agents) ? SIM.agents : [];
  if(!MINDS || MINDS.length !== roster.length){
    MINDS = roster.map(function(a){ return { owner:a.id, deeds:[] }; });
  }
  return MINDS;
}
function whereOf(id){
  var roster = (SIM && SIM.agents) ? SIM.agents : [];
  for(var i=0;i<roster.length;i++) if(roster[i].id===id) return roster[i].loc||null;
  return null;
}
function factionOfOwner(id){
  var roster = (SIM && SIM.agents) ? SIM.agents : [];
  for(var i=0;i<roster.length;i++){
    if(roster[i].id!==id) continue;
    var a=roster[i];
    var f = authoredFactionFor(a);
    if(f) return String(f).toUpperCase();
    try { f = BohemiaAgents.factionOf(a, CELL, CTX.factionBases); } catch(_e){ f=null; }
    return f ? String(f).toUpperCase() : null;
  }
  return null;
}
function witnessResolution(){
  if(typeof BohemiaDeeds==='undefined' || typeof BohemiaStanding==='undefined') return;
  if(!RT || !RT.Q) return;
  try{
    if(!DEEDS_READY){
      BohemiaDeeds.loadCorpus((window.CANON_QUESTS||[]).map(function(src,i){
        return { id:'C'+i, src:src }; }));
      DEEDS_READY = true;
    }
    var st = RT.Q.stages.filter(function(x){ return x.n===RT.state.stage; })[0];
    if(!st) return;
    var rows = BohemiaDeeds.scanQuest(BQ.serialize(RT.Q), RT.Q.id)
                 .filter(function(r){ return r.stage===st.n; });
    if(!rows.length) return;
    var res = BohemiaDeeds.publish(blockMinds(), SIM.turn|0, 'PLAYER', rows,
                                   px, py, whereOf, factionOfOwner);
    /* TWO DIFFERENT NUMBERS, AND THE CARD MUST NOT CONFUSE THEM. publish() is
       faction-scoped ON PURPOSE - a Red standing in the street genuinely does not care
       who buys seed, so only the faction an act actually touched records an opinion of
       it. That is who FORMED A VIEW, and on this block it can honestly be zero.
       "N people saw it" is a different, physical claim: who was close enough. So it is
       counted as what the English actually says - everybody within the reach the deed's
       own clout tag earned - and the faction lines underneath carry the opinion half.
       The first cut printed the opinion count under the words "PEOPLE SAW IT" and read
       as broken when the mechanism was right. */
    var reach = BohemiaDeeds.reachOf(rows[0].clout || null);
    /* WHO COULD ACTUALLY HAVE KNOWN, and it took two wrong cuts to get here.
       CUT 1 counted every agent within reach, including everybody ASLEEP AT HOME - the
       probe caught a "witness" whose own card read ASLEEP AT HOME quoting what they had
       just seen. Obviously wrong.
       CUT 2 counted only SIM.outAgents(), which is honest and too strict: if you cut a
       live line with sparks and a crowd at half seven, the neighbour in bed knows. A
       wall does not block that, it WEAKENS it.
       SO: outdoors hears it at full reach, indoors at HALF - one uniform physical rule
       rather than a list of which tiers wake people, and it lets the loudness axis do
       the work it already earned. A #quiet fix (reach 7) barely carries indoors at all;
       a #reckless one (24) gets through walls twelve tiles out. */
    var out = (SIM && SIM.outAgents) ? SIM.outAgents() : [];
    var outIds = {}; for(var oi=0; oi<out.length; oi++) outIds[out[oi].id]=1;
    var eyes = 0, roster = (SIM && SIM.agents) ? SIM.agents : [];
    function heard(a){
      var q=a.loc; if(!q) return false;
      var d=Math.abs(q.x-px)+Math.abs(q.y-py);
      return d <= (outIds[a.id] ? reach : reach/2);
    }
    for(var i=0;i<roster.length;i++) if(heard(roster[i])) eyes++;
    RUN.witnesses = eyes;
    RUN.opinions  = res.witnesses;
    /* WHO, not just how many. The deed records inside publish() are faction-scoped on
       purpose, so they cannot answer "were YOU there" for a bystander whose faction the
       act never touched. This is the physical fact and nothing else: the ids of everyone
       close enough to see it, and the quest's own @LOG line for what they saw. It is
       weightless - it moves no standing and touches no faction - so recording it cannot
       disturb zero-sum. */
    RUN.sawList = [];
    /* and remember WHICH, because "they saw you" is the wrong sentence for somebody who
       was asleep inside and heard it through a wall. The probe caught exactly that card. */
    for(var k=0;k<roster.length;k++){
      if(!heard(roster[k])) continue;
      RUN.sawList.push({ id: roster[k].id, saw: !!outIds[roster[k].id] });
    }
    RUN.sawWhat = (st.log||'').replace(/^\[stage \d+\]\s*/,'');
  }catch(_e){ /* a demo must never die because nobody was looking */ }
}

/* ---- THE CONSEQUENCE LINE (8/9, closes the integration ledger's oldest PARTIAL) ----
   "factions / world bridge | PARTIAL | quest outcomes really move faction standing,
   but nothing in the run SHOWS it" has sat in records/BOHEMIA_RUN_INTEGRATION_LEDGER
   since 7/26. Four days of reputation work move real numbers a player never sees.
   NOTHING NEW IS COMPUTED HERE. Three things the run already had and never rendered:
     - which factions this quest moved, and the rung they now sit on, read straight off
       the REAL FactionWorld that the world bridge already moved when it resolved
     - who it stirred up (@DO faction_posture, wired 8/7)
     - HOW FAR THE WORD CARRIED, from the clout tag the quest tagged ITSELF with
       (bohemia_deeds, 8/6): #quiet reaches 7 tiles, #reckless 24
   THE RUN LANE'S JOB IS INTEGRATION, NOT FEATURES (Paolo 7/26): "the measure of the
   lane is what is finally IN it that we already made." */
function questConsequence(rt, cloutTag){
  if(!rt || !rt.state || !CTX || !CTX.factions) return null;
  var F = BohemiaEngine.Factions, bits = [];
  function realId(fid){
    if(CTX.factions.factions.get(fid)) return fid;
    var up=String(fid).toUpperCase(), it=CTX.factions.factions.keys(), k;
    while(!(k=it.next()).done){ if(String(k.value).toUpperCase()===up) return k.value; }
    return null;
  }
  var fac = rt.state.faction || {};
  Object.keys(fac).forEach(function(fid){
    var d = fac[fid]; if(!d) return;
    var real = realId(fid); if(!real) return;
    var now = CTX.factions.factions.get(real).standingWith('player');
    bits.push({ txt: real.toUpperCase()+' '+(d>0?'+':'')+d+' \u00b7 '+F.rungOf(now), good: d>0 });
  });
  var post = rt.state.posture || {};
  Object.keys(post).forEach(function(fid){
    if(!post[fid]) return;
    var real = realId(fid); if(!real) return;
    bits.push({ txt: real.toUpperCase()+' STIRRED UP', good:false });
  });
  var reach = null;
  try { reach = BohemiaDeeds.reachOf(cloutTag||null); } catch(_e){}
  if(!bits.length && reach==null) return null;

  var box=document.createElement('div');
  box.style.cssText='border-top:1px solid rgba(255,255,255,.06);margin-top:5px;padding-top:5px';
  if(reach!=null){
    var r=document.createElement('div');
    r.style.cssText='font:10px ui-monospace,monospace;color:#6c614f;letter-spacing:.5px';
    /* ZERO IS A REAL ANSWER HERE, NOT A BROKEN COUNTER. Resolve something quietly on
       an empty street at an hour when the block is asleep and the honest count IS
       nobody - which is exactly what the run already tells the player in its own words
       ("Done, and nobody heard it"). So it says NOBODY rather than printing a 0 that
       reads like a bug. */
    r.textContent = (RUN.witnesses==null)
      ? ('WORD CARRIED '+reach+' TILES')
      : ((RUN.witnesses===0 ? 'NOBODY SAW IT'
          : RUN.witnesses + (RUN.witnesses===1?' PERSON SAW IT':' PEOPLE SAW IT'))
         + ' \u00b7 IT CARRIED ' + reach + ' TILES');
    box.appendChild(r);
  }
  bits.forEach(function(bt){
    var d=document.createElement('div');
    d.style.cssText='font:600 11px ui-monospace,monospace;margin-top:2px;color:'
      +(bt.good?'var(--good)':'#e0a060');
    d.textContent=bt.txt;
    box.appendChild(d);
  });
  return box;
}

/* ===========================================================================
   14c. SAVE / LOAD — ONE PORTABLE BLOB.
   Ruled 7/26 by Paolo, twice, and built exactly to those two rulings:
     laws/BOHEMIA_ADDENDUM_SAVES_AND_CLOUD_7_26_26.md
       "BOTH kinds": sleep saves AND free manual saves AND a quiet autosave, all
       coexisting. ONE serializable, versioned, device-agnostic package;
       everything about the player's game in it; NOTHING device-specific in it;
       no system keeps its own private side-channel; version from day one and
       loaders migrate old versions forward, never reject them; export/import a
       save code so it travels between devices with no server (phase 1).
     laws/BOHEMIA_ADDENDUM_DEATH_IS_A_RELOAD_7_26_26.md
       death loads the CLOSEST PREVIOUS SAVE. Never a reset, never permadeath.

   THE BLOB is the engine's own versioned save (E.Save via BohemiaLoop) plus the
   run's surface state, inside ONE envelope that is itself versioned. The music
   toggle is deliberately NOT in it: that is a device preference and the law says
   device preferences never travel in the save.
   =========================================================================== */
var SAVE_ENV_VERSION=1, SAVE_KEY='bohemia.save.v1', SAVE_KEEP=6;
function saveBlob(label){
  return { env:SAVE_ENV_VERSION, kind:'BOHEMIA_SAVE', label:label||'save',
    /* stamped from the world's own clock, never wall-clock: a save has to mean
       the same thing on a device in another timezone */
    beat: CTX.clock ? CTX.clock.snapshot().beat : 0,
    step: SIM ? SIM.turn : 0,
    engine: JSON.parse(BohemiaLoop.captureSave(CTX)),
    run: { mode:mode, px:px, py:py, curHouse:curHouse, backAt:backAt&&backAt.slice(),
           phase:RUN.phase, outcome:RUN.outcome, clout:RUN.clout,
           combat:RUN.combatOutcome, rebound:rebound,
           doors:JSON.parse(JSON.stringify(DOORST)),
           /* PEOPLE:SAVE */met:PEOPLE_MET.serialize(),/* /PEOPLE:SAVE */
           npc:(function(){ var p=CTX.quests._placed[QID];
             return p?{x:p.x,y:p.y,speaker:p.speaker,channel:p.channel}:null; })() } };
}
/* loaders migrate forward, never reject (the law's own words) */
function migrateBlob(b){
  if(!b||b.kind!=='BOHEMIA_SAVE') return null;
  var v=b.env||1;
  /* v1 is current; each future bump adds one step here and never a rejection */
  while(v<SAVE_ENV_VERSION){ v++; b.env=v; }
  return b;
}
function applyBlob(b){
  b=migrateBlob(b); if(!b) return false;
  try{
    CTX = BohemiaLoop.boot({ saveText: JSON.stringify(b.engine) });
    RT = QID ? CTX.quests.get(QID) : null;
    if(!RT && S01_TEXT){ CTX.quests.place(S01_TEXT,{x:LINEMAN_AT[0],y:LINEMAN_AT[1],channel:'inperson',speaker:'lineman'}); RT=CTX.quests.get(QID); }
    var pl=b.run.npc;
    if(pl) CTX.quests.place(QID,{x:pl.x,y:pl.y,channel:pl.channel||'inperson',speaker:pl.speaker});
    mode=b.run.mode; px=b.run.px; py=b.run.py; backAt=b.run.backAt?b.run.backAt.slice():null;
    rebound=!!b.run.rebound;
    RUN.phase=b.run.phase; RUN.outcome=b.run.outcome; RUN.clout=b.run.clout;
    RUN.combatOutcome=b.run.combat||null;
    DOORST=b.run.doors||{};
    /* PEOPLE:LOAD */
    /* WHO YOU HAVE MET SURVIVES THE LOAD. The bodies do not survive it — the
       block below rebuilds every agent from the seed — which is exactly why the
       ledger is keyed by DERIVED identity and never by an agent object. */
    PEOPLE_MET = BohemiaPeople.makeLedger(b.run.met || null);
    /* /PEOPLE:LOAD */
    if(b.run.curHouse>=0){ var keepPX=px, keepPY=py; enter(b.run.curHouse); px=keepPX; py=keepPY; }
    else { curHouse=-1; fp=null; fpDoor=null; }
    /* the block sim is deterministic from the seed, so a save stores HOW FAR it
       ran, not a dump of every body: re-step it to the same world minute. */
    if(SIM){ try{ var _a=BohemiaAgents.agentsForBlock(SEED,feet,[],fpOf);
        SIM=BohemiaAgents.makeSim(res,feet,_a,{fpOf:fpOf,doorOf:doorOf,startTurn:0});
        SIM.playerAt=(mode==='ext')?[px,py]:null;
        for(var i=0;i<(b.step||0);i++)SIM.step();
        FACES={}; _APOS={}; updateFaces(); }catch(_e){} }
    PHONE.style.display='none'; TALKEL.style.display='none'; HAND.style.display='none';
    refresh(); draw(); return true;
  }catch(e){ return false; }
}
function saveSlots(){
  try{ var raw=localStorage.getItem(SAVE_KEY); if(!raw) return [];
    var a=JSON.parse(raw); return Array.isArray(a)?a:[]; }catch(_e){ return []; }
}
function writeSave(label){
  var a=saveSlots(); a.unshift(saveBlob(label));
  while(a.length>SAVE_KEEP) a.pop();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(a)); }catch(_e){}
  return a[0];
}

/* NAV CLUSTER (7/27): four buttons became eight. The run's movement already
   spoke 8 - dirOf() has always returned SE/NE/SW/NW and DIRS8 has been sitting
   there - only the BUTTONS were four. */
var NAV8=[['u',0,-1],['ne',1,-1],['r',1,0],['se',1,1],['d',0,1],['sw',-1,1],['l',-1,0],['nw',-1,-1]];
NAV8.forEach(function(e){ var id=e[0], dx=e[1], dy=e[2];
  var b=document.getElementById('b'+id); if(!b) return;
  /* NO CORNER SQUEEZE: a diagonal through two solid orthogonal neighbours would
     let you slip between two building corners into a sealed yard. Turning
     diagonals on means owning that rule, so the step is refused unless at least
     one of the two sides is open. */
  var go=function(){
    if(dx&&dy&&mode==='ext'&&typeof SOLIDG!=='undefined'&&SOLIDG){
      var a=SOLIDG[py]&&SOLIDG[py][px+dx], c=SOLIDG[py+dy]&&SOLIDG[py+dy][px];
      if(a&&c){ PFACE=dirOf(dx,dy); draw(); return; }
    }
    if(FREEPOS && !freeSnapped()) freeNudge(dx,dy); else move(dx,dy); };
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); holdStop(); go();
    HOLD={ t:setTimeout(function(){ HOLD.i=setInterval(go, (FREEPOS&&!freeSnapped())?40:110); },220), i:0 }; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ b.addEventListener(ev, holdStop); });
});
window.addEventListener('blur', holdStop);
document.addEventListener('keydown', function(e){ var k=e.key;
  if(k==='ArrowUp'||k==='w') move(0,-1); else if(k==='ArrowDown'||k==='s') move(0,1);
  else if(k==='ArrowLeft'||k==='a') move(-1,0); else if(k==='ArrowRight'||k==='d') move(1,0);
  else return; e.preventDefault(); });
cv.addEventListener('click', function(e){
  var r=cv.getBoundingClientRect(), dx=(e.clientX-r.left)-r.width/2, dy=(e.clientY-r.top)-r.height/2;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0); else move(0,dy>0?1:-1);
});

/* FULL PIXEL QUALITY (Paolo 7/31, clause B1: "WHY WHEN I ZOOM IN ARE ALL THE
   QUALITY OF THE PIXELS OF THE TILES SO DOGSHIT??? WHY IS THE PIXEL QUALITY NOT
   AT FULL BRO WTF").
   THIS LINE WAS THE ANSWER. It set the canvas BACKING STORE to CSS pixels and
   ignored devicePixelRatio, so on his phone (DPR 3) a 390x795 buffer was stretched
   by the browser across 1170x2385 real pixels -- every single pixel of his art
   blown up 3x with the browser's own smoothing, which no imageSmoothingEnabled=false
   inside the canvas can undo because the blur happens AFTER, on the way to the
   screen. That is exactly what "not at full quality" looks like.
   The buffer is now real device pixels, so one art pixel can land on one screen
   pixel. Law: laws/BOHEMIA_THE_BUILT_WORLD_LAW_7_31_26.md B1. */
var DPR = Math.max(1, Math.min(4, Math.round(window.devicePixelRatio || 1)));
function fit(){
  DPR = Math.max(1, Math.min(4, Math.round(window.devicePixelRatio || 1)));
  cv.width  = Math.round(cv.clientWidth  * DPR);
  cv.height = Math.round(cv.clientHeight * DPR);
  cv.style.width = cv.clientWidth + 'px';
  draw();
}
window.addEventListener('resize', fit);
refresh(); fit(); updateFaces();
askForCast();   /* the real bodies, straight off the rig Paolo built */
autoSave('start');   /* death is a reload: there is always a save to land on */
sfx('come_up');   /* HIS 8/16b, 4 of 5, all his own instruments. The other
        half of the sleep he swept five of five. */
toast('You woke up in your own house. Walk out the front door.');

/* ---- read-only introspection for gates/run_gate.js. Actions go through the
   real buttons; this only REPORTS where things are. ---- */
window.__RUN = {
  state: function(){ return { mode:mode, px:px, py:py, phase:RUN.phase, home:HOME,
    homeDoor:HOME_DOOR, lineman:LINEMAN_AT, fixer:FIXER_AT, curHouse:curHouse,
    questDone: !!(RT&&RT.state.done), outcome:RUN.outcome, clout:RUN.clout,
    stage: RT?RT.state.stage:null, sent: window.__RUN_SENT.slice(),
    combat: RUN.combatOutcome,
    npc: (function(){ var n=questNpcTile(); return n?[n.x,n.y]:null; })() }; },
  grid: function(){ var a=[], c=[];
    for(var y=0;y<H;y++){ var r=[], q=[]; for(var x=0;x<W;x++){ r.push(passExt(x,y)); q.push(G[y][x]); }
      a.push(r); c.push(q); }
    /* CODES, so a gate or a shot can find a surface by what it IS rather than by
       guessing coordinates. 4 is the community wall, 5 the gate mouth. Reports only. */
    return { W:W, H:H, pass:a, code:c, doorOf:doorOf }; },
  interior: function(){ if(!fp) return null; var a=[];
    for(var y=0;y<fp.H;y++){ var r=[]; for(var x=0;x<fp.W;x++) r.push(passInt(x,y)); a.push(r); }
    return { W:fp.W, H:fp.H, door:fpDoor, pass:a }; },
  talkables: function(){ return talkables(); },
  doors: function(){ return { clips:DOOR_IMGS.length, frames:DOOR_ANIM.framesPerClip,
    tileW:DOOR_ANIM.tileW, tileH:DOOR_ANIM.tileH, version:DOOR_ANIM.version,
    state:JSON.parse(JSON.stringify(DOORST)) }; },
  music: function(){ return MUSIC_ON; },
  /* the sentence, for gates/run_gate.js: what ONE button is offering right now,
     what the world did the last time time was spent, and how walking feels. */
  verb: function(){ return VERB ? { verb:VERB.verb, label:VERB.label } : null; },
  /* PEOPLE:DBG */
  /* WHO IS ON THIS BLOCK, as the identity layer sees them. Reports, never acts. */
  people: function(){
    if(!SIM) return null;
    var out = SIM.agents.map(function(a){
      var p = personFor(a);
      return { key:p.key, id:a.id, role:p.role, tier:p.tier, name:BohemiaPeople.nameOf(p),
               asked:PEOPLE_MET.asked(p.key),
               heading:BohemiaPeople.headingOf(p), seat:BohemiaPeople.seatLineOf(p),
               /* THE SIXTEEN INTRODUCTIONS, as the surface actually resolves them.
                  Reported, never acted on: this is the only honest way a gate can
                  check that the organ reaches the player, because a gate that
                  greps the file for a function name proves nothing (8/9, this
                  lane: advance_territory was 'wired' by name and dead in fact). */
               faction:factionForPerson(a),
               intro:(function(){ var ix=introFor(a,p); if(!ix) return null;
                 return { rule:ix.rule.key, tier:ix.m.tier, shown:ix.m.shown,
                          isName:ix.m.isName, asks:ix.m.asks, next:ix.m.next,
                          vouchedBy:ix.st.vouchedBy||null, overheardBy:ix.st.overheardBy||null,
                          onward:ix.st.onward|0,
                          button:BohemiaIntros.buttonFor(ix.rule,ix.ctx,ix.st) }; })(),
               /* WHO THIS PERSON KNOWS, as the graph resolves it on the real block.
                  Reported, never acted on. */
               ties:(function(){ if(typeof BohemiaTies==='undefined'||typeof CELL==='undefined'||!CELL) return null;
                 return BohemiaTies.tiesOf(p.key, tieRoster(), CELL, tieKeyOf)
                   .map(function(t){ return {key:t.key, via:t.via}; }); })(),
               lookSeed:p.lookSeed, outside:(a.loc.mode==='out'),
               x:a.loc.x, y:a.loc.y, house:p.household.house,
               card:BohemiaPeople.cardFor(p, a, SIM.turn, PEOPLE_MET.get(p.key)) };
    });
    return { turn:SIM.turn, day:worldDay(), n:out.length,
             namesKnown:PEOPLE_MET.namesKnown(), met:PEOPLE_MET.serialize(), looks:(CAST&&CAST.portraits)?CAST.portraits.looks.length:0,
             open:PERSON_OPEN?PERSON_OPEN.key:null, people:out };
  },
  /* THE VALLEY IS BIGGER THAN ONE BLOCK, and a gate that can only ever see the
     cell the game opens on cannot check the other 2,303. This calls the run's
     OWN loadCell - the same function the edge-crossing uses when you walk off
     the block - so what the gate sees is what a player who walked there sees.
     Reports after acting; it is a test hook and people_gate is its only caller. */
  gotoCell: function(cx,cy){
    try{ loadCell(cx,cy); buildSim(450); refresh(); draw();
      return { at:CELL.slice(), name:CELLNAME }; }catch(_e){ return null; }
  },
  /* /PEOPLE:DBG */
  moments: function(){ return MOMENTS.map(function(m){ return {name:m.name,spends:m.spends}; }); },
  lastResolve: function(){ return LAST_RESOLVE; },
  reach: function(){ return { tiles:REACH.tiles, facing:PFACE,
    faced:REACH.facingTile(px,py,facingOf(PFACE)) }; },
  cell: function(){ return { at:CELL.slice(), name:CELLNAME, suburb:isSuburbCell(),
    home:HOME_CELL.slice(),
    isHome:(CELL[0]===HOME_CELL[0]&&CELL[1]===HOME_CELL[1]), tiles:T, homes:feet.length }; },
  /* WHERE THE GATED COMMUNITIES ARE, without loading a single one. "GATED IS RICH" is
     Paolo's ruling and the generator honours it: a gate assembly (code 5) exists on
     about 1.9% of residential cells, so a tool hunting one by walking the valley cell
     by cell does hundreds of full loadCell+buildSim rounds to find nothing. WORLD.tile()
     answers the district question straight from the overmap. Reports, never acts. */
  gatedCells: function(r){
    var out=[], R=r||10;
    for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
      var cx=CELL[0]+dx, cy=CELL[1]+dy; if(cx<0||cy<0) continue;
      var t=WORLD?WORLD.tile(cx*T+(T>>1),cy*T+(T>>1)):null;
      var d=t?String(t.district):'';
      if(d==='gated'||d==='estate') out.push([cx,cy,d,Math.abs(dx)+Math.abs(dy)]);
    }
    out.sort(function(a,b){ return a[3]-b[3]; });
    return out;
  },
  neighbours: function(){ var out={};
    [['E',1,0],['W',-1,0],['S',0,1],['N',0,-1]].forEach(function(d){
      var t=WORLD?WORLD.tile((CELL[0]+d[1])*T+(T>>1),(CELL[1]+d[2])*T+(T>>1)):null;
      out[d[0]]=t?String(t.district):null; });
    return out; },
  walkMode: function(){ return WALKMODE; },
  walkModes: function(){ return WALKMODES.slice(); },
  setWalkMode: function(m){ walkModeSet(m); return WALKMODE; },
  drawOffset: function(){ return drawOffset(); },
  /* save/load introspection for gates/run_gate.js — reports, never acts */
  saves: function(){ return saveSlots().map(function(b){
    return { label:b.label, env:b.env, beat:b.beat, step:b.step,
             hasEngine:!!b.engine, hasRun:!!b.run,
             /* the law: device preferences NEVER travel in the save */
             carriesDevicePrefs: JSON.stringify(b).indexOf('MUSIC_ON')>=0 }; }); },
  saveNow: function(label){ return !!writeSave(label||'manual'); },
  loadLast: function(){ return loadClosest(); },
  exportCode: function(){ return JSON.stringify(saveBlob('export')); },
  importCode: function(t){ try{ return applyBlob(JSON.parse(t)); }catch(_e){ return false; } },
  wipeSaves: function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(_e){} },
  cast: function(){ if(!CAST) return null;
    var d=Object.keys(CAST.player), any=CAST.player[d[0]];
    return { dirs:d.length, walkFrames:any?any.walk.length:0, looks:CAST.looks.length,
      lookDirs:CAST.looks.length?Object.keys(CAST.looks[0]).length:0,
      portrait:!!CAST.portraits.you, npcPortraits:CAST.portraits.looks.filter(Boolean).length,
      spriteW:any&&any.idle?any.idle.width:0, spriteH:any&&any.idle?any.idle.height:0 }; },
  /* THE BUILDING STACK, as facts a gate can check (Paolo 7/27's three). Reports
     what the renderer would actually lay on every cell of the loaded block. */
  look: function(){
    if(!isSuburbCell()) return null;
    var isRoof=function(id){ return id.indexOf('roof_')===0; },
        isWall=function(id){ return id.indexOf('wall_')===0; },
        isBay =function(id){ return id.indexOf('garage_bottom')===0; },
        isGar =function(id){ return id.indexOf('garage_')===0; };
    var o={ faceH:FACE_H, roofD:ROOF_D, band:BAND, doors:0, doorsOnSouthFace:0,
            minDoorWallCourses:99, bays:0, widestBay:0, tallestBayColumn:0,
            worstRoofRun:0, strayWallCaps:0, blackHipRisk:0 };
    var id=function(x,y){ return isBody(x,y) ? bodyTile(G[y][x],x,y) : null; };
    /* the doors */
    Object.keys(doorOf).forEach(function(k){
      var p=k.split(',').map(Number); o.doors++;
      if(!isBody(p[0],p[1]+1)) o.doorsOnSouthFace++;
      /* how many courses of real wall this door's column carries, the door's
         own two rows included: Paolo's "at the least three wall tiles tall" */
      var n=0, y=p[1];
      while(isBody(p[0],y) && (doorOf[p[0]+','+y]!=null || isWall(id(p[0],y)||''))){ n++; y--; }
      if(n<o.minDoorWallCourses) o.minDoorWallCourses=n;
    });
    if(o.doors===0) o.minDoorWallCourses=0;
    /* the garage bays: horizontal runs only, never a vertical stripe */
    var run=0;
    for(var y2=0;y2<H;y2++){ run=0;
      for(var x2=0;x2<W;x2++){
        var t=id(x2,y2);
        if(t&&isBay(t)) run++;
        else { if(run){ o.bays++; if(run>o.widestBay) o.widestBay=run; } run=0; } }
      if(run){ o.bays++; if(run>o.widestBay) o.widestBay=run; } }
    for(var x3=0;x3<W;x3++){ var col=0;
      for(var y3=0;y3<H;y3++){ var t3=id(x3,y3);
        if(t3&&isGar(t3)){ col++; if(col>o.tallestBayColumn) o.tallestBayColumn=col; } else col=0; } }
    /* CONCRETE HAS TO BE GOING SOMEWHERE. Every poured tile on open ground is
       either the kerb band, a driveway/gate the world itself put there, or a
       front path that reached the street. Anything else is a stray slab. */
    var ps=pathSet();
    o.pathCells=0; o.pathDoors=0; o.strayConcrete=0;
    for(var k2 in ps) o.pathCells++;
    Object.keys(doorOf).forEach(function(k3){
      var p3=k3.split(',').map(Number);
      if(ps[p3[0]+','+(p3[1]+1)]) o.pathDoors++;
    });
    for(var y5=0;y5<H;y5++) for(var x5=0;x5<W;x5++){
      if(isBody(x5,y5)) continue;
      var c5=G[y5][x5]; if(c5!==0) continue;              /* only the yards */
      var t5=groundTile(c5,x5,y5);
      if(t5.indexOf('walk_')!==0 && t5.indexOf('concrete_')!==0) continue;
      if(t5==='walk_kerb') continue;                      /* the band against the road */
      if(ps[x5+','+y5]) continue;                         /* a real front path */
      o.strayConcrete++;
    }
    /* the roof may never become a field, and a wall course may never cap a mass */
    for(var x4=0;x4<W;x4++){ var r=0;
      for(var y4=0;y4<H;y4++){ var t4=id(x4,y4);
        if(t4&&isRoof(t4)){ r++; if(r>o.worstRoofRun) o.worstRoofRun=r; } else r=0;
        if(t4&&isWall(t4)&&!isBody(x4,y4-1)) o.strayWallCaps++; } }
    return o;
  },
  /* what is drawn see-through OVER you where you stand right now */
  occluders: function(){
    var out={ overhead:0, inDoorway:(mode==='ext'&&doorOf[px+','+py]!=null),
              wallToTheNorth:(mode==='ext'&&isBody(px,py-1)) };
    if(mode==='ext') for(var up=0;up<=1;up++){ var oy=py-up;
      if(oy>=0 && LAYERG[oy] && LAYERG[oy][px]==='overhead') out.overhead++; }
    out.faded = out.overhead>0 || out.inDoorway;
    return out; },
  feed: function(){ return BohemiaLoop.buildFeed(CTX,{}); },
  profile: function(){ return BohemiaLoop.socialProfile(CTX); }
};

if(CELL) bridgePost({ type:'BOHEMIA_RUN_WHERE', cell:CELL.slice(), district:CELLNAME });

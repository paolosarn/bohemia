<!-- ============================================================================
     BOHEMIA — THE FIRST CONNECTED RUN  (RUN lane, 7/26/26)
     One loop, start to finish, one thumb, iPhone portrait:
       wake up INSIDE your house -> walk out the real front door -> walk the dead
       block -> pull up on the lineman -> he gives you S01 THE METER READER ->
       follow the skimmed line down the block to the fixer -> resolve it (quiet,
       in daylight, or LOUD) -> a loud resolution hands off to the REAL combat
       frame through the existing BOHEMIA_ENCOUNTER bridge -> walk home -> your
       phone posts the finished quest to the feed with its real CLOUT weight.

     STITCHING ONLY. Nothing here invents a system:
       - the block, the houses, the doors, the interiors  = engine/bohemia_suburb.js
                                                            + engine/bohemia_floorplan.js
       - the neighbours living on it                      = engine/bohemia_agents.js
       - the quest, its dialogue, its forks, its endings  = quests/bq/S01 + engine/bohemia_bq.js
                                                            + engine/bohemia_quest_runtime.js
       - who you can talk to, clout, the feed, followers  = engine/bohemia_loop.js
                                                            (talkablesNear / talkTo /
                                                             buildFeed / socialProfile / cloutWeight)
       - the fight                                        = the alpha's COMBAT frame,
                                                            over the existing postMessage bus
       - the dressed look (doors/roofs/yards/walls)       = lifted verbatim, in the
                                                            builder, from the APPROVED
                                                            slices/BOHEMIA_SUBURB_WALK_7_18_26.html

     SELF-CONTAINED OUTPUT: tools/build_run_slice.js inlines every engine/ module
     (canonical order, byte-identical to engine/) into slices/BOHEMIA_RUN_CURRENT.html,
     which is what the alpha's RUN tab loads. Never edit the generated file.
     ========================================================================= -->
<style>
  :root{
    --bg:#0c0a07; --surface:#16110a; --line:#2c2317; --ink:#ece2cf; --dim:#9c8f76;
    --faint:#6c614f; --gold:#d8a742; --gold-soft:#372a10; --good:#86ac52;
    --teal:#61a89f; --amber:#d47a30; --danger:#d9563a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  }
  /* TOUCH GUARD (7/28). Paolo: "when I'm playing it and I press the direction
     button keys it tries to like copy and paste it like it's text or something."
     This was fixed on 7/27 for the shell and for the CITY / COMBAT / RIG frames
     - and the RUN was missed by all of it, because the run is NOT a base64
     frame like those three: it is a separate file the alpha loads by iframe
     src, so tools/bohemia_touch_guard_patch.py never touched it and
     touch_guard_gate.js never looked at it. Green gate, broken controls, on the
     one surface he actually plays. That is the lane's own standing rule from
     backlog 0O arriving a second time.
     On iOS, press-and-hold on ANY text - a label, an arrow glyph - raises the
     selection magnifier and the Copy / Look Up callout, and HOLD IS THIS GAME'S
     MOVEMENT INPUT. user-select kills the selection, -webkit-touch-callout
     kills the menu.
     IT LIVES IN THE DEV SOURCE, NOT THE BUILT FILE. Patching the generated
     run would be erased by the very next `node tools/build_run_slice.js`, which
     runs several times a session. */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent;
     -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  /* and given straight back where copy/paste is the POINT (the save code box) */
  input,textarea{ -webkit-touch-callout:default; -webkit-user-select:text; user-select:text; }
  /* the controls are pure gesture surfaces: no double-tap zoom, no scroll steal */
  #pad,#pad *,#nav,#nav *,.dpad,.dpad *,#act,#mus{ touch-action:manipulation; }
  html,body{ margin:0; height:100%; background:#050403; color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden; }
  #run{ position:relative; display:flex; flex-direction:column; height:100%;
    max-width:480px; margin:0 auto; background:#0b0d09; overflow:hidden; }

  /* ---- OBJECTIVE BAR: the one line telling you what you are doing ---- */
  #obj{ flex:none; display:flex; align-items:center; gap:8px; padding:9px 12px;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.3px; color:#e6c887;
    background:linear-gradient(90deg,var(--gold-soft),transparent);
    border-bottom:1px solid var(--line); min-height:38px; }
  #obj .ring{ color:var(--gold); }
  #obj #mus{ margin-left:auto; flex:none; font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:1px; padding:5px 9px; border:0; border-radius:3px; background:#241d12;
    color:var(--faint); box-shadow:inset 0 0 0 1px var(--line); text-transform:none; }
  #obj #mus.on{ background:var(--gold-soft); color:var(--gold); }
  #obj #menu{ margin-left:6px; flex:none; font-family:var(--mono); font-size:12px; font-weight:700;
    padding:4px 10px; border:0; border-radius:3px; background:#241d12; color:var(--dim);
    box-shadow:inset 0 0 0 1px var(--line); }
  #obj b{ color:var(--ink); font-weight:700; }

  /* ---- THE WORLD ---- */
  #stage{ flex:1; position:relative; min-height:0; }
  #cv{ display:block; width:100%; height:100%; background:#12140f; }
  #where{ position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.6px; color:rgba(236,226,207,.62); background:rgba(6,7,5,.55);
    padding:3px 7px; border-radius:3px; pointer-events:none; }
  #toast{ position:absolute; left:10px; right:10px; bottom:10px; font-family:var(--mono);
    font-size:12px; line-height:1.45; color:#e6c887; background:rgba(8,7,5,.86);
    border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:4px;
    padding:9px 11px; display:none; pointer-events:none; }

  /* ---- ONE-THUMB CONTROLS: THE NAV CLUSTER (7/27, Paolo) ----
     "on the run should be using the same movement ui s the combat shit ... the
      arrows taking up half the screen is dog shit man".
     What was here: a #ctl BAR, a flex sibling of the stage, holding a full-width
     ACT button and four 74x52 arrows. ~125px of chrome that did not float over
     the world - it SHRANK the canvas, so the game was played in what the buttons
     left over. This is the cluster the game already uses twice: COMBAT's
     buildMoveRing (8 buttons on a 66px radius around the fire button) grown into
     CITY's #nav (8 round buttons around an 80px portrait). Same UI, third
     surface, floating in the thumb corner over a full-screen world. */
  #nav{ position:absolute; right:6px; z-index:9;
    bottom:calc(6px + env(safe-area-inset-bottom)); width:180px; height:180px; }
  #pad{ position:absolute; inset:0; }
  .pb{ position:absolute; width:42px; height:42px; border-radius:50%; padding:0;
    background:radial-gradient(circle at 50% 38%,#241d12,#0f0c07 75%);
    border:1px solid var(--line); color:var(--gold); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; }
  .pb:active{ border-color:#c8b892; color:#fff; }
  /* the one contextual action button is now also where your face is */
  #act{ position:absolute; left:50px; top:50px; width:80px; height:80px; padding:0;
    border:0; border-radius:999px; overflow:hidden; z-index:10;
    background:radial-gradient(circle at 50% 38%,#3a342a,#15120d 72%);
    box-shadow:0 0 0 1px #4a4030,0 6px 22px rgba(0,0,0,.6); }
  #act:active:enabled{ box-shadow:0 0 0 1px var(--gold),0 6px 22px rgba(0,0,0,.6); }
  #actface{ position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; border-radius:999px; }
  /* the verb rides ABOVE the ring, not inside it: the run's verbs are whole
     sentences ("SLEEP (8 HOURS, SAVES)") and an 80px circle with overflow:hidden
     ate them. It is allowed to be wider than the cluster - it is a HUD line. */
  #actlbl{ position:absolute; left:-96px; right:0; top:-4px; text-align:center;
    font-family:var(--mono); font-size:10px; letter-spacing:1px; font-weight:700;
    line-height:1.3; color:var(--gold); text-shadow:0 1px 4px #000,0 0 9px #000,0 0 3px #000;
    pointer-events:none; z-index:11; }
  #nav.off #actlbl{ color:var(--faint); }

  /* ---- DIALOGUE SHEET ---- */
  #talk{ position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    justify-content:flex-end; background:rgba(4,4,3,.72); }
  #talkin{ background:var(--surface); border-top:1px solid var(--line);
    border-radius:10px 10px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:88%; overflow-y:auto; }
  .spkrow{ display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  #spkface{ width:52px; height:52px; flex:none; border-radius:4px; image-rendering:pixelated;
    background:#0c0a07; box-shadow:inset 0 0 0 1px var(--line); display:none; }
  #spk{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold); }
  #says p{ margin:0 0 9px; font-size:15.5px; line-height:1.46; }
  #says p.nv{ color:var(--faint); font-size:12.5px; font-style:italic; }
  #opts button{ display:block; width:100%; text-align:left; margin-top:8px; min-height:50px;
    padding:12px 13px; font-family:var(--sans); font-size:14.5px; font-weight:600;
    text-transform:none; letter-spacing:0; line-height:1.35; border:0; border-radius:5px;
    background:#241d12; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  #opts button.sil{ color:var(--dim); font-style:italic; font-weight:500; }
  #opts button:active{ background:#31280f; }
/* PEOPLE:CSS */
  /* THE IDENTITY CARD. Deliberately NOT a debug panel: it is the top of the
     dialogue sheet, in the sheet's own type, because a person you can read is a
     person and a table of fields is a spreadsheet. */
  #seat{ font-family:var(--mono); font-size:9px; letter-spacing:1.3px;
    color:var(--faint); text-transform:uppercase; margin-top:3px; }
  #idcard{ display:none; margin:0 0 12px; padding:10px 0 0; border-top:1px solid var(--line); }
  #idcard .r{ display:flex; gap:10px; align-items:baseline; margin-bottom:6px; }
  #idcard .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:1.2px;
    color:var(--faint); text-transform:uppercase; flex:none; width:82px; }
  #idcard .v{ font-size:13px; color:var(--ink); line-height:1.35; }
  #idcard .r.unnamed .v{ color:var(--dim); font-style:italic; }
/* /PEOPLE:CSS */

  /* ---- THE PHONE (end of the run: the post) ---- */
  #phone{ position:absolute; inset:0; z-index:30; display:none; flex-direction:column;
    background:linear-gradient(180deg,#0e0b07,#0a0806 60%,#0c0a07); overflow-y:auto;
    padding:16px 14px calc(20px + env(safe-area-inset-bottom)); }
  #phone .wm{ font-family:var(--mono); font-weight:800; letter-spacing:2px; font-size:12px;
    color:var(--gold); }
  #phone h3{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:1.4px; color:var(--faint); margin:18px 2px 9px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:13px 14px; margin-bottom:10px; }
  .card .who{ font-weight:700; font-size:14px; }
  .card .who .at{ color:var(--dim); font-weight:500; font-family:var(--mono); font-size:12px; }
  .card .body{ font-size:15px; line-height:1.45; margin:9px 0 0; }
  .card .eng{ display:flex; gap:14px; align-items:center; margin-top:11px; padding-top:11px;
    border-top:1px solid var(--line); font-family:var(--mono); font-size:12px; color:var(--dim); }
  .card .eng .g{ color:var(--gold); font-weight:700; margin-left:auto; }
  .tag{ display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:3px; margin-left:6px; letter-spacing:.5px;
    background:var(--gold-soft); color:var(--gold); border:1px solid #43310f; }
  .stats{ display:flex; gap:26px; margin-top:12px; }
  .stat b{ font-size:21px; font-weight:800; display:block; line-height:1; font-family:var(--mono); }
  .stat span{ font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:1px; }
  .stat.foll b{ color:var(--gold); }
  #phone button{ width:100%; height:48px; margin-top:14px; font-family:var(--mono);
    font-size:13px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    border:0; border-radius:5px; background:#241d12; color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line); }

  /* ---- SAVE SHEET ---- */
  #save{ position:absolute; inset:0; z-index:26; display:none; flex-direction:column;
    justify-content:flex-end; background:rgba(4,4,3,.72); }
  #savein{ background:var(--surface); border-top:1px solid var(--line);
    border-radius:10px 10px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom));
    max-height:90%; overflow-y:auto; }
  #savetitle{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; color:var(--gold);
    margin-bottom:10px; }
  #savelist .slot{ display:flex; gap:10px; align-items:center; padding:9px 11px; margin-bottom:7px;
    background:#141009; border:1px solid var(--line); border-radius:5px; font-size:13.5px; }
  #savelist .slot .when{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); }
  #savelist .none{ color:var(--faint); font-size:13px; margin-bottom:8px; }
  #saveacts button, #save .ghostbtn{ display:block; width:100%; min-height:48px; margin-top:8px;
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    border:0; border-radius:5px; background:var(--gold); color:#0c0a07; }
  #saveacts button.ghost, #save .ghostbtn{ background:#241d12; color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line); }
  #saveacts button:disabled{ background:#241d12; color:var(--faint); box-shadow:none; }
  .walkrow{ margin:2px 0 12px; }
  .walkrow .wlab{ font-family:var(--mono); font-size:9.5px; letter-spacing:1.2px;
    color:var(--faint); margin-bottom:7px; }
  .walkbtn{ display:block; width:100%; text-align:left; min-height:46px; margin-top:6px;
    padding:8px 11px; border:0; border-radius:5px; background:#241d12; color:var(--dim);
    box-shadow:inset 0 0 0 1px var(--line); font-family:var(--sans); }
  .walkbtn b{ font-family:var(--mono); font-size:12px; letter-spacing:1.2px; color:var(--ink);
    display:block; }
  .walkbtn span{ font-size:11.5px; line-height:1.35; }
  .walkbtn.on{ background:var(--gold-soft); box-shadow:inset 0 0 0 1px #5a441a; }
  .walkbtn.on b{ color:var(--gold); }
  #savecode{ width:100%; height:72px; margin-top:10px; background:#0c0a07; color:var(--dim);
    border:1px solid var(--line); border-radius:5px; padding:8px; font-family:var(--mono);
    font-size:11px; resize:none; }

  /* ---- COMBAT HANDOFF CURTAIN ---- */
  #hand{ position:absolute; inset:0; z-index:25; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px;
    background:rgba(6,5,4,.93); text-align:center; }
  #hand .big{ font-family:var(--mono); font-size:17px; letter-spacing:2px; color:var(--danger);
    font-weight:800; }
  #hand .sub{ font-size:13.5px; line-height:1.5; color:var(--dim); max-width:320px; }
  #hand button{ min-width:220px; height:48px; font-family:var(--mono); font-size:13px;
    font-weight:700; letter-spacing:1.2px; text-transform:uppercase; border:0;
    border-radius:5px; background:#241d12; color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line); display:none; }

:root{
  /* --- THE LETTERS. His ruling was a CATEGORY: every letter the same width,
     everywhere, labels and body alike. --sans keeps its name so nothing that
     already asks for it breaks, and it now answers with the typewriter. --- */
  --fmono:'BohemiaMono',ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --mono:var(--fmono);
  --sans:var(--fmono);
  /* THE ONE EXCEPTION, and it is not a letter. The nav ring is eight arrows and
     the typeface carries only two of them, so six would arrive from a different
     face inside the same ring. Eight arrows from one font beats seven from the
     right one. Glyph controls only. Never text. */
  --fglyph:-apple-system,"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;

  /* --- THE CORNER: C CUT. Two corners sliced at 45 degrees, 10px deep.
     The world is drawn at 45 degrees and now the interface agrees with it. --- */
  --cut:10px; --cutin:8.83px; --r:0px;
  --clip:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  --clipin:polygon(8.83px 0, 100% 0, 100% calc(100% - 8.83px), calc(100% - 8.83px) 100%, 0 100%, 0 8.83px);
  --cliptop:polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
  --cliptopin:polygon(8.83px 0, 100% 0, 100% 100%, 0 100%, 0 8.83px);

  /* --- THE LINE: B HEAVY. 2px, his own ink at 45% over his own surface.
     3.78 to 1 against the panel. The old hairline measured 1.22. --- */
  --bw:2px; --line:#766f63; --line-soft:#453f35;

  /* --- THE COLOUR: B GOLD AND COLD, and this is a RULE, not a swatch. --------
     GOLD IS YOU AND WHAT YOU DO. Verbs. The objective. Your choices. Anything
       you are about to press.                      (8.52:1 on the panel)
     COLD IS THE MACHINE. The phone, the network, counts you did not choose,
       timestamps, readouts, the place-name.         (6.80:1 on the panel)
     The world has no cold in it, so the interface never competes with a lamp
     (LIGHT = TERRITORY) and the phone reads as a different object from the
     street (FFX.L03: the interface lives in a hue the world does not use).
     NO ESSENTIAL INFORMATION BY COLOUR ALONE: gold and cold say WHOSE a thing
     is, never WHAT it says. Every one of them is also labelled in words. --- */
  --acc:#d8a742; --accink:#14100a;
  --cold:#61a89f; --coldsoft:#27322b;
  --acc2:var(--cold);

  --fill:#16110a;
  /* a thing you can press sits slightly proud of a thing you cannot. Hodent's
     FORM FOLLOWS FUNCTION: pressable has to LOOK pressable before it is pressed,
     not only after. Same family, no new hue. */
  --fill-lift:#271f0f;
  /* THE DIRT is dead, all three (8/27). The interface is not textured. */
  --grain:none; --wear:none;
}

/* ---- THE BOX: the one shape everything in Bohemia is made of --------------
   outer = the edge (its background IS the line, its inset IS the weight)
   inner = the fill, chamfered 8.83px so the line follows the diagonal at
           exactly 2px instead of the cut slicing straight through it.

   IT NEEDS NO EXTRA MARKUP. The judge page could afford a wrapper div per box;
   the game cannot, because its buttons are built by the RUN lane's JavaScript
   and a LOOK lane does not reach into another lane's DOM. So the inner is a
   ::before, held under the text by a stacking context on the element itself.
   Same picture, zero markup, nothing in engine/ has to change. --- */
.bx{ position:relative; isolation:isolate; border:0; background:var(--line);
     -webkit-clip-path:var(--clip); clip-path:var(--clip);
     border-radius:0; }
.bx::before{ content:''; position:absolute; inset:var(--bw); z-index:-1;
     background:var(--fill);
     -webkit-clip-path:var(--clipin); clip-path:var(--clipin); }
/* the sheet: same rule, and only the top-left cut is ever on screen */
.bx-top{ -webkit-clip-path:var(--cliptop); clip-path:var(--cliptop); }
.bx-top::before{ -webkit-clip-path:var(--cliptopin); clip-path:var(--cliptopin); }
/* a box that belongs to the machine wears the cold edge instead of the warm one */
.bx-cold{ background:var(--cold); }

/* ---- PRESSED: A FLIP, AND IT IS HIS, RULED 8/27 14:12. --------------------
   THIS FORK HAD NO VOTE AT 06:07 and he said exactly why: I typed three
   paragraphs about what a press feels like instead of showing him. He was right
   and it was worse than he knew -- A THUMB COVERS THE BUTTON, so the one fork
   whose whole subject is what happens under a finger was the one fork he
   physically could not see.
   The presses were rebuilt to play themselves with a ghost fingertip. He opened
   the page again and answered in one tap. THE FIX FOR A MISSING VOTE WAS NEVER A
   BETTER EXPLANATION, IT WAS SHOWING HIM THE THING.
   FLIP: the whole box inverts to solid gold with dark ink (8.60 to 1),
   because a change that only happens in the middle of a button is a change his
   thumb is sitting on. It is the FF10 move -- the selected row is a solid bar,
   not an outline. --- */
.bx:active::before{ background:var(--acc); }
.bx:active{ background:var(--acc); color:var(--accink); }
.bx-cold:active::before{ background:var(--cold); }
.bx-cold:active{ background:var(--cold); color:var(--accink); }

@media (prefers-reduced-motion:reduce){ .bx,.bx::before{ transition:none; } }

/* LOOK:END */

/* ============================================================================
   THE RUN WEARS THE LOOK HE PICKED  (UI lane, 8/27/26)

   Paolo answered the vocabulary page twice on 8/27: the corner, the line, the
   colour and the letters at 06:07, and PRESSED at 14:12 once the presses played
   themselves instead of being described to him. Until this block existed that
   verdict lived on a judge page and the game he actually plays still wore the
   old chrome. This is the block that puts it on him.

   NOT ONE LINE OF RUN LOGIC IS TOUCHED. Every id and class here already existed;
   this is CSS and only CSS, which is the whole boundary of a LOOK lane. The RUN
   lane still owns what every one of these buttons DOES.

   GOLD IS YOU. COLD IS THE MACHINE. That is the rule his COLOUR verdict bought
   and it is applied by MEANING, not by decoration:
     gold  the objective, the verb on the action button, the arrows you move
           with, the choices you make, the feedback on what you just did
     cold  the phone, the network, the place-name, every count and timestamp the
           machine hands you and you did not choose
   NO ESSENTIAL INFORMATION BY COLOUR ALONE: gold and cold say WHOSE a thing is,
   never WHAT it says. Every cold value on this screen carries its own word next
   to it (posts, quests, followers, the clout tag, the place name), so the rule
   is a second channel on top of the words and never instead of them.
   ========================================================================== */

/* ---- THE BOX, BY SELECTOR ------------------------------------------------
   The judge page could afford a wrapper div per box. The game cannot: these
   buttons are built by the RUN lane's JavaScript and a LOOK lane does not reach
   into another lane's DOM. So the inner face is a ::before held under the text
   by a stacking context on the element itself. Same picture, zero markup. --- */
#opts button, #saveacts button, #save .ghostbtn, .walkbtn, #phone button,
#hand button, .card, #savelist .slot, #toast{
  isolation:isolate; border:0; border-radius:0;
  background:var(--line); box-shadow:none;
  -webkit-clip-path:var(--clip); clip-path:var(--clip); }
/* *** POSITION IS SET ONLY WHERE IT IS MISSING, AND THAT DISTINCTION COST A BUG.
   The first cut put `position:relative` on the whole list, because the ::before
   inner face needs a containing block. #toast was ALREADY `position:absolute`
   with left/right/bottom, so relative overrode it, dropped the toast back into
   normal flow and pushed its right edge 10px off a 390px phone -- on the line the
   player reads in the first second of the game.
   An already-positioned element is already a containing block, and `isolation`
   alone gives it the stacking context. A blanket rule is only safe over elements
   that are all the same to begin with; these were not, and only measuring every
   line on the real surface found it. *** */

   ring to the system stack instead and the browser still splits it, glyph by
   glyph, across whatever it can find. Photographed on the real surface: the
   cardinals came back thin and the diagonals came back heavy, in the same ring,
   eight buttons that are supposed to be one control.

   REAL SURFACE (7/18).

   rotated eight times. Identical at every angle, on every engine, forever, and

   tip, so the eye picks the wrong end. Measuring it proved the rotations had been

     resample - fascia above, glazing continuing below. Ghost letters read
     DARKER (the salvaged cans kept the sun off the paint); one band colour

  if(n.indexOf('awning')<0){

      if(pl&&pl.complete&&pl.naturalWidth) ctx.drawImage(look(pl),X,Y,S,S);

}

/* TF-WORLD-010 SIGNS (8/19, board row 39, HIGH since 7/28): every district

     field wears the FACE - bleached, crazed, some panels torn or blown out

     point is the face). Outer w/e edges wear the steel frame overlay.

     3x2-cell dead cabinet anchored at the blob's right-bottom cell so the
     L-to-R draw loop never overpaints it; the arm points at the facade.
   - ANTENNA/DISH (police roofs): the district's own roof tile first, then
     the whip mast (1x1 blob, two cells tall) or the dish (2x2 blob).
   Dead and unlit always; no readable text; no purple. */
function signKind(gx,gy){
  if(gy<0||gx<0||gy>=NAMEG.length||gx>=NAMEG[0].length) return '';
  var n=String(NAMEG[gy][gx]||'').toLowerCase();
  if(n.indexOf('screen tower')>=0) return 'screen';
  if(n.indexOf('scoreboard')>=0||n.indexOf('jumbotron')>=0) return 'board';
  if(n.indexOf('marquee')>=0) return 'marq';
  if(n.indexOf('pylon')>=0) return 'pyl';
  if(n.indexOf('blade sign')>=0) return 'blade';
  if(n.indexOf('antenna')>=0||n.indexOf('dish')>=0) return 'ant';
  return '';
}
function drawSignform(gx,gy,X,Y,S){
  var kind=signKind(gx,gy);
  if(!kind) return false;
  function tf(nm){var im=TILEFORM_IMG[nm];return (im&&im.complete&&im.naturalWidth)?im:null;}
  if(kind==='blade'){
    if(!drawBought('concrete',gx,gy,X,Y,S)) tput('concrete',X,Y,S);
    if(signKind(gx+1,gy)==='blade'||signKind(gx,gy+1)==='blade') return true;
    var x0=gx; while(signKind(x0-1,gy)==='blade') x0--;
    var y0=gy; while(signKind(gx,y0-1)==='blade') y0--;
    var w=gx-x0+1, h=gy-y0+1;
    var arm = civicSolidAt(x0-1,gy) ? 'w' : 'e';

    if(signKind(gx-1,gy)==='ant'||signKind(gx,gy-1)==='ant'){

    } else {

  else {

    name = kind==='screen' ? (r<2?'sign_screen_torn_'+r:'sign_screen_face_'+th(gx,gy,3))

         : kind==='pyl'    ? (r<4?'sign_pyl_blown_'+(r&1):'sign_pyl_face_'+th(gx,gy,2))

  ctx.drawImage(look(fim),X,Y,S,S);
  if(signKind(gx-1,gy)!==kind){var ew=tf('sign_'+kind+'_edge_w'); if(ew) ctx.drawImage(look(ew),X,Y,S,S);}
  if(signKind(gx+1,gy)!==kind){var ee=tf('sign_'+kind+'_edge_e'); if(ee) ctx.drawImage(look(ee),X,Y,S,S);}
  /* the pylon's LEGS: one pole overlay per real leg column, never baked
     into the foot band (first render stood a 7-wide cabinet on a
     colonnade). One centred leg; a cabinet 6+ wide stands on two. */
  if(kind==='pyl' && name==='sign_pyl_foot'){
    var lx=gx; while(signKind(lx-1,gy)===kind) lx--;
    var rx=gx; while(signKind(rx+1,gy)===kind) rx++;
    var w2=rx-lx+1, legs = w2>=6 ? [lx+(w2>>2), rx-(w2>>2)] : [lx+(w2>>1)];
    for(var li=0; li<legs.length; li++) if(legs[li]===gx){
      var pim=tf('sign_pyl_pole'); if(pim) ctx.drawImage(look(pim),X,Y,S,S);
    }

  return true;

function drawCivNamed(gx,gy,X,Y,S){

function epx2(src){

  var S=src.getContext('2d').getImageData(0,0,w,h).data;
  var out=document.createElement('canvas'); out.width=w*2; out.height=h*2;
  var ox=out.getContext('2d'), O=ox.createImageData(w*2,h*2), D=O.data;
  var at=function(x,y){ x=x<0?0:(x>=w?w-1:x); y=y<0?0:(y>=h?h-1:y); return (y*w+x)*4; };
  var eq=function(i,j){ return S[i]===S[j]&&S[i+1]===S[j+1]&&S[i+2]===S[j+2]&&S[i+3]===S[j+3]; };
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var P=at(x,y),A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),E=at(x,y+1);
    var e0=P,e1=P,e2=P,e3=P;
    if(eq(C,A)&&!eq(C,E)&&!eq(A,B))e0=A;
    if(eq(A,B)&&!eq(A,C)&&!eq(B,E))e1=B;
    if(eq(E,C)&&!eq(E,B)&&!eq(C,A))e2=C;
    if(eq(B,E)&&!eq(B,A)&&!eq(E,C))e3=E;
    var o=(y*2*(w*2)+x*2)*4, o2=o+4, o3=o+(w*2)*4, o4=o3+4;
    for(var k=0;k<4;k++){ D[o+k]=S[e0+k]; D[o2+k]=S[e1+k]; D[o3+k]=S[e2+k]; D[o4+k]=S[e3+k]; }
  }
  ox.putImageData(O,0,0); return out;
}
function decodeSet(set){
  if(!set)return null;
  var o={ idle:decodeFrame(set.idle), walk:(set.walk||[]).map(decodeFrame).filter(Boolean) };
  if(!o.idle)return null;
  o.idle=epx2(o.idle); o.walk=o.walk.map(epx2);
  return o;
}

function castIn(m){

  for(var d in (m.player||{})){ var s=decodeSet(m.player[d]); if(s)c.player[d]=s; }

    ctx.beginPath(); ctx.ellipse(cxp,NY+CELL*0.88,CELL*0.42,CELL*0.17,0,0,7); ctx.stroke(); }

/* ===========================================================================
   ZOOM (Paolo 7/31, clause D4: "i should be able to ZOOM OUT UNTIL I GET INTO THE
   CITY BUILDER MODE BRO").

   THE ART IS 44px AND IS NEVER RESAMPLED (clause B1), so the zoom steps are the
   integer ratios of 44 and nothing else. A step that would need a fractional
   scale does not exist -- that is the law's own words: "if a zoom level cannot be
   drawn at an integer scale, that zoom level does not exist."

     step 2 -> CELL 88   close, one art pixel = 2 screen pixels
     step 1 -> CELL 44   native, one art pixel = one screen pixel
     downscale steps are INTEGER DIVISORS: 44/2=22, 44/4=11, so a tile is sampled
     on a whole-pixel lattice rather than smeared across a fraction.

   ZOOMING PAST THE LAST STEP HANDS OFF TO THE CITY. It is the same valley, the
   same seed, and the bridge already exists (BOHEMIA_RUN_WHERE tells the shell
   which cell he is standing in), so the far end of the zoom is the city view of
   the exact block he is standing on -- not a separate place he travels to.
   =========================================================================== */
var ART_PX = 44;
var ZOOM_STEPS = [4, 2, 1, -2, -4];      /* multiply, then integer-divide */
/* DEFAULT ZOOM = step 2x, and this is not a taste call, it is arithmetic.
   His approved DOOR bank is authored at 88x176 for a cell that is 1 wide x 2
   tall. At CELL=44 the renderer squeezed that into 44x88 -- a HALF-SCALE
   downsample of approved art on every frame, which is both the no-resample law
   broken and the reason the door read as "a picture of the door" instead of a
   door: it was mush, and small.
   At CELL=88 the door draws 88x176 into 88x176. EXACTLY 1:1. Nothing interpolated.
   It also puts ~13 tiles across a phone screen at DPR 3, which is the readable
   framing, so the correct pixel answer and the correct play answer are the same
   number. Law: THE BUILT WORLD LAW B1 + B4. */
var ZOOM_I = 1;
function zoomStep(){
  var z = ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, ZOOM_I))];
  return z > 0 ? z : 1 / (-z);           /* 1/2 and 1/4 keep the lattice whole */
}
function zoomBy(d){
  var next = ZOOM_I + d;
  /* past the far end: this IS the city builder, same cell, no loading screen */
  if(next >= ZOOM_STEPS.length){
    bridgePost({ type:'BOHEMIA_RUN_ZOOM_TO_CITY', cell: CELL_XY(), district: CELLNAME });
    return;
  }
  ZOOM_I = Math.max(0, Math.min(ZOOM_STEPS.length - 1, next));
  draw();
}
function CELL_XY(){ return (typeof CELL!=='undefined'&&CELL&&CELL.slice)?CELL.slice():[0,0]; }

function draw(){
  ctx.imageSmoothingEnabled=false;
  var gw = mode==='ext'?W:fp.W, gh = mode==='ext'?H:fp.H;
  /* THE CELL IS AN INTEGER MULTIPLE OF THE ART, NEVER A FRACTION OF THE SCREEN.
     This used to be Math.floor(min(cv.width,cv.height)/11) -- "fit 11 tiles across"
     -- which on a 390px canvas gives CELL=35 for a 44px source tile. Every approved
     tile was therefore being drawn at 0.795 scale: RESAMPLED, on every frame, which
     the 7/26 no-resample law forbids and which is the second half of why the pixels
     read as mush.
     Now: CELL = 44 * an integer zoom step. An art pixel is always a whole number of
     screen pixels, so nothing is ever interpolated. How many tiles fit on screen is
     a CONSEQUENCE of the screen size, which is how a pixel game is supposed to work.
     Law: laws/BOHEMIA_THE_BUILT_WORLD_LAW_7_31_26.md B1. */

     Bodies draw after tiles, so nothing in this world is ever accidentally in
     front of you - the first cut fixed that by re-drawing whatever sat one and
     two rows north of you see-through over your head, which ghosted the
     character every time he stood in his own front yard with the house behind
     him. He is IN FRONT of that wall. He belongs opaque.
     You are UNDER something in exactly two places, and they are both real:
       - the tile you are standing on is on the OVERHEAD layer, the layer the
         dossier law defines as the one you pass under (canopy, deck, carport)
       - you have stepped INTO a doorway, and the two-tall leaf is around you
     Those redraw over you see-through. Nothing else does.
     =========================================================================== */

        /* GROUND UNDER EVERY BUILDING TILE. A hip tile is drawn as "the slope
           cuts in, and above the cut there is nothing" - so laying it on bare
           canvas punched a BLACK NOTCH into the top corner of every roof in the
           game. The dirt the house stands on goes down first and the cut shows
           the yard through it, which is what a hip is supposed to look like. */

        /* BOUGHT BEATS PAINTED (Paolo 7/31): his own tile wins over anything painted.

  /* ===========================================================================
     WHAT IS STANDING ON THE GROUND. (8/5)

     An empty street with perfect asphalt is still an empty street. This is the
     first pass of objects the valley has ever had, and every one of them is a
     tile he BOUGHT and personally thumbed UP in the 7/13 Great Sweep.

     THE SURFACE DECIDES WHAT IS ON IT, which is the whole placement rule and it
     is mechanism, not content: a road gets WRECKS, a sidewalk gets STREET
     furniture, dirt gets the DEAD desert, a yard gets JUNK. I am not choosing
     what exists in his world -- he chose that with his thumb -- only that a
     wreck belongs on a road and a rock belongs on dirt.

     INTEGER SCALE, WHICH IS WHY THIS WAS POSSIBLE AT ALL. The masters are ~96px
     and the art cell is 44px, and that mismatch is why 8,674 tiles sat dark: the
     no-resample law was read as "art must be cell-sized". IT DOES NOT SAY THAT.
     It says an art pixel is a whole number of screen pixels. So a prop is blitted
     at the run's own integer zoom step and simply spans about two cells, which is
     what an object the size of a market stall SHOULD do.

     IT DECORATES, IT NEVER BLOCKS. Nothing here touches passExt() or the
     occupancy layer. A prop that quietly made a cell impassable would break
     pathing everywhere and read as a world bug, so props are pure paint: drawn
     after the ground and its shadows, before any body.

     doorway, never on a cell something solid already stands on.
     =========================================================================== */

      var e=propOutside(gx,gy); if(!e) continue;
      var im=e.im; if(!im.complete||!im.naturalWidth) continue;

         is 44, so the honest blit is zoomStep() -- but a 96px master at 2x is 2.2

         crate. Measured on the real surface: the first cut put a two-metre
         backpack on a lawn. So the scale steps DOWN in whole numbers until the

     Paolo: "you're kind of just like putting art in places. I can't even see it."
     The grade above fixed the RANGE and the TEMPERATURE of the frame. This fixes the
     other half, which is the reason a screenshot of this game reads as a texture
     swatch instead of a place: NOTHING IN THE WORLD CASTS A SHADOW. A wall, a house
     and a warehouse all sat on the dirt like stickers on paper, at exactly the same
     depth as the dirt, so the eye had nothing to tell it which things are OBJECTS
     and which things are FLOOR. No amount of texture density buys that. One shadow
     does, immediately.

     THE LIGHT IS THE ONE THE ART ALREADY HAS. Every cooked tile in this repo is lit
     from the upper LEFT (SKIN_LIGHT above: end_l 1.12 sunlit, end_r 0.86 shaded), so
     the shadow falls DOWN AND RIGHT. Picking any other angle would put the cast
     shadow on the lit side of every wall in the game and read as broken.

     IT IS A MULTIPLY TOWARD A BLUE, NOT A BLACK WASH. Same physics as the grade: a
     shadow is not the ground turned down, it is the ground lit by the SKY instead of
     by the sun, so it goes darker AND cooler AND keeps its own texture. A black
     rectangle at 55% would erase his bought asphalt, which is the whole point of
     having bought it.

     TWO CELLS LONG, FULL THEN HALF. That step IS the penumbra at this scale, and it
     is aligned to the geometry that casts it, so it reads as a shadow and never as
     the 44px stamp -- the stamp bug is a pattern with no cause in the world, and this
     one has nothing BUT a cause.
     =========================================================================== */
  (function(){
    if(mode!=='ext'||!SUN.on) return;

    ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=SUN.tint;
    for(var sy=-halfH; sy<=halfH; sy++) for(var sx=-halfW; sx<=halfW; sx++){
      var gx=px+sx, gy=py+sy;
      if(gx<0||gy<0||gx>=gw||gy>=gh) continue;
      if(sunSolid(gx,gy)) continue;                 /* a caster is not a receiver */
      if(doorOf[gx+','+gy]!=null) continue;         /* a doorway is already its own dark */
      var a=0;
      for(var d=1; d<=SUN.reach; d++)
        if(sunSolid(gx-d,gy-d)){ a=SUN.step[d-1]; break; }
      if(!a) continue;
      ctx.globalAlpha=a;
      ctx.fillRect((sx+halfW)*CELL,(sy+halfH)*CELL,CELL,CELL);
    }
    ctx.globalAlpha=pa; ctx.globalCompositeOperation=pv;
  })();
  /* the two real cases, worked out once per frame */
  (function(){
    if(mode!=='ext') return;
    for(var up=0; up<=1; up++){
      var ox=px, oy=py-up; if(oy<0) continue;
      var lay = LAYERG[oy] && LAYERG[oy][ox];
      if(lay!=='overhead') continue;                 /* the pass-under layer */
      fade.push([ox,oy,halfW*CELL,(halfH-up)*CELL,CELL,up]);
    }
    if(doorOf[px+','+py]!=null) doorOver=[px,py,halfW*CELL,halfH*CELL,CELL];
  })();
  /* ===========================================================================
     THE GRIME PASS (8/3). ONE LAYER OF FILTH OVER THE WHOLE WORLD, INDIFFERENT TO
     WHERE ONE OBJECT STOPS AND THE NEXT STARTS.

     Paolo 8/3, on Machine Party: "I really love machine parties aesthetic." The
     research found the mechanism in Klubnika's own words about how he textures: he
     "added dirty and grimy leaks to every corner, which BLENDS EVERYTHING TOGETHER
     rather than having different objects." That is the answer to the thing Paolo
     said himself on 7/31 looking at the yard -- two different games in one frame.
     Bohemia textures every tile INDEPENDENTLY and nothing crosses a seam, so three
     perfectly textured surfaces that share nothing are three assets side by side.

     IT IS A SHEET, NOT A TILE, AND THAT IS THE WHOLE DESIGN. Each cell samples its
     own window into ONE CONTINUOUS 8x8-cell image, keyed to WORLD position -- so a
     stain that begins on one cell carries onto the next because it was drawn as one
     stain. Baking grime into a 44px tile would repeat it at cell pitch forever,
     which is precisely the bug he circled on 8/2 ("looks like it's glitching out").

     PIXEL-TRUE: the source rect is a whole 44x44 window and the destination is the
     integer CELL, so this is the same integer blit as every other tile. No filter,
     no smoothing, no resample -- the no-resample law applies to dirt too.

     DRAWN AFTER EVERY WORLD SURFACE AND BEFORE THE CAST. Dirt is on the world, not
     on the people standing in it.

     *** GRIME_STRENGTH IS 0 AND THAT IS DELIBERATE. *** The MACHINERY is cheap and
     invalidates nothing he has approved. The TUNING -- how dirty the world is -- is
     a whole-world art-direction call, and ONE district type of twenty-seven is
     finished, so tuning it now means tuning it twice. The dial goes up when there is
     a world to judge it against, and not before. gates/grime_gate.py holds the zero.
     =========================================================================== */
  /* 8/3, SECOND LOOK: this was turned up to 0.55 earlier today on the strength of
     "do what you want", and that is not a ruling on an AMOUNT. He has never seen a
     dirty frame. A global dirt pass over the whole world is exactly the kind of
     unjudged art the 7/26 STOP PRODUCING law says not to surface, and the reason
     stated three lines up has not changed: one district of twenty-seven is finished.
     Back to zero. It goes up when he rules on the number, and the side-by-side to
     rule on is in records/target/. */
  /* 8/9, HE RULED: the ART tab dial came back "UP, amount picked: 0.30, note:
     Some my fav dirty can be good too" (records/BOHEMIA_GRIME_VERDICT_8_9_26.txt).
     The pick is 0.30 and that is what ships. The note keeps 0.55 as live interest,
     not a ruling - do not turn it up off that sentence. grime_gate now pins 0.30
     WITH the verdict file, instead of pinning zero. */
  var GRIME_STRENGTH = 0.30;
  if(mode==='ext' && GRIME_STRENGTH>0 && grimeReady()){
    ctx.save(); ctx.globalAlpha=GRIME_STRENGTH;
    for(var _gy=-halfH; _gy<=halfH; _gy++) for(var _gx=-halfW; _gx<=halfW; _gx++){
      var _wx=px+_gx, _wy=py+_gy;
      if(_wx<0||_wy<0||_wx>=gw||_wy>=gh) continue;
      var _sx=(((_wx%GRIME_CELLS)+GRIME_CELLS)%GRIME_CELLS)*ART_PX;

  doorDraws.forEach(function(d){
    if(!drawDoorFace(d[0],d[1],d[2],d[3],d[4])){

    if(d[5]){ ctx.strokeStyle='#e8b84a'; ctx.lineWidth=2;
      ctx.strokeRect(d[2]+1,d[3]-d[4]+1,d[4]-2,d[4]*2-2); }   /* your own door */
  });
  /* EVERY BODY, PAINTER-SORTED. Whoever stands lower on the screen is nearer,
     so they draw last and overlap the people behind them - the player included,
     which is why he is in this list instead of stamped on top of it. */
  var bodies=[];

    if(SIM){ var outs=SIM.outAgents();
      for(var ai=0; ai<outs.length; ai++){ var a=outs[ai];
        var nsx=a.loc.x-px, nsy=a.loc.y-py; if(Math.abs(nsx)>halfW||Math.abs(nsy)>halfH) continue;

        /* PEOPLE:LOOK */var lk=lookFor(personFor(a).lookSeed);/* /PEOPLE:LOOK */
        bodies.push({ id:a.id, sx:nsx, sy:nsy, set:lk?lk[fa.d]:null, frame:fa.moving?fa.f:null,

/* ==== RUN PERSON FACTS (7/31) ==== */
      /* WHAT WAS PAINTED, not what a helper says would be painted. A gate that
         asks a helper instead of reading the render passed 18/18 with the draw
         deliberately sabotaged - this lane shipped that mistake once, on 7/31.
         This is the neighbour bodies that actually went into the paint list
         this frame, by id, and it is what the gate reads.

         THE ID LIST IS THE USEFUL HALF. The run's viewport is about four tiles
         either side of you (CELL 44 on a ~390px canvas), so standing in your
         own doorway on a 128-tile block the honest painted count is usually
         ZERO and a "bodies thin at midday" assertion read here would be noise.
         What the render CAN prove from any vantage is that it never paints
         somebody the sim says is indoors - which is exactly the surface-
         disagrees-with-the-sim bug this whole lane exists to prevent. */
      try{ window.__RUN_PPL_DRAWN = bodies.length;
           window.__RUN_PPL_IDS = bodies.map(function(_b){ return _b.id; }); }catch(_ed){}
/* ==== /RUN PERSON FACTS ==== */
    var npc=questNpcTile();
    if(npc){ var qsx=npc.x-px, qsy=npc.y-py;
      if(Math.abs(qsx)<=halfW && Math.abs(qsy)<=halfH){
        /* the quest body faces you, so walking up to him reads as walking up to him */

        bodies.push({ sx:qsx, sy:qsy, set:nlk?nlk[nd]:null, frame:null, ring:'#d8a742', fb:'#7d6a44' }); } }
  }
  /* YOU */
  var off=drawOffset();
  bodies.push({ sx:off.x, sy:off.y, set:(CAST&&CAST.player[PFACE])||null,
                frame:PMOVING?PFRAME:null, ring:null, fb:'#ff5a3c', me:true });
  bodies.sort(function(A,B){ return (A.sy-B.sy)||(A.sx-B.sx); });
  bodies.forEach(function(b){
    drawBody((b.sx+halfW)*CELL,(b.sy+halfH)*CELL,CELL,b.set,b.frame,b.ring,b.fb);
  });
  /* THE FADE. The thing you are under, drawn again over you, see-through, so
     you read as being under it instead of stamped on top of it. */
  if(fade.length || doorOver){
    /* 35%, the number the THREE-TILE WALL addendum fixed for the whole game */
    ctx.save(); ctx.globalAlpha=0.35;
    fade.forEach(function(f){
      var gx=f[0], gy2=f[1], X=f[2], Y=f[3], S=f[4];
      /* RUN PERIMETER (7/28): the see-through pass draws the same tiles, so it
         needs his wall too or a faded community wall reverts to a house tile. */
      if(isSuburbCell() && G[gy2][gx]===4){ tput(groundTile(0,gx,gy2),X,Y,S); if(drawPerim(X,Y,S,gx,gy2)) return; }
      if(isSuburbCell() && G[gy2][gx]===5){ tput(groundTile(0,gx,gy2),X,Y,S); if(drawGateMouth(X,Y,S,gx,gy2)) return; }
      var laid = isSuburbCell()
        ? (isBody(gx,gy2) ? bodyTile(G[gy2][gx],gx,gy2) : groundTile(G[gy2][gx],gx,gy2))
        : genericTile(gx,gy2);
      /* HOUSE SKINS: the see-through pass draws the same tiles, so it needs his
         skins too or a faded wall reverts to the target set. */
      /* BOUGHT BEATS PAINTED (Paolo 7/31): his own tile wins over anything painted */
      var _c2=G[gy2][gx];
      if(isSuburbCell() && boughtFor(_c2)&&drawBought(boughtFor(_c2),gx,gy2,X,Y,S)) return;
      if(isSuburbCell() && drawSkin(laid,gx,gy2,X,Y,S)) return;
      tput(laid,X,Y,S);
    });
    /* standing in your own doorway: the leaf and its head close around you */
    if(doorOver) drawDoorFace(doorOver[0],doorOver[1],doorOver[2],doorOver[3],doorOver[4]);
    ctx.restore();
  }
  /* PEOPLE:KNOWNNAMES */
  /* A NAME YOU EARNED IS A NAME YOU SEE (Paolo 7/31, the half that was missing).
     His ruling, in full: "you can personally ask them for their name and then
     the game will track that SO ANYTIME YOU MIGHT SEE THEM IN THE FUTURE LIKE
     THEIR NAME WILL POP UP."
     The asking half shipped 7/31 and is gated end to end. The SEEING half was
     never built: a name only ever appeared on the card, or on the one button
     while you were close enough to touch them. So you could ask somebody their
     name, walk five steps, and they were visually indistinguishable from every
     stranger in the valley - the entire mechanic had no consequence you could
     see. This is that consequence.

     WHY IT DOES NOT TURN INTO NAMEPLATE SOUP, which is the obvious risk and the
     reason a lesser version of this would be worse than nothing:
       - ONLY people you ASKED. That is the whole point. nameOf() returns null
         for a stranger by law, so a stranger can never get a label no matter
         what happens here. The label IS the difference between the people you
         bothered with and the people you did not.
       - the run's viewport is about four tiles either side of you, so the most
         this can ever paint is the handful of bodies actually on screen, and
         it is capped and sorted nearest-first on top of that.
       - FIRST NAME ONLY. You know somebody's first name; you do not read their
         full record off their forehead.
       - IT IS A NAME AND NOTHING ELSE. No role, no mood, no timetable. A
         ROUTINE IS INVISIBLE INFORMATION (Paolo 7/31) is still the law here,
         and a name is not a routine.
     Drawn last so nothing paints over it, at integer pixel positions, in the
     run's own gold - the same colour the game already uses for YOURS. */
  if(mode==='ext' && SIM && typeof BohemiaPeople!=='undefined'){
    var _kn=[], _kouts=SIM.outAgents();
    for(var _ki=0;_ki<_kouts.length;_ki++){
      var _ka=_kouts[_ki];
      var _ksx=_ka.loc.x-px, _ksy=_ka.loc.y-py;
      if(Math.abs(_ksx)>halfW||Math.abs(_ksy)>halfH) continue;
      var _kp=personFor(_ka); if(!_kp) continue;
      var _knm=BohemiaPeople.nameOf(_kp); if(!_knm) continue;
      _kn.push({ n:String(_knm).split(' ')[0],
                 x:Math.round((_ksx+halfW)*CELL+CELL/2),
                 y:Math.round((_ksy+halfH)*CELL-Math.round(CELL*0.30)),
                 d:Math.abs(_ksx)+Math.abs(_ksy) });
    }
    _kn.sort(function(A,B){ return A.d-B.d; });
    if(_kn.length>KNOWN_NAME_CAP) _kn.length=KNOWN_NAME_CAP;
    if(_kn.length){
      ctx.save();
      ctx.font='10px ui-monospace,monospace';
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      for(var _kj=0;_kj<_kn.length;_kj++){
        var _k=_kn[_kj];
        /* a dark ring first, because this has to stay readable over pale
           concrete AND over a dark yard, and the game has no UI plate to sit on */
        ctx.fillStyle='rgba(12,14,10,0.85)';
        for(var _ox=-1;_ox<=1;_ox++) for(var _oy=-1;_oy<=1;_oy++)
          if(_ox||_oy) ctx.fillText(_k.n,_k.x+_ox,_k.y+_oy);
        ctx.fillStyle='#e8b84a';
        ctx.fillText(_k.n,_k.x,_k.y);

    try{ window.__RUN_NAMES_DRAWN=_kn.map(function(_k){ return _k.n; }); }catch(_ek){}
  }
  /* /PEOPLE:KNOWNNAMES */
  /* no cast yet (this page opened outside the alpha): say so, never pretend */
  if(!CAST){ ctx.fillStyle='rgba(236,226,207,0.5)'; ctx.font='10px ui-monospace,monospace';
    ctx.fillText('no cast: open THE RUN from the alpha for real bodies', 8, cv.height-8); }

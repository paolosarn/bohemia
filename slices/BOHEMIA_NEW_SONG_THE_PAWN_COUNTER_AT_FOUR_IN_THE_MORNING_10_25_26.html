<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="song" content="the_pawn_counter_at_four_in_the_morning">
<meta name="list" content="vote/songs/new_four/index.json">
<title>The Pawn Counter At Four In The Morning</title>
<!-- SOUNDS lane, 10/25, rules 167, 168 and 181. PAOLO 10/25: 'one intensity on the map or chilling, two when they're
     attacking, three when it's your turn to attack, real combat music'; 'everything at 120 BPM'; and rule 181: 'I still
     want to hear if it's something I even want... I hope you're not telling it to go immediately into the game.'

     WHAT THIS PAGE IS: one of his songs, played by his own engine (tools/bohemia_sounds_three_levels.js), at
       1 THE MAP      his song exactly as approved, with a soft 120 BPM pulse under it (his own kick and clock, quiet)
       2 THEIR TURN   tension: his engine's second tier, a heartbeat kick, ticking 16ths, a low pedal, toms
       3 YOUR TURN    real combat music: his engine's top tier, a driving kit, a driving bass, a hook in his lead voice
     and A FIGHT, the turn changes as a fight plays them (the map, their turn, your turn, their turn, your turn), each
     change on the bar line. The three levels are one timeline: tap a level while another plays and it changes on the
     next bar, the song does not jump. NOTHING HERE IS IN THE GAME (rule 181(d)). The song is this page's <meta name="song">
     (each card's own copy, written by the tool), or the part after the #, or the first song. The list is this page's
     <meta name="list">: his songs' levels (vote/songs/three_levels/index.json) or the new songs (vote/songs/new_four/).
     Gate: gates/three_levels_vote_gate.js. -->
<style>
  :root{ --ink:#1b1408; --paper:#e8dfc9; --line:#8a7a52; --dim:#b9a77e; --hot:#6a1d10; }
  html,body{margin:0;min-height:100%;background:#0d0b08;color:var(--paper);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  body{box-sizing:border-box;padding:14px 16px 18px;max-width:560px;margin:0 auto}
  h1{font-size:16px;letter-spacing:2px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:8px 6px;min-height:48px;letter-spacing:1px;cursor:pointer;border-radius:0}
  button.on{background:var(--hot);color:var(--paper)}
  button.wide{grid-column:1 / span 2}
  #beat{display:flex;gap:6px;margin:12px 0 6px}
  #beat i{flex:1;height:14px;background:#2a2216;border:1px solid #3a3020}
  #beat i.lit{background:#c8a24a}
  #beat i.one.lit{background:#e8dfc9}
  #turns{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
  #turns span{flex:1;min-width:60px;text-align:center;font-size:11px;padding:6px 2px;border:1px solid #3a3020;color:var(--dim)}
  #turns span.now{background:var(--hot);color:var(--paper);border-color:var(--hot)}
  #num{font-size:12px;color:var(--dim);min-height:4.5em;margin-top:6px}
  select{font:inherit;background:var(--ink);color:var(--paper);border:1px solid var(--line);padding:6px;width:100%;margin-top:10px}
</style></head><body>
<h1 id="ttl">THREE LEVELS</h1>
<div class="sub" id="sub">Your song at the three levels of a fight. Not in the game until you say so.</div>
<div class="row">
  <button id="l1">1. THE MAP</button>
  <button id="l2">2. THEIR TURN</button>
  <button id="l3">3. YOUR TURN</button>
  <button id="fight">A FIGHT</button>
  <button id="stop" class="wide">STOP</button>
</div>
<div id="beat"><i class="one"></i><i></i><i></i><i></i></div>
<div id="turns"></div>
<div id="num">Tap 1, then 2, then 3. Each one changes on the next bar, on the beat. Then tap A FIGHT to hear the turns change the way a fight plays them.</div>
<select id="pick" aria-label="the song"></select>
<script>
(function(){
  'use strict';
  var AC=null, OUT=null, BUF={}, IDX=null, S=null, live=null, run=null, clock=null, lvlNow=0, n=document.getElementById('num');
  var WHAT0, WHAT={ 1:'1. THE MAP: your song as you approved it, with a soft 120 beat under it (your own kick and clock, quiet).',
             2:'2. THEIR TURN: tension. A heartbeat kick on every beat, the ticking, a low note pushing, toms. No backbeat yet.',
             3:'3. YOUR TURN: combat music. Full drums, the bass driving, a hook in your song\'s own lead.' };
  function ctx(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; try{ AC=new C({latencyHint:'playback'}); }catch(e){ AC=new C(); } OUT=AC.createGain(); OUT.gain.value=0.9; OUT.connect(AC.destination); } if(AC.state==='suspended') AC.resume(); return AC; }
  function load(p){ if(BUF[p]) return Promise.resolve(BUF[p]);
    return fetch(p).then(function(r){ if(!r.ok) throw new Error(p+' '+r.status); return r.arrayBuffer(); })
      .then(function(ab){ return new Promise(function(res,rej){ ctx().decodeAudioData(ab,res,rej); }); }).then(function(b){ return (BUF[p]=b); }); }
  function file(f){ return S.dir+f+'.mp3'; }
  /* the bar line: bar 1 starts 0.05 s into every file, a bar is 2 s at 120 BPM */
  function barAt(t0,at){ var x=(at-t0-0.05)/2; return Math.max(0,Math.ceil(x-1e-6)); }
  function mark(){ ['l1','l2','l3'].forEach(function(k,i){ document.getElementById(k).classList.toggle('on',!!live&&lvlNow===i+1); });
    document.getElementById('fight').classList.toggle('on',!!run); }
  function stopAll(){
    var t=AC?AC.currentTime:0;
    [live,run].forEach(function(h){ if(!h) return; h.src.forEach(function(s,i){ try{ var g=h.g[i]; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+0.15); s.stop(t+0.2); }catch(e){} }); });
    live=null; run=null; lvlNow=0; turns(-1); mark(); }
  /* THE THREE LEVELS LIVE: all three start together, one is heard; a change crossfades on the next bar line */
  function level(lv){
    ctx();
    if(run) stopAll();
    if(live){ var t=AC.currentTime, b=barAt(live.t0,t+0.08), at=live.t0+0.05+b*2;
      if(at>live.t0+0.05+31*2){ stopAll(); return level(lv); }
      live.g.forEach(function(g,i){ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.setValueAtTime(g.gain.value,at-0.03); g.gain.linearRampToValueAtTime(i===lv-1?1:0,at+0.03); });
      lvlNow=lv; live.want=lv; live.at=at; mark(); n.textContent=WHAT[lv]+' It comes in at bar '+(b+1)+'.'; return; }
    n.textContent='Loading '+S.name+'...';
    Promise.all([1,2,3].map(function(k){ return load(file('level_'+k)); })).then(function(bs){
      if(live||run) return;
      var t0=AC.currentTime+0.1, h={ t0:t0, src:[], g:[], want:lv, at:t0 };
      bs.forEach(function(b,i){ var s=AC.createBufferSource(), g=AC.createGain(); s.buffer=b; g.gain.value=i===lv-1?1:0; s.connect(g); g.connect(OUT); s.start(t0); h.src.push(s); h.g.push(g); });
      h.src[0].onended=function(){ if(live===h){ live=null; lvlNow=0; mark(); n.textContent='That was the first minute. Tap a level again.'; } };
      live=h; lvlNow=lv; mark(); n.textContent=WHAT[lv];
    }).catch(function(e){ n.textContent='It did not load: '+e.message; });
  }
  /* A FIGHT: the run his engine's three levels make, spliced on the bar line by the tool */
  function turns(on){ var el=document.getElementById('turns'); if(!el.children.length&&S){ (S.run||[]).forEach(function(p){ var s=document.createElement('span'); s.textContent=p; el.appendChild(s); }); }
    Array.prototype.forEach.call(el.children,function(c,i){ c.classList.toggle('now',i===on); }); }
  function fight(){
    ctx(); stopAll(); n.textContent='Loading the fight...';
    load(file('a_fight')).then(function(b){
      if(live||run) return;
      var s=AC.createBufferSource(), g=AC.createGain(); s.buffer=b; s.connect(g); g.connect(OUT); var t0=AC.currentTime+0.1; s.start(t0);
      var h=run={ t0:t0, src:[s], g:[g] }; mark();
      s.onended=function(){ if(run===h){ run=null; turns(-1); mark(); n.textContent='That was a fight: the map, their turn, your turn, their turn, your turn. Each change on the bar.'; } };
    }).catch(function(e){ n.textContent='It did not load: '+e.message; });
  }
  /* the beat light and the words, off the audio clock, so what you see is what you hear */
  function tick(){
    var t=AC?AC.currentTime:0, h=live||run, lights=document.querySelectorAll('#beat i');
    var beat=-1; if(h&&t>=h.t0+0.05){ beat=Math.floor((t-h.t0-0.05)/0.5)%4; }
    Array.prototype.forEach.call(lights,function(l,i){ l.classList.toggle('lit',i===beat); });
    if(run){ var sec=t-run.t0, part=Math.min((S.run||[]).length-1,Math.floor(sec/8)); turns(part);
      var lv=S.run_levels?S.run_levels[part]:0; n.textContent='A FIGHT: '+(S.run[part]||'')+' (level '+lv+'). Bar '+(Math.floor(sec/2)%4+1)+' of 4.'; }
  }
  function pickSong(sl){
    stopAll(); S=null;
    IDX.songs.forEach(function(x){ if(x.slug===sl) S=x; }); if(!S) S=IDX.songs[0];
    S.run=['THE MAP','THEIR TURN','YOUR TURN','THEIR TURN','YOUR TURN']; S.run_levels=[1,2,3,2,3];
    document.getElementById('turns').innerHTML='';
    document.getElementById('ttl').textContent=S.name+', AT THREE LEVELS';
    document.getElementById('sub').textContent=S.sub||('Your song '+S.name+' at the three levels of a fight. Your song stays exactly as it plays in the game until you say a level joins.');
    if(S.what) WHAT=S.what;
    document.getElementById('pick').value=S.slug; turns(-1);
  }
  document.getElementById('l1').onclick=function(){ level(1); };
  document.getElementById('l2').onclick=function(){ level(2); };
  document.getElementById('l3').onclick=function(){ level(3); };
  document.getElementById('fight').onclick=fight;
  document.getElementById('stop').onclick=function(){ if(AC) stopAll(); n.textContent='Stopped.'; };
  var lm=document.querySelector('meta[name=list]');
  fetch((lm&&lm.content)||'vote/songs/three_levels/index.json').then(function(r){ return r.json(); }).then(function(j){
    IDX=j; var sel=document.getElementById('pick');
    j.songs.forEach(function(x){ var o=document.createElement('option'); o.value=x.slug; o.textContent=x.name; sel.appendChild(o); });
    sel.onchange=function(){ pickSong(sel.value); };
    var mt=document.querySelector('meta[name=song]'); pickSong((mt&&mt.content)||(location.hash||'').slice(1));
  }).catch(function(e){ n.textContent='The song list did not load: '+e.message; });
  clock=setInterval(tick,50);
  window.__threelevels=function(){ return { song:S&&S.name, level:lvlNow, live:!!live, fight:!!run, state:AC&&AC.state, latency:AC&&AC.baseLatency, loaded:Object.keys(BUF), t:live?+(AC.currentTime-live.t0).toFixed(2):run?+(AC.currentTime-run.t0).toFixed(2):0, gains:live?live.g.map(function(g){ return +g.gain.value.toFixed(3); }):null, text:n.textContent }; };
})();
</script>
</body></html>

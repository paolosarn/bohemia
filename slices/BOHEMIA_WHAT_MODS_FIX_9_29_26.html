<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Mods Fix</title>
<style>:root{--bg:#0b0d0c;--ink:#cfd6cc;--dim:#6f7a70;--red:#d8352a;--amber:#d9a441;--ok:#7fb069;--line:#1d2320}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}h1{font-size:20px;letter-spacing:.08em;margin:6px 0 2px;text-transform:uppercase}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chips button{flex:1;min-width:70px;padding:11px 4px;background:#141816;color:var(--ink);border:1px solid var(--line);font:inherit;letter-spacing:.06em}
.chips button.on{border-color:var(--red);color:#fff;background:#1c1210}
.card{border:1px solid var(--line);padding:10px;margin:8px 0;background:#0e1110}.top{display:flex;justify-content:space-between;gap:8px}
.nm{font-weight:bold}.v{flex:none;padding:0 6px;border:1px solid}.KEEP{color:var(--ok)}.MAYBE{color:var(--amber)}.NO{color:#f0908a}
.k{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-top:6px}.t{font-size:13px}.tally{color:var(--dim);font-size:12px}</style></head><body><div class="wrap">
<h1>What mods fix</h1><div class="sub">MODS. Research, nothing in the game. Nineteen Battle Brothers mods players name most, and what we do about each. KEEP = ours by default. MAYBE = a chat proposes it. NO = fights your rulings.</div>
<div class="tally" id="tally"></div><div class="chips" id="chips"></div><div id="list"></div></div>
<script>var M=[["Swifter (successor to Quicker and Faster)","speed","F1 to F4 set combat speed 1x to 4x, turn changes scale with it, and events keep a fair rate at speed.","Long fights on repeat; speed was the most-named must-have.","none to balance","MAYBE","Our beat is fixed at 120 BPM (a law), so the beat cannot speed up. What can: skip the waiting between the company's automatic turns. A lane proposes it in VOTE."],["Pause Without Conflicts","pause","Pauses when an enemy party is sighted and at dawn while camping, without clashing with other mods.","BB's clock runs while you read; players lose the moment.","none","KEEP","Travel already stops for events on the map (rule 33). Sighting a party stops the march by default."],["Mount n Blade Pause","pause","Pause key for the world map, borrowed from another game.","Same reason as the row above.","none","KEEP","Same default; one stop rule, not three mods."],["Autopause when view Enemy","pause","Pauses the moment an enemy comes into view.","Same reason.","none","KEEP","Same default."],["Plan Your Perks","info","Highlights perks so you can plan a brother's whole build. Works on vanilla and on Reforged.","Perks are permanent and a wrong pick is a lost hour.","none","KEEP","Ours is masteries. A build preview at the training ground costs nothing and fits \"the knowledge you earn shows\"."],["Bro Planner / BBPlanner (outside tool)","info","Perk planner with a counter of remaining perks, a forecast of max stats at level 11, and a loadout picker.","Players guess what a recruit will become; this shows it.","none","MAYBE","The stat forecast is the interesting part. It tells what the player cannot work out alone (RF4-68). Propose it at the barber and training ground."],["Effective Hitpoints","info","Shows one number: how much damage a brother can really take, counting armour, helmet and perks.","Armour, helmet and perks stack in ways nobody can add in their head.","none","KEEP","Armour is the depth (rule 36). One honest number beside it is the game teaching, not spoiling."],["Settlement Tooltips","info","Shows what a town's current situation is.","New players miss what changes prices and contracts.","none","KEEP","Our settlement screen shows it as a person or a thing in the place, never a popup (rule 19)."],["Backgrounds and Attribute Ranges","info","Shows the range of stats a background can roll before you hire.","Hiring blind is a coin flip.","none","KEEP","Origins are stated (rule 36c). Ranges are printed on the recruit's own face card."],["Named Item Stat Viewer","info","Shows the possible stat range of a named item.","You cannot tell a good find from a great one.","none","KEEP","Same reason: tell what cannot be derived."],["Numbers","info","Puts an approximate count beside \"few\" and \"many\".","The words hide what you are about to fight.","none","KEEP","Show the real count. A game about knowledge wants the number, not a vague word."],["Autopilot","auto","Auto-pass, auto-shieldwall, fast item switching, ignore a brother, AI control of the company.","The routine turns of a big company are homework.","none to base numbers, changes how much you play","KEEP","This is our gambits, on purpose (rule 36a). The company acts on its own between orders."],["End's Inventory Management Overhaul","inventory","Mass sell, mass repair and better inventory handling.","A big stash on a small screen is a chore.","none","KEEP","A phone game needs it more than a desktop one. Sell-all and repair-all live on the settlement screen (rule 37)."],["Tweaks and Fixes","balance","A modular pile: companions never get bad traits, all locations start discovered (not the fog), polearm AP cut, nets reusable, Resilient 33% and Nine Lives 61% survival.","Small annoyances and odd numbers the studio never touched.","each item is a small number change; not measured here","MAYBE","Take them one by one. \"Locations start discovered\" is NO: it removes exploration, and rule 40 wants the map to be the long part. \"No bad traits for companions\" fits the main character never dying."],["Legends","overhaul","Alternate starts, commanders, camping, world generation, art, new enemies, weapons and skills, new backgrounds.","More replay and variety than the base has.","very large; pins a minimum game version","MAYBE","Alternate starts are our origins (rule 36c, already built). Camping is worth a look. The rest is a different game; NO by his \"never a rip-off\" line (rule 39)."],["Legends Perk Trees Rework","overhaul","Reworks the perk trees.","Trees felt lopsided.","changes builds; not measured here","NO","We have masteries and a swap after level 11 (rule 40e). Two systems is one too many."],["Reforged","overhaul","Dynamic perk trees, 100+ new perks, a dynamic spawn system, reworked enemies, Reach and Crowded mechanics, new gear.","Depth and variety in fights.","very large","MAYBE","Two ideas fit: enemy parties that scale (TUNING's difficulty dials, rule 40a) and weapon reach (already ours). The rest is scope."],["Hardened (a Reforged submod)","overhaul","Simplified systems and bolder mechanics on top of Reforged.","A modder's own taste for a harder game.","large","NO","A mod on a mod. Nothing to take that Reforged did not already give us."],["Sato balance mod","balance","Rebalances some weapons, skills and other pieces.","Some weapons and skills were dead picks.","not measured here","MAYBE","Not a thing to install. TUNING reads it as evidence of what players felt was off."]];var f='ALL';var c={KEEP:0,MAYBE:0,NO:0};M.forEach(function(m){c[m[5]]++;});
document.getElementById('tally').textContent=c.KEEP+' KEEP, '+c.MAYBE+' MAYBE, '+c.NO+' NO. '+M.filter(function(m){return m[4].indexOf('none')===0;}).length+' of '+M.length+' cost the base game balance nothing.';
var ch=document.getElementById('chips');['ALL','KEEP','MAYBE','NO'].forEach(function(n){var b=document.createElement('button');b.textContent=n;b.onclick=function(){f=n;draw();};b.id='c'+n;ch.appendChild(b);});
function e(t,cl,x){var d=document.createElement(t);if(cl)d.className=cl;d.textContent=x;return d;}
function draw(){['ALL','KEEP','MAYBE','NO'].forEach(function(n){document.getElementById('c'+n).className=n===f?'on':'';});
var L=document.getElementById('list');L.innerHTML='';M.forEach(function(m){if(f!=='ALL'&&m[5]!==f)return;var d=e('div','card');var t=e('div','top');t.appendChild(e('span','nm',m[0]));t.appendChild(e('span','v '+m[5],m[5]));d.appendChild(t);
[['WHAT IT DOES',m[2]],['WHY PLAYERS WANT IT',m[3]],['COST TO BASE BALANCE',m[4]],['WHAT WE DO',m[6]]].forEach(function(p){d.appendChild(e('div','k',p[0]));d.appendChild(e('div','t',p[1]));});L.appendChild(d);});}
draw();</script></body></html>

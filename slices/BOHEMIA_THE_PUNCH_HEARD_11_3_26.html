<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Punch Heard</title>
<style>
/* SOUNDS 11/3 (ask line 266): every new sound of the round, alone, through the game's own chain. A VOTE card's page. */
:root{--bg:#0d0b09;--ink:#e8dcc4;--dim:#9a8b6e;--line:#3a3024;--hot:#e0432c;--btn:#1c1712}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-monospace,Menlo,monospace;padding:16px}
h1{font-size:18px;letter-spacing:2px;margin:0 0 4px}
p{color:var(--dim);margin:0 0 14px;max-width:640px}
h2{font-size:13px;letter-spacing:3px;color:var(--hot);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:820px}
button{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 10px;font:inherit;text-align:left;cursor:pointer}
button b{display:block;font-size:13px;letter-spacing:1px}
button span{display:block;color:var(--dim);font-size:11px;margin-top:3px}
button.on{border-color:var(--hot)}
#st{color:var(--dim);font-size:12px;margin-top:16px}
</style></head><body>
<h1>THE PUNCH HEARD</h1>
<p>Every hit, swing, miss and fall in a fight, the robot, the road, the boss, camp and the phone, made from real recordings. They are already in the game. Tap one to hear it alone, at the level the game plays it. Tap again for another take.</p>
<div id="groups"></div>
<div id="st">loading...</div>
<script>
const GROUPS = [
  ['THE FIGHT', [['blunt', 'a pipe or a fist lands'], ['blade', 'a blade cuts'], ['swing', 'the swing\'s air'], ['scuff', 'the swing misses'], ['hurt_body', 'a blow on one of yours'],
    ['down', 'struck down, alive'], ['thud', 'the body hits the floor'], ['high', 'he takes the roof']]],
  ['THE ROBOT', [['metal_step', 'its steel foot'], ['servo', 'a joint turning'], ['machine_hit', 'a blow on its steel'], ['machine_fall', 'it goes down']]],
  ['THE MAP', [['road_stop', 'the road stops you'], ['boss_found', 'a boss is marked'], ['they_come', 'they come for you'], ['camp_make', 'the fire catches'], ['camp_break', 'camp breaks, hours roll']]],
  ['THE PHONE', [['phone_tap', 'a button'], ['phone_open', 'a page opens'], ['phone_close', 'a page closes']]]
];
let AC = null, OUT = null, BUF = null, IDX = null; const last = {};
function chain(AC) { const o = AC.createGain(), c = AC.createDynamicsCompressor(), l = AC.createDynamicsCompressor();
  c.threshold.value = -14; c.knee.value = 8; c.ratio.value = 6; c.attack.value = 0.002; c.release.value = 0.12;
  l.threshold.value = -5; l.knee.value = 0; l.ratio.value = 20; l.attack.value = 0.001; l.release.value = 0.08;
  o.connect(c); c.connect(l); l.connect(AC.destination); return o; }
async function boot() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); OUT = chain(AC);
  IDX = await (await fetch('fight_punch/index.json')).json();
  BUF = await AC.decodeAudioData(await (await fetch('fight_punch/' + IDX.file)).arrayBuffer());
  document.getElementById('st').textContent = 'ready: ' + Object.keys(IDX.voices).length + ' sounds, from CC0 recordings (the list is in fight_punch/manifest.json)'; }
async function play(name, b) { await boot(); if (AC.state !== 'running') await AC.resume();
  const v = IDX.voices[name]; if (!v) return; const n = v.takes.length; let k = ((last[name] ?? -1) + 1) % n; last[name] = k;
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = BUF; g.gain.value = Math.pow(10, v.db / 20); s.connect(g); g.connect(OUT);
  s.start(AC.currentTime + 0.01, Math.max(0, v.takes[k][0] - 0.004), v.takes[k][1] + 0.004);
  document.querySelectorAll('button.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
  document.getElementById('st').textContent = name + ', take ' + (k + 1) + ' of ' + n; }
const root = document.getElementById('groups');
GROUPS.forEach(([title, list]) => { const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; root.appendChild(g);
  list.forEach(([name, what]) => { const b = document.createElement('button'); b.innerHTML = '<b>' + name.replace(/_/g, ' ').toUpperCase() + '</b><span>' + what + '</span>';
    b.onclick = () => play(name, b).catch(e => { document.getElementById('st').textContent = 'could not play: ' + e.message; }); g.appendChild(b); }); });
document.getElementById('st').textContent = 'tap a sound';
</script>
</body></html>

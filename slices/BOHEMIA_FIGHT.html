<script src="vote/ANIMATION_THE_AURA.js"></script>
<!-- __EVERYBODY_IDLES__ (ANIMATION [everybody idles], rule 130(a), Paolo 10/23: 'everyone's standing still... looking like a chess man'): a waiting man breathes and idles -->
<script src="../engine/bohemia_idles.js"></script>
<!-- ============================================================================
     THE FIGHT, REBUILT (COMBAT [rebuild], rule 63, Paolo 10/2: "start combat over from the
     ground up; re-create Battle Brothers combat... too far gone").

     Battle Brothers' combat, re-created in one file, on COMBAT TWO's ground: a 20 x 15
     board of house tiles cut from the city's blocks, at 45 degrees. THEIR RULES EXACTLY
     (rule 63d): 9 action points; a step costs what the ground costs (flat 2, rough 3,
     water 4, +1 to climb); a one-hand strike 4, a two-hand strike 6; the round goes by
     initiative and fatigue pushes you down it; hit chance is skill minus defence, defence
     past 50 counts half, +5 for each extra man around you, +10 from above; a shot loses
     some per tile, three quarters behind cover; the head is hit one time in four for half
     again; armour takes the hit before the body does; the morale ladder runs Confident,
     Steady, Wavering, Breaking, Fleeing; leaving a man's reach draws his free swing;
     injuries apart from hitpoints. NOT ONE OF THOSE NUMBERS IS TYPED BELOW: the rules
     script reads them through R() from records/target/bb/, where each sits beside the
     wiki page and the words it came from. gates/the_fight_reads_only_sourced_numbers_gate.js
     holds that line.

     OURS ON TOP (rule 63, (c)): house tiles on a square grid; our guns as their jobs
     (a pipe is their mace, a car door their shield, a pistol their dagger, the rifle
     their crossbow, a shotgun their handgonne, a sledge their hammer, bottles their
     throwing axes); YOU are downed, never dead; a hire struck down dies one time in five,
     else is laid up 30 to 40 days; the beat (120) is the clock every swing lands on;
     the fight opens with the whole board on the glass and the pinch brings it in (62).

     SET ASIDE until he calls this right (63a): the dial. The shot resolves in ONE
     function, resolveAttack(), hit chance in, result out, so the dial can take the
     important shot over without a rewrite.
     The driver: gates/the_rebuilt_fight_plays_gate.js plays a whole fight on his phone.
     ============================================================================ -->
<style>
:root{--bg:#0d0b09;--plate:#1d1712;--plate2:#15110d;--ink:#e6d9c2;--dim:#9c8c74;--gold:#d9a85a;--red:#c4553f;--line:#352b21;--green:#8fae6a;--paper-ink:#2a221a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;
  -webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;touch-action:none;display:block}
/* THE BAR, Battle Brothers' layout in our materials (rule 67a): the turn strip of faces on tape at the top;
   one cardboard bar at the bottom, taped on: his face and bars at the left, END TURN at the right, the
   skill row of 44-point squares of cracked glass under the thumbs, WAIT at its end. */
#top{position:fixed;left:0;right:0;top:0;padding:max(6px,env(safe-area-inset-top)) 6px 6px;z-index:4;display:flex;align-items:center;gap:6px;
  background:linear-gradient(rgba(13,11,9,.92),rgba(13,11,9,.55))}
#round{flex:0 0 auto;padding:3px 6px;font-weight:700;font-size:11px;color:var(--paper-ink);background:var(--mat-receipt,#e2dac6) center/cover;
  transform:rotate(-2deg);box-shadow:0 2px 3px rgba(0,0,0,.5)}
#order{flex:0 1 auto;min-width:0;display:flex;gap:4px;align-items:center;overflow:hidden;height:46px;padding:0 4px;background:var(--mat-tape) center/100% 100%}
#order canvas{flex:0 0 auto;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.6)}
#order canvas.now{outline:2px solid #f0d296}
#bauto{flex:0 0 auto;margin-left:auto;width:48px;height:44px;font:inherit;font-size:10px;font-weight:700;color:var(--paper-ink);border:0;
  background:var(--mat-receipt,#e2dac6) center/cover;box-shadow:0 2px 3px rgba(0,0,0,.5);transform:rotate(1.5deg)}
#bauto.on{outline:2px solid var(--gold);color:#6b3a14}
#bot{position:fixed;left:0;right:0;bottom:0;padding:10px 8px max(8px,env(safe-area-inset-bottom));z-index:4;
  background:var(--mat-cardboard,#3a2c1e);background-size:256px 256px;box-shadow:0 -4px 10px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,225,180,.10)}
#bot::before,#bot::after{content:'';position:absolute;top:-8px;width:72px;height:18px;background:var(--mat-tape) center/100% 100%}
#bot::before{left:18px;transform:rotate(-4deg)} #bot::after{right:22px;transform:rotate(3deg)}
#row1{display:flex;gap:8px;align-items:stretch;height:58px}
#card{flex:0 0 auto;width:56px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
#face{width:48px;height:48px;border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.6);background:#0d0b09}
#cnm{font-size:9px;font-weight:700;color:#efe3cc;margin-top:1px;white-space:nowrap;max-width:60px;overflow:hidden;text-shadow:0 1px 0 #000}
#stats{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.bar{height:5px;background:rgba(0,0,0,.55);border-radius:1px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.6)}
.bar i{display:block;height:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
#apicons{display:flex;gap:6px;align-items:center;margin-top:1px}
#ap{display:flex;gap:2px}
#ap i{width:7px;height:5px;border-radius:1px;background:rgba(0,0,0,.5)}
#ap i.on{background:var(--gold)}
#picons{display:flex;gap:2px;overflow:hidden}
#bend{flex:0 0 auto;width:76px;font:inherit;font-weight:700;font-size:12px;color:var(--paper-ink);border:0;
  background:var(--mat-receipt,#e2dac6) center/cover;box-shadow:0 3px 4px rgba(0,0,0,.55);transform:rotate(-1.5deg)}
#row2{display:flex;gap:6px;margin-top:8px;height:48px;align-items:center}
#skills{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;height:48px;align-items:center}
#skills::-webkit-scrollbar{display:none}
.sq{flex:0 0 auto;width:46px;height:46px;position:relative;border:1px solid rgba(0,0,0,.6);border-radius:4px;padding:0;
  background:var(--mat-glass,#151210) center/cover;box-shadow:0 2px 3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);color:#efe3cc;font:inherit}
.sq canvas{position:absolute;left:7px;top:5px}
.sq b{position:absolute;right:3px;bottom:2px;font-size:10px;color:#f0d296;text-shadow:0 1px 0 #000}
.sq:disabled{opacity:.32}
.sq.on{outline:2px solid #8fb8e0}
.sq.hot{outline:2px solid #e0604a}
/* THE EMPTY GUN SHOUTS (COMBAT [the reload is loud], rule 124, Paolo 10/20: 'if I need to reload it needs to be very apparent
   on the screen... super clear'): the moment the man you control has an empty gun, the strike square gives its place to ONE BIG
   RELOAD, a VCR's warning on the cracked glass, never a game-show banner: the ROM's white letters with the tape's red and blue
   ghosts a pixel either side, scanlines over the glass, a red rim; it BLINKS on the beat (on for most of it, then dim: an
   on-screen display steps, it does not breathe), a bright tracking band rolls down it once a beat, and a tap that would have
   fired empty kicks it. --beat is the fight's beat and --ph its phase, set by hud(), so the blink lands on the music's beat. */
#breload.big{width:132px;display:flex;align-items:center;gap:6px;padding:0 8px 0 7px;overflow:hidden;opacity:1;
  border:1px solid #c4553f;outline:1px solid rgba(0,0,0,.7);outline-offset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.36) 0 1px,rgba(0,0,0,0) 1px 3px),var(--mat-glass,#151210) center/cover;
  animation:rlBlink var(--beat,500ms) steps(1,end) var(--ph,0ms) infinite}
#breload.big canvas{position:static;flex:0 0 auto}
#breload.big .rl{flex:1;text-align:left;font-family:var(--face-casing,ui-monospace,monospace);font-size:16px;letter-spacing:1px;line-height:1;
  color:#f2ead8;text-shadow:-1px 0 rgba(224,64,46,.9),1px 0 rgba(80,200,230,.65),0 1px 0 #000}
#breload.big b{right:5px;bottom:3px;font-size:9px;color:#f2ead8;letter-spacing:.5px}
#breload.big::after{content:'';position:absolute;left:0;right:0;top:0;height:4px;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,0),rgba(242,234,216,.28),rgba(255,255,255,0));
  animation:rlRoll var(--beat,500ms) linear var(--ph,0ms) infinite}
#breload.big:disabled{opacity:.72;animation:none;border-color:#7a2a1c}
#breload.big:disabled .rl{font-size:12px;color:#c8bda8}
#breload.poke,#breload.big.poke{animation:rlPoke var(--beat,500ms) steps(6,end) 1}
@keyframes rlBlink{0%{filter:none}62%{filter:brightness(.5) saturate(.6)}}
@keyframes rlRoll{0%{transform:translateY(-6px)}100%{transform:translateY(48px)}}
@keyframes rlPoke{0%{transform:translateY(-7px) scale(1.14);filter:brightness(1.8);outline:3px solid #f2ead8}
  35%{transform:translateX(3px) skewX(-8deg)}70%{transform:translateX(-2px)}100%{transform:none}}
#breload.last{outline:2px solid #e0a044;opacity:.8}
/* the rounds while he aims (rule 124): his gun's bullets on the receipt, a spent one an empty case */
#say .rds{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:5px}
#say .rds i{display:block;width:4px;height:10px;border-radius:2px 2px 0 0;background:#7a3d10;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
#say .rds i.out{background:transparent;box-shadow:inset 0 0 0 1px rgba(42,34,26,.45)}
#say b.dry{color:#a3261a}
/* ONE TAP TO SEE, ONE TAP TO DO (COMBAT [one tap to see, one tap to do]; his 10/19 'better for the touch'): the first tap
   shows the whole result where the finger is, a receipt tag on the board (SHOOT 72% over the man, WALK 4 AP over the tile),
   and the one big button bottom right names what it will do now (WALK, SHOOT, HIT, THROW, or END TURN), ringed in amber when
   it does more than end the turn; the second tap on the same spot, or the button, does it */
#bend.go{outline:2px solid #e0a044;outline-offset:1px}
html[data-materials] #bend.walk::before{background-image:var(--mark-walk)}
html[data-materials] #bend.shoot::before,html[data-materials] #bend.throw::before{background-image:var(--mark-shoot)}
html[data-materials] #bend.hit::before{background-image:var(--mark-hit)}
#bend .sub{display:block;font-size:10px;word-spacing:normal;margin-top:3px;opacity:.85}
#pick{position:fixed;display:none;z-index:3;padding:3px 7px 4px;pointer-events:none;font-family:var(--face-casing,ui-monospace,monospace);
  font-size:13px;letter-spacing:.5px;line-height:1.15;color:var(--paper-ink);background:var(--mat-receipt,#e2dac6) center/100% 100%;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.8));transform:rotate(-1.5deg);white-space:nowrap;text-align:center}
#pick i{display:block;font-style:normal;font-size:10px;color:#a3261a}
/* THE FIRST FIGHT TEACHES (COMBAT [the first fight teaches]): one veteran of the company says it, his own face beside his
   words, on receipt paper at the top of the board under the strip; it covers no man's middle and takes no tap */
#vet{position:fixed;left:8px;display:none;z-index:4;pointer-events:none;align-items:center;gap:8px;max-width:min(calc(100vw - 16px),420px);
  padding:6px 10px 8px 6px;color:var(--paper-ink);background:var(--mat-receipt,#e2dac6) center/100% 100%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8));transform:rotate(.5deg)}
#vet canvas{flex:0 0 auto;width:44px;height:44px;border-radius:2px;background:#0d0b09}
#vet b{display:block;font-family:var(--face-casing,ui-monospace,monospace);font-weight:400;font-size:11px;letter-spacing:.5px;color:#5c2410}
#vet span{display:block;font-family:var(--face-rom,ui-monospace,monospace);font-size:12px;line-height:1.3;min-height:1.3em}
/* THE TURN ENDS ITSELF (COMBAT [the turn ends itself], rule 125): Battle Brothers' numbers on his bar (the AP and the wind
   left, as numbers beside the pips), and when he can afford nothing, OUT OF ACTION POINTS over his bars for a beat and a
   half, the same VCR warning as the empty gun, before the turn passes by itself */
#apn{flex:0 0 auto;font-family:var(--face-casing,ui-monospace,monospace);font-size:9px;letter-spacing:.3px;color:#efe3cc;white-space:nowrap;text-shadow:0 1px 0 #000}
#apn.low{color:#ff8a6a}
#outap{position:fixed;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;line-height:1.1;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,rgba(0,0,0,0) 1px 3px),rgba(8,6,4,.92);border:1px solid #c4553f;
  font-family:var(--face-casing,ui-monospace,monospace);font-size:13px;letter-spacing:1px;color:#f2ead8;text-align:center;
  text-shadow:-1px 0 rgba(224,64,46,.9),1px 0 rgba(80,200,230,.65);animation:rlBlink var(--beat,500ms) steps(1,end) infinite}
#outap small{display:block;font-size:10px;letter-spacing:.5px;margin-top:2px}
#bwait{flex:0 0 auto;width:56px;height:46px;font:inherit;font-weight:700;font-size:11px;color:var(--paper-ink);border:0;
  background:var(--mat-receipt,#e2dac6) center/cover;box-shadow:0 2px 3px rgba(0,0,0,.55);transform:rotate(1deg)}
#bend:disabled,#bwait:disabled{opacity:.45}
#say{position:fixed;left:50%;transform:translateX(-50%) rotate(-.6deg);z-index:4;display:none;pointer-events:none;max-width:92vw;padding:4px 10px;
  font-size:11px;color:var(--paper-ink);background:var(--mat-receipt,#e2dac6) center/cover;box-shadow:0 2px 4px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* THE FLIPPED PHONE'S LOOK (rule 88): the tape ends at the last face (it was stretched across the whole glass, a smear
   over the shop fronts); on a wide glass the hint sits in the strip's own empty space beside the faces, never on the men */
/* THE AIM (rule 120(b)): what the blow does and, when the arm is bad for him, one plain line; it wraps on the receipt */
#say.aim{white-space:normal;text-align:left;line-height:1.35;max-width:min(92vw,380px)}
#say.aim b{font-size:13px}
#say.instrip,html[data-materials] #say.instrip{right:auto;margin:0;transform:translateY(-50%) rotate(-.6deg);white-space:normal;max-width:none;line-height:1.3;max-height:calc(2.6em + 13px);overflow:hidden}
#drawer{position:fixed;left:10px;right:10px;display:none;z-index:5;color:var(--paper-ink);
  background:var(--mat-receipt,#e2dac6) center/cover;box-shadow:0 4px 10px rgba(0,0,0,.6);padding:12px 12px 14px;font-size:11px;transform:rotate(-.4deg)}
#drawer .r{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed rgba(42,34,26,.3)}
#drawer .p{display:flex;gap:6px;align-items:center;margin-top:4px;font-weight:700}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,6,4,.78);z-index:6}
#over .box{width:min(92vw,420px);color:var(--paper-ink);background:var(--mat-receipt,#e2dac6) center/cover;
  box-shadow:0 8px 24px rgba(0,0,0,.7);padding:16px 14px 14px;transform:rotate(-.5deg)}
#over h2{margin:0 0 8px;font-size:15px;letter-spacing:.06em;text-align:center;border-bottom:2px dashed rgba(42,34,26,.4);padding-bottom:6px}
#over p{margin:4px 0;font-size:11px}
#over table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
#over td,#over th{padding:4px 2px;text-align:right;border-bottom:1px dashed rgba(42,34,26,.25)}
#over th{font-weight:400;opacity:.7}
#over td:first-child,#over th:first-child{text-align:left;font-weight:700}
#over .lv{color:#7a3d10;font-weight:700}
#over .inj{color:#8a2a18;font-size:9px;font-weight:700}
#over button{margin-top:12px;width:100%;min-height:46px;color:#efe3cc;border:0;font:inherit;font-weight:700;
  background:var(--mat-glass,#151210) center/cover;box-shadow:0 2px 4px rgba(0,0,0,.5)}
/* THE BAR ON EVERY SCREEN (rules 62 and 72; slices/bohemia_screen_class.js): the phone held upright keeps the two rows
   above. Wide screens get Battle Brothers' own bar, ONE ROW: his face and bars at the left, the skill squares in the
   middle, WAIT and END TURN at the right. On its side the phone's bar runs the whole width inside the notch's safe
   area, the strip of faces slims; on a tablet or a computer the bar and the strip are a taped plate centred at the
   width of Battle Brothers' own bar, the board running out to the edges round them. */
html[data-screen=phone_landscape] #bot,html[data-screen=tablet] #bot,html[data-screen=computer] #bot{display:flex;align-items:center;gap:8px;
  padding:8px max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
html[data-screen=phone_landscape] #row1,html[data-screen=tablet] #row1,html[data-screen=computer] #row1,
html[data-screen=phone_landscape] #row2,html[data-screen=tablet] #row2,html[data-screen=computer] #row2{display:contents}
html[data-screen=phone_landscape] #card,html[data-screen=tablet] #card,html[data-screen=computer] #card{order:1}
html[data-screen=phone_landscape] #stats,html[data-screen=tablet] #stats,html[data-screen=computer] #stats{order:2;flex:0 0 200px}
html[data-screen=phone_landscape] #skills,html[data-screen=tablet] #skills,html[data-screen=computer] #skills{order:3;flex:1;margin-left:6px}
html[data-screen=phone_landscape] #bwait,html[data-screen=tablet] #bwait,html[data-screen=computer] #bwait{order:4}
html[data-screen=phone_landscape] #bend,html[data-screen=tablet] #bend,html[data-screen=computer] #bend{order:5;height:56px}
html[data-screen=phone_landscape] #top{padding:max(4px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left))}
html[data-screen=phone_landscape] #order{height:44px}
html[data-screen=tablet] #bot,html[data-screen=computer] #bot{left:50%;right:auto;bottom:12px;width:min(980px,calc(100vw - 24px));transform:translateX(-50%);border-radius:3px}
html[data-screen=tablet] #top,html[data-screen=computer] #top{left:50%;right:auto;top:8px;width:min(980px,calc(100vw - 24px));transform:translateX(-50%);
  border-radius:3px;padding:6px;background:rgba(13,11,9,.78);box-shadow:0 3px 8px rgba(0,0,0,.5)}
#num{position:fixed;display:none;z-index:3;padding:2px 6px;font-weight:700;font-size:13px;pointer-events:none;
  background:var(--mat-receipt,#e2dac6) center/cover;filter:drop-shadow(rgba(0,0,0,.6) 0px 1px 0px);transform:rotate(-2deg)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);z-index:7;background:var(--bg);letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div id="round">R1</div><div id="order"></div><button id="bauto">AUTO</button></div>
<div id="say"></div>
<div id="bot">
  <div id="row1">
    <div id="card"><canvas id="face" width="144" height="144"></canvas><div id="cnm">-</div></div>
    <div id="stats"><div class="bar"><i id="bhp"></i></div><div class="bar"><i id="barm"></i></div><div class="bar"><i id="bfat"></i></div>
      <div id="apicons"><div id="ap"></div><span id="apn"></span><div id="picons"></div></div></div>
    <button id="bend">END TURN</button>
  </div>
  <div id="row2">
    <div id="skills"><button class="sq" id="bstrike" disabled></button><button class="sq" id="breload" disabled></button></div>
    <button id="bwait">WAIT</button>
  </div>
</div>
<div id="outap"></div>
<div id="drawer"></div>
<div id="num"></div>
<div id="pick"></div>
<div id="vet"><canvas id="vetface" width="132" height="132"></canvas><div><b id="vetname"></b><span id="vetline"></span></div></div>
<div id="over"><div class="box"><h2 id="oh"></h2><div id="ob"></div><button id="oagain">AGAIN</button></div></div>
<div id="load">LOADING THE GROUND</div>

<script id="fight-data">
'use strict';
/* THE DATA: every file the fight reads, and nothing else. R('a.b.c') is the only door from
   the rules to a number: it returns the row's value and remembers that it was read, so
   the gate can list every number the fight felt. 'ours.' reads Paolo's rulings, 'ai.'
   the behaviours, anything else Battle Brothers' rules. */
const DATA_FILES = [
  '../records/target/bb/rules.json', '../records/target/bb/ours.json', '../records/target/bb/ai.json',
  '../records/target/bb/enemies.json', '../records/target/bb/weapons.json', '../records/target/bb/armor.json',
  '../records/target/bb/injuries.json', '../records/target/bb/backgrounds.json', 'fight_ground/fight_ground.json',
  '../records/target/bb/perks.json', '../records/target/bb/perk_translation.json', 'fight_rig/fight_rig.json',
  '../records/target/bb/weapon_lines.json',
  /* WORLD's one ground table and its district list (rule 59: every floor tile is a translation; never a second list of grounds) */
  '../records/target/BOHEMIA_GROUND_EFFECTS.json', '../records/target/BOHEMIA_BOARD_KINDS.json',
  /* a beast's weapon is its bite, copied from the wiki's skill pages (COMBAT, the fight holds the grid, rule 117e); its body is its rig
     model in slices/fight_rig (rule 121), ANIMATION's flat sheet is not read */
  '../records/target/bb/beast_attacks.json',
  /* CHARACTER's armour tiers, so the line can name what he wears (rule 120(b): 'your pipe barely dents his plate') */
  '../records/target/bb/armor_tiers.json',

    const ty0 = Math.min.apply(null, on.map(function (v) { return v.y; })), ty1 = Math.max.apply(null, on.map(function (v) { return v.y; }));
    const rows = Math.max(ty1 - ty0 + 1, R('ours.formation').slots_per_row) + FOUR_ROOM * (1 + 1);
    const zu = Math.max(UI.coverFar || UI.far, Math.min(UI.near, (W - (FIT_PAD + MAN_IDLE * FIG_HALF) * (1 + 1)) / Math.max((x1 - x0) * UI.tw, 1), ah / (rows * UI.th)));
    return { z: zu, cx: (x0 + x1) / (1 + 1) * UI.tw, cy: (ty0 + ty1 + 1) / (1 + 1) * UI.th };
  }
  const z = Math.max(UI.coverFar || UI.far, Math.min(UI.near, (W - (FIT_PAD + MAN_IDLE * FIG_HALF) * (1 + 1)) / Math.max((x1 - x0) * UI.tw, 1), zh));
  if (z < UI.far) UI.far = z;   /* the pinch's far stop never closer than both teams */
  const m = H > W ? MAN_IDLE : Math.min(MAN_IDLE, MAN_ROWS * UI.th * z);
  return { z: z, cx: (x0 + x1) / (1 + 1) * UI.tw, cy: (y0 + y1) / (1 + 1) * UI.th - m / z / (1 + 1) };
}
function allFramed(more) { return FIGHT.S.units.filter(FIGHT.onField).concat(more || []).every(function (v) { const b = manBox(v.x, v.y); return b.x - manH() * FIG_HALF >= 0 && b.x + manH() * FIG_HALF <= W && b.head >= TOPH && b.feet <= H - BOTH; }); }
function fitNow(ms) { const f = fitBoth(); if (ms) glideTo(f.cx, f.cy, f.z, ms); else { UI.zoom = f.z; UI.cx = f.cx; UI.cy = f.cy; clampCam(); } }
/* FIGHT: the line is set; the camera goes in on it the way the open always did */
function fightNow() {
  if (!FIGHT.startFight()) return;
  UI.dsel = null; UI.drag = null; keepLine(); say(UI.auto ? '' : WALK_SAY);
  fitNow(beatMs() * (1 + 1));   /* both teams stay on the glass (rule 104a) */
  hud();
}
function tapAt(px, py) {
  if (FIGHT.S.deploy && !UI.auto && !FIGHT.S.over) { deployTap(px, py); return; }
  if (!FIGHT.S.over && FIGHT.current() && !crewControlled(FIGHT.current())) { UI.skip = true; return; }   /* skip their turn */
  const u = FIGHT.current(); if (!crewControlled(u) || UI.anim.length || FIGHT.S.over) return;
  const p = tileAt(px, py), S = FIGHT.S;
  if (p.x < 0 || p.y < 0 || p.x >= S.w || p.y >= S.h) return;
  UI.drawer = false; document.getElementById('drawer').style.display = 'none';
  if (UI.skillMode) {
    const id = UI.skillMode; UI.skillMode = null;
    if (!FIGHT.useSkill(u, id, p)) say('Not there.'); else take();
    return;
  }
  const th = UI.th * UI.zoom, hgt = manH();
  const body = S.units.filter(function (v) {
    if (!FIGHT.onField(v) || (v.side === 'them' && !FIGHT.sideSees('you', v))) return false;
    const X = sx((v.x + .5) * UI.tw), Yf = sy((v.y + .9) * UI.th);
    return Math.abs(px - X) <= Math.max(hgt * .28, UI.tw * UI.zoom * .3) && py <= Yf + th * .1 && py >= Yf - hgt;
  }).sort(function (a, b) { return b.y - a.y; })[0], onTile = S.units.filter(function (v) { return FIGHT.onField(v) && v.x === p.x && v.y === p.y; })[0];
  /* the man ON the tile first; a body over an empty tile answers only if it is theirs (aim), never one of yours (rule 104a:
     zoomed out to both teams, your own men's bodies cover the tiles behind them, and those tiles must still be walkable) */
  let who = onTile || (body && body.side === 'them' ? body : null);
  UI.tapped = true;   /* his first tap: the open's how-to line has done its job and does not come back */
  /* NO BODY COVERS A TILE HE NEEDS (one tap to see, one tap to do): a body of theirs drawn over an empty tile his arm cannot
     reach from here gives the finger to the tile under it, when he can walk there */
  if (who && !onTile && !FIGHT.canStrike(u, who) && !FIGHT.dryAt(u, who) && FIGHT.pathTo(u, p.x, p.y, FIGHT.reach(u, null, true))) who = null;
  if (who && who.side === 'them' && FIGHT.sideSees('you', who) && UI.sweep) {
    /* WEAPON SHAPES: a sweep armed: the first tap lights its shape, the second swings it */
    if (!FIGHT.canSweep(u, who, UI.sweep)) { say(who.name + ' is out of the ' + UI.sweep.toLowerCase() + '\'s reach.' + reachWords(u), true); UI.pend = null; return; }
    if (UI.pend && UI.pend.target === who && UI.pend.sweep) { const nm = UI.pend.sweep; UI.pend = null; UI.sweep = null; FIGHT.sweep(u, who, null, nm); take(); return; }
    UI.pend = { target: who, sweep: UI.sweep, pv: FIGHT.preview(u, who) }; sweepSay(u, who, UI.sweep); hud(); return;
  }
  if (who && who.side === 'them' && FIGHT.sideSees('you', who)) {
    if (FIGHT.dryAt(u, who)) { UI.pend = null; dryTap(u); hud(); return; }   /* rule 124: never a silent refusal, never 'out of reach' */
    if (!FIGHT.canStrike(u, who)) { const rr = FIGHT.rounds(u), spent = rr && rr.left <= 0 && !FIGHT.reloadSkill(u.weapon);
      say(spent ? 'No ' + armName(u, u.weapon) + ' left.' : who.name + ' is out of reach.' + reachWords(u), true); if (spent) sfx('ui_deny'); UI.pend = null; return; }
    if (UI.pend && UI.pend.target === who) { UI.pend = null; FIGHT.strike(u, who); take(); return; }
    UI.pend = { target: who, pv: FIGHT.preview(u, who) }; aimSay(u, who);
    /* the first fight teaches (COMBAT [the first fight teaches]): the first aim; the first man in cover */
    if (!teach('aim') && (FIGHT.hitChance(u, who).parts.indexOf('cover') >= 0 || S.cover[who.y][who.x])) teach('cover');
    hud(); return;
  }
  if (who) { UI.pend = null; return; }
  const f = FIGHT.reach(u, null, true), path = FIGHT.pathTo(u, p.x, p.y, f);
  if (!path) { UI.pend = null; say('Too far for the AP left.'); return; }
  if (UI.pend && UI.pend.tile && UI.pend.tile.x === p.x && UI.pend.tile.y === p.y) { UI.pend = null; FIGHT.moveTo(u, p.x, p.y, true); take(); return; }
  /* the price of walking past: every tile left inside a man's reach is a free swing */
  let swings = 0, at = { x: u.x, y: u.y };
  path.forEach(function (q) { swings += FIGHT.zocOn(u, at.x, at.y).length; at = q; });
  UI.pend = { tile: p, path: path, cost: f.best[f.key(p.x, p.y)], swings: swings };
  /* what standing there does (rule 59; rule 117b: only where the ground changes something) and what the walk costs in swings;
     the AP and 'tap again' are no longer sentences: the tag on the tile and the big button say WALK and its AP */
  const gs = FIGHT.groundSay(p.x, p.y);
  say((gs || '') + (swings ? (gs ? ' ' : '') + swings + ' free swing' + (swings > 1 ? 's' : '') + ' on the way.' : ''));
  if (S.cover[p.y][p.x]) teach('cover');
  hud();
}
document.getElementById('bstrike').onclick = function () { audio(); if (UI.heldCard) { UI.heldCard = false; return; } const u = FIGHT.current(); if (crewControlled(u) && UI.pend && UI.pend.target) { const t = UI.pend.target, nm = UI.pend.sweep; UI.pend = null; UI.sweep = null; if (nm) FIGHT.sweep(u, t, null, nm); else FIGHT.strike(u, t); take(); } };
document.getElementById('bwait').onclick = function () { audio(); const u = FIGHT.current(); if (crewControlled(u)) { UI.pend = null; UI.skillMode = null; FIGHT.wait(u); take(); } };
document.getElementById('bend').onclick = function () { audio();
  if (FIGHT.S.deploy) { fightNow(); return; }
  /* the big button does what it names (one tap to see, one tap to do): the walk or the blow picked, else the end of the turn */
  const u = FIGHT.current(); if (!crewControlled(u)) return;
  const p = UI.pend, act = nextAct(u); UI.pend = null; UI.skillMode = null; UI.sweep = null;
  if (act && p.target && p.sweep) FIGHT.sweep(u, p.target, null, p.sweep);
  else if (act && p.target) FIGHT.strike(u, p.target);
  else if (act && p.tile) FIGHT.moveTo(u, p.tile.x, p.tile.y, true);
  else FIGHT.endTurn(u);
  take(); hud(); };
document.getElementById('breload').onclick = function () { audio(); if (UI.heldCard) { UI.heldCard = false; return; } const u = FIGHT.current(); if (crewControlled(u)) { UI.pend = null; if (FIGHT.reload(u)) say(''); take(); } };
document.getElementById('bauto').onclick = function () { audio(); UI.auto = !UI.auto; UI.pend = null; UI.skillMode = null; };
document.getElementById('oagain').onclick = function () { document.getElementById('over').style.display = 'none'; start(); };

/* ---------------- boot ---------------- */
let hudN = 0;
/* the next frame is asked for FIRST: one bad frame is reported, it never freezes the fight (it did, 10/2) */
function frame(now) {
  requestAnimationFrame(frame);
  try { tick(now); draw(now); placeTag(); placePick(); tickVet(now); if (++hudN % 6 === 0) hud(); }
  catch (e) { if (!UI.lastErr || now - UI.lastErr > 2000) { UI.lastErr = now; setTimeout(function () { throw e; }); } }
}
function start() {
  const o = window.FIGHT_OPTS || {};
  if (o.seed !== undefined) SEED = o.seed >>> 0;
  if (o.speed) UI.speed = o.speed;
  if (o.auto) UI.auto = true;
  MAN_IDLE = o.manPx > 0 ? o.manPx : MAN_DEFAULT;
  FIGHT.setup(o);
  UI.anim = []; UI.pops = []; UI.beats = 0; UI.feedLines = []; FIGHT.S.events = [];
  UI.vet = null; UI.tapped = false; UI.pend = null; document.getElementById('vet').style.display = 'none';
  UI.spentKey = null; hideSpent();
  return bakeBoard().then(function () {
    resize();
    /* THE OPEN (rule 104a, amending 79's 'on your line, a pinch shows the rest'): both teams on the glass, the man at 112.
       Two beats of stillness (nothing happens in the first second). */
    const dep = FIGHT.S.deploy && !UI.auto;
    fitNow();   /* BOTH TEAMS ON ONE SCREEN (rule 104a): the open holds every man of both teams, no swipe; the man still 112 */
    UI.t0 = performance.now(); UI.openUntil = UI.t0 + beatMs() * 4.5;
    document.getElementById('load').style.display = 'none';
    MUSIC.started();   /* rule 126: the board is up, the song lifts at the next bar */
    /* the open's line names whose move it is: a pack of wolves (initiative 150) moves before his men, and 'tap inside the chalk'
       under a wolf's turn tells him to do something he cannot (COMBAT [the fight holds the grid]) */
    const first = FIGHT.current();
    say(dep ? deploySay() : first && first.side === 'them' && !UI.auto ? THEIRS_SAY : WALK_SAY); hud();
  });
}
window.addEventListener('resize', resize);
try { BohemiaMaterials.apply(); } catch (_e) {}
actMarks();
try { BohemiaScreen.watch(function () { resize(); }); } catch (_e) {}
loadAll().then(function () { resize(); return start(); }).then(function () { requestAnimationFrame(frame); })
  .catch(function (e) { document.getElementById('load').textContent = 'THE GROUND DID NOT LOAD: ' + e.message; });
window.FIGHT_UI = UI;
</script>

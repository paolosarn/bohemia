<!--
  ===========================================================================
  BOHEMIA REFERENCE LAB 04 — PROJECT ZOMBOID: LOOTING / RUMMAGING / ENCUMBRANCE
  laws/BOHEMIA_ADDENDUM_LAB_IS_WHOLE_MECHANICS_7_26_26.md

  Backlog LAB-2: "ZOMBOID LOOT LOOP: containers, search, weight, the tension of
  rummaging a house."

  THREE MECHANICS, IN A HOUSE YOU WALK AROUND:
    LOOTING      the real two-stage procedural distribution. A room plus a
                 container type picks named tables by weightChance; each table
                 rolls a weighted item list; and every table has its own
                 separate JUNK roll, which is why rummaging feels like
                 rummaging instead of shopping.
    RUMMAGING    the real time economy. Every item you touch costs time, and
                 what it costs depends on how heavy it is and how full the bag
                 you are putting it in already is.
    ENCUMBRANCE  the consequence, exactly as the source computes it, and NOT
                 what I first assumed: grabbing off a shelf is a FLAT cost, and
                 the fullness tax lands when you PACK what you grabbed into a
                 bag. Project Zomboid charges you for organising, not for
                 grabbing. So the loop here is the real two-step one players
                 actually do: take into your hands, then pack into the bag.

  SOURCE: the vanilla Project Zomboid Lua, read directly.
    server/Items/Distributions.lua           room -> container -> procList
    server/Items/ProceduralDistributions.lua the tables, rolls, weights, junk
    client/TimedActions/ISInventoryTransferAction.lua:784-833  the time formula
  Numbers + citations: records/lab/BOHEMIA_LAB_ZOMBOID_TEARDOWN_7_26_26.txt
  Patterns: records/lab/BOHEMIA_LAB_ZOMBOID_PATTERN_NOTE_7_26_26.md

  NOT BOHEMIA. No engine module, no bank, no alpha. Placeholder art only.
  gates/lab_gate.js walks this house and plays all three loops in it.
  ===========================================================================
-->

/* =========================================================================
   THE NUMBERS. Read off the vanilla Project Zomboid Lua. Every key is
   cross-checked against the teardown record by gates/lab_gate.js, which fails
   the build if one loses its file:line citation.
   ========================================================================= */
var PZ = {
  /* --- the rummage time economy (ISInventoryTransferAction.lua:784-833) --- */
  T_BASE:         120,   /* maxTime for moving something between two things on you */
  T_CONTAINER:    50,    /* taking from, or putting into, a container in the world */
  T_WEIGHT_CAP:   3,     /* w = min(item weight, 3): heavier costs more, capped   */
  T_DELTA_FLOOR:  0.4,   /* destCapacityDelta is floored here                     */
  T_FLOOR_DROP:   0.2,   /* dropping to the floor from a container                 */
  T_SELF_DROP:    0.1,   /* dropping to the floor out of your own hands            */
  T_DEXTROUS:     0.5,   /* the trait multiplier                                  */
  T_ALLTHUMBS:    2.0,   /* and its opposite                                      */
  /* --- the loot mechanism (Distributions / ProceduralDistributions) --- */
  CHANCE_BASE:    100,   /* weightChance is out of 100                            */
  GUARANTEED_MIN: 98,    /* min>=98 in the real data is a "guaranteed" sentinel    */
  /* --- ours, declared: the master keeps these outside the Lua --- */
  TICKS_PER_SEC:  36,    /* ours (declared): PZ action ticks are a Java unit       */
  HANDS_CAPACITY: 5,     /* ours (declared): what you can hold before packing      */
  BAG_CAPACITY:   20     /* ours (declared): item weights live in media/scripts    */
};
var TICK = 1000 / 60;

/* ITEM WEIGHT IS OURS, DECLARED. Project Zomboid keeps item weights in
   media/scripts/items_*.txt, which is not in the Lua repo, so this is a
   category guess in the right ballpark and it is labelled as ours everywhere
   it shows up. The MECHANISM (weight drives time) is theirs and exact. */
function weightOf(name) {
  var n = name.toLowerCase();
  if (/water|jug|gascan|propane|weight|sledge|axe|barbell/.test(n)) return 8;
  if (/pot|pan|kettle|toolbox|tv|radio|generator|bag_|suitcase/.test(n)) return 3;
  if (/canned|tinned|beans|soup|bottle|book|magazine|paperback|hammer|saw|wrench|torch/.test(n)) return 1;
  if (/pills|bandaid|bandage|needle|thread|nail|screw|battery|key|spoon|fork|knife|comb|floss/.test(n)) return 0.1;
  return 0.4;
}
function pretty(name) { return name.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase(); }

/* =========================================================================
   MECHANIC 1 — LOOTING: the real two-stage procedural distribution.
   ========================================================================= */
var RNG = Math.random;
function rnd() { return RNG(); }
function weightedPick(items) {
  if (!items || !items.length) return null;   /* an empty table yields nothing */
  var total = 0, i;
  for (i = 0; i < items.length; i++) total += items[i][1];
  var r = rnd() * total;
  for (i = 0; i < items.length; i++) { r -= items[i][1]; if (r <= 0) return items[i][0]; }
  return items[items.length - 1][0];
}
/* STAGE 1: the room and the CONTAINER TYPE together pick which named tables are
   in play, each on its own weightChance out of 100, then min..max instances.
   STAGE 2: each table rolls its weighted item list `rolls` times, and then its
   JUNK table rolls separately. The junk is the point. */
function rollContainer(room, container) {
  var procList = (PZ_ROOMS[room] || {})[container];
  if (!procList) return [];
  var out = [];
  procList.forEach(function (entry) {
    if (rnd() * PZ.CHANCE_BASE >= entry.w) return;                 /* weightChance */
    var count = entry.min >= PZ.GUARANTEED_MIN ? 1
      : entry.min + Math.floor(rnd() * (entry.max - entry.min + 1));
    var table = PZ_TABLES[entry.t];
    if (!table || !count) return;
    for (var c = 0; c < count; c++) {
      for (var r = 0; r < table.rolls; r++) {
        var pick = weightedPick(table.items);
        if (pick) out.push({ name: pick, from: entry.t, junk: false });
      }
      if (table.junk) {
        for (var j = 0; j < table.junk.rolls; j++) {
          var jp = weightedPick(table.junk.items);
          if (jp) out.push({ name: jp, from: entry.t, junk: true });
        }
      }
    }
  });
  return out;
}

/* =========================================================================
   MECHANIC 2 + 3 — RUMMAGING and ENCUMBRANCE, which are the same formula.
   ISInventoryTransferAction:new, lines 784-833, rule for rule.
   ========================================================================= */
function transferTicks(item, opts) {
  var o = opts || {};
  var maxTime = PZ.T_BASE;
  var destCapacityDelta = 1.0;
  if (o.fromSelf && o.toSelf) {
    destCapacityDelta = o.destWeight / o.destMax;       /* packing your own bag */
  } else if (o.fromSelf) {
    maxTime = PZ.T_CONTAINER;                           /* putting it away     */
  } else if (o.toSelf) {
    maxTime = PZ.T_CONTAINER;                           /* taking it           */
  }
  if (destCapacityDelta < PZ.T_DELTA_FLOOR) destCapacityDelta = PZ.T_DELTA_FLOOR;
  var w = weightOf(item);
  if (w > PZ.T_WEIGHT_CAP) w = PZ.T_WEIGHT_CAP;
  maxTime = maxTime * w * destCapacityDelta;
  if (o.toFloor) maxTime = maxTime * (o.fromSelf ? PZ.T_SELF_DROP : PZ.T_FLOOR_DROP);
  if (o.dextrous) maxTime = maxTime * PZ.T_DEXTROUS;
  if (o.allThumbs) maxTime = maxTime * PZ.T_ALLTHUMBS;
  return maxTime;
}

/* =========================================================================
   THE HOUSE. Rooms are TAGGED, because in the real data the room and the
   container type together decide what is inside.
   ========================================================================= */
var HOUSE = [
  '###################',
  '#.....#.......#...#',
  '#..K..#...L...#.B.#',
  '#.....+.......+...#',
  '#CCOO.#..sSf..#.mc#',
  '###+###.......#####',
  '#.....#...+...#####',
  '#..D..+...#...#####',
  '#.dwl.#...#...#####',
  '###################'
];
/* which room each tile belongs to, painted by hand because a room is authored */
var ROOM_MAP = [
  '                   ',
  ' KKKKK  LLLLLLL BBB',
  ' KKKKK  LLLLLLL BBB',
  ' KKKKK  LLLLLLL BBB',
  ' KKKKK  LLLLLLL BBB',
  '                   ',
  ' DDDDD  LLLLLLL    ',
  ' DDDDD  LLLLLLL    ',
  ' DDDDD  LLLLLLL    ',
  '                   '
];
var ROOM_OF = { K: 'kitchen', L: 'livingroom', B: 'bathroom', D: 'bedroom' };
/* tile char -> container type, using the real container keys from the Lua */
var CONTAINER_OF = {
  C: 'counter', O: 'overhead', S: 'shelves', s: 'sidetable', f: 'fridge',
  w: 'wardrobe', d: 'dresser', l: 'locker', m: 'medicine', c: 'crate', D2: 'desk'
};
var SOLID = '#COSsfwdlmc';      /* '+' is a doorway, '.' is floor */
var LABEL = { C: 'COUNTER', O: 'OVERHEAD', S: 'SHELVES', s: 'SIDE TABLE', f: 'FRIDGE',
  w: 'WARDROBE', d: 'DRESSER', l: 'LOCKER', m: 'MEDICINE CABINET', c: 'CRATE' };

var S = {
  pos: { x: 2, y: 6 }, facing: 0, sub: { x: 0, y: 0 },
  hands: [], handsWeight: 0, bag: [], bagWeight: 0, searched: {}, contents: {},
  rummage: null,            /* { key, queue, ticksLeft, ticksTotal, item } */
  modal: null, tookTotal: 0, timeSpent: 0, dextrous: false, allThumbs: false,
  driven: true, now: 0
};
function tileAt(x, y) {
  if (y < 0 || y >= HOUSE.length || x < 0 || x >= HOUSE[0].length) return '#';
  return HOUSE[y][x];
}
function roomAt(x, y) {
  if (y < 0 || y >= ROOM_MAP.length || x < 0 || x >= ROOM_MAP[0].length) return null;
  return ROOM_OF[ROOM_MAP[y][x]] || null;
}
function solid(x, y) { return SOLID.indexOf(tileAt(x, y)) >= 0; }
function facingXY() {
  var d = [[0,-1],[1,0],[0,1],[-1,0]][S.facing];
  return { x: S.pos.x + d[0], y: S.pos.y + d[1] };
}
function logLine(cls, msg) {
  var host = document.getElementById('log'), d = document.createElement('div');
  d.className = cls || ''; d.textContent = msg;
  host.insertBefore(d, host.firstChild);
  while (host.children.length > 5) host.removeChild(host.lastChild);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 7000);
}

/* --- the container you are facing, and its rolled contents (rolled ONCE) --- */
function facedContainer() {
  var f = facingXY(), ch = tileAt(f.x, f.y);
  if (!CONTAINER_OF[ch]) return null;
  /* a container belongs to the room BEHIND it, which is the room you are in */
  var room = roomAt(S.pos.x, S.pos.y) || roomAt(f.x, f.y);
  if (!room) return null;
  return { key: f.x + ',' + f.y, x: f.x, y: f.y, ch: ch, type: CONTAINER_OF[ch], room: room };
}
function contentsOf(c) {
  if (!S.contents[c.key]) S.contents[c.key] = rollContainer(c.room, c.type);
  return S.contents[c.key];
}
function context() {
  if (S.rummage) return S.rummage.mode === 'pack' ? 'PACKING' : 'RUMMAGING';
  if (S.modal) return null;
  /* hands full is the loudest thing in the world: you cannot grab any more */
  if (S.handsWeight >= PZ.HANDS_CAPACITY && S.bagWeight < PZ.BAG_CAPACITY) return 'PACK';
  var c = facedContainer();
  if (c && contentsOf(c).length) return 'RUMMAGE';
  if (S.hands.length && S.bagWeight < PZ.BAG_CAPACITY) return 'PACK';
  if (c) return 'EMPTY';
  return null;
}

/* --- start rummaging: one item at a time, each costing its own real time --- */
function startRummage() {
  var mode = context();
  if (mode === 'PACK') { S.rummage = { mode: 'pack', ticksLeft: 0, ticksTotal: 0, item: null }; nextPack(); return; }
  var c = facedContainer();
  if (!c) return;
  var items = contentsOf(c);
  if (!items.length) { logLine('bad', LABEL[c.ch] + ' is empty.'); return; }
  S.rummage = { mode: 'take', c: c, ticksLeft: 0, ticksTotal: 0, item: null };
  nextItem();
}
/* TAKE: from a container in the world into your hands. FLAT 50 * min(w,3) — the
   source only applies the fullness tax to the self-to-self case, so grabbing is
   cheap no matter how loaded you are. */
function nextItem() {
  var r = S.rummage; if (!r) return;
  if (S.handsWeight >= PZ.HANDS_CAPACITY) { stopRummage('YOUR HANDS ARE FULL. Pack it into the bag.'); return; }
  var items = contentsOf(r.c);
  if (!items.length) { stopRummage('Nothing left in the ' + LABEL[r.c.ch].toLowerCase() + '.'); return; }
  var item = items[0];
  var ticks = transferTicks(item.name, {
    toSelf: true, dextrous: S.dextrous, allThumbs: S.allThumbs
  });
  r.item = item; r.ticksTotal = ticks; r.ticksLeft = ticks;
}
/* PACK: from your hands into your bag. 120 * min(w,3) * how full the bag is,
   floored at 0.4. THIS is where encumbrance actually bites. */
function nextPack() {
  var r = S.rummage; if (!r) return;
  if (!S.hands.length) { stopRummage('Hands empty.'); return; }
  if (S.bagWeight >= PZ.BAG_CAPACITY) { stopRummage('THE BAG IS FULL.'); return; }
  var item = S.hands[0];
  var ticks = transferTicks(item.name, {
    fromSelf: true, toSelf: true, destWeight: S.bagWeight, destMax: PZ.BAG_CAPACITY,
    dextrous: S.dextrous, allThumbs: S.allThumbs
  });
  r.item = item; r.ticksTotal = ticks; r.ticksLeft = ticks;
}
function stopRummage(msg) { S.rummage = null; if (msg) logLine('', msg); }
function stepRummage(dtms) {
  var r = S.rummage; if (!r || !r.item) return;
  r.ticksLeft -= (dtms / 1000) * PZ.TICKS_PER_SEC;
  S.timeSpent += dtms;
  if (r.ticksLeft > 0) return;
  if (r.mode === 'pack') {
    var it = S.hands.shift();
    S.handsWeight = Math.max(0, Math.round((S.handsWeight - it.w) * 100) / 100);
    S.bag.push(it);
    S.bagWeight = Math.round((S.bagWeight + it.w) * 100) / 100;
    logLine('', 'packed ' + pretty(it.name) + ' — ' + Math.round(r.ticksTotal) + ' ticks at ' +
      Math.round((S.bagWeight / PZ.BAG_CAPACITY) * 100) + '% full');
    if (S.bagWeight >= PZ.BAG_CAPACITY) { stopRummage('THE BAG IS FULL.'); return; }
    nextPack();
    return;
  }
  var items = contentsOf(r.c), item = items.shift();
  var w = weightOf(item.name);
  S.hands.push({ name: item.name, w: w, junk: item.junk, from: item.from });
  S.handsWeight = Math.round((S.handsWeight + w) * 100) / 100;
  S.tookTotal++;
  logLine(item.junk ? 'junk' : 'good',
    (item.junk ? 'junk: ' : '') + pretty(item.name) + '  ' + w + 'kg  (' + item.from + ')');
  if (S.handsWeight >= PZ.HANDS_CAPACITY) { stopRummage('YOUR HANDS ARE FULL. Pack it.'); return; }
  nextItem();
}

/* =========================================================================
   THE WALK — one cell per step, because Bohemia's movement is ruled
   (laws/BOHEMIA_ADDENDUM_TIME_IS_SPENT_BY_ACTIONS_7_26_26.md) and a reference
   page has no business teaching a walk we are not going to use.
   ========================================================================= */
var STEP_MS = 150, stepCd = 0;
function tryStep(dx, dy) {
  if (S.rummage || S.modal) return false;
  if (dx) S.facing = dx > 0 ? 1 : 3; else if (dy) S.facing = dy > 0 ? 2 : 0;
  var nx = S.pos.x + dx, ny = S.pos.y + dy;
  if (solid(nx, ny)) return false;
  S.pos.x = nx; S.pos.y = ny;
  return true;
}

/* =========================================================================
   RENDER — placeholder art, deliberately grim and deliberately not ours
   ========================================================================= */
var cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
var VW = 0, VH = 0, DPR = 1, TS = 34;
function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  var r = cv.getBoundingClientRect();
  VW = Math.max(120, Math.round(r.width)); VH = Math.max(120, Math.round(r.height));
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  TS = Math.max(18, Math.floor(Math.min(VW / HOUSE[0].length, (VH - 40) / HOUSE.length)));
}
window.addEventListener('resize', resize);
var PAL = { floor:'#4a4136', floorB:'#443b31', wall:'#2b2a2c', wallTop:'#3a3739',
  door:'#6b4b28', counter:'#7a6a4a', metal:'#5a6068', wood:'#6a5236', fabric:'#5a4a5a',
  fridge:'#8a9098', body:'#8a7f5a', skin:'#c8a37a', hair:'#2e2620',
  searched:'#3c4a3c', full:'#8c6a3a' };
function render() {
  var W = HOUSE[0].length, H = HOUSE.length;
  var ox = Math.round((VW - W * TS) / 2), oy = Math.round((VH - H * TS) / 2) - 6;
  ctx.fillStyle = '#0b0c0f'; ctx.fillRect(0, 0, VW, VH);
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
    var ch = HOUSE[y][x], sx = ox + x * TS, sy = oy + y * TS;
    if (ch === '#') {
      ctx.fillStyle = PAL.wall; ctx.fillRect(sx, sy, TS, TS);
      ctx.fillStyle = PAL.wallTop; ctx.fillRect(sx, sy, TS, Math.max(1, TS * 0.22));
      continue;
    }
    ctx.fillStyle = ((x + y) % 2) ? PAL.floor : PAL.floorB; ctx.fillRect(sx, sy, TS, TS);
    if (ch === '+') { ctx.fillStyle = PAL.door; ctx.fillRect(sx + 2, sy + 2, TS - 4, TS - 4); continue; }
    if (!CONTAINER_OF[ch]) continue;
    var col = ch === 'f' ? PAL.fridge : (ch === 'l' || ch === 'm' || ch === 'O') ? PAL.metal
      : (ch === 'w' || ch === 'd') ? PAL.fabric : (ch === 'c') ? PAL.wood : PAL.counter;
    ctx.fillStyle = col; ctx.fillRect(sx + 1, sy + 1, TS - 2, TS - 2);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(sx + 1, sy + Math.round(TS * 0.55), TS - 2, 1);
    var key = x + ',' + y;
    if (S.contents[key]) {
      var n = S.contents[key].length;
      ctx.fillStyle = n ? PAL.full : PAL.searched;
      ctx.fillRect(sx + TS - 8, sy + 2, 6, 6);
      if (n) { ctx.fillStyle = '#0d0d0d'; ctx.font = '7px monospace'; ctx.fillText(String(Math.min(9, n)), sx + TS - 7, sy + 8); }
    }
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '7px ui-monospace, monospace';
    ctx.fillText(LABEL[ch].slice(0, 4), sx + 2, sy + TS - 3);
  }
  /* the tile you are about to act on */
  var f = facingXY();
  if (CONTAINER_OF[tileAt(f.x, f.y)]) {
    ctx.strokeStyle = 'rgba(255,224,120,.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(ox + f.x * TS + 1, oy + f.y * TS + 1, TS - 2, TS - 2);
  }
  /* you */
  var px = ox + S.pos.x * TS, py = oy + S.pos.y * TS;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px + TS / 2, py + TS - 5, TS * 0.28, TS * 0.12, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = PAL.body; ctx.fillRect(px + TS * 0.28, py + TS * 0.34, TS * 0.44, TS * 0.42);
  ctx.fillStyle = PAL.skin; ctx.fillRect(px + TS * 0.3, py + TS * 0.14, TS * 0.4, TS * 0.26);
  ctx.fillStyle = PAL.hair; ctx.fillRect(px + TS * 0.3, py + TS * 0.14, TS * 0.4, TS * 0.1);
  if (S.facing === 3) ctx.fillRect(px + TS * 0.3, py + TS * 0.14, TS * 0.12, TS * 0.26);
  if (S.facing === 1) ctx.fillRect(px + TS * 0.58, py + TS * 0.14, TS * 0.12, TS * 0.26);
  if (S.facing === 0) ctx.fillRect(px + TS * 0.3, py + TS * 0.14, TS * 0.4, TS * 0.2);
  /* room labels */
  ctx.font = '8px ui-monospace, monospace';
  [['kitchen',2,1],['livingroom',9,1],['bathroom',16,1],['bedroom',2,6]].forEach(function (r) {
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.fillText(r[0].toUpperCase(), ox + r[1] * TS, oy + r[2] * TS + 9);
  });
}
function hud() {
  var r = S.rummage;
  document.getElementById('hudl').textContent =
    'room      ' + (roomAt(S.pos.x, S.pos.y) || '-') + '\n' +
    'took      ' + S.tookTotal + '\n' +
    'time      ' + (S.timeSpent / 1000).toFixed(1) + 's';
  var full = S.bagWeight / PZ.BAG_CAPACITY;
  var delta = Math.max(PZ.T_DELTA_FLOOR, full);
  document.getElementById('hudr').textContent =
    'hands     ' + S.handsWeight.toFixed(1) + '/' + PZ.HANDS_CAPACITY + 'kg\n' +
    'bag       ' + S.bagWeight.toFixed(1) + '/' + PZ.BAG_CAPACITY + 'kg (' + Math.round(full * 100) + '%)\n' +
    (r && r.item ? (r.mode === 'pack' ? 'packing   ' : 'taking    ') +
        Math.ceil(r.ticksLeft) + '/' + Math.round(r.ticksTotal) + ' ticks'
      : 'grab flat 50 · pack x' + delta.toFixed(2));
  document.getElementById('bagfill').style.width = Math.min(100, full * 100) + '%';
  document.getElementById('bagtxt').textContent =
    'BAG ' + S.bagWeight.toFixed(1) + 'kg of ' + PZ.BAG_CAPACITY +
    ' — grabbing is flat, PACKING is what a full bag taxes';
  document.getElementById('progfill').style.width =
    (r && r.ticksTotal ? (1 - r.ticksLeft / r.ticksTotal) * 100 : 0) + '%';
}
var elAct = document.getElementById('act');
var ACT_LABEL = { RUMMAGE: 'RUMMAGE', RUMMAGING: 'HOLD — TAKING', PACK: 'PACK THE BAG',
  PACKING: 'HOLD — PACKING', EMPTY: 'EMPTIED' };
function syncAct() {
  var c = context();
  elAct.textContent = c ? ACT_LABEL[c] : '—';
  elAct.disabled = !c || c === 'EMPTY';
  elAct.className = (c && c !== 'EMPTY') ? 'hot' : '';
}

/* =========================================================================
   CONTROLS
   ========================================================================= */
var stick = document.getElementById('stick'), knob = document.getElementById('knob');
var stickActive = false, held = null;
function stickVec(e) {
  var r = stick.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  var dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
  var m = Math.sqrt(dx * dx + dy * dy);
  if (m < r.width * 0.17) { held = null; knob.style.transform = 'translate(0,0)'; return; }
  held = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? [1, 0] : [-1, 0]) : (dy > 0 ? [0, 1] : [0, -1]);
  var cl = Math.min(1, m / (r.width / 2)) * (r.width * 0.21);
  knob.style.transform = 'translate(' + (held[0] * cl).toFixed(0) + 'px,' + (held[1] * cl).toFixed(0) + 'px)';
}
function stickEnd() { stickActive = false; held = null; knob.style.transform = 'translate(0,0)'; }
stick.addEventListener('touchstart', function (e) { e.preventDefault(); stickActive = true; stickVec(e); }, { passive: false });
stick.addEventListener('touchmove', function (e) { e.preventDefault(); if (stickActive) stickVec(e); }, { passive: false });
stick.addEventListener('touchend', function (e) { e.preventDefault(); stickEnd(); }, { passive: false });
stick.addEventListener('mousedown', function (e) { e.preventDefault(); stickActive = true; stickVec(e); });
window.addEventListener('mousemove', function (e) { if (stickActive) stickVec(e); });
window.addEventListener('mouseup', function () { if (stickActive) stickEnd(); });
var actHeld = false;
var actDown = function (e) { if (e) e.preventDefault(); actHeld = true; if (!S.rummage) { startRummage(); syncAct(); } };
var actUp = function (e) { if (e) e.preventDefault(); actHeld = false; if (S.rummage) stopRummage('Stopped.'); syncAct(); };
elAct.addEventListener('touchstart', actDown, { passive: false });
elAct.addEventListener('touchend', actUp, { passive: false });
elAct.addEventListener('mousedown', actDown);
window.addEventListener('mouseup', actUp);
var KEY = { ArrowUp:[0,-1], KeyW:[0,-1], ArrowRight:[1,0], KeyD:[1,0], ArrowDown:[0,1], KeyS:[0,1], ArrowLeft:[-1,0], KeyA:[-1,0] };
window.addEventListener('keydown', function (e) {
  if (e.code in KEY) { held = KEY[e.code]; e.preventDefault(); }
  if (e.code === 'Space') actDown(e);
});
window.addEventListener('keyup', function (e) {
  if (e.code in KEY) { held = null; e.preventDefault(); }
  if (e.code === 'Space') actUp(e);
});
(function chips() {
  var host = document.getElementById('chips');
  var mk = function (id, label, fn) {
    var b = document.createElement('button');
    b.className = 'chip'; b.id = id; b.textContent = label;
    b.addEventListener('click', fn); host.appendChild(b); return b;
  };
  mk('c_bag', 'THE BAG', function () {
    S.modal = 'bag'; document.getElementById('m_bag').classList.add('open'); paintBag(); syncAct();
  });
  mk('c_dex', 'DEXTROUS x0.5', function () {
    S.dextrous = !S.dextrous; S.allThumbs = false; syncChips();
  });
  mk('c_thumb', 'ALL THUMBS x2', function () {
    S.allThumbs = !S.allThumbs; S.dextrous = false; syncChips();
  });
  mk('c_num', 'NUMBERS', function () {
    S.modal = 'num'; document.getElementById('m_num').classList.add('open'); syncAct();
  });
})();
function syncChips() {
  document.getElementById('c_dex').className = 'chip' + (S.dextrous ? ' on' : '');
  document.getElementById('c_thumb').className = 'chip' + (S.allThumbs ? ' on' : '');
}
document.getElementById('b_close').addEventListener('click', function () {
  S.modal = null; document.getElementById('m_bag').classList.remove('open'); syncAct();
});
document.getElementById('n_close').addEventListener('click', function () {
  S.modal = null; document.getElementById('m_num').classList.remove('open'); syncAct();
});
function paintBag() {
  var junk = S.bag.filter(function (i) { return i.junk; }).length;
  document.getElementById('baghead').textContent =
    'THE BAG — ' + S.bag.length + ' items, ' + S.bagWeight.toFixed(1) + 'kg, ' + junk + ' of it junk';
  var rows = S.bag.slice().reverse().map(function (i) {
    return '<tr><td class="n">' + (i.junk ? 'junk · ' : '') + pretty(i.name) +
      '</td><td class="v">' + i.w + 'kg</td><td style="color:#7d8699;text-align:right">' + i.from + '</td></tr>';
  }).join('');
  document.getElementById('bagtable').innerHTML = rows || '<tr><td class="n">empty</td></tr>';
}
(function numbers() {
  var SRC = {
    T_BASE:'ISInventoryTransferAction.lua:785', T_CONTAINER:'ISInventoryTransferAction.lua:795',
    T_WEIGHT_CAP:'ISInventoryTransferAction.lua:810', T_DELTA_FLOOR:'ISInventoryTransferAction.lua:805',
    T_FLOOR_DROP:'ISInventoryTransferAction.lua:822', T_SELF_DROP:'ISInventoryTransferAction.lua:820',
    T_DEXTROUS:'ISInventoryTransferAction.lua:828', T_ALLTHUMBS:'ISInventoryTransferAction.lua:831',
    CHANCE_BASE:'Distributions.lua (weightChance)', GUARANTEED_MIN:'Distributions.lua (min=98 sentinel)',
    TICKS_PER_SEC:'ours (declared)', HANDS_CAPACITY:'ours (declared)', BAG_CAPACITY:'ours (declared)'
  };
  var h = '<table class="st">';
  for (var k in PZ) h += '<tr><td class="n">' + k + '</td><td class="v">' + PZ[k] +
    '</td><td style="color:#7d8699">' + (SRC[k] || '') + '</td></tr>';
  h += '</table><p style="color:#c9c6bd">THE TIME FORMULA, verbatim: base 120 for moving ' +
    'something between two things you carry, 50 for taking from or putting into a container in ' +
    'the world; times min(item weight, 3); and times how full the DESTINATION is, floored at 0.4 — ' +
    'but read the source carefully, because I got this wrong at first: that fullness term is only ' +
    'computed when BOTH containers are on your body. Grabbing off a shelf is FLAT. The fullness ' +
    'tax lands when you PACK. Zomboid charges you for organising, not for grabbing.</p>' +
    '<p style="color:#c9c6bd">THE LOOT is two stages: the ROOM plus the CONTAINER TYPE pick named ' +
    'tables by weightChance out of 100, then each table rolls its weighted item list `rolls` times ' +
    'AND rolls its own separate JUNK table. The junk is why rummaging feels like rummaging.</p>' +
    '<p style="color:#c9c6bd">OURS, DECLARED: item weights (the master keeps them in ' +
    'media/scripts, not the Lua), the ticks-per-second conversion, the bag size and the reach. ' +
    'Everything else above is theirs, exactly.</p>';
  document.getElementById('numbody').innerHTML = h;
})();

/* =========================================================================
   THE LOOP
   ========================================================================= */
function frame(dtms) {
  S.now += dtms;
  if (S.rummage) { if (actHeld || S.forceHold) stepRummage(dtms); }
  else {
    stepCd -= dtms;
    if (held && stepCd <= 0) { tryStep(held[0], held[1]); stepCd = STEP_MS; }
    if (!held) stepCd = 0;
  }
}
var last = 0, syncCd = 0;
function loop(ts) {
  if (!last) last = ts;
  var dt = Math.max(4, Math.min(50, ts - last)); last = ts;
  if (S.driven) frame(dt);
  render(); hud();
  syncCd += dt; if (syncCd > 120) { syncCd = 0; syncAct(); }
  requestAnimationFrame(loop);
}
resize(); syncChips(); syncAct();
logLine('', 'Walk up to a container and face it, then HOLD RUMMAGE. Each item costs its own time: heavy things cost more and a fuller bag costs more.');
requestAnimationFrame(loop);

/* =========================================================================
   THE TEST SURFACE — the gate walks this house and plays all three loops
   ========================================================================= */
window.LAB = {
  PZ: PZ, S: S, PZ_ROOMS: PZ_ROOMS, PZ_TABLES: PZ_TABLES,
  mechanics: ['looting', 'rummaging', 'encumbrance'],
  freeze: function () { S.driven = false; }, thaw: function () { S.driven = true; },
  seedRNG: function (n) { var st = n >>> 0; RNG = function () { st = (st * 1103515245 + 12345) & 0x7fffffff; return st / 0x7fffffff; }; },
  unseedRNG: function () { RNG = Math.random; },
  place: function (x, y, facing) { S.pos.x = x; S.pos.y = y; if (facing !== undefined) S.facing = facing; },
  step: function (n, dir) {
    held = dir || null;
    for (var i = 0; i < n; i++) frame(TICK);
    held = null;
    return { x: S.pos.x, y: S.pos.y };
  },
  walkTo: function (x, y, max) {
    var g = 0;
    while (g++ < (max || 2000)) {
      if (S.pos.x === x && S.pos.y === y) return true;
      var d = (S.pos.x !== x) ? [(x > S.pos.x ? 1 : -1), 0] : [0, (y > S.pos.y ? 1 : -1)];
      var before = S.pos.x + ',' + S.pos.y;
      held = d; frame(TICK); held = null;
      if (before === S.pos.x + ',' + S.pos.y) { stepCd = 0; frame(TICK); }
      if (before === S.pos.x + ',' + S.pos.y) {
        /* blocked on this axis: try the other one */
        d = (S.pos.y !== y) ? [0, (y > S.pos.y ? 1 : -1)] : [(x > S.pos.x ? 1 : -1), 0];
        stepCd = 0; held = d; frame(TICK); held = null;
        if (before === S.pos.x + ',' + S.pos.y) return false;
      }
      stepCd = 0;
    }
    return false;
  },
  setFacing: function (f) { S.facing = f; },
  context: context, facedContainer: facedContainer, contentsOf: contentsOf,
  rollContainer: rollContainer, transferTicks: transferTicks, weightOf: weightOf,
  startRummage: function () { startRummage(); S.forceHold = true; },
  rummageFrames: function (n) { S.forceHold = true; for (var i = 0; i < n; i++) frame(TICK); },
  stopRummage: function () { S.forceHold = false; stopRummage(); },
  bag: function () { return { items: S.bag.slice(), weight: S.bagWeight, count: S.bag.length,
                              junk: S.bag.filter(function (i) { return i.junk; }).length }; },
  hands: function () { return { items: S.hands.slice(), weight: S.handsWeight, count: S.hands.length }; },
  setBagWeight: function (w) { S.bagWeight = w; },
  setHands: function (list) {
    S.hands = list.map(function (n) { return { name: n, w: weightOf(n), junk: false, from: 'test' }; });
    S.handsWeight = S.hands.reduce(function (a, i) { return a + i.w; }, 0);
  },
  house: HOUSE, roomAt: roomAt, tileAt: tileAt,
  containerCount: function () {
    var n = 0;
    for (var y = 0; y < HOUSE.length; y++) for (var x = 0; x < HOUSE[0].length; x++) {
      if (CONTAINER_OF[HOUSE[y][x]]) n++;
    }
    return n;
  },
  reset: function () {
    S.bag = []; S.bagWeight = 0; S.hands = []; S.handsWeight = 0;
    S.contents = {}; S.tookTotal = 0; S.timeSpent = 0;
    S.rummage = null; S.forceHold = false; S.dextrous = false; S.allThumbs = false;
  }
};

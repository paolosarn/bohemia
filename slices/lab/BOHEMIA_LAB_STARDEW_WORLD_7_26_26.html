  var v = Math.max(SDV.MIN_STEP, spd * SDV.MOVE_MULT * dtms);
  if (dirCount > 1) v = SDV.DIAG_FACTOR * v;
  return v;

  if (dir === 0) b.y -= d; else if (dir === 2) b.y += d;
  else if (dir === 1) b.x += d; else b.x -= d;
  return b;

  var x0 = Math.floor(b.x / SDV.TILE), x1 = Math.floor((b.x + b.w - 1) / SDV.TILE);

  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {

  if (!colliding(nextBox(dir, spd / 2))) { shift(dir, spd / 2); return 'half'; }
  if (dirCount === 1) {
    var b = nextBox(dir, spd), vertical = (dir === 0 || dir === 2);
    var q = { x: b.x, y: b.y, w: b.w, h: b.h }, a, c;
    if (vertical) { q.w = Math.floor(b.w / 4); a = colliding(q); q.x += q.w * 3; c = colliding(q); }

  }

    var mod = 1 - (S.running ? SDV.ANIM_RUN_MOD : SDV.ANIM_WALK_MOD) *
      Math.max(1, (S.running ? SDV.RUN_SPEED : SDV.WALK_SPEED) * SDV.MOVE_MULT * dtms) * SDV.ANIM_MOD_MULT;
    S.animTimer += dtms;
    var per = SDV.ANIM_BASE_MS * mod;
    while (S.animTimer >= per) { S.animTimer -= per; S.animFrame = (S.animFrame + 1) % SDV.ANIM_FRAMES; }
  } else { S.animFrame = 0; S.animTimer = 0; }
}
function startWarp(w) {
  if (S.fadeDir) return;
  S.pendingWarp = w; S.fadeDir = 1;
  for (var d = 0; d < 4; d++) S.dirs[d] = false;
}
function stepFade(dtms) {
  if (!S.fadeDir) return;
  var step = SDV.FADE_STEP * (dtms / TICK);
  if (S.fadeDir === 1) {
    S.fade += step;
    if (S.fade >= 1) {
      S.fade = 1;
      var w = S.pendingWarp; S.pendingWarp = null;
      S.map = w.map; S.pos.x = w.tx * SDV.TILE; S.pos.y = w.ty * SDV.TILE;
      S.fadeDir = -1;
    }
  } else {
    S.fade -= step;
    if (S.fade <= 0) { S.fade = 0; S.fadeDir = 0; }
  }
}

/* =========================================================================
   THE CLOCK + THE LIGHT — and the rule that makes a doorway free
   ========================================================================= */
function pseudoMinutes(t) { return (t - t % 100) + (t % 100 / 10) * SDV.MINUTE_UNIT; }
function tintAlpha() {
  if (!MAPS[S.map].outdoors) return 0;
  var extra = S.clockAcc / SDV.MS_PER_10MIN * SDV.MINUTE_UNIT;
  if (S.timeOfDay >= SDV.DARK_TRULY) {
    return Math.min(SDV.LIGHT_CAP, SDV.NIGHT_BASE +
      (pseudoMinutes(S.timeOfDay) - SDV.DARK_TRULY + extra) * SDV.NIGHT_RATE);
  }
  if (S.timeOfDay >= SDV.DARK_START) {
    return Math.min(SDV.LIGHT_CAP, SDV.DUSK_BASE +
      (pseudoMinutes(S.timeOfDay) - SDV.DARK_START + extra) * SDV.DUSK_RATE);
  }
  return 0;
}
function timePasses() { return S.fadeDir === 0 && !S.modal; }
function stepClock(dtms) {
  if (!timePasses()) return;
  S.clockAcc += dtms;
  while (S.clockAcc > SDV.MS_PER_10MIN) {
    S.clockAcc = 0;
    S.timeOfDay += 10;
    if (S.timeOfDay % 100 >= 60) S.timeOfDay = S.timeOfDay - S.timeOfDay % 100 + 100;
    S.timeOfDay = Math.min(S.timeOfDay, SDV.DAY_END);
  }
}
function clockText() {
  var t = S.timeOfDay, h = Math.floor(t / 100), m = t % 100, suf = 'AM';
  if (h >= 24) h -= 24;
  if (h >= 12) { suf = 'PM'; if (h > 12) h -= 12; }
  if (h === 0) h = 12;
  return h + ':' + (m < 10 ? '0' + m : m) + ' ' + suf;
}

/* =========================================================================
   MECHANIC 1 — FISHING, at the dock. Same BobberBar rules, reached on foot.
   ========================================================================= */
var RNG = Math.random;
function rnd() { return RNG(); }
function rndInt(a, b) { return Math.floor(a + RNG() * (b - a)); }
var F = { live: false, fish: null, difficulty: 0, motionType: 0, barH: 0, barPos: 0, barSpeed: 0,
  bobPos: 0, bobSpeed: 0, bobTarget: 0, bobAccel: 0, floatAccel: 0,
  progress: 0, reeling: false, perfect: true, size: 0, sizeTimer: 0, caught: 0 };

/* which fish bites is CONTENT: deeper water, harder fish. Ours, declared. */
function pickFish() {
  var deep = 0, t = facingTile();
  for (var d = 1; d <= 6; d++) if (tileAt(t.x, t.y + d - 1) === '~') deep++;
  var band = Math.min(FISH.length - 1, Math.floor(rnd() * (1 + deep / 2)));
  return FISH[band];
}
function castAt(fish) {
  F.fish = fish; F.difficulty = fish.d; F.motionType = MOTION[fish.m];
  F.barH = SDV.BAR_BASE_H + S.fishingLevel * SDV.BAR_H_PER_LEVEL;
  F.barPos = SDV.BAR_TRACK - F.barH; F.barSpeed = 0;
  F.bobPos = SDV.BOBBER_START;
  F.bobTarget = (100 - F.difficulty) / 100 * 548;
  F.bobSpeed = 0; F.bobAccel = 0; F.floatAccel = 0;
  F.progress = SDV.CATCH_START; F.perfect = true;
  F.size = Math.round(fish.min + (fish.max - fish.min) * rnd()) + 1;
  F.sizeTimer = SDV.SIZE_DROP_MS;
  F.live = true;
  for (var d = 0; d < 4; d++) S.dirs[d] = false;
  toast('', 'HOOKED ' + fish.n + ' · difficulty ' + fish.d + ' · ' + fish.m +
    ' · your bar is ' + F.barH + ' of ' + SDV.BAR_TRACK);
  syncAct();
}
function fishTick(dt) {
  if (!F.live) return;
  var ticks = dt / TICK;
  if (rnd() < F.difficulty * (F.motionType === 2 ? 20 : 1) / 4000 &&
      (F.motionType !== 2 || F.bobTarget === -1)) {
    var room = 548 - F.bobPos;
    var scale = Math.min(99, F.difficulty + rndInt(10, 45)) / 100;
    F.bobTarget = F.bobPos + rndInt(Math.min(-F.bobPos, room), room) * scale;
  }
  if (F.motionType === 4) F.floatAccel = Math.max(F.floatAccel - SDV.FLOAT_ACCEL, -SDV.FLOAT_MAX);
  else if (F.motionType === 3) F.floatAccel = Math.min(F.floatAccel + SDV.FLOAT_ACCEL, SDV.FLOAT_MAX);
  if (Math.abs(F.bobPos - F.bobTarget) > 3 && F.bobTarget !== -1) {
    F.bobAccel = (F.bobTarget - F.bobPos) / (rndInt(10, 30) + (100 - Math.min(100, F.difficulty)));
    F.bobSpeed += (F.bobAccel - F.bobSpeed) / SDV.FISH_SMOOTH;
  } else {
    F.bobTarget = (F.motionType === 2 || rnd() >= F.difficulty / 2000) ? -1
      : F.bobPos + (rnd() < 0.5 ? rndInt(-100, -51) : rndInt(50, 101));
  }
  if (F.motionType === 1 && rnd() < F.difficulty / 1000) {
    F.bobTarget = F.bobPos + (rnd() < 0.5 ? rndInt(-100 - F.difficulty * 2, -51)
                                          : rndInt(50, 101 + F.difficulty * 2));
  }
  F.bobTarget = Math.max(-1, Math.min(F.bobTarget, 548));
  F.bobPos += (F.bobSpeed + F.floatAccel) * ticks;
  if (F.bobPos > SDV.BOBBER_BOTTOM) F.bobPos = SDV.BOBBER_BOTTOM;
  if (F.bobPos < SDV.BOBBER_TOP) F.bobPos = SDV.BOBBER_TOP;

  var inBar = (F.bobPos + SDV.FISH_BELOW <= F.barPos + F.barH) && (F.bobPos - SDV.FISH_ABOVE >= F.barPos);
  if (F.bobPos >= SDV.BAR_TRACK - 20 - F.barH && F.barPos >= SDV.BAR_TRACK - F.barH - 4) inBar = true;

  var accel = F.reeling ? -SDV.BAR_LIFT : SDV.BAR_GRAVITY;
  if (F.reeling && (F.barPos === 0 || F.barPos === SDV.BAR_TRACK - F.barH)) F.barSpeed = 0;
  if (inBar) accel *= SDV.BAR_IN_DAMP;
  F.barSpeed += accel * ticks;
  F.barPos += F.barSpeed * ticks;
  if (F.barPos + F.barH > SDV.BAR_TRACK) { F.barPos = SDV.BAR_TRACK - F.barH; F.barSpeed = -F.barSpeed * SDV.BAR_BOUNCE; }
  else if (F.barPos < 0) { F.barPos = 0; F.barSpeed = -F.barSpeed * SDV.BAR_BOUNCE; }

  if (inBar) F.progress += SDV.CATCH_GAIN * ticks;
  else {
    F.progress -= SDV.CATCH_LOSS * ticks;
    F.perfect = false;
    F.sizeTimer -= dt;
    if (F.sizeTimer <= 0) { F.size = Math.max(F.fish.min, F.size - 1); F.sizeTimer = SDV.SIZE_DROP_MS; }
  }
  if (F.progress >= 1) endFish(true);
  else if (F.progress <= 0) endFish(false);
}
function endFish(won) {
  F.live = false; F.reeling = false;
  if (won) {
    var gold = Math.round(F.fish.d * 2 + F.size * 3) * (F.perfect ? 2 : 1);
    S.gold += gold; F.caught++;
    if (F.caught % 2 === 0 && S.fishingLevel < 10) {
      S.fishingLevel++;
      toast('good', 'FISHING LEVEL ' + S.fishingLevel + ' — your bar is now ' +
        (SDV.BAR_BASE_H + S.fishingLevel * SDV.BAR_H_PER_LEVEL) + '. That is the whole skill tree.');
    }
    toast('good', 'CAUGHT ' + F.fish.n + ' · ' + F.size + '"' + (F.perfect ? ' · PERFECT' : '') + ' · +' + gold + 'g');
  } else toast('bad', 'IT GOT AWAY. ' + F.fish.n + ' ran the bar out.');
  syncAct();
}

/* =========================================================================
   MECHANIC 2 — FARMING, on the plot behind your house
   ========================================================================= */
function plantCrop(t, def) {
  var phases = def.phases.slice();
  var total = phases.reduce(function (a, b) { return a + b; }, 0);
  var remove = Math.ceil(total * FERTS[t.fert].speed);
  for (var pass = 0; remove > 0 && pass < 3; pass++) {
    for (var k = 0; k < phases.length && remove > 0; k++) {
      if (phases[k] > (k === 0 ? 1 : 0)) { phases[k]--; remove--; }
    }
  }
  t.crop = { def: def, phases: phases, phase: 0, dayOfPhase: 0, dead: false,
             fullyGrown: false, regrowLeft: 0, seasons: def.seasons };
}
function cropReady(c) { return !!c && !c.dead && c.phase >= c.phases.length - 1 && (!c.fullyGrown || c.regrowLeft <= 0); }
function farmNewDay() {
  var grew = 0, stalled = 0, died = 0;
  for (var k in FARM) {
    var t = FARM[k];
    if (t.crop && !t.crop.dead) {
      if (t.crop.seasons.indexOf(S.season) < 0) { t.crop.dead = true; died++; }
      else if (t.state === SDV.WATERED) {
        if (t.crop.fullyGrown) { if (t.crop.regrowLeft > 0) t.crop.regrowLeft--; }
        else {
          var need = t.crop.phases[Math.min(t.crop.phases.length - 1, t.crop.phase)];
          t.crop.dayOfPhase = Math.min(t.crop.dayOfPhase + 1, need);
          if (t.crop.dayOfPhase >= need && t.crop.phase < t.crop.phases.length - 1) {
            t.crop.phase++; t.crop.dayOfPhase = 0;
          }
        }
        grew++;
      } else stalled++;
    }
    if (t.state === SDV.WATERED) {
      var keep = FERTS[t.fert].retain;
      if (!(keep >= 1 || Math.random() < keep)) t.state = SDV.DRY;
    }
  }
  if (grew || stalled || died) {
    toast(stalled || died ? 'bad' : 'good', 'THE PLOT: ' + grew + ' grew, ' + stalled +
      ' STALLED on dry soil (a wasted day, not damage), ' + died + ' died out of season.');
  }
}
function useTool(tx, ty) {
  var t = farmAt(tx, ty);
  if (S.tool === 'hoe') {
    if (t.crop) { toast('bad', 'There is a crop there.'); return; }
    t.tilled = !t.tilled; t.state = SDV.DRY;
    toast('', t.tilled ? 'Tilled.' : 'Cleared.');
  } else if (S.tool === 'can') {
    if (!t.tilled) { toast('bad', 'Till it first.'); return; }
    t.state = SDV.WATERED; toast('', 'Watered. It grows at the rollover, not now.');
  } else if (S.tool === 'seed') {
    if (!t.tilled) { toast('bad', 'Till it first.'); return; }
    if (t.crop) { toast('bad', 'Already planted.'); return; }
    t.fert = S.fertPick; plantCrop(t, CROPS[S.seedPick]);
    var days = t.crop.phases.reduce(function (a, b) { return a + b; }, 0);
    toast('', 'Planted ' + CROPS[S.seedPick].n + ' (' + FERTS[S.fertPick].n + ') · ' +
      days + ' watered days' + (CROPS[S.seedPick].regrow > 0 ? ', then every ' + CROPS[S.seedPick].regrow : ''));
  } else if (S.tool === 'pick') {
    if (!t.crop) { toast('bad', 'Nothing there.'); return; }
    if (t.crop.dead) { t.crop = null; toast('', 'Cleared the dead crop.'); return; }
    if (!cropReady(t.crop)) {
      var need = t.crop.phases[Math.min(t.crop.phases.length - 1, t.crop.phase)];
      toast('bad', 'Not ready: phase ' + (t.crop.phase + 1) + '/' + t.crop.phases.length +
        ', day ' + t.crop.dayOfPhase + '/' + need);
      return;
    }
    S.gold += t.crop.def.sell;
    toast('good', 'Harvested ' + t.crop.def.n + ' · +' + t.crop.def.sell + 'g');
    if (t.crop.def.regrow > 0) { t.crop.fullyGrown = true; t.crop.regrowLeft = t.crop.def.regrow; }
    else t.crop = null;
  }
}

/* =========================================================================
   MECHANIC 3 — MARRIAGE, by walking up to her
   ========================================================================= */
function maxHearts() {
  if (L.married) return SDV.MAX_HEARTS_SPOUSE;
  if (L.status === 'DATING' || L.status === 'ENGAGED') return SDV.MAX_HEARTS_DATING;
  return SDV.MAX_HEARTS_UNDATED;
}
function pointCap() { return (maxHearts() + 1) * SDV.PER_HEART - 1; }
function hearts() { return Math.floor(L.points / SDV.PER_HEART); }
function isBirthday() { return S.season === L.birthdaySeason && ((S.day - 1) % 28) + 1 === L.birthdayDay; }
function changeFriendship(a) {
  var b = L.points;
  L.points = Math.max(0, Math.min(L.points + a, pointCap()));
  return L.points - b;
}
function loveLog(cls, m) {
  var el = document.getElementById('lovelog'), d = document.createElement('div');
  d.className = cls; d.textContent = m;
  el.insertBefore(d, el.firstChild);
  while (el.children.length > 10) el.removeChild(el.lastChild);
}
function talk() {
  if (L.talkedToday) { loveLog('bad', 'Already talked to her today. Talking is once a day.'); return; }
  var d = changeFriendship(SDV.TALK_POINTS);
  L.talkedToday = true;
  loveLog('good', 'Talked. +' + d + ' (' + L.points + '/' + pointCap() + ')');
  paintLove();
}
function giveGift(g) {
  if (L.giftsToday >= SDV.GIFTS_PER_DAY && !isBirthday()) {
    loveLog('bad', 'One gift a day. Come back tomorrow.'); return;
  }
  if (L.giftsThisWeek >= SDV.GIFTS_PER_WEEK && !L.married && !isBirthday()) {
    loveLog('bad', 'Two gifts a week and you spent both. The ration is what makes a gift mean anything.');
    return;
  }
  var mult = g.q === 1 ? SDV.GIFT_SILVER_X : g.q === 2 ? SDV.GIFT_GOLD_X : 1;
  var bday = isBirthday() ? SDV.GIFT_BIRTHDAY_X : 1;
  var raw = Math.trunc(TASTE_POINTS[g.taste] * bday * mult);
  var d = changeFriendship(raw);
  L.giftsToday++; L.giftsThisWeek++;
  loveLog(raw >= 0 ? 'good' : 'bad', 'Gave ' + g.n + ' (' + g.taste + ') ' +
    (bday > 1 ? 'ON HER BIRTHDAY x8 ' : '') + (mult > 1 ? 'quality x' + mult + ' ' : '') +
    '= ' + (raw > 0 ? '+' : '') + raw + (d !== raw ? ' (capped, gained ' + d + ')' : '') +
    ' · ' + L.points + '/' + pointCap());
  paintLove();
}
function court() {
  if (L.married) { loveLog('', 'You are already married.'); return; }
  if (L.weddingIn >= 0) { loveLog('', 'The wedding is in ' + L.weddingIn + ' days.'); return; }
  if (L.status === 'STRANGER' || L.status === 'FRIEND') {
    if (L.points < SDV.BOUQUET_AT) {
      loveLog('bad', 'The bouquet needs ' + SDV.BOUQUET_AT + ' (8 hearts). You have ' + L.points +
        ', and gifting cannot carry you past ' + pointCap() + ': undated is HARD CAPPED at 8 hearts.');
      return;
    }
    L.status = 'DATING';
    loveLog('good', 'BOUQUET ACCEPTED. Dating. The ceiling moves to 10 hearts and neglect now costs -' +
      SDV.DECAY_DATING + ' a day.');
  } else if (L.status === 'DATING') {
    if (L.points < SDV.PENDANT_AT) {
      loveLog('bad', "The pendant needs " + SDV.PENDANT_AT + ' (10 hearts). You have ' + L.points + '.');
      return;
    }
    L.status = 'ENGAGED'; L.weddingIn = SDV.WEDDING_DELAY;
    loveLog('good', 'PENDANT ACCEPTED. The wedding is in ' + SDV.WEDDING_DELAY + ' days.');
  }
  paintLove();
}
function loveNewDay() {
  var decay = 0, undated = (L.status === 'STRANGER' || L.status === 'FRIEND');
  if (!L.talkedToday) {
    if (L.married) decay += SDV.DECAY_SPOUSE;
    else if ((L.status === 'DATING' || L.status === 'ENGAGED') && L.points < SDV.PENDANT_AT) decay += SDV.DECAY_DATING;
    if ((!undated && L.points < 2500) || (undated && L.points < SDV.DECAY_FLOOR_UNDATED)) decay += SDV.DECAY_STRANGER;
    changeFriendship(-decay);
  }
  L.talkedToday = false; L.giftsToday = 0;
  if (dayName() === 'MON') L.giftsThisWeek = 0;
  if (L.status === 'STRANGER' && L.points >= SDV.PER_HEART * 2) L.status = 'FRIEND';
  if (L.weddingIn > 0) {
    L.weddingIn--;
    if (L.weddingIn === 0) {
      L.married = true; L.status = 'MARRIED'; L.weddingIn = -1;
      toast('good', 'MARRIED. The ceiling moves to 14 hearts and ignoring her now costs -' + SDV.DECAY_SPOUSE + ' a day.');
    }
  }
  if (decay) toast('bad', 'You did not talk to ' + NPC.name + ' yesterday: -' + decay);
  paintLove();
}
function paintLove() {
  var h = hearts(), s = '';
  for (var i = 0; i < maxHearts(); i++) s += (i < h ? '♥' : '♡');
  document.getElementById('lovehead').innerHTML = NPC.name + ' &middot; ' + L.status +
    ' <span class="hearts">' + s + '</span>';
  document.getElementById('lovestat').innerHTML =
    '<tr><td class="n">points</td><td class="v">' + L.points + ' / ' + pointCap() + '</td></tr>' +
    '<tr><td class="n">hearts</td><td class="v">' + h + ' of ' + maxHearts() + '</td></tr>' +
    '<tr><td class="n">gifts left</td><td class="v">day ' + (SDV.GIFTS_PER_DAY - L.giftsToday) +
      ' / week ' + Math.max(0, SDV.GIFTS_PER_WEEK - L.giftsThisWeek) + '</td></tr>' +
    '<tr><td class="n">talked today</td><td class="v">' + (L.talkedToday ? 'yes' : 'no, -' +
      (L.married ? SDV.DECAY_SPOUSE : (L.status === 'DATING' || L.status === 'ENGAGED') ? SDV.DECAY_DATING : SDV.DECAY_STRANGER) +
      ' tomorrow') + '</td></tr>' +
    '<tr><td class="n">next step</td><td class="v">' + (L.married ? 'married' :
      (L.status === 'DATING' ? SDV.PENDANT_AT : SDV.BOUQUET_AT) + ' pts') + '</td></tr>' +
    '<tr><td class="n">her birthday</td><td class="v">' + L.birthdaySeason + ' ' + L.birthdayDay +
      (isBirthday() ? ' — TODAY, x8' : '') + '</td></tr>';
  document.getElementById('l_court').textContent = L.married ? 'MARRIED' :
    L.weddingIn >= 0 ? 'WEDDING IN ' + L.weddingIn :
    L.status === 'DATING' ? "GIVE PENDANT" : 'GIVE BOUQUET';
}

/* =========================================================================
   THE SCHEDULED NPC — she keeps her day whether or not you are watching
   ========================================================================= */
function nrnd() { NPC.seed = (NPC.seed * 1103515245 + 12345) & 0x7fffffff; return NPC.seed / 0x7fffffff; }
function bfs(map, from, to) {
  if (from[0] === to[0] && from[1] === to[1]) return [];
  var W = MAPS[map].rows[0].length, H = MAPS[map].rows.length, seen = {}, q = [[from[0], from[1]]], prev = {};
  seen[from[0] + ',' + from[1]] = 1;
  var dirs = [[0,-1],[1,0],[0,1],[-1,0]];
  while (q.length) {
    var cur = q.shift();
    for (var i = 0; i < 4; i++) {
      var nx = cur[0] + dirs[i][0], ny = cur[1] + dirs[i][1], key = nx + ',' + ny;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen[key] || solidOn(map, nx, ny)) continue;
      seen[key] = 1; prev[key] = cur;
      if (nx === to[0] && ny === to[1]) {
        var path = [[nx, ny]], p = key;
        while (prev[p]) { var c = prev[p]; path.unshift(c); p = c[0] + ',' + c[1]; }
        path.shift(); return path;
      }
      q.push([nx, ny]);
    }
  }
  return [];
}
function npcTile() {
  return [Math.floor((NPC.pos.x + SDV.TILE / 2) / SDV.TILE), Math.floor((NPC.pos.y + SDV.TILE / 2) / SDV.TILE)];
}
function stepNPC(dtms) {
  var due = null;
  for (var i = 0; i < NPC.schedule.length; i++) if (S.timeOfDay >= NPC.schedule[i].t) due = i;
  if (due !== null && due !== NPC.lastKey) {
    NPC.lastKey = due;
    var e = NPC.schedule[due];
    NPC.target = [e.x, e.y];
    NPC.path = bfs('town', npcTile(), NPC.target);
    NPC.pauseLeft = 0;
  }
  if (!NPC.path.length) {
    NPC.pauseLeft -= dtms;
    if (NPC.pauseLeft <= 0) {
      NPC.pauseLeft = SDV.NPC_PAUSE_MIN + nrnd() * (SDV.NPC_PAUSE_MAX - SDV.NPC_PAUSE_MIN);
      NPC.facing = Math.floor(nrnd() * 4);
    }
    NPC.animFrame = 0; return;
  }
  var step = SDV.NPC_SPEED * (dtms / TICK);
  var n = NPC.path[0], tx = n[0] * SDV.TILE, ty = n[1] * SDV.TILE;
  var dx = tx - NPC.pos.x, dy = ty - NPC.pos.y;
  if (Math.abs(dx) > 0.001) { NPC.facing = dx > 0 ? 1 : 3; NPC.pos.x += Math.sign(dx) * Math.min(step, Math.abs(dx)); }
  else if (Math.abs(dy) > 0.001) { NPC.facing = dy > 0 ? 2 : 0; NPC.pos.y += Math.sign(dy) * Math.min(step, Math.abs(dy)); }
  if (Math.abs(tx - NPC.pos.x) < 0.001 && Math.abs(ty - NPC.pos.y) < 0.001) NPC.path.shift();
  NPC.animTimer += dtms;
  while (NPC.animTimer >= SDV.ANIM_BASE_MS) { NPC.animTimer -= SDV.ANIM_BASE_MS; NPC.animFrame = (NPC.animFrame + 1) % SDV.ANIM_FRAMES; }
}

/* =========================================================================
   THE ONE BUTTON. What it does depends on what you are standing in front of,
   which is the whole point of putting mechanics in a world instead of a menu.
   ========================================================================= */
function standTile() {
  return { x: Math.floor((S.pos.x + SDV.TILE / 2) / SDV.TILE),
           y: Math.floor((S.pos.y + SDV.BOX_H / 2) / SDV.TILE) };
}
function facingTile() {

  ctx.fillStyle = 'rgba(120,220,140,.30)'; ctx.fillRect(colX, barY, colW, barH);
  ctx.strokeStyle = '#7adc8c'; ctx.lineWidth = 2; ctx.strokeRect(colX + 1, barY + 1, colW - 2, barH - 2);
  var fy = top + Math.round((F.bobPos - SDV.FISH_ABOVE) * scale);
  var fh = Math.max(4, Math.round((SDV.FISH_ABOVE + SDV.FISH_BELOW) * scale));
  var fx = colX + Math.round(colW / 2) - 18;
  ctx.fillStyle = '#ffd24a'; ctx.fillRect(fx, fy, 36, fh);
  ctx.fillStyle = '#e0a516'; ctx.fillRect(fx - 10, fy + Math.round(fh * 0.28), 11, Math.max(2, Math.round(fh * 0.44)));
  /* the progress rail sits INSIDE the frame, left of the column */
  var railX = colX - 26;
  ctx.fillStyle = '#20303c'; ctx.fillRect(railX, top, 20, trackH);
  var ph = Math.round(Math.max(0, Math.min(1, F.progress)) * trackH);
  ctx.fillStyle = F.progress > 0.5 ? '#7adc8c' : (F.progress > 0.2 ? '#ffd24a' : '#ff7060');
  ctx.fillRect(railX, top + trackH - ph, 20, ph);
  ctx.fillStyle = '#dfe6ff'; ctx.font = 'bold 13px ui-monospace, monospace';
  ctx.fillText(Math.round(F.progress * 100) + '%', railX - 4, top - 26);
  ctx.font = '10px ui-monospace, monospace'; ctx.fillStyle = '#9fb3c0';
  ctx.fillText(F.fish.n + ' ' + F.size + '"  ·  difficulty ' + F.difficulty, railX - 4, top - 12);
  ctx.fillText('bar ' + F.barH + ' of ' + SDV.BAR_TRACK + '  ·  HOLD to lift', railX - 4, top - 1);
}

/* =========================================================================
   HUD + CONTROLS
   ========================================================================= */
var elClock = document.getElementById('clock'), elTele = document.getElementById('tele');
var elAct = document.getElementById('act');
var ACT_LABEL = { REEL: 'HOLD TO REEL', SLEEP: 'SLEEP', TALK: 'TALK TO ' + NPC.name,
                  FISH: 'CAST', FARM: 'USE TOOL', FARM_HERE: 'USE TOOL' };
function syncAct() {
  var c = context();

  elAct.disabled = !c;

}
function syncTools() {

}

document.getElementById('n_close').addEventListener('click', function () {
  S.modal = null; document.getElementById('m_num').classList.remove('open'); syncAct();
});
document.getElementById('l_close').addEventListener('click', closeLove);
document.getElementById('l_talk').addEventListener('click', talk);
document.getElementById('l_court').addEventListener('click', court);
(function buildGifts() {

/* --- the stick --- */
var stick = document.getElementById('stick'), knob = document.getElementById('knob');
var stickActive = false;
function setDirsFromVec(dx, dy, r) {
  var dead = r * 0.34, m = Math.sqrt(dx * dx + dy * dy);
  S.dirs[0] = S.dirs[1] = S.dirs[2] = S.dirs[3] = false;
  if (m < dead) { knob.style.transform = 'translate(0,0)'; return; }
  var ang = Math.atan2(dy, dx), oct = Math.round(ang / (Math.PI / 4));
  if (oct === -4 || oct === 4) S.dirs[3] = true;
  if (oct === -3) { S.dirs[3] = S.dirs[0] = true; }
  if (oct === -2) S.dirs[0] = true;
  if (oct === -1) { S.dirs[0] = S.dirs[1] = true; }
  if (oct === 0) S.dirs[1] = true;
  if (oct === 1) { S.dirs[1] = S.dirs[2] = true; }
  if (oct === 2) S.dirs[2] = true;
  if (oct === 3) { S.dirs[2] = S.dirs[3] = true; }
  var cl = Math.min(1, m / r) * (r * 0.42);
  knob.style.transform = 'translate(' + (Math.cos(ang) * cl).toFixed(1) + 'px,' + (Math.sin(ang) * cl).toFixed(1) + 'px)';
}
function stickAt(e) {
  var r = stick.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  setDirsFromVec(t.clientX - (r.left + r.width / 2), t.clientY - (r.top + r.height / 2), r.width / 2);
}
function stickEnd() { stickActive = false; S.dirs[0] = S.dirs[1] = S.dirs[2] = S.dirs[3] = false; knob.style.transform = 'translate(0,0)'; }
stick.addEventListener('touchstart', function (e) { e.preventDefault(); stickActive = true; stickAt(e); }, { passive: false });
stick.addEventListener('touchmove', function (e) { e.preventDefault(); if (stickActive) stickAt(e); }, { passive: false });
stick.addEventListener('touchend', function (e) { e.preventDefault(); stickEnd(); }, { passive: false });
stick.addEventListener('mousedown', function (e) { e.preventDefault(); stickActive = true; stickAt(e); });
window.addEventListener('mousemove', function (e) { if (stickActive) stickAt(e); });
window.addEventListener('mouseup', function () { if (stickActive) stickEnd(); });

/* --- the one button: tap to act, hold to reel --- */
var actDown = function (e) {
  if (e) e.preventDefault();
  if (F.live) { F.reeling = true; return; }
  act();
};
var actUp = function (e) { if (e) e.preventDefault(); F.reeling = false; };
elAct.addEventListener('touchstart', actDown, { passive: false });
elAct.addEventListener('touchend', actUp, { passive: false });
elAct.addEventListener('mousedown', actDown);
window.addEventListener('mouseup', actUp);

var KEYMAP = { ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3 };
window.addEventListener('keydown', function (e) {
  if (e.code in KEYMAP) { S.dirs[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Space') { actDown(e); }
});
window.addEventListener('keyup', function (e) {
  if (e.code in KEYMAP) { S.dirs[KEYMAP[e.code]] = false; e.preventDefault(); }
  if (e.code === 'Space') actUp(e);
});

/* =========================================================================
   THE LOOP
   ========================================================================= */
function frame(dtms) {
  S.now += dtms;
  stepFade(dtms);
  if (F.live) fishTick(dtms);
  else if (canWalk()) stepPlayer(dtms);
  stepClock(dtms);
  if (timePasses()) stepNPC(dtms);
  updateCam();
}
var last = 0, actTick = 0;
function loop(ts) {
  if (!last) last = ts;
  var dt = Math.max(4, Math.min(50, ts - last)); last = ts;
  if (S.driven) frame(dt);
  render(); hud();
  actTick += dt;
  if (actTick > 120) { actTick = 0; syncAct(); }
  requestAnimationFrame(loop);
}
resize(); syncTools(); syncAct(); paintLove(); updateCam();
toast('', 'Walk to the DOCK bottom-right and face the water to fish. The PLOT behind your house is soil: face it and use a tool. Walk up to ' + NPC.name + ' to court her. Sleep in your BED to end the day.');
requestAnimationFrame(loop);

/* =========================================================================
   THE TEST SURFACE — the gate walks this world and plays every loop in it
   ========================================================================= */
window.LAB = {
  SDV: SDV, S: S, F: F, L: L, NPC: NPC, FARM: FARM, MAPS: MAPS,
  CROPS: CROPS, FISH: FISH, GIFTS: GIFTS, FERTS: FERTS,
  mechanics: ['fishing', 'farming', 'marriage'],
  freeze: function () { S.driven = false; }, thaw: function () { S.driven = true; },
  seedRNG: function (n) { var st = n >>> 0; RNG = function () { st = (st * 1103515245 + 12345) & 0x7fffffff; return st / 0x7fffffff; }; },
  unseedRNG: function () { RNG = Math.random; },
  setDirs: function (list) {
    S.dirs[0] = S.dirs[1] = S.dirs[2] = S.dirs[3] = false;
    (list || []).forEach(function (d) { S.dirs[d] = true; });
  },
  step: function (n, dirs, run) {
    if (dirs !== undefined) window.LAB.setDirs(dirs);
    if (run !== undefined) S.running = !!run;
    for (var i = 0; i < n; i++) frame(TICK);
    return { x: S.pos.x, y: S.pos.y, map: S.map, time: S.timeOfDay };
  },
  place: function (map, tx, ty, facing) {
    S.map = map; S.pos.x = tx * SDV.TILE; S.pos.y = ty * SDV.TILE;
    if (facing !== undefined) S.facing = facing;
    S.fade = 0; S.fadeDir = 0; S.pendingWarp = null;
  },
  /* walk toward a tile with the real movement code, the way a thumb would */
  walkTo: function (tx, ty, maxFrames) {
    var guard = 0;
    while (guard++ < (maxFrames || 4000)) {
      var s = standTile();
      if (s.x === tx && s.y === ty) { window.LAB.setDirs([]); return true; }
      var dirs = [];
      if (Math.abs(tx - s.x) > 0) dirs.push(tx > s.x ? 1 : 3);
      else if (ty !== s.y) dirs.push(ty > s.y ? 2 : 0);
      window.LAB.setDirs(dirs);
      frame(TICK);
      if (S.map !== 'town' && MAPS.town.rows) { /* a warp fired: caller decides */ }
    }
    window.LAB.setDirs([]); return false;
  },
  context: context, act: act,
  facingTile: facingTile, standTile: standTile, setFacing: function (f) { S.facing = f; },
  fishTick: function (n, reeling) { F.reeling = !!reeling; for (var k = 0; k < n; k++) fishTick(TICK); return F.progress; },
  autoFish: function (maxTicks) {
    var t = 0;
    while (F.live && t++ < (maxTicks || 30000)) {
      var c = F.barPos + F.barH / 2;
      F.reeling = (F.bobPos - c - F.barSpeed * 10) < 0;
      fishTick(TICK);
    }
    return { live: F.live, progress: F.progress, caught: F.caught, gold: S.gold, level: S.fishingLevel };
  },
  castFish: function (i) { castAt(FISH[i]); },
  tool: function (t) { S.tool = t; }, seedPick: function (i) { S.seedPick = i; }, fertPick: function (i) { S.fertPick = i; },
  farmAt: farmAt, cropReady: function (tx, ty) { return cropReady(farmAt(tx, ty).crop); },
  talk: talk, gift: function (i) { giveGift(GIFTS[i]); }, court: court,
  openLove: openLove, closeLove: closeLove,
  hearts: hearts, pointCap: pointCap, setPoints: function (p) { L.points = p; paintLove(); },
  setBirthdayToday: function () { L.birthdaySeason = S.season; L.birthdayDay = ((S.day - 1) % 28) + 1; },
  sleep: sleep, setTime: function (t) { S.timeOfDay = t; S.clockAcc = 0; },
  setSeason: function (s) { S.season = s; },
  tintAlpha: tintAlpha, npcTile: npcTile, tileOn: tileOn, solidOn: solidOn,
  plateOf: function (m) { return { w: MAPS[m].rows[0].length, h: MAPS[m].rows.length }; },
  furnitureCount: function (m) {
    var r = MAPS[m].rows, n = 0;
    for (var y = 0; y < r.length; y++) for (var x = 0; x < r[y].length; x++) if (FURNITURE.indexOf(r[y][x]) >= 0) n++;
    return n;
  },
  soilCount: function () {
    var r = MAPS.town.rows, n = 0;
    for (var y = 0; y < r.length; y++) for (var x = 0; x < r[y].length; x++) if (r[y][x] === 'o') n++;
    return n;
  }
};

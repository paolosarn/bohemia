<h1>DECOY, A NEW PERK</h1>
<p class="q">"Did you seriously just walk around with a cardboard cutout?"</p>
<p>Once a fight, your man sets a cardboard cutout of himself on a tile up to two away. Their side thinks it is him and goes for it until it falls over. It never fights back. The kids and the riders can carry one too.</p>

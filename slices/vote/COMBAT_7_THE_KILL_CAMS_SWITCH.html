<p class="q">"Toggle kill cams on or off."</p>
<p>The kill cams are off as the game comes. Open the gear: under FIGHTS there is a KILL CAMS row, ON or OFF. With it off, a kill never stops the fight and nothing on the board changes. They are being reworked behind the switch.</p>

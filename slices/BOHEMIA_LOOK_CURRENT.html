<header>
  <h1>LOOK &mdash; WHAT IS NEW, IN PICTURES</h1>
  <div class="sub">51 pictures &middot; taken off the real screen &middot; 8/8/26</div>
</header>
<div class="wrap">
<figure class="shot"><figcaption class="t">THE FACE THAT POPS UP IS WEARING YOUR HAIRCUT NOW</figcaption><img loading="lazy" src="look/portrait-haircut.png" alt="THE FACE THAT POPS UP IS WEARING YOUR HAIRCUT NOW"><figcaption class="c">The body has been picking from sixteen haircuts. The portrait that pops up when somebody talks could draw six of them, and five of the seven names it could be given drew the exact same pixels. So three people in four had one haircut standing in front of you and a different one in the portrait. They matched 24.7% of the time, which is WORSE than the 33% you would get from a coin. The cause was a sentence I wrote saying the body has no notion of a hairstyle -- it does, and it is set for 93% of the valley. I had checked one of the two things that dress a person and written down that there wasn&#x27;t one. It is 88% now, and the portrait can draw ninety-two haircuts instead of six. AND YOU CAN BUILD YOUR OWN FACE: the editor only ever changed colours, so at a size where a face IS its proportions there was no way to change one. Fourteen sliders now, plus all fifteen haircuts and four hair textures. CHARACTER tab, tap your portrait. Your own face is byte-for-byte untouched.</figcaption></figure>
<figure class="shot"><figcaption class="t">EVERY HAIRCUT, EVERY WAY HE TURNS</figcaption><img loading="lazy" src="look/hair-reference.png" alt="EVERY HAIRCUT, EVERY WAY HE TURNS"><figcaption class="c">Twenty-four haircuts now, up from fifteen, and the first textured ones the game has ever had -- locs, short twists and a weave. Every one of them is rendered here in five directions, because a shape that only works head-on is not a haircut with a bug in it, it is a haircut that does not exist yet. TWENTY-THREE WERE COOKED AND NINE SHIPPED. Three crests were cut because head-on a mohawk is still a hard rectangle, which is the exact thing you killed it for. Four tied styles were cut because a ponytail only existed when you turned the head sideways. Six more were cut because their edges ran straight for seven to nine rows and your rule says six. Three real bugs got found on the way and fixing them made the WHOLE game less straight, including the fifteen that were already in: the loc parting was a barcode, a braid was drawn as a net full of holes, and a long fall hung off one fixed line so its edge only moved when a dice roll happened to change. CHARACTER tab to try them on, RUN tab for the crowd.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE FACE AND THE BODY ARE THE SAME PERSON</figcaption><img loading="lazy" src="look/one-id-one-person.png" alt="THE FACE AND THE BODY ARE THE SAME PERSON"><figcaption class="c">You said the eye colors should match the portrait. They did not, and it was worse than eyes. Measured over two hundred people: their SKIN matched eight times in a hundred, and their HAIR matched ZERO times in two hundred. The portrait that popped up when somebody talked was a different human being from the body standing in front of you. Two causes, and only one was a missing feature. Skin and hair had TWO systems picking them, one seven weeks older than the other, so the younger one got deleted. Eyes had NO system at all -- the body drew YOUR iris for everybody in the valley. Same person on both sides now, every time, off one name. And the city stopped being a clown parade on the way: one person in six had bright orange hair and one in eight had pink, because the crowd picked evenly from a list where pink sits next to black. Black was the rarest at 12.7%. It is 34% now. RUN tab, talk to anybody.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE PORTRAIT POPS UP WHEN SOMEBODY TALKS</figcaption><img loading="lazy" src="look/the-portrait-pops-up.png" alt="THE PORTRAIT POPS UP WHEN SOMEBODY TALKS"><figcaption class="c">You asked for this: every time you speak to someone their portrait pops up so you feel like you are relating to them, with the face actually talking and the eyebrows moving. Last time I built the talking and it could not be used, and here is the honest reason: ONLY YOU HAD A FACE IN THIS WHOLE GAME. Everybody else was a body with nothing on the front of their head, so there was no portrait to pop up. Now every single person in the valley has one. The top row is the real opening scene of the game, photographed, not a mockup. The middle row is her mouth blown up so you can see it: the shape is made from the LETTERS she is actually saying, so an O in the words is an O on her face, and the same line always looks the same. The bottom row is your family and four strangers off the street, so you can see they are different people and not one face with the colours swapped. Nobody is random. The same person has the same face every time you meet them, on any phone, with nothing saved. They blink on real human timing and their eyebrows go up when they ask you something. Who anybody IS is still yours to say. LOOK tab for this picture, RUN tab to see it in the opening.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE MIDDLE OF THE WARDROBE DID NOT EXIST</figcaption><img loading="lazy" src="look/the-trenchcoat-rule.png" alt="THE MIDDLE OF THE WARDROBE DID NOT EXIST"><figcaption class="c">You said everyone is getting a fucking trenchcoat and it is ridiculous. One in five people in the city was wearing one, and it was not a taste problem: every coat in the game was either a waistcoat or floor-length, so anybody who wanted a coat and not a waistcoat came out in a duster. Nobody chose that, the wardrobe chose it. Seventeen new coats fill the two lengths that did not exist, and the long coat is held back from nine strangers in ten. Then you set a hard ceiling: only 10% of people no matter what, because this is a desert game and it is hot. The factions were at three of thirteen -- 23% -- and my own gate had exempted them by design. One faction wears it now, 7.7%, inside your number. Not one coat was deleted. About 20% before, about 1.5% now. CHARACTER tab to try them on, RUN tab for the crowd.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE COLOURS WERE NEVER PUT ON ANYBODY</figcaption><img loading="lazy" src="look/colour-is-territory.png" alt="THE COLOURS WERE NEVER PUT ON ANYBODY"><figcaption class="c">You said the Colorful guy was not colorful and that shit was crazy. You were right, and you already asked for this once: back in July you said &quot;not even a single color, like rainbow literally&quot;, and four bright clothes were made that week FOR Colorful. Measured five weeks later: three of them were worn by NOBODY, the fourth went to the wrong faction, and Colorful was dressed in bone, bone and bone -- the second least colourful of the thirteen. The BLUES were 67% RED, because their coat was oxblood, so a faction named for a colour was walking around flagged as its rival. Both fixed. Nobody changed shape: same coat, same cap, same boots, only the colour moved, so you can still tell them apart in the dark. And the board has THUMBS now, because you said you would have voted. LOOK tab for this picture, CHARACTER tab to vote.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE FACE TALKS</figcaption><img loading="lazy" src="look/the-face-talks.png" alt="THE FACE TALKS"><figcaption class="c">You said you want their portrait to pop up when you speak to them, with real facial animation, talking and eyebrows. Here is the face doing all three. THE MOUTH IS DRIVEN BY THE LETTERS THEY ARE ACTUALLY SAYING: the line is walked one sound at a time and each sound picks a shape, so an O in the words is an O on the face, and the same line always looks the same. Four mouth shapes, not the ten a cartoon uses, because this mouth is nine pixels wide and three tall and ten shapes into nine pixels is the same mistake as the overworld face size you killed. They blink on real human timing, 285 milliseconds, lid dropping faster than it lifts. A question lifts their eyebrows by itself. Nothing is random, so the same person is the same person every time you meet them, and a face with nothing asked of it is EXACTLY the face you approved. LOOK tab for this picture, CHARACTER tab for the portrait.</figcaption></figure>
<figure class="shot"><figcaption class="t">ONE IN THREE HAD A HAT ON</figcaption><img loading="lazy" src="look/the-bald-crowd.png" alt="ONE IN THREE HAD A HAT ON"><figcaption class="c">The hats I fixed yesterday were not just seventeen items in a menu. The city dresses itself out of that same wardrobe. I generated 5,000 townspeople the exact way the game makes them: 30 out of every 100 were wearing headwear, and 88 out of every 100 of those hats drew NOTHING. That is 28 out of every 100 people in your city putting something on their head and staying bare. Only 2 of the 17 hats in the whole game worked, so the town read as a place where almost nobody owns a hat, which is not the town you wrote. Top rows are what you actually saw. Bottom rows are the same ten people, same seed, same everything, wearing what they were always wearing. LOOK tab for this picture, CITY tab to walk through them.</figcaption></figure>
<figure class="shot"><figcaption class="t">SEVENTEEN THINGS THAT WERE NOT THERE</figcaption><img loading="lazy" src="look/the-missing-hats.png" alt="SEVENTEEN THINGS THAT WERE NOT THERE"><figcaption class="c">Seventeen things in your wardrobe drew NOTHING. Every knit cap, watch cap, field cap, work cap and slouch beanie, the rice farmer hat, and both pairs of shades. You could put one on and not one pixel of the screen changed. I found them by running the same check I built for the hair across all 204 clothes. One wrong number caused it: the code measured your head on the OLD small grid, so it thought the line a hat is not allowed to cross sat twelve rows ABOVE your head. Nothing can draw above that. And the gate that guards hats was green the whole time, because what it checks is that a hat never crosses the line, and a hat that draws nothing never crosses anything. Left three columns are before, right three are now. LOOK tab for this picture, CHARACTER tab to put one on.</figcaption></figure>
<figure class="shot"><figcaption class="t">ONE HAIRCUT, THE WHOLE WAY ROUND</figcaption><img loading="lazy" src="look/one-haircut.png" alt="ONE HAIRCUT, THE WHOLE WAY ROUND"><figcaption class="c">You said the haircuts have to be the same and coordinated from all angles. Two of the fifteen were not, and it was not close: SHOULDER LENGTH and LONG LOOSE had a real fall of hair facing forward and NOTHING from any other angle. Turn his head one notch and a shoulder-length haircut became a crop. A second bug on top of it meant the long one and the shoulder one drew the exact same length anyway, so the dial that says how long a haircut is was not reaching the screen at all. Both fixed. Each row here is one haircut turning all the way around, one step at a time. I also drew this twice wrong before I got it right: once the hair fell as a single strip down his chest, once it detached at the jaw and floated off his shoulders. Looking at the picture caught both; every number I had said it was fine. LOOK tab for this picture, CHARACTER tab for the hair.</figcaption></figure>
<figure class="shot"><figcaption class="t">A FENCE YOU CAN SEE THROUGH</figcaption><img loading="lazy" src="look/you-can-see-through-it.png" alt="A FENCE YOU CAN SEE THROUGH"><figcaption class="c">Every perimeter fence in the city was a solid band of house roof tiles ringing every district. Thirty-one of them. A fence you cannot see through is a WALL, whatever the map calls it. These are chain-link now, and the trick is what is NOT drawn: the tile is mostly empty and the ground on the far side shows straight through the mesh, with the posts every three metres and the top rail catching the light. Some panels are simply gone, because the fences here have been down for ten years and every one of these legends already said so. RUN tab, walk up to any fence line.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE RUST RUNS DOWN IT NOW</figcaption><img loading="lazy" src="look/everything-metal.png" alt="THE RUST RUNS DOWN IT NOW"><figcaption class="c">Every metal thing in the city was wearing house roof tiles: the gantry crane at the rail yard, the conveyors at the quarry, the pipe galleries at the water plant, the guardrails on the freeway, this water tank. Twenty-five of them. They are steel now -- ribbed like real sheet metal, catching the light on one edge of every rib the way metal does and concrete does not, with the rust bleeding DOWNWARD from every fastener, because that is the direction water carries it. Ten years of it. RUN tab, walk into any industrial yard.</figcaption></figure>
<figure class="shot"><figcaption class="t">STRANDS IN THE HAIR</figcaption><img loading="lazy" src="look/hair-strands.png" alt="STRANDS IN THE HAIR"><figcaption class="c">You said the hair was still drawn in the old fat pixels. You were right, and the first number I took said you were wrong. That number was measuring the OUTLINE of the haircut, and the outline is not the haircut. Measuring the INSIDE instead: 9 of your 15 haircuts had nothing in them at all, one flat colour with a dark rim and no strand, parting or break anywhere. That is what the old small canvas could hold and nothing more. Now none are like that: 47 one-pixel marks across all the hair before, 820 now. The parting drifts by a pixel as it runs so it is a strand and not a ruled line, and it is worked out from the haircut&#x27;s name so the same style comes out the same every time and nobody in a crowd shimmers. Nothing got thinner and no shape moved. LOOK tab for this picture, CHARACTER tab for the hair.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE SIDE VIEW, FIXED</figcaption><img loading="lazy" src="look/one-head.png" alt="THE SIDE VIEW, FIXED"><figcaption class="c">ANSWERED 8/25: &quot;the side view is a lot better east and west.&quot; The hold on the other 21 haircuts is LIFTED. What was wrong: the hair was drawing IN FRONT OF HIS FACE. On the rows his eyes, nose and mouth are on, the hair spilled past the front of his face and hung in the air there, so every profile read as a helmet with a slot instead of a person. 546 stray pixels across all 15 styles, not one style clean. Now zero. Top row is his bare head, bottom row is the same head with hair on. LOOK tab for this picture, CHARACTER tab for the hair.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE HEM</figcaption><img loading="lazy" src="look/hem.png" alt="THE HEM"><figcaption class="c">Last big pass on giving your clothes detail the sharper character can hold. Cloth is hemmed and the stitching is one pixel, so your shirts and coats had none because there was no room for it. Shirts went from 50 of 68 with fine detail to 65, coats from 20 of 31 to 27. On Friday 102 of your clothes had no fine detail anywhere. It is 22 now. The stitch sits just above the fold like real hemming, and it picks a tone that contrasts with the cloth, because a stitch you cannot see is not a stitch. Nothing moved and nothing got thinner. LOOK tab for this picture, CLOTHES tab for the clothes.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE HARDWARE</figcaption><img loading="lazy" src="look/hardware.png" alt="THE HARDWARE"><figcaption class="c">Third pass on giving your clothes detail the sharper character can actually hold. Scavenged armour is bolted together and yours had no rivets, because a rivet is one pixel and one pixel did not exist before. Every gear piece and every pack now gets studs along its plate edges. This is the biggest single jump so far: gear went from 4 of 22 pieces with fine detail to 24 of 26, packs from 3 of 11 to 7 of 11. Three days ago 102 of your clothes had no fine detail anywhere, now it is 44. Nothing moved and nothing got thinner, a rivet just recolours a pixel the plate already owned. LOOK tab for this picture, CLOTHES tab for the gear.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE SMALL THINGS</figcaption><img loading="lazy" src="look/fine-detail.png" alt="THE SMALL THINGS"><figcaption class="c">Carrying on from the boots. Your gloves had no knuckles, your belts had no stitching, your scarves had no weave and your masks had no hem, because at the old resolution there was no spare row to put any of it in. All four have one now. This is the same method as the boot stitch and the same rule with it: nothing you already ruled on got thinner, these are marks that did not exist before. 102 of your 200 clothes had no fine detail yesterday morning, 66 do now. Next are the gear pieces and the bags. LOOK tab for this picture, CLOTHES tab for the items.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE BOOTS GOT STITCHING</figcaption><img loading="lazy" src="look/boot-stitch.png" alt="THE BOOTS GOT STITCHING"><figcaption class="c">Since the character went to four times the pixels, only his hair had actually been given anything to do with them. I measured the wardrobe and 102 of your 200 canon garments had no one-pixel detail on them anywhere, which means every mark on them was a whole block wide and the extra pixels were buying a bigger boot rather than a finer one. Footwear was the worst: zero of eighteen. So every shoe now has a welt stitch, a single-pixel dotted line where the upper meets the sole, which is the thing real boots have and 56 pixels had no room for. Left is before, right is now, front and side. Nothing you already ruled on got thinner: the heel seam and the laces are exactly as they were. LOOK tab for this picture, CLOTHES tab for the shoes.</figcaption></figure>
<figure class="shot"><figcaption class="t">IT WAS NEVER JUST THE HAIR</figcaption><img loading="lazy" src="look/slot-leak.png" alt="IT WAS NEVER JUST THE HAIR"><figcaption class="c">The white blob you spotted on the side of his head was not a hair bug, it was a slot bug, so I went and checked the other eight painted layers the same way. Three more were doing it: your leather legwarmers showing through blue jeans, your Balenciagas through white sneakers, and your fuzz hoodie through the wasteland duster. 147 stray pixels in total, now zero. Be warned these are much smaller and less obvious than the hair blob was, so look at the hips and the boot edges rather than expecting something to jump out. Nothing of yours was edited, and with nothing worn you still look exactly as you painted yourself. LOOK tab for this picture, CHARACTER tab for the clothes.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE WHITE BLOB IN PROFILE</figcaption><img loading="lazy" src="look/hair-profile.png" alt="THE WHITE BLOB IN PROFILE"><figcaption class="c">You said to keep fixing east and west hair. Two things were wrong and both were profile only, which is why they survived three weeks of front views. First, your own painted curtain bob was still drawing underneath every hairstyle you put on. Front on, the hairstyle covered it and you could not tell. Side on, your paint reaches two pixels further out than the hairstyle knows about, and the near-white colour in your bob&#x27;s palette stuck out over the forehead as a bright blob. 1,349 pixels of it across all fifteen styles, now zero. Second, the fade was stopping halfway down the head in profile instead of at the bottom of the hair. Your painted bob is untouched and comes straight back the moment you take a hairstyle off. LOOK tab for this picture, CHARACTER tab for the hair.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE HAIR STOPPED BEING STRAIGHT</figcaption><img loading="lazy" src="look/hair-edge.png" alt="THE HAIR STOPPED BEING STRAIGHT"><figcaption class="c">You told me on 8/1 that hair is little off shapes and that I was drawing a lot of straight lines. The fix that day worked, but it moved the edge by a whole block, so when the character went to four times the pixels the hair kept wobbling in the same chunky steps: sharper, not finer. Measured, half of every hair edge was running dead straight for four rows or more and some for sixteen. The edge now moves by a single pixel, which is only possible at the new resolution. 18.5% now, longest run six. Left is the old edge, right is the new one, same generator, same head. Your painted head is untouched. CHARACTER tab for the hair, LOOK tab for this picture.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE KERB AND THE LANE LINE</figcaption><img loading="lazy" src="look/the-proper-sidewalk.png" alt="THE KERB AND THE LANE LINE"><figcaption class="c">You said do not forget the proper sidewalks. The sidewalk surface was already your good concrete, but the KERB beside it was wearing the house-yard dirt pool and the LANE LINE was wearing blank asphalt, so the road had no line on it. Both now wear the tiles you approved on 7/14: pale concrete with the panel joints for the kerb, and the thirty-year washed white line for the lane. RUN tab, stand on any big road.</figcaption></figure>
<figure class="shot"><figcaption class="t">IT LOOKS EXACTLY THE SAME: the 4x flip, before and after</figcaption><img loading="lazy" src="look/the-box.png" alt="IT LOOKS EXACTLY THE SAME: the 4x flip, before and after"><figcaption class="c">You looked at this and said it looks exactly the same, and you were right, so it shipped. The whole 4x flip had been built and switched off since 8/16 on my judgement that the head came out too square without the upscaler rounding its corners. Measured, the two columns differ on 5.9% of him and only 11% of that is on the head. Left is every build before 8/20, right is what you are playing now: the character is composed at four times the pixels, the upscaler is off, and the black border is one true pixel instead of a doubled one. Your painted art is untouched and still hashes byte for byte. LOOK tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE WARDROBE AT 4X: what four times the pixels buys the clothes</figcaption><img loading="lazy" src="look/wardrobe-4x.png" alt="THE WARDROBE AT 4X: what four times the pixels buys the clothes"><figcaption class="c">Twelve garments and two hairstyles, drawn twice at the same size on screen. LEFT is the way the 2x plan was going to ship them: generated at 56 and doubled into 2x2 squares, chunky cloth on a sharp body. RIGHT is the same garment composed natively, so a strap, a fold, a plaid and a cornrow each carry four times the detail. As of 8/20 the right-hand column is what the game draws: the rig is flipped and the wardrobe was made resolution-native the same day. CLOTHES tab is where you wear them; this picture lives in the LOOK tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">HIS SIGNALS, BACK ON THE INTERSECTIONS</figcaption><img loading="lazy" src="look/the-signals-are-back.png" alt="HIS SIGNALS, BACK ON THE INTERSECTIONS"><figcaption class="c">The 348-sprite traffic signal set you approved on 7/17 stopped appearing anywhere the day the roads started drawing themselves from their own modules. One flag meant BOTH &quot;this cell is a road&quot; AND &quot;draw it the old way&quot;, so turning the second off turned the first off with it, and 274 real intersections lost their signals in silence. Measured at zero draws; here they are. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">GROUND YOU CANNOT SET YOUR FEET ON</figcaption><img loading="lazy" src="look/the-bad-footing.png" alt="GROUND YOU CANNOT SET YOUR FEET ON"><figcaption class="c">Loose ground: ballast, talus, rubble drift. Standing here you cannot brace, so everything physical hits you harder -- and the tip cuts both ways, because you can lead somebody else onto it. Until 8/20 this drew as flat colour and the only thing that told you it was dangerous was a line of text in the corner. Now the floor says it: broken chips, four values, no two pieces alike. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE HOLE: ground you can be thrown into</figcaption><img loading="lazy" src="look/the-hole.png" alt="THE HOLE: ground you can be thrown into"><figcaption class="c">The crest of a quarry bench. Until 8/20 this was a WALL -- the deepest hole in the valley was something you bounced off. It is a void now: you cannot walk into it, it does not stop a body thrown at it, and being knocked in is fatal. Drawn darker than the rock it is cut from, because a drop reads as a floor at a different value. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY LOST YOU</figcaption><img loading="lazy" src="look/they-lost-you.png" alt="THEY LOST YOU"><figcaption class="c">Put stone between you and them and the guns do not miss, they turn OFF. One thing decides it -- whether a man can actually see you -- and five separate systems ask it: whether he can hold a bead, whether he may shoot, where he walks, whether he runs for cover, and whether he shouts. A man who loses you walks to WHERE YOU WERE, not to where you are. And the one who can still see you tells everyone within eight tiles, so he is the one worth shooting first. COMBAT tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE CARD FITS AGAIN</figcaption><img loading="lazy" src="look/the-terms-fold.png" alt="THE CARD FITS AGAIN"><figcaption class="c">Five different systems write onto a person now and the card had quietly grown to 96 percent of your screen -- one more thing and it would have run off the bottom. So the stuff that is true of the WHOLE outfit and never changes (what they want, what they hold, what they pay in) collapses to one line the moment you have done anything for them, because you have already read it. Tap that line and it all comes back. Down to 84 percent. CITY tab, tap somebody you have helped.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY ARE NOT WAITING</figcaption><img loading="lazy" src="look/the-collection.png" alt="THEY ARE NOT WAITING"><figcaption class="c">This is what the free thing was for. You took what the Cartel was offering three times, and now that they count you they are asking -- and they are not waiting for the polite gap between asks, because that gap is for people who do not owe them. Saying no here does not cost you one rung, it costs you one for every favour you took. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE FIRST THING IS FREE</figcaption><img loading="lazy" src="look/the-favour.png" alt="THE FIRST THING IS FREE"><figcaption class="c">The other direction, finally. Some outfits give you something the first time you meet them, it costs you nothing, and that is exactly the part to worry about -- the card starts keeping a tally of what you have taken. Others hand you nothing until they count you, and then it spends the standing you built. One outfit gives nothing to anybody ever. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY ASK YOU BACK</figcaption><img loading="lazy" src="look/the-claim.png" alt="THEY ASK YOU BACK"><figcaption class="c">Once an outfit COUNTS you it starts asking, and what it asks for is the thing it already wanted. Saying yes buys you nothing -- it is the rent on being counted. Saying no drops you straight back below counted, and they remember which way you went. CITY tab, tap a person you have done favours for.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE WALL: turning up runs out of road</figcaption><img loading="lazy" src="look/the-wall.png" alt="THE WALL: turning up runs out of road"><figcaption class="c">Walk up to anybody who runs with an outfit and this is their card. You have done what they want five times, and it says so: turning up gets you no further than USEFUL, and COUNTED is not for sale at any number of favours. The only button that passes it is saying out loud that you are with them. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">A PIT DUG IN THE DIRT</figcaption><img loading="lazy" src="look/the-pit-dug.png" alt="A PIT DUG IN THE DIRT"><figcaption class="c">Somebody dug here. The ground is sunk where the fill settled, the pale heap beside it is the earth that never went back in, and the dark green is growing on what is under it. Bare dirt and sand generate these now. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">A CLUSTER: they died together</figcaption><img loading="lazy" src="look/dead-cluster.png" alt="A CLUSTER: they died together"><figcaption class="c">The dead come in groups now, not sprinkled one by one. This is what you find in an abandoned block. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE PIT: the cemetery</figcaption><img loading="lazy" src="look/dead-pit.png" alt="THE PIT: the cemetery"><figcaption class="c">They stopped digging graves and dug one hole. The cemetery is a dumping pit now, about 34 bodies in a single heap. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE VISTA: the mountain overlook</figcaption><img loading="lazy" src="look/vista.png" alt="THE VISTA: the mountain overlook"><figcaption class="c">THE DEMO MONEY SHOT. Stand on the west rim and the whole valley is laid out below you, drawn by the valley view that already existed. RUN tab, on reaching the overlook.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: how thick they lie</figcaption><img loading="lazy" src="look/dead-density.png" alt="THE DEAD: how thick they lie"><figcaption class="c">A wider view of the same ground, so the density reads. Too many, too few, or about right is the only call needed. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: the walk-out</figcaption><img loading="lazy" src="look/dead-desert.png" alt="THE DEAD: the walk-out"><figcaption class="c">Open desert. The ones who walked out and did not make it, thin and scattered, no mummified bodies because nothing out here is sealed. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: the road out</figcaption><img loading="lazy" src="look/dead-road.png" alt="THE DEAD: the road out"><figcaption class="c">The exodus road. Remains on the asphalt where people stopped walking. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: a suburban street</figcaption><img loading="lazy" src="look/dead-suburb.png" alt="THE DEAD: a suburban street"><figcaption class="c">Bones lying in the open on a suburb street, bleached and scattered by ten years of scavengers. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE BLACK BORDER IS ONE PIXEL NOW</figcaption><img loading="lazy" src="look/border-one-pixel.png" alt="THE BLACK BORDER IS ONE PIXEL NOW"><figcaption class="c">His 8/14 ask: &quot;the black border has to be thinner, like half as thin.&quot; It was always drawn as ONE pixel -- but it was drawn on the 56 composition and then DOUBLED by the upscale that takes the frame to 112, so it reached the screen at two. It is now drawn after the upscale and arrives at one. Same body, byte for byte: 0 of ~18,000 non-border pixels changed. CHARACTER tab, and anywhere a person is drawn -- RUN, CITY, COMBAT.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE BLACK BORDER, IN THE GAME</figcaption><img loading="lazy" src="look/border-in-the-game.png" alt="THE BLACK BORDER, IN THE GAME"><figcaption class="c">His 8/14 ask, finished where it counts. The CHARACTER tab got the thin outline first, and the GAME kept doubling it: the city enlarges every body on an integer ladder, so the one pixel came along for the ride and landed 2px thick walking around and 4px zoomed in. The border is now drawn AFTER the enlargement, at the size you actually see it, for the player and every neighbour. RUN tab (and CITY), anywhere a person is drawn.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE SIX PEOPLE ON YOUR STREET</figcaption><img loading="lazy" src="look/six-neighbours.png" alt="THE SIX PEOPLE ON YOUR STREET"><figcaption class="c">Your neighbours used to be YOU, six times, under six random colours -- same body, same clothes, only the hue changed, plus a durag on every third one. Strip the colour and they were six identical silhouettes, which matters because the valley goes DARK: night runs 19:00 to 06:00 and only about 4% of the map has live power, so colour is the one channel you cannot count on (06:00 itself is when night ENDS -- I had that wrong and it is corrected). They are six SHAPES now -- different bodies, different garments, all from the canon wardrobe. TWO OF THEM STILL MATCHED, and the fix was not a new garment: I measured all 202 clothes in the wardrobe for how much each one changes the outline, and the SHOULDER MANTLE moves it four times more than the gap I could not close. It was already in there. The backpack I had given one of them turns out to be invisible from the front, which is the direction you meet somebody in. The two closest neighbours are now three times further apart. The bottom row is the test. RUN tab, walk into a settlement.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE THIRTEEN OUTFITS</figcaption><img loading="lazy" src="look/thirteen-outfits.png" alt="THE THIRTEEN OUTFITS"><figcaption class="c">Every faction you can join, and you can tell them apart with the colour switched off. That matters because the valley goes DARK: night runs 19:00 to 06:00, and only about 4% of the map has live power, so most streets have no light even by day. Colour is the one channel you cannot count on. (I had been saying the demo OPENS in the dark -- it does not, 06:00 is exactly when night ends. Corrected.) These were not picked by eye: 880 fits were rendered out of clothes that already existed and the thirteen most different were kept, which is also how I found out the wardrobe holds exactly thirteen and not one more. The bottom block is the test. CHARACTER tab, THE THIRTEEN OUTFITS -- tap a body to turn it, hit COLOUR OFF to run the test yourself, WEAR IT to put one on and change it.</figcaption></figure>
<figure class="shot"><figcaption class="t">TREATING A GUNSHOT WOUND</figcaption><img loading="lazy" src="look/field-surgery.png" alt="TREATING A GUNSHOT WOUND"><figcaption class="c">Your five steps, the ones you wrote at a bedside, as animations you can watch: pour the iodine, inject the lidocaine, pick the pellets out. Three clips cover all five because the needle gets used twice and boiling the tweezers is a held prop. All three put both hands in the same spot -- it is the same wound -- so what tells them apart is HOW THEY MOVE, and the bars under each row are the hand speed: the pour has a long flat stretch where the hand has stopped, the injection is one tall spike, and the tweezing shakes. ANIMATION tab, pick the clip. Also CHARACTER tab on the body.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DRUNK WALK JUMPED EVERY TWO SECONDS</figcaption><img loading="lazy" src="look/the-drunk-seam.png" alt="THE DRUNK WALK JUMPED EVERY TWO SECONDS"><figcaption class="c">The drunk walk teleported sideways every two seconds and had done since it was written: one number in its maths ran at half the speed of everything beside it, so it ended each loop on the opposite side from where it started. The line under each row is the body&#x27;s real centre, measured off the drawn pixels. Before, the whole 12.5px of movement happened in ONE frame, at the restart. After, the step across the restart is 0.3px. I found it by checking every animation in the game for the same defect -- 102 of the 103 were already fine, which is the more useful half of the answer. ANIMATION tab, pick drunk.</figcaption></figure>
<figure class="shot"><figcaption class="t">WHEN A PERSON STOPS BEING SOMEBODY</figcaption><img loading="lazy" src="look/zoom-identity.png" alt="WHEN A PERSON STOPS BEING SOMEBODY"><figcaption class="c">I proved the thirteen faction outfits tell each other apart -- and I proved it at ONE of the four sizes this game draws a person at. This is the other two. At the zoom you actually walk around in they are thirteen people. One zoom out they are already closer together than the gap that once made two neighbours read as the same guy, and zoomed right out the body is twenty-five pixels tall and they are a crowd. That is not something a wider coat fixes; it is a limit worth knowing. What it means in practice: anything you need to RECOGNISE from far away -- whose street this is, somebody you are looking for -- needs something other than the outline. CHARACTER tab for the outfits themselves; this is what they look like from the CITY.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE NEIGHBOURHOOD YOU WAKE UP IN</figcaption><img loading="lazy" src="look/the-spawn-sidewalk.png" alt="THE NEIGHBOURHOOD YOU WAKE UP IN"><figcaption class="c">Two passes on the street you spawn on. The sidewalks were being laid all along and the renderer had no case for them, so they drew as dead dirt -- they wear your concrete now. And every house sat in one flat empty rectangle: nine tile codes in the whole suburb and not one of them a prop. Front yards are DECORATIVE GRAVEL now, which is what a Las Vegas yard actually is and the one thing that survives a dead world, with wind-drifted debris against the kerb in about a third of them. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">TWO YARDS THAT HAVE NEVER HAD A LIGHT</figcaption><img loading="lazy" src="look/the-yards-lit.png" alt="TWO YARDS THAT HAVE NEVER HAD A LIGHT"><figcaption class="c">The wrecking yard and the reservoir both put four pole lights down when they were built, and then paved straight over all four with their own dirt lanes -- so both places have been pitch dark since the day they were written, every seed, and nothing ever said a word, because a light that got overwritten looks exactly like a light that was never there. A machine that reads the world that actually got built found them. They stand now, and at night the power grid decides which ones burn. RUN tab, walk into a wrecking yard.</figcaption></figure>
<figure class="shot"><figcaption class="t">A ROAD ACROSS THE DAM</figcaption><img loading="lazy" src="look/the-way-in.png" alt="A ROAD ACROSS THE DAM"><figcaption class="c">Four places in the valley were built so that a car could not get into them at all, and this was the worst of them. The road over the top of the dam was two tiles wide, which is about five feet -- a footpath, not the highway that ran over Hoover Dam for seventy years. And the whole thing read as sealed off from the street anyway, because the machine that checks it counted the gate you drive through as a wall. Both fixed: the crest carries two real lanes with a parapet either side, and every district in the valley can now be driven into. And the dam is made of concrete now. It was wearing the HOUSE ROOF art -- the same shingle tiles as the little houses in the suburb, tinted grey -- because the game hands that art to anything standing up that is not a mountain. It is poured concrete now, with the horizontal lines where each five-foot lift of the pour stopped, which is what a real dam face looks like. RUN tab, walk out onto the dam.</figcaption></figure>

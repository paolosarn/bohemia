<header>
  <h1>LOOK &mdash; WHAT IS NEW, IN PICTURES</h1>
  <div class="sub">27 pictures &middot; taken off the real screen &middot; 8/8/26</div>
</header>
<div class="wrap">
<figure class="shot"><figcaption class="t">THE KERB AND THE LANE LINE</figcaption><img loading="lazy" src="look/the-proper-sidewalk.png" alt="THE KERB AND THE LANE LINE"><figcaption class="c">You said do not forget the proper sidewalks. The sidewalk surface was already your good concrete, but the KERB beside it was wearing the house-yard dirt pool and the LANE LINE was wearing blank asphalt, so the road had no line on it. Both now wear the tiles you approved on 7/14: pale concrete with the panel joints for the kerb, and the thirty-year washed white line for the lane. RUN tab, stand on any big road.</figcaption></figure>
<figure class="shot"><figcaption class="t">IS THIS A DEALBREAKER? the 4x character, side by side</figcaption><img loading="lazy" src="look/the-box.png" alt="IS THIS A DEALBREAKER? the 4x character, side by side"><figcaption class="c">The whole 4x flip has been built and switched off since 8/16 for one reason, and it was my judgement, not yours: composing natively removes the corner-rounding the upscaler was doing for free, so the head comes out a bit more square, and that reads against your own no-straight-lines rule. You have never actually been shown it. Left is what you see today, right is what native 4x gives you, same art, same size, same clothes. They differ on 5.9% of him, 11% of that on the head. 40% of the difference is clothes and hair, which is code I fix for free; the rest is your paint. If you can live with the right column, 4x ships. LOOK tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE WARDROBE AT 4X: what four times the pixels buys the clothes</figcaption><img loading="lazy" src="look/wardrobe-4x.png" alt="THE WARDROBE AT 4X: what four times the pixels buys the clothes"><figcaption class="c">Twelve garments and two hairstyles, drawn twice at the same size on screen. LEFT is the way the 2x plan was going to ship them: generated at 56 and doubled into 2x2 squares, chunky cloth on a sharp body. RIGHT is the same garment composed natively, so a strap, a fold, a plaid and a cornrow each carry four times the detail. As of 8/20 the right-hand column is what the game draws: the rig is flipped and the wardrobe was made resolution-native the same day. CLOTHES tab is where you wear them; this picture lives in the LOOK tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">HIS SIGNALS, BACK ON THE INTERSECTIONS</figcaption><img loading="lazy" src="look/the-signals-are-back.png" alt="HIS SIGNALS, BACK ON THE INTERSECTIONS"><figcaption class="c">The 348-sprite traffic signal set you approved on 7/17 stopped appearing anywhere the day the roads started drawing themselves from their own modules. One flag meant BOTH &quot;this cell is a road&quot; AND &quot;draw it the old way&quot;, so turning the second off turned the first off with it, and 274 real intersections lost their signals in silence. Measured at zero draws; here they are. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">GROUND YOU CANNOT SET YOUR FEET ON</figcaption><img loading="lazy" src="look/the-bad-footing.png" alt="GROUND YOU CANNOT SET YOUR FEET ON"><figcaption class="c">Loose ground: ballast, talus, rubble drift. Standing here you cannot brace, so everything physical hits you harder -- and the tip cuts both ways, because you can lead somebody else onto it. Until 8/20 this drew as flat colour and the only thing that told you it was dangerous was a line of text in the corner. Now the floor says it: broken chips, four values, no two pieces alike. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE HOLE: ground you can be thrown into</figcaption><img loading="lazy" src="look/the-hole.png" alt="THE HOLE: ground you can be thrown into"><figcaption class="c">The crest of a quarry bench. Until 8/20 this was a WALL -- the deepest hole in the valley was something you bounced off. It is a void now: you cannot walk into it, it does not stop a body thrown at it, and being knocked in is fatal. Drawn darker than the rock it is cut from, because a drop reads as a floor at a different value. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY LOST YOU</figcaption><img loading="lazy" src="look/they-lost-you.png" alt="THEY LOST YOU"><figcaption class="c">Put stone between you and them and the guns do not miss, they turn OFF. One thing decides it -- whether a man can actually see you -- and five separate systems ask it: whether he can hold a bead, whether he may shoot, where he walks, whether he runs for cover, and whether he shouts. A man who loses you walks to WHERE YOU WERE, not to where you are. And the one who can still see you tells everyone within eight tiles, so he is the one worth shooting first. COMBAT tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE CARD FITS AGAIN</figcaption><img loading="lazy" src="look/the-terms-fold.png" alt="THE CARD FITS AGAIN"><figcaption class="c">Five different systems write onto a person now and the card had quietly grown to 96 percent of your screen -- one more thing and it would have run off the bottom. So the stuff that is true of the WHOLE outfit and never changes (what they want, what they hold, what they pay in) collapses to one line the moment you have done anything for them, because you have already read it. Tap that line and it all comes back. Down to 84 percent. CITY tab, tap somebody you have helped.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY ARE NOT WAITING</figcaption><img loading="lazy" src="look/the-collection.png" alt="THEY ARE NOT WAITING"><figcaption class="c">This is what the free thing was for. You took what the Cartel was offering three times, and now that they count you they are asking -- and they are not waiting for the polite gap between asks, because that gap is for people who do not owe them. Saying no here does not cost you one rung, it costs you one for every favour you took. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE FIRST THING IS FREE</figcaption><img loading="lazy" src="look/the-favour.png" alt="THE FIRST THING IS FREE"><figcaption class="c">The other direction, finally. Some outfits give you something the first time you meet them, it costs you nothing, and that is exactly the part to worry about -- the card starts keeping a tally of what you have taken. Others hand you nothing until they count you, and then it spends the standing you built. One outfit gives nothing to anybody ever. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">THEY ASK YOU BACK</figcaption><img loading="lazy" src="look/the-claim.png" alt="THEY ASK YOU BACK"><figcaption class="c">Once an outfit COUNTS you it starts asking, and what it asks for is the thing it already wanted. Saying yes buys you nothing -- it is the rent on being counted. Saying no drops you straight back below counted, and they remember which way you went. CITY tab, tap a person you have done favours for.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE WALL: turning up runs out of road</figcaption><img loading="lazy" src="look/the-wall.png" alt="THE WALL: turning up runs out of road"><figcaption class="c">Walk up to anybody who runs with an outfit and this is their card. You have done what they want five times, and it says so: turning up gets you no further than USEFUL, and COUNTED is not for sale at any number of favours. The only button that passes it is saying out loud that you are with them. CITY tab, tap a person.</figcaption></figure>
<figure class="shot"><figcaption class="t">A PIT DUG IN THE DIRT</figcaption><img loading="lazy" src="look/the-pit-dug.png" alt="A PIT DUG IN THE DIRT"><figcaption class="c">Somebody dug here. The ground is sunk where the fill settled, the pale heap beside it is the earth that never went back in, and the dark green is growing on what is under it. Bare dirt and sand generate these now. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">A CLUSTER: they died together</figcaption><img loading="lazy" src="look/dead-cluster.png" alt="A CLUSTER: they died together"><figcaption class="c">The dead come in groups now, not sprinkled one by one. This is what you find in an abandoned block. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE PIT: the cemetery</figcaption><img loading="lazy" src="look/dead-pit.png" alt="THE PIT: the cemetery"><figcaption class="c">They stopped digging graves and dug one hole. The cemetery is a dumping pit now, about 34 bodies in a single heap. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE VISTA: the mountain overlook</figcaption><img loading="lazy" src="look/vista.png" alt="THE VISTA: the mountain overlook"><figcaption class="c">THE DEMO MONEY SHOT. Stand on the west rim and the whole valley is laid out below you, drawn by the valley view that already existed. RUN tab, on reaching the overlook.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: how thick they lie</figcaption><img loading="lazy" src="look/dead-density.png" alt="THE DEAD: how thick they lie"><figcaption class="c">A wider view of the same ground, so the density reads. Too many, too few, or about right is the only call needed. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: the walk-out</figcaption><img loading="lazy" src="look/dead-desert.png" alt="THE DEAD: the walk-out"><figcaption class="c">Open desert. The ones who walked out and did not make it, thin and scattered, no mummified bodies because nothing out here is sealed. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: the road out</figcaption><img loading="lazy" src="look/dead-road.png" alt="THE DEAD: the road out"><figcaption class="c">The exodus road. Remains on the asphalt where people stopped walking. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DEAD: a suburban street</figcaption><img loading="lazy" src="look/dead-suburb.png" alt="THE DEAD: a suburban street"><figcaption class="c">Bones lying in the open on a suburb street, bleached and scattered by ten years of scavengers. RUN tab.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE BLACK BORDER IS ONE PIXEL NOW</figcaption><img loading="lazy" src="look/border-one-pixel.png" alt="THE BLACK BORDER IS ONE PIXEL NOW"><figcaption class="c">His 8/14 ask: &quot;the black border has to be thinner, like half as thin.&quot; It was always drawn as ONE pixel -- but it was drawn on the 56 composition and then DOUBLED by the upscale that takes the frame to 112, so it reached the screen at two. It is now drawn after the upscale and arrives at one. Same body, byte for byte: 0 of ~18,000 non-border pixels changed. CHARACTER tab, and anywhere a person is drawn -- RUN, CITY, COMBAT.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE BLACK BORDER, IN THE GAME</figcaption><img loading="lazy" src="look/border-in-the-game.png" alt="THE BLACK BORDER, IN THE GAME"><figcaption class="c">His 8/14 ask, finished where it counts. The CHARACTER tab got the thin outline first, and the GAME kept doubling it: the city enlarges every body on an integer ladder, so the one pixel came along for the ride and landed 2px thick walking around and 4px zoomed in. The border is now drawn AFTER the enlargement, at the size you actually see it, for the player and every neighbour. RUN tab (and CITY), anywhere a person is drawn.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE SIX PEOPLE ON YOUR STREET</figcaption><img loading="lazy" src="look/six-neighbours.png" alt="THE SIX PEOPLE ON YOUR STREET"><figcaption class="c">Your neighbours used to be YOU, six times, under six random colours -- same body, same clothes, only the hue changed, plus a durag on every third one. Strip the colour and they were six identical silhouettes, which matters because the valley goes DARK: night runs 19:00 to 06:00 and only about 4% of the map has live power, so colour is the one channel you cannot count on (06:00 itself is when night ENDS -- I had that wrong and it is corrected). They are six SHAPES now -- different bodies, different garments, all from the canon wardrobe. TWO OF THEM STILL MATCHED, and the fix was not a new garment: I measured all 202 clothes in the wardrobe for how much each one changes the outline, and the SHOULDER MANTLE moves it four times more than the gap I could not close. It was already in there. The backpack I had given one of them turns out to be invisible from the front, which is the direction you meet somebody in. The two closest neighbours are now three times further apart. The bottom row is the test. RUN tab, walk into a settlement.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE THIRTEEN OUTFITS</figcaption><img loading="lazy" src="look/thirteen-outfits.png" alt="THE THIRTEEN OUTFITS"><figcaption class="c">Every faction you can join, and you can tell them apart with the colour switched off. That matters because the valley goes DARK: night runs 19:00 to 06:00, and only about 4% of the map has live power, so most streets have no light even by day. Colour is the one channel you cannot count on. (I had been saying the demo OPENS in the dark -- it does not, 06:00 is exactly when night ends. Corrected.) These were not picked by eye: 880 fits were rendered out of clothes that already existed and the thirteen most different were kept, which is also how I found out the wardrobe holds exactly thirteen and not one more. The bottom block is the test. CHARACTER tab, THE THIRTEEN OUTFITS -- tap a body to turn it, hit COLOUR OFF to run the test yourself, WEAR IT to put one on and change it.</figcaption></figure>
<figure class="shot"><figcaption class="t">TREATING A GUNSHOT WOUND</figcaption><img loading="lazy" src="look/field-surgery.png" alt="TREATING A GUNSHOT WOUND"><figcaption class="c">Your five steps, the ones you wrote at a bedside, as animations you can watch: pour the iodine, inject the lidocaine, pick the pellets out. Three clips cover all five because the needle gets used twice and boiling the tweezers is a held prop. All three put both hands in the same spot -- it is the same wound -- so what tells them apart is HOW THEY MOVE, and the bars under each row are the hand speed: the pour has a long flat stretch where the hand has stopped, the injection is one tall spike, and the tweezing shakes. ANIMATION tab, pick the clip. Also CHARACTER tab on the body.</figcaption></figure>
<figure class="shot"><figcaption class="t">THE DRUNK WALK JUMPED EVERY TWO SECONDS</figcaption><img loading="lazy" src="look/the-drunk-seam.png" alt="THE DRUNK WALK JUMPED EVERY TWO SECONDS"><figcaption class="c">The drunk walk teleported sideways every two seconds and had done since it was written: one number in its maths ran at half the speed of everything beside it, so it ended each loop on the opposite side from where it started. The line under each row is the body&#x27;s real centre, measured off the drawn pixels. Before, the whole 12.5px of movement happened in ONE frame, at the restart. After, the step across the restart is 0.3px. I found it by checking every animation in the game for the same defect -- 102 of the 103 were already fine, which is the more useful half of the answer. ANIMATION tab, pick drunk.</figcaption></figure>
<figure class="shot"><figcaption class="t">WHEN A PERSON STOPS BEING SOMEBODY</figcaption><img loading="lazy" src="look/zoom-identity.png" alt="WHEN A PERSON STOPS BEING SOMEBODY"><figcaption class="c">I proved the thirteen faction outfits tell each other apart -- and I proved it at ONE of the four sizes this game draws a person at. This is the other two. At the zoom you actually walk around in they are thirteen people. One zoom out they are already closer together than the gap that once made two neighbours read as the same guy, and zoomed right out the body is twenty-five pixels tall and they are a crowd. That is not something a wider coat fixes; it is a limit worth knowing. What it means in practice: anything you need to RECOGNISE from far away -- whose street this is, somebody you are looking for -- needs something other than the outline. CHARACTER tab for the outfits themselves; this is what they look like from the CITY.</figcaption></figure>
</div>
<footer>Nothing to hunt for. If a thing is not pictured here it is NOT IN A TAB YET.</footer>

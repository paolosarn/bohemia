<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE MAP HEARS THE DESERT</title>
<!-- SOUNDS lane, 10/18, row [the desert under travel] (VAMILY, SOUNDS).
     PAOLO 10/10, the eleventh votes: "The travel clip at night is terrible so just use the day one for the
     night one too... You don't have to fall in love with this fucked up generator humming noises everywhere."
     PAOLO 10/17, UP on the settlement heard whole: the real recordings, the bed thinned to a desert.

     WHAT THIS PAGE IS: the real valley map (slices/BOHEMIA_MAP_CURRENT.html, untouched) seen from its own
     camera, with the SAME code path the game now runs under travel: the recorded desert wind (the day clip,
     by day and by night), a far thing now and then. It is the same file, the same loop and the same level
     ratio as the alpha's MAPDESERT object. In the GAME this is already live (the RUN tab's map and the demo);
     this page lets him hear it without starting a run. Gate: gates/map_heard_gate.js. -->
<style>
  :root{ --ink:#1b1408; --paper:#e8dfc9; --line:#8a7a52; --dim:#6a5a3e; }
  html,body{margin:0;height:100%;background:#0d0b08;color:var(--paper);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  #map{position:fixed;inset:0 0 132px 0;width:100%;height:calc(100% - 132px);border:0;background:#0d0b08}
  #bar{position:fixed;left:0;right:0;bottom:0;height:132px;box-sizing:border-box;padding:10px 16px;background:var(--ink);border-top:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:10px 12px;min-height:46px;letter-spacing:1px;cursor:pointer;border-radius:0}
  button.on{background:#6a1d10;color:var(--paper)}
  .num{font-size:12px;color:#b9a77e;margin-top:8px}
</style></head><body>
<iframe id="map" src="BOHEMIA_MAP_CURRENT.html" title="the valley map"></iframe>
<div id="bar">
  <div class="row">
    <button id="day">TRAVEL BY DAY</button>
    <button id="night">TRAVEL BY NIGHT</button>
    <button id="stop">STOP</button>
  </div>
  <div class="num" id="num">Tap one. Same recorded wind both times (your words: the day one for the night too). No generator.</div>
</div>
<script>
(function(){
  'use strict';
  var DIR='vote/settlement_heard/', LEVEL=0.45;
  var FAR={ day:['far_horn','far_helicopter','far_crow'], night:['far_siren','far_helicopter'] };
  var AC=null, OUT=null, BUF={}, g=null, timer=null, farT=null, night=false, n=document.getElementById('num');
  function ctx(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; AC=new C(); OUT=AC.createGain(); OUT.connect(AC.destination); } if(AC.state==='suspended') AC.resume(); return AC; }
  function load(id){ if(BUF[id]) return Promise.resolve(BUF[id]);
    return fetch(DIR+id+'.mp3').then(function(r){ return r.arrayBuffer(); }).then(function(ab){ return new Promise(function(res,rej){ ctx().decodeAudioData(ab,res,rej); }); }).then(function(b){ return (BUF[id]=b); }); }
  function stop(){ if(timer) clearTimeout(timer); if(farT) clearTimeout(farT); timer=farT=null;
    if(g){ var x=g; g=null; x.gain.cancelScheduledValues(AC.currentTime); x.gain.setValueAtTime(x.gain.value,AC.currentTime); x.gain.linearRampToValueAtTime(0,AC.currentTime+0.6); setTimeout(function(){ try{x.disconnect();}catch(e){} },900); }
    mark(null); }
  function mark(id){ ['day','night'].forEach(function(k){ document.getElementById(k).classList.toggle('on',k===id); }); }
  function far(){ farT=setTimeout(function(){ if(!g) return; var pool=night?FAR.night:FAR.day, id=pool[(Math.random()*pool.length)|0], my=g;
      load(id).then(function(b){ if(g!==my) return; var s=AC.createBufferSource(); s.buffer=b; var v=AC.createGain(); v.gain.value=0.8; s.connect(v); v.connect(my); s.start(); n.textContent='far off: '+id.replace('far_','')+(night?'  (night)':'  (day)'); });
      far(); }, 25000+Math.random()*35000); }
  function go(isNight){
    stop(); night=isNight; mark(isNight?'night':'day'); ctx();
    load('bed_day').then(function(b){
      var my=g=AC.createGain(); my.gain.setValueAtTime(0,AC.currentTime); my.gain.linearRampToValueAtTime(LEVEL,AC.currentTime+1.5); my.connect(OUT);
      var XF=1.0, step=b.duration-XF;
      (function one(at){ if(g!==my) return;
        var s=AC.createBufferSource(); s.buffer=b; var v=AC.createGain(); s.connect(v); v.connect(my);
        v.gain.setValueAtTime(0,at); v.gain.linearRampToValueAtTime(1,at+XF); v.gain.setValueAtTime(1,at+b.duration-XF); v.gain.linearRampToValueAtTime(0,at+b.duration);
        s.start(at); timer=setTimeout(function(){ one(at+step); }, Math.max(100,(at+step-AC.currentTime-0.5)*1000)); })(AC.currentTime+0.05);
      n.textContent=(isNight?'Night':'Day')+': the recorded desert wind, a far thing every 25 to 60 s'+(isNight?' (only a helicopter or a siren at night).':'.');
      far();
    });
  }
  document.getElementById('day').onclick=function(){ go(false); };
  document.getElementById('night').onclick=function(){ go(true); };
  document.getElementById('stop').onclick=stop;
})();
</script>
</body></html>

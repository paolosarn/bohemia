<!--
  THE ONE VOTE TAB. Paolo 9/14, LOCKED.
  laws/BOHEMIA_ADDENDUM_ONE_VOTE_TAB_AND_THE_PORTRAIT_CHAT_9_14_26.md

  "We need one central tab in the fucking demo where everything from sounds to portrait
   to hair to everything that is new, where I vote on it... after I vote on something it
   needs to stop presenting itself like I didn't just vote on it."

  There were eight judge pages, one per lane, each built when it was "one or two things".
  This replaces all of them as the place anything NEW is presented. They stay on disk as
  archives; they present nothing.

  THREE THINGS THIS PAGE IS:
  1. ONE QUEUE OF EVERY KIND, newest first. A song sits next to a haircut sits next to a
     line of words. Same three controls on every row: up, down, a comment.
  2. A DOOR, NOT A GALLERY. Each row shows the thing itself (a picture, a clip, a sound,
     the words, or the sheet the lane drew) on tap. Nothing heavy loads until he asks.
  3. A CONSUMER. The moment he votes, the row leaves and never comes back under that id.
     Two memories keep that true: the phone remembers instantly (localStorage), and the
     registry remembers forever (records/target/BOHEMIA_VOTE_REGISTRY.json, which every
     lane appends to and reads verdicts back from). A rebuild, a new phone, a cleared
     cache -- none of them resurrect a judged thing, because the registry outlives them.

  WHERE IT LIVES: behind the gear. In the alpha it is also the VOTE tab; in the demo the
  tab bar is cut away, so the gear is the only door and that is on purpose -- a stranger
  playing the demo must never trip over the judging machinery.

  THE REGISTRY IS FETCHED, NOT INLINED. If it were baked in, every lane adding a candidate
  would have to edit this file, which is exactly the shared-file collision the handoff
  fight taught us about. One file, appended to, read at open.
-->
<style>
 :root{
   --ink:#141210; --paper:#f2ece1; --card:#fffdf8; --rule:#a2957f;
   --dim:#5d564b; --hot:#a8391d; --cool:#2f6f6a; --gold:#8a6a1f;
 }
 /* NIGHT IS THE OPTION, SUN IS THE DEFAULT. Every other judge surface in this repo
    opens dark and makes him find the SUN button. He judges outside. Paper first. */
 html.night{
   --ink:#e8e0cc; --paper:#0d0d12; --card:#16161d; --rule:#3a3744;
   --dim:#9a93a6; --hot:#e0714f; --cool:#63bdb4; --gold:#c79a3f;
 }
 *{ box-sizing:border-box }
 html,body{ margin:0 }
 body{ background:var(--paper); color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;
       padding-bottom:env(safe-area-inset-bottom,0px) }

 /* EVERY CONTROL IS 44. THE THUMB law, and this page is all controls. The reach is set
    once here so no row can quietly ship a 30px button. */
 button, .tb, .look{
   min-height:44px; min-width:44px; display:inline-flex; align-items:center;
   justify-content:center; font:inherit; cursor:pointer; box-sizing:border-box;
   border:2px solid var(--rule); background:var(--card); color:var(--ink);
   border-radius:4px; padding:0 12px;
 }

 header{ position:sticky; top:0; z-index:5; background:var(--paper);
         border-bottom:3px solid var(--ink); padding:10px 12px;
         padding-top:calc(10px + env(safe-area-inset-top,0px));
         display:flex; gap:8px; align-items:center; flex-wrap:wrap }
 h1{ margin:0; font-size:16px; letter-spacing:2px; flex:1 1 auto; min-width:0 }
 #tally{ font-size:13px; color:var(--gold); flex:0 0 auto }

 .say{ margin:0; padding:10px 12px; font-size:14px; color:var(--dim);
       border-bottom:1px solid var(--rule) }

 .wrap{ padding:6px 12px 30px; max-width:680px; margin:0 auto }

 .row{ background:var(--card); border:2px solid var(--rule); border-radius:5px;
       margin:12px 0; overflow:hidden }
 .row.gone{ opacity:0; transform:translateX(18px); transition:opacity .18s, transform .18s }
 .head{ padding:10px 12px 8px }
 .kind{ display:inline-block; font-size:11px; letter-spacing:1.5px; color:var(--paper);
        background:var(--ink); border-radius:3px; padding:3px 7px; vertical-align:2px }
 .who{ font-size:11px; letter-spacing:1px; color:var(--dim); margin-left:6px }
 .ttl{ margin:7px 0 0; font-size:17px; font-weight:700 }
 .why{ margin:4px 0 0; font-size:14px; color:var(--dim) }
 .quote{ margin:7px 0 0; padding:7px 9px; font-size:13px; background:var(--paper);
         border-left:4px solid var(--hot) }

 .stage{ padding:0 12px 10px }
 .stage[hidden]{ display:none }
 .stage img{ max-width:100%; display:block; border:1px solid var(--rule); background:#0c0a07 }
 .stage iframe{ width:100%; height:62vh; border:2px solid var(--rule); background:var(--paper) }
 .stage audio{ width:100% }
 .stage .words{ padding:10px 12px; background:var(--paper); border-left:4px solid var(--cool);
                font-size:15px; white-space:pre-wrap }

 .judge{ padding:9px 12px 12px; border-top:1px dashed var(--rule);
         display:flex; gap:8px; align-items:center; flex-wrap:wrap }
 .tb{ font-size:20px; padding:0 16px }
 .tb.up:hover{ border-color:var(--cool) }
 .tb.down:hover{ border-color:var(--hot) }
 .tb.star{ color:#c79a3f }
 .tb.star:hover{ border-color:#c79a3f }
 .look{ margin-left:auto; font-size:13px; letter-spacing:1px }
 .note{ width:100%; min-height:44px; font:14px ui-sans-serif,system-ui,Arial;
        padding:9px 10px; border:2px solid var(--rule); border-radius:4px;
        background:var(--paper); color:var(--ink) }

 #empty{ margin:26px 12px; padding:16px; background:var(--card);
         border:2px solid var(--rule); border-radius:5px; font-size:15px }
 #empty b{ display:block; font-size:17px; margin-bottom:6px }

 #foot{ margin:18px 12px 40px; padding:12px; background:var(--card);
        border:2px solid var(--rule); border-radius:5px }
 #foot label{ display:block; font-size:13px; letter-spacing:1px; color:var(--dim); margin-bottom:6px }
 #foot textarea{ width:100%; min-height:76px; font:15px ui-sans-serif,system-ui,Arial;
                 padding:9px 10px; border:2px solid var(--rule); border-radius:4px;
                 background:var(--paper); color:var(--ink) }
 #foot .fb{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap }
 #saidit{ font-size:13px; color:var(--cool); margin-top:8px; min-height:18px }
 /* THE FOLD (UI [the triage filter], rule 92): what is not red waits behind one button with its count */
 #fold{ width:100%; margin:16px 0 4px; justify-content:space-between; font-size:14px; letter-spacing:1.5px;
        border-style:dashed }
 #fold b{ font-size:15px; color:var(--gold) }
 #more[hidden]{ display:none }
 /* A CARD'S PICTURE, FULL SIZE (RUN TWO, rule 89: what he cannot see he cannot judge). A tap on the picture lays it over
    the whole screen at one image pixel to one point, crisp; one finger drags, two pinch, a tap closes. Nothing new on the
    card's face: the picture itself is the door. */
 .stage img{ cursor:zoom-in }
 #full{ position:fixed; left:0; top:0; right:0; bottom:0; z-index:40; background:#0c0a07; overflow:hidden;
        touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
 #full[hidden]{ display:none }
 #full img{ position:absolute; left:0; top:0; transform-origin:0 0; max-width:none; max-height:none; border:0;
            image-rendering:pixelated; pointer-events:none; -webkit-user-drag:none }
 #full img.soft{ image-rendering:auto }
 /* HIS YESES IN THE DEMO (RUN TWO): under the comment box, one line per YES since 10/16, never above the fold */
 #yeses{ margin:0 12px 44px; padding:12px; background:var(--card); border:2px solid var(--rule); border-radius:5px }
 #yeses[hidden]{ display:none }
 #yeses h2{ margin:0 0 4px; font-size:13px; letter-spacing:1.5px; color:var(--dim); font-weight:700 }
 #yeses .sum{ margin:0 0 8px; font-size:15px; font-weight:700 }
 #yeses .yl{ display:flex; gap:8px; align-items:baseline; padding:5px 0; border-top:1px dashed var(--rule); font-size:13px; line-height:1.35 }
 #yeses .yt{ flex:0 0 auto; font-size:10px; letter-spacing:1px; font-weight:700; padding:2px 5px; border-radius:3px; color:var(--paper) }
 #yeses .yl.in .yt{ background:var(--cool) }
 #yeses .yl.not .yt{ background:var(--dim) }
 #yeses .yn{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere }
 #yeses .yw{ color:var(--dim); font-size:12px }
 #full .hint{ position:absolute; left:0; right:0; bottom:calc(12px + env(safe-area-inset-bottom,0px)); text-align:center;
              font-size:12px; letter-spacing:1.5px; color:#f2ece1; text-shadow:0 1px 2px #000, 0 0 6px #000; pointer-events:none }
</style></head><body>

<header>
  <h1>VOTE</h1>
  <span id="tally"></span>
  <button id="sun" type="button">NIGHT</button>
  <button id="out" type="button">EXPORT</button>
</header>

<p class="say">Everything new lands here. Tap the thumb. What you vote on leaves and does not come back.</p>

<div class="wrap"><div id="list"></div>
<button id="fold" type="button" hidden><span>MORE</span><b id="foldn"></b></button>
<div id="more" hidden></div>

<div id="empty" hidden>
  <b>NOTHING IS WAITING ON YOU.</b>
  Every new thing the chats made has already been voted on. When a lane finishes something
  fresh it shows up here on its own.
</div>

<div id="foot">
  <label for="allnote">ANYTHING ELSE YOU WANT TO SAY</label>
  <textarea id="allnote" placeholder="type here"></textarea>
  <div class="fb">
    <button id="out2" type="button">EXPORT MY VOTES</button>
    <button id="undo" type="button">PUT THE LAST ONE BACK</button>
  </div>
  <div id="saidit"></div>
</div>
<div id="yeses" hidden></div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- THE TWO MEMORIES ----------
     PHONE: instant, so the row leaves the second he taps.
     REGISTRY: permanent, so a cleared cache cannot resurrect a judged thing.
     A vote is consumed if it is in EITHER. That is the whole vanish rule. */
  var KEY = 'bohemia.vote.verdicts.v1';
  var NOTEKEY = 'bohemia.vote.note.v1';
  var REG = '../records/target/BOHEMIA_VOTE_REGISTRY.json';

  var mine = {};      /* id -> {vote, said, when} from this phone */
  var theirs = {};    /* id -> verdict from the registry */
  var items = [];
  var lastGone = null;
  var lastReg = null;   /* the registry as read, for the YES list at the foot */
  /* THE SORT (UI [the triage filter], rule 92): records/target/BOHEMIA_VOTE_TRIAGE.json is the coordinator's file. RED
     he sees first; then anything the coordinator has NOT tagged yet, both newest first, together at most the file's cap
     (twelve); YELLOW and whatever is past the cap wait behind one fold that says MORE with its count; GREEN (the lane's
     pick stands) and GRAY (the team already knows) never show. A tag only ever DEMOTES (RUN TWO [new cards show first],
     Paolo 10/18 'the votes aren't loading what you're telling me': the untagged went behind MORE, the coordinator stopped
     tagging after sweep AP, and his list showed nothing new for hours). No file, or a broken one: everything shows. */
  var TRI = null, TRI_URL = '../records/target/BOHEMIA_VOTE_TRIAGE.json', foldOpen = false;

  function readPhone(){
    try{ mine = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
    catch(e){ mine = {}; }
  }
  function writePhone(){
    try{ localStorage.setItem(KEY, JSON.stringify(mine)); }catch(e){}
  }
  function judged(id){ return !!(mine[id] || theirs[id]); }

  function stamp(){
    var d = new Date();
    return (d.getMonth()+1) + '/' + d.getDate();
  }

  /* ---------- SUN AND NIGHT ---------- */
  var SKEY = 'bohemia.vote.night.v1';
  function paint(){
    var n = false;
    try{ n = localStorage.getItem(SKEY) === '1'; }catch(e){}
    document.documentElement.classList.toggle('night', n);
    var b = document.getElementById('sun');
    if(b) b.textContent = n ? 'SUN' : 'NIGHT';
  }
  document.getElementById('sun').addEventListener('click', function(){
    var n = document.documentElement.classList.contains('night');
    try{ localStorage.setItem(SKEY, n ? '0' : '1'); }catch(e){}
    paint();
  });
  paint();

  /* ---------- SHOWING THE THING ----------
     Nothing heavy is built until he taps LOOK. A sheet is a whole page and there are
     seven of them; building all seven iframes at open would cost him the open. */
  function build(show, box){
    var how = (show && show.how) || 'text';
    var src = (show && show.src) || '';
    if(how === 'image'){
      /* THE FIRST PICTURE IS ONE THING. A sheet of many shrinks every thing on it to a thumbnail on his phone (COMBAT TWO
         measured five boards at about 75 points each), so a card may carry show.first, one thing cut from the sheet, and
         show.firstAt, where it sits on the sheet [x, y, w, h]. The card shows the one thing; a tap opens the whole sheet at
         full size on that same spot, and he drags to the rest. */
      var one = show.first || src, at = show.first && show.firstAt;
      var im = document.createElement('img');
      im.alt = ''; im.loading = 'lazy'; im.src = one;
      im.addEventListener('click', function(e){
        var r = im.getBoundingClientRect();
        var fx = r.width ? (e.clientX - r.left) / r.width : 0.5, fy = r.height ? (e.clientY - r.top) / r.height : 0.5;
        fx = Math.max(0, Math.min(1, fx)); fy = Math.max(0, Math.min(1, fy));
        if(at && at.length === 4) openFull(src, { x: at[0] + fx * at[2], y: at[1] + fy * at[3] });
        else openFull(one, { fx: fx, fy: fy });
      });
      box.appendChild(im);
    } else if(how === 'audio' || how === 'clip' && /\.(mp3|wav|ogg|m4a)$/i.test(src)){
      var au = document.createElement('audio');
      au.controls = true; au.src = src;
      box.appendChild(au);
    } else if(how === 'clip'){
      var vi = document.createElement('video');
      vi.controls = true; vi.playsInline = true; vi.src = src;
      vi.style.width = '100%';
      box.appendChild(vi);
    } else if(how === 'page'){
      var fr = document.createElement('iframe');
      fr.title = 'the thing you are voting on';
      fr.src = src;
      box.appendChild(fr);
    } else {
      var w = document.createElement('div');
      w.className = 'words';
      w.textContent = src;
      box.appendChild(w);
    }
  }

  /* ---------- A PICTURE, FULL SIZE ----------
     RUN TWO [a card's picture, full size], rule 89 (Paolo 10/10: what he cannot see did not ship). It opens at ONE IMAGE
     PIXEL TO ONE POINT (the browser's own 100 percent, every pixel crisp), centred on the spot he tapped, so the thing
     under his thumb is the thing he sees. One finger drags, two fingers pinch around the point between them, a wheel zooms
     on a laptop, and a tap that did not move closes it (so does Escape). It never votes: the card is still there after. */
  var FV = { el: null, im: null, s: 1, x: 0, y: 0, nw: 0, nh: 0, pts: {}, n: 0, g: null };
  function fvBox(){ var e = FV.el; return { w: e.clientWidth || window.innerWidth, h: e.clientHeight || window.innerHeight }; }
  function fvMin(){ var b = fvBox(); return Math.min(1, b.w / (FV.nw || 1), b.h / (FV.nh || 1)); }
  function fvClamp(){
    var b = fvBox(), w = FV.nw * FV.s, h = FV.nh * FV.s;
    FV.x = w <= b.w ? (b.w - w) / 2 : Math.min(0, Math.max(b.w - w, FV.x));
    FV.y = h <= b.h ? (b.h - h) / 2 : Math.min(0, Math.max(b.h - h, FV.y));
  }
  function fvPaint(){
    fvClamp();
    FV.im.style.transform = 'translate(' + FV.x + 'px,' + FV.y + 'px) scale(' + FV.s + ')';
    FV.im.classList.toggle('soft', FV.s < 1);
  }
  function fvZoom(ns, px, py){   /* keep the image point under (px, py) under it */
    ns = Math.max(fvMin(), Math.min(8, ns));
    var ix = (px - FV.x) / FV.s, iy = (py - FV.y) / FV.s;
    FV.s = ns; FV.x = px - ix * ns; FV.y = py - iy * ns; fvPaint();
  }
  function fvEl(){
    if(FV.el) return FV.el;
    var el = document.createElement('div');
    el.id = 'full'; el.hidden = true; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'the picture, full size');
    var im = document.createElement('img'); im.alt = ''; im.draggable = false;
    var h = document.createElement('div'); h.className = 'hint'; h.textContent = 'FULL SIZE · DRAG · PINCH · TAP TO CLOSE';
    el.appendChild(im); el.appendChild(h); document.body.appendChild(el);
    FV.el = el; FV.im = im;
    function pts(){ var a = [], k; for(k in FV.pts) a.push(FV.pts[k]); return a; }
    function start(){
      var a = pts();
      if(a.length >= 2){
        var dx = a[1].x - a[0].x, dy = a[1].y - a[0].y;
        FV.g = { two: true, d0: Math.max(1, Math.sqrt(dx * dx + dy * dy)), s0: FV.s,
                 ix: ((a[0].x + a[1].x) / 2 - FV.x) / FV.s, iy: ((a[0].y + a[1].y) / 2 - FV.y) / FV.s,
                 moved: 99, t: FV.g ? FV.g.t : Date.now() };
      } else if(a.length === 1){
        var was = FV.g;
        FV.g = { two: false, sx: a[0].x, sy: a[0].y, x0: FV.x, y0: FV.y,
                 moved: was ? 99 : 0, t: was ? was.t : Date.now() };   /* a finger left over from a pinch is never a tap */
      }
    }
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(er){}
      FV.pts[e.pointerId] = { x: e.clientX, y: e.clientY }; start();
    });
    el.addEventListener('pointermove', function(e){
      if(!FV.pts[e.pointerId] || !FV.g) return;
      FV.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var a = pts(), g = FV.g;
      if(g.two && a.length >= 2){
        var dx = a[1].x - a[0].x, dy = a[1].y - a[0].y, mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
        var ns = Math.max(fvMin(), Math.min(8, g.s0 * Math.sqrt(dx * dx + dy * dy) / g.d0));
        FV.s = ns; FV.x = mx - g.ix * ns; FV.y = my - g.iy * ns; fvPaint();
      } else if(!g.two && a.length === 1){
        var mx1 = a[0].x - g.sx, my1 = a[0].y - g.sy;
        g.moved = Math.max(g.moved, Math.sqrt(mx1 * mx1 + my1 * my1));
        FV.x = g.x0 + mx1; FV.y = g.y0 + my1; fvPaint();
      }
    });
    function up(e){
      if(!FV.pts[e.pointerId]) return;
      delete FV.pts[e.pointerId];
      var left = pts().length, g = FV.g;
      if(left) { start(); return; }
      FV.g = null;
      /* A TAP CLOSES ON ITS CLICK, NOT ON ITS LIFT: closing on the lift let the click that follows land on the card's
         picture underneath and open it again (measured: the probe's tap re-opened it at 1:1). The click lands on this
         layer while it is still up, and a drag never counts as a tap. */
      FV.tap = !!(e.type === 'pointerup' && g && !g.two && g.moved < 10 && Date.now() - g.t < 600);
      if(FV.tap) setTimeout(function(){ if(FV.tap) closeFull(); }, 400);   /* a browser that sends no click still closes */
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); if(FV.tap) closeFull(); });
    el.addEventListener('wheel', function(e){
      e.preventDefault();
      fvZoom(FV.s * Math.pow(1.0015, -e.deltaY), e.clientX, e.clientY);
    }, { passive: false });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !el.hidden) closeFull(); });
    window.addEventListener('resize', function(){ if(!el.hidden) fvPaint(); });
    return el;
  }
  /* at: {x, y} a point on the image in its own pixels, or {fx, fy} a fraction of it; that point opens in the middle */
  function openFull(src, at){
    var el = fvEl(), im = FV.im;
    FV.pts = {}; FV.g = null;
    im.onload = function(){
      FV.nw = im.naturalWidth; FV.nh = im.naturalHeight;
      im.style.width = FV.nw + 'px'; im.style.height = FV.nh + 'px';
      var b = fvBox(), px = at && at.x != null ? at.x : FV.nw * (at && at.fx != null ? at.fx : 0.5),
          py = at && at.y != null ? at.y : FV.nh * (at && at.fy != null ? at.fy : 0.5);
      FV.s = 1; FV.x = b.w / 2 - px; FV.y = b.h / 2 - py; fvPaint();
      el.setAttribute('data-ready', '1');
    };
    el.removeAttribute('data-ready');
    el.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    if(im.getAttribute('src') === src && im.complete && im.naturalWidth) im.onload();
    else im.src = src;
  }
  function closeFull(){
    if(!FV.el) return;
    FV.el.hidden = true; FV.pts = {}; FV.g = null; FV.tap = false;
    document.documentElement.style.overflow = '';
  }
  window.__voteFull = { open: openFull, close: closeFull, state: function(){ return { s: FV.s, x: FV.x, y: FV.y, nw: FV.nw, nh: FV.nh, open: !!(FV.el && !FV.el.hidden) }; } };

  /* ---------- A ROW ---------- */
  function row(it){
    var r = document.createElement('div');
    r.className = 'row';
    r.setAttribute('data-id', it.id);

    var h = document.createElement('div');
    h.className = 'head';
    var k = document.createElement('span');
    k.className = 'kind'; k.textContent = String(it.kind || 'new').toUpperCase();
    h.appendChild(k);
    var wq = document.createElement('span');
    wq.className = 'who';
    wq.textContent = String(it.lane || '').toUpperCase() + '  ' + (it.made || '');
    h.appendChild(wq);
    var t = document.createElement('div');
    t.className = 'ttl'; t.textContent = it.title || it.id;
    h.appendChild(t);
    if(it.why){
      var y = document.createElement('div');
      y.className = 'why'; y.textContent = it.why;
      h.appendChild(y);
    }
    /* A REDO NEVER ARRIVES BLIND. His own words on the one it replaces ride along, so he
       is not being asked the same question twice without being told it is the same one. */
    if(it.redoOf){
      var q = document.createElement('div');
      q.className = 'quote';
      q.textContent = 'REDONE. You killed ' + it.redoOf +
                      (it.said ? ' because: "' + it.said + '"' : '.');
      h.appendChild(q);
    }
    r.appendChild(h);

    var st = document.createElement('div');
    st.className = 'stage'; st.hidden = true;
    r.appendChild(st);

    var j = document.createElement('div');
    j.className = 'judge';

    var up = document.createElement('button');
    up.type = 'button'; up.className = 'tb up'; up.textContent = '\u{1F44D}';
    up.setAttribute('aria-label', 'yes');
    var dn = document.createElement('button');
    dn.type = 'button'; dn.className = 'tb down'; dn.textContent = '\u{1F44E}';
    dn.setAttribute('aria-label', 'no');
    /* RUN TWO [the star], 10/18 (rule 115(h)): his first star was a sentence in a note ('this is the first star I've
       handed out'); now it is one tap. A star is a YES and more: the card's METHOD becomes the fleet's default the same
       sweep. It is stored as vote 'up' with star:true, so every lane that reads a YES still reads it. */
    var sr = document.createElement('button');
    sr.type = 'button'; sr.className = 'tb star'; sr.textContent = '\u2605';
    sr.setAttribute('aria-label', 'star');
    var lk = document.createElement('button');
    lk.type = 'button'; lk.className = 'look'; lk.textContent = 'LOOK AT IT';

    lk.addEventListener('click', function(){
      if(st.hidden){
        if(!st.childElementCount) build(it.show, st);
        st.hidden = false; lk.textContent = 'HIDE IT';
      } else {
        st.hidden = true; lk.textContent = 'LOOK AT IT';
      }
    });

    j.appendChild(up); j.appendChild(sr); j.appendChild(dn); j.appendChild(lk);
    r.appendChild(j);

    var n = document.createElement('textarea');
    n.className = 'note';
    n.placeholder = 'say why, if you want to';
    n.style.margin = '0 12px 12px';
    n.style.width = 'calc(100% - 24px)';
    r.appendChild(n);

    function vote(v, star){
      mine[it.id] = { vote: v, said: n.value.trim(), when: stamp(),
                      kind: it.kind, lane: it.lane, title: it.title };
      if(star) mine[it.id].star = true;
      writePhone();
      lastGone = it.id;
      r.classList.add('gone');
      setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); tally(); }, 190);
      said(star ? 'A star on ' + (it.title || it.id) + '. Its way of making things becomes the way.'
           : v === 'up' ? 'Yes on ' + (it.title || it.id) + '.'
                      : 'No on ' + (it.title || it.id) + '.');
      tally();
      if(lastReg) drawYes(lastReg);   /* a YES joins the list at the foot the second he taps */
    }
    up.addEventListener('click', function(){ vote('up'); });
    dn.addEventListener('click', function(){ vote('down'); });
    sr.addEventListener('click', function(){ vote('up', true); });

    return r;
  }

  function said(s){
    var e = document.getElementById('saidit');
    if(e) e.textContent = s;
  }

  function tally(){
    var live = document.querySelectorAll('#list .row:not(.gone)').length;
    /* behind the fold: the rows themselves once it is open, its count while it is shut */
    var later = foldOpen ? document.querySelectorAll('#more .row:not(.gone)').length : +(document.getElementById('fold').dataset.n || 0);
    var done = 0, id;
    for(id in mine){ if(Object.prototype.hasOwnProperty.call(mine, id)) done++; }
    var t = document.getElementById('tally');
    if(t) t.textContent = live + ' WAITING' + (done ? '  ·  ' + done + ' JUDGED' : '');   /* the MORE count lives on the fold: in the header it pushed EXPORT onto a second line */
    var fn = document.getElementById('foldn'); if(fn && TRI) fn.textContent = String(later);
    var fb = document.getElementById('fold'); if(fb && TRI && !later) fb.hidden = true;
    var em = document.getElementById('empty');
    if(em) em.hidden = live > 0 || later > 0;
  }

  /* ---------- DRAW ---------- */
  function tagOf(id){ var t = TRI && TRI.tags && TRI.tags[id]; return t && t.tag ? String(t.tag).toLowerCase() : null; }
  /* NEWEST FIRST, by the day a card says it was made, then by where it sits in the file (the readme says append, so later
     is newer). The day leads because a card put at the TOP of the file was drawn last for weeks (measured 10/18: eight
     10/18 cards at the head of items[] sat under 9/12 ones). */
  function madeOf(it){ var m = String((it && it.made) || '').match(/^(\d{1,2})\/(\d{1,2})/); return m ? (+m[1]) * 100 + (+m[2]) : 0; }
  function newestFirst(){
    return items.map(function(it, i){ return {it:it, i:i, d:madeOf(it)}; })
      .sort(function(a, b){ return (b.d - a.d) || (b.i - a.i); }).map(function(x){ return x.it; });
  }
  function draw(){
    var list = document.getElementById('list'), more = document.getElementById('more'), fold = document.getElementById('fold');
    list.textContent = ''; more.textContent = '';
    var cap = (TRI && TRI.cap) || 12, reds = [], fresh = [], rest = [];
    newestFirst().forEach(function(it){
      if(!it || !it.id) return;
      if(judged(it.id)) return;        /* A VOTE CONSUMES. This line is the whole law. */
      if(!TRI){ list.appendChild(row(it)); return; }
      var tg = tagOf(it.id);
      if(tg === 'green' || tg === 'gray' || tg === 'grey') return;      /* the team already has it: never on his screen */
      if(tg === 'red') reds.push(it); else if(!tg) fresh.push(it); else rest.push(it);   /* red, not sorted yet, yellow */
    });
    var front = reds.concat(fresh), later = front.slice(cap).concat(rest);   /* red first, then the new; a tag only demotes */
    front.slice(0, cap).forEach(function(it){ list.appendChild(row(it)); });
    fold.hidden = !TRI || !later.length;
    fold.dataset.n = String(later.length);
    more.hidden = !foldOpen;
    if(foldOpen) later.forEach(function(it){ more.appendChild(row(it)); });
    tally();
  }
  document.getElementById('fold').addEventListener('click', function(){ foldOpen = !foldOpen; draw(); });

  /* ---------- EXPORT ----------
     .txt, never .json (the verdict workflow). The block is written so it can be dropped
     straight into records/ and read by a person, and the REGISTER lines at the bottom are
     what a lane pastes into the registry's verdicts[]. */
  function txt(){
    var out = [];
    out.push('BOHEMIA VOTE -- ' + stamp());
    out.push('One tab, one queue. Paolo 9/14.');
    out.push('');
    var ids = Object.keys(mine);
    if(!ids.length) out.push('(no votes yet)');
    ids.forEach(function(id){
      var v = mine[id];
      out.push((v.star ? 'STAR ' : v.vote === 'up' ? 'YES  ' : 'NO   ') + (v.title || id));
      out.push('     id    ' + id);
      out.push('     kind  ' + (v.kind || '?') + '   lane ' + (v.lane || '?') + '   on ' + (v.when || '?'));
      if(v.said) out.push('     said  ' + v.said);
      out.push('');
    });
    var note = (document.getElementById('allnote') || {}).value || '';
    if(note.trim()){
      out.push('ANYTHING ELSE');
      out.push(note.trim());
      out.push('');
    }
    out.push('--- FOR THE REGISTRY (verdicts[] in records/target/BOHEMIA_VOTE_REGISTRY.json) ---');
    ids.forEach(function(id){
      var v = mine[id];
      out.push('{"id":' + JSON.stringify(id) + ',"vote":' + JSON.stringify(v.vote) +
               (v.star ? ',"star":true' : '') +
               ',"said":' + JSON.stringify(v.said || '') + ',"when":' + JSON.stringify(v.when || '') + '},');
    });
    return out.join('\n');
  }

  function save(){
    var body = txt();
    try{
      var b = new Blob([body], { type: 'text/plain' });
      var u = URL.createObjectURL(b);
      var a = document.createElement('a');
      a.href = u; a.download = 'BOHEMIA_VOTE_' + stamp().replace('/', '_') + '.txt';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 800);
      said('Saved. Send me the file.');
    }catch(e){
      /* A DOWNLOAD IS NOT ALWAYS ALLOWED (in a frame, on some phones). Falling back to
         the clipboard beats a button that silently does nothing. */
      try{ navigator.clipboard.writeText(body); said('Copied. Paste it to me.'); }
      catch(e2){ said('Could not save. Screenshot this instead.'); }
    }
  }
  document.getElementById('out').addEventListener('click', save);
  document.getElementById('out2').addEventListener('click', save);

  /* PUT THE LAST ONE BACK. A mis-tap on a 44px thumb is a real thing and a vote is
     permanent by design, so there is exactly one step of undo and it is labelled in
     plain words. It only reaches this phone's memory; the registry is never rewritten
     from here. */
  document.getElementById('undo').addEventListener('click', function(){
    if(!lastGone || !mine[lastGone]){ said('Nothing to put back.'); return; }
    var id = lastGone;
    delete mine[id];
    writePhone();
    lastGone = null;
    draw();
    said('Put back: ' + id);
  });

  var an = document.getElementById('allnote');
  try{ an.value = localStorage.getItem(NOTEKEY) || ''; }catch(e){}
  an.addEventListener('input', function(){
    try{ localStorage.setItem(NOTEKEY, an.value); }catch(e){}
  });

  /* ---------- OPEN ---------- */
  readPhone();
  function fail(why){
    items = [];
    draw();
    var em = document.getElementById('empty');
    if(em){
      em.hidden = false;
      em.innerHTML = '';
      var b = document.createElement('b');
      b.textContent = 'THE LIST DID NOT LOAD.';
      em.appendChild(b);
      em.appendChild(document.createTextNode(
        'Nothing is lost. The list lives in a file on the server and this build could not ' +
        'reach it (' + why + '). Open the link again in a minute.'));
    }
  }

  /* ---------- HIS YESES IN THE DEMO ----------
     RUN TWO [his yeses in the demo], Paolo 10/18 ('the demo has not been fixed and updated in a long time'; rule 118: he
     sees the truth, not anybody's word). Every YES since 10/16 is one line under the comment box: IN THE DEMO with the
     build stamp the demo is serving right now, or NOT YET with the chat that has it. NOTHING HERE IS TYPED: the YES
     votes are the registry's (and this phone's, the second he taps), IN or NOT YET is records/target/BOHEMIA_YES_IN_THE_DEMO.json
     (made by tools/bohemia_run2_yes_in_the_demo.js from each card's commits and what the demo's own cut loads; the deploy
     re-makes it right after it cuts the demo), and the stamp is the one line the cut writes beside the demo. A YES the
     machine has not read yet says NOT YET: it never says IN on a guess. */
  var YES_URL = '../records/target/BOHEMIA_YES_IN_THE_DEMO.json', STAMP_URL = 'BOHEMIA_DEMO_STAMP.txt', YES_SINCE = 1016;
  function getText(u){ return fetch(u, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).catch(function(){ return null; }); }
  function plainTitle(t){
    t = String(t || '').replace(/^(CANDIDATE|PLACEHOLDER|REDO(NE)?|NEW)\b[^:]{0,30}:\s*/i, '');
    return t.length > 72 ? t.slice(0, 70).replace(/\s+\S*$/, '') + '…' : t;
  }
  function drawYes(reg){
    var box = document.getElementById('yeses'); if(!box) return;
    Promise.all([getText(YES_URL), getText(STAMP_URL)]).then(function(got){
      var made = null; try{ made = got[0] ? JSON.parse(got[0]) : null; }catch(e){ made = null; }
      var state = {}; ((made && made.rows) || []).forEach(function(r){ if(r && r.id) state[r.id] = r; });
      var stamp = String(got[1] || (made && made.stamp) || '').trim();
      var build = (stamp.match(/BUILD\s+(\S+)/) || [])[1] || (made && made.build) || '';
      var cards = {}; ((reg && reg.items) || []).forEach(function(it){ if(it && it.id) cards[it.id] = it; });
      var seen = {}, rows = [];
      function add(id, v){
        if(!v || v.vote !== 'up' || seen[id] || madeOf({ made: v.when }) < YES_SINCE) return;
        seen[id] = true;
        var it = cards[id] || {}, m = state[id];
        rows.push({ id: id, title: plainTitle(it.title || v.title || id), lane: String(it.lane || v.lane || '?').toUpperCase(),
                    star: !!v.star, inDemo: !!(m && m.state === 'in') });
      }
      ((reg && reg.verdicts) || []).forEach(function(v){ if(v) add(v.id, v); });
      Object.keys(mine).forEach(function(id){ add(id, mine[id]); });   /* a YES on this phone the registry has not caught yet */
      box.textContent = '';
      if(!rows.length){ box.hidden = true; return; }
      var ins = rows.filter(function(r){ return r.inDemo; }), nots = rows.filter(function(r){ return !r.inDemo; });
      var h = document.createElement('h2'); h.textContent = 'YOUR YESES SINCE 10/16'; box.appendChild(h);
      var s = document.createElement('p'); s.className = 'sum';
      s.textContent = ins.length + ' of ' + rows.length + ' are in the demo' + (build ? ' (build ' + build + ').' : '.');
      box.appendChild(s);
      ins.concat(nots).forEach(function(r){
        var l = document.createElement('div'); l.className = 'yl ' + (r.inDemo ? 'in' : 'not'); l.setAttribute('data-id', r.id);
        var t = document.createElement('span'); t.className = 'yt'; t.textContent = r.inDemo ? 'IN THE DEMO' : 'NOT YET'; l.appendChild(t);
        var n = document.createElement('span'); n.className = 'yn';
        n.appendChild(document.createTextNode((r.star ? '★ ' : '') + r.title));
        var w = document.createElement('span'); w.className = 'yw';
        w.textContent = r.inDemo ? (build ? '  · build ' + build : '') : '  · ' + r.lane + ' has it';
        n.appendChild(w); l.appendChild(n); box.appendChild(l);
      });
      box.hidden = false;
      window.__yesReady = true;
    });
  }

  /* the sort is read beside the list; if it cannot be read the tab shows everything, never nothing */
  var triage = fetch(TRI_URL, { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(t){ TRI = (t && t.tags && typeof t.tags === 'object') ? t : null; })
    .catch(function(){ TRI = null; });
  fetch(REG, { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){ return triage.then(function(){ return d; }); })
    .then(function(d){
      items = (d && d.items) || [];
      ((d && d.verdicts) || []).forEach(function(v){ if(v && v.id) theirs[v.id] = v; });
      draw();
      window.__voteReady = true;
      lastReg = d; drawYes(d);
    })
    .catch(function(e){ fail(String(e.message || e)); window.__voteReady = true; });
})();
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Try A Mod</title>
<style>
:root{--bg:#0b0d0c;--ink:#cfd6cc;--dim:#6f7a70;--red:#d8352a;--amber:#d9a441;--ok:#7fb069;--line:#1d2320}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:20px;letter-spacing:.08em;margin:6px 0 2px;text-transform:uppercase}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
label{display:block;color:var(--dim);font-size:11px;letter-spacing:.1em;margin:12px 0 4px}
textarea{width:100%;height:190px;background:#101312;color:var(--ink);border:1px solid var(--line);font:13px/1.35 inherit;font-family:inherit;padding:10px;resize:vertical}
.btns{display:flex;gap:8px;margin:8px 0}
.btns button{flex:1;padding:12px 4px;background:#141816;color:var(--ink);border:1px solid var(--line);font:inherit;letter-spacing:.06em}
.btns button:active{border-color:var(--red)}
.msg{margin:8px 0;padding:8px 10px;border-left:3px solid var(--line);font-size:12px}
.msg.ok{border-color:var(--ok)}.msg.warn{border-color:var(--amber);color:var(--amber)}.msg.bad{border-color:var(--red);color:#f0908a}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:normal}
td.chg{color:var(--amber);background:#1a1508}td.new{color:var(--ok)}
.tw{overflow-x:auto}
</style></head><body><div class="wrap">
<h1>Try a mod</h1>
<div class="sub">MODS. Draft, not in the game. This is the whole idea: the base guns are one file, a mod is a few lines that change keys. Edit the box and press APPLY.</div>
<label>THE MOD (a manifest and the change)</label>
<textarea id="mod" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
<div class="btns"><button id="apply">APPLY</button><button id="ex1">BIGGER PISTOL MAG</button><button id="ex2">NEW GUN</button><button id="ex3">BROKEN MOD</button></div>
<div id="msgs"></div>
<label>THE GUNS THE FIGHT WOULD READ</label>
<div class="tw"><table id="tbl"></table></div>
</div>
<script>
var BASE={"pistol":{"mag":15,"startLoaded":15,"cap":8,"lethal":0.2,"width":1,"arc":1.31,"rangeEff":6,"rangeMax":12},"smg":{"mag":30,"startLoaded":30,"cap":2,"lethal":0.35,"width":0.8,"arc":1.05,"rangeEff":10,"rangeMax":15},"rifle":{"mag":20,"startLoaded":20,"cap":1,"lethal":0.55,"width":1.3,"arc":0.7,"rangeEff":20,"rangeMax":16},"shotgun":{"mag":6,"startLoaded":6,"cap":2,"lethal":1,"width":1.2,"arc":0.96,"rangeEff":5,"rangeMax":9}};
var GAME_SCHEMA=1;
var FIELDS=['mag','startLoaded','cap','lethal','width','arc','rangeEff','rangeMax'];
var EX={
ex1:{"mod":{"id":"bigger-mags","name":"Bigger Mags","version":"1.0.0","schema":1},"weapons":{"pistol":{"mag":17,"startLoaded":17}}},
ex2:{"mod":{"id":"crossbow-pack","name":"Crossbow Pack","version":"0.2.0","schema":1,"loadAfter":["bigger-mags"]},"weapons":{"crossbow":{"mag":1,"startLoaded":1,"cap":1,"lethal":0.6,"width":1.1,"arc":0.5,"rangeEff":9,"rangeMax":14}}},
ex3:{"mod":{"id":"oops","name":"Oops","version":"1.0.0","schema":0},"weapons":{"pistol":{"mag":"a lot","magazine":9},"laser":{"mag":3}}}
};
function clone(o){return JSON.parse(JSON.stringify(o));}
function merge(base,mod){
  var out=clone(base),log=[];
  if(!mod||typeof mod!=='object'||!mod.mod||typeof mod.mod.id!=='string'){return {out:out,log:[['bad','SKIPPED: no manifest. A mod needs mod.id, name, version, schema.']]};}
  var m=mod.mod;
  if(m.schema!==GAME_SCHEMA)log.push(['warn',m.name+': written for data schema '+m.schema+', this game reads '+GAME_SCHEMA+'. Loaded anyway, may not fit.']);
  var w=mod.weapons||{};
  Object.keys(w).forEach(function(id){
    var row=w[id],exists=id in out,next=exists?clone(out[id]):{},ok=true;
    Object.keys(row).forEach(function(k){
      if(FIELDS.indexOf(k)<0){log.push(['warn',id+'.'+k+': no such field, ignored. Fields are: '+FIELDS.join(', ')]);return;}
      if(typeof row[k]!=='number'||!isFinite(row[k])){log.push(['bad',id+'.'+k+': wants a number, got '+JSON.stringify(row[k])+'. That one value is skipped.']);return;}
      next[k]=row[k];
    });
    if(!exists){var miss=FIELDS.filter(function(f){return !(f in next);});
      if(miss.length){log.push(['bad',id+': NEW gun needs every field, missing '+miss.join(', ')+'. Gun skipped, the rest of the mod still loads.']);ok=false;}
      else log.push(['ok',id+': new gun added.']);}
    else{var ch=Object.keys(row).filter(function(k){return FIELDS.indexOf(k)>=0&&next[k]!==out[id][k];});log.push([ch.length?'ok':'warn',id+': '+(ch.length?'changed '+ch.join(', ')+'.':'nothing changed.')]);}
    if(ok)out[id]=next;
  });
  log.push(['ok','Mod "'+m.name+'" v'+m.version+' finished. The game did not crash.']);
  return {out:out,log:log};
}
function show(res){
  var mm=document.getElementById('msgs');mm.innerHTML='';
  res.log.forEach(function(l){var d=document.createElement('div');d.className='msg '+l[0];d.textContent=l[1];mm.appendChild(d);});
  var t=document.getElementById('tbl');
  var h='<tr><th>gun</th>'+FIELDS.map(function(f){return '<th>'+f+'</th>';}).join('')+'</tr>';
  Object.keys(res.out).forEach(function(id){
    h+='<tr><td>'+id+'</td>'+FIELDS.map(function(f){
      var v=res.out[id][f],isNew=!(id in BASE),chg=!isNew&&v!==BASE[id][f];
      return '<td class="'+(isNew?'new':chg?'chg':'')+'">'+v+'</td>';}).join('')+'</tr>';});
  t.innerHTML=h;
}
var ta=document.getElementById('mod');
function run(){var o;try{o=JSON.parse(ta.value);}catch(e){show({out:clone(BASE),log:[['bad','SKIPPED: this is not valid JSON ('+e.message+'). The base game is untouched.']]});return;}show(merge(BASE,o));}
document.getElementById('apply').onclick=run;
['ex1','ex2','ex3'].forEach(function(k){document.getElementById(k).onclick=function(){ta.value=JSON.stringify(EX[k],null,1);run();};});
ta.value=JSON.stringify(EX.ex1,null,1);run();
</script></body></html>

        const ya=A[p*LANE_W], yb=B[B.length-1-p*LANE_W];
        if(ya!=null&&cwX-1-PL>=1){mark(ya,cwX-PL,cwX-1,'turn_arrow_right');pocketsRight++;}
        if(yb!=null&&cwX+cwW+PL<=W-2){mark(yb,cwX+cwW,cwX+cwW+PL-1,'turn_arrow_right');pocketsRight++;}
      }
    }
    // lamps: STAGGERED LAW
    const ls=(opts&&opts.lampSpacing)||8; let side=0;
    const lampH=(opts&&opts.lampTall)||(L.lanes>=3?4:3); // LAMP HEIGHT LAW: arterial 4, smaller 3
    for(let x=2;x<W-1;x+=ls){placeProp(grid[side?H-1:0][x],{p:'street_lamp',hTiles:lampH,state:'dead'});side=1-side;}
    // FIRE BARRELS RARE (7/14): standalone props, never lamp stand-ins
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const c=grid[y][x];
      if(c.g==='side'&&!c.props.length&&r()<0.03)placeProp(c,{p:'fire_barrel',hTiles:1});
    }
    // wrecks: CAR OVERLAP LAW via occupancy, 4-way facings
    const occ=new Set(); const laneRows=[]; L.rows.forEach((rw,i)=>{if(rw.t==='lane')laneRows.push(i);});
    const wrecks=(opts&&opts.wrecks!=null)?opts.wrecks:Math.floor(r()*4);
    let placed=0,tries=0;
    while(placed<wrecks&&tries<100){tries++;
      const ns=r()<0.4, w=ns?2:3,h=ns?3:2;
      const gx=4+Math.floor(r()*(W-8)), gy=laneRows[Math.floor(r()*laneRows.length)];
      if(gy+h>H-L.sidewalk)continue;
      let free=true;
      for(let x=gx;x<gx+w;x++)for(let y=gy;y<gy+h;y++)if(occ.has(x+','+y))free=false;
      if(!free)continue;
      for(let x=gx;x<gx+w;x++)for(let y=gy;y<gy+h;y++)occ.add(x+','+y);
      // a wreck is not street furniture: the choke refuses it if a lane row ever
      // resolves onto a sidewalk cell. It counts only if it actually landed.
      if(placeProp(grid[gy][gx],{p:'car_wreck',w,h,facing:ns?'NS':'EW'}))placed++;
    }
    return {type:'street',W,H,grid,meta:{lanes:L.lanes,median:L.median,sidewalk:L.sidewalk,intersection:hasIntersection,wrecks:placed,pocketsLeft,pocketsRight,pocketLen:PL,crosswalkX:cwX,crosswalkW:cwW}};
  }
  // recipe registry per BLOCK CANON (street-scene-first; others are presets/stubs)
  // TERRAIN TYPES (7/14): the valley's edges.
    // RUIN FLANKS — DEAD (Paolo 7/14, SIDEWALK SANCTITY LAW): sidewalks carry NOTHING
  // but lamp posts / street furniture; buildings+ruins live PAST the sidewalk in a
  // zone not yet designed. Function retained unused as the graveyard record.
  // (original intent below)
  // along their building edges (top row 0 and bottom row H-1 sidewalk backs).
  // Placement is lawful spacing, not map design: fragments every 3-6 cells,
  // density scales with decay (wrecks opt); never on crosswalk columns.
  // GRAVEYARD (RF0 DOWN, 7/14/26, SIDEWALK SANCTITY LAW): addRuinFlanks and
  // ruin_frag are DEAD. The record lives in bohemia_graveyard.txt. A dead
  // function kept inside a live module is a loaded gun — one call site away
  // from resurrecting a verdict Paolo already made. Ruins live PAST the
  // sidewalk in a zone he has not designed yet.
  function genDesert(seed,W,opts){
    const r=rng(seed);const H=Math.max(10,Math.floor(W*0.6));
    const grid=[];
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        const c={g:'desert',props:[]};
        const v=r();
        if(v<0.03)c.props.push({p:'rock',w:1,h:1});
        else if(v<0.045)c.props.push({p:'rubble',w:1,h:1});
        else if(v<0.053)c.props.push({p:'scorch_patch',w:1,h:1});
        row.push(c);
      } grid.push(row);}
    return {W,H,grid,meta:{type:'desert',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0}};
  }
  function genMountain(seed,W,opts){
    const r=rng(seed);const H=Math.max(10,Math.floor(W*0.6));
    const grid=[];
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        const c={g:'rock',props:[]};
        if(r()<0.35)c.props.push({p:'boulder',w:1,h:1,impassable:true});
        row.push(c);
      } grid.push(row);}
    return {W,H,grid,meta:{type:'mountain',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0}};
  }
  // BIG-ACREAGE GRAMMAR (7/14) — semantic roles only, art pools PENDING.
  // WASH: Vegas flood channels — concrete floor, sloped banks, service road one side.
  function genWash(seed,W,opts){
    const H=Math.max(12,Math.floor(W*0.6));
    const grid=[];
    const floorW=Math.max(4,Math.floor(W*0.3));
    const x0=Math.floor((W-floorW)/2);
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        let g='desert';
        if(x>=x0&&x<x0+floorW)g='wash_floor';
        else if(x===x0-1||x===x0+floorW)g='wash_slope';
        else if(x===x0-2)g='wash_service_road';
        row.push({g,props:[]});
      } grid.push(row);}
    return {W,H,grid,meta:{type:'wash',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0,pending:['channel concrete art','culvert crossings']}};
  }
  // SOLAR: panel rows on N-S racks, service aisles between, perimeter fence.
  function genSolar(seed,W,opts){
    const H=Math.max(12,Math.floor(W*0.6));
    const grid=[];
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        const g=(x%4<2)?'panel_row':'service_aisle';
        row.push({g,props:[]});
      } grid.push(row);}
    for(let x=0;x<W;x++){grid[0][x].props.push({p:'fence',impassable:true});grid[H-1][x].props.push({p:'fence',impassable:true});}
    for(let y=0;y<H;y++){grid[y][0].props.push({p:'fence',impassable:true});grid[y][W-1].props.push({p:'fence',impassable:true});}
    return {W,H,grid,meta:{type:'solar',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0,pending:['panel art','inverter pads','fence art']}};
  }
  // FARM: field strips with dirt access lanes every 8 rows.
  function genFarm(seed,W,opts){
    const H=Math.max(12,Math.floor(W*0.6));
    const grid=[];
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        const g=(y%8===0)?'farm_lane':'field_row';
        row.push({g,props:[]});
      } grid.push(row);}
    return {W,H,grid,meta:{type:'farm',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0,pending:['crop art (citybuilder output ties in)','farm buildings']}};
  }
  // AIRPORT/AIRBASE (7/14): factual anatomy — runway strip with centerline,
  // parallel taxiway, apron band. Art pools PENDING (concrete family).
  function genAirfield(seed,W,opts){
    const H=Math.max(14,Math.floor(W*0.6));
    const grid=[];
    const rwY=Math.floor(H*0.35);
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++){
        let g='desert';
        if(y===rwY||y===rwY+1||y===rwY+2)g=(y===rwY+1)?'runway_centerline':'runway';
        else if(y===rwY+5)g='taxiway';
        else if(y>=H-5)g='apron_concrete';
        row.push({g,props:[]});
      } grid.push(row);}
    return {W,H,grid,meta:{type:'airfield',lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0,
      pending:['runway/taxiway concrete art','marking art','derelict aircraft props']}};
  }
  // INTERSECTION (7/17, Paolo: "is it time I can see a proper intersection").
  // Two streets CROSSING, per the researched Vegas anatomy: the BOX stays
  // clean (no lane paint, no median inside), crosswalks guard all four
  // approaches at the box edges, medians stop at the crosswalks, and each
  // approach's innermost lane carries a left-turn pocket ending one cell
  // before its crosswalk (arrows face travel; the baker resolves rotation).
  // Corners are sidewalk with lamps. Cell fields: g (role), o ('ew'|'ns'),
  // dir, mk. LINE COLOR LAW: yellow only on median cells; pockets are white.
  function genIntersection(seed,W,opts){
    const o=opts||{};const r=rng(seed);
    const lanesEW=o.lanesEW!=null?o.lanesEW:2, lanesNS=o.lanesNS!=null?o.lanesNS:2;
    const bandEW=2*(lanesEW*LANE_W+(lanesEW-1))+1;  // lanes+divs both dirs + median
    const bandNS=2*(lanesNS*LANE_W+(lanesNS-1))+1;
    const cw=1;
    const H=o.H||(bandEW+2*(cw+8));   // auto-size: room for crosswalks + pockets
    const PLx=Math.max(0,Math.min(6,(((W-bandNS)/2)|0)-cw-2));   // EW approaches
    const PLy=Math.max(0,Math.min(6,(((H-bandEW)/2)|0)-cw-2));   // NS approaches
    const r0=(H-bandEW)>>1, r1=r0+bandEW-1;
    const c0=(W-bandNS)>>1, c1=c0+bandNS-1;
    const medRow=r0+(bandEW>>1), medCol=c0+(bandNS>>1);
    const grid=[];
    for(let y=0;y<H;y++){const row=[];
      for(let x=0;x<W;x++)row.push({g:'side',o:null,dir:null,color:null,axis:null,mk:null,props:[]});
      grid.push(row);}
    const laneRowsEW=[],laneColsNS=[];
    const halfEW=bandEW>>1, halfNS=bandNS>>1;
    // side A counts up to the median; side B restarts AFTER it, so both sides
    // put LANES against the median (the real anatomy; a div there was the bug)
    const divAt=(i,half)=>{const l=i<half?i:i-half-1;return (l%(LANE_W+1))===LANE_W;};
    for(let i=0;i<bandEW;i++){const y=r0+i;
      if(y===medRow)continue;
      const isDiv=divAt(i,halfEW);
      for(let x=0;x<W;x++){const c=grid[y][x];c.o='ew';
        c.g=isDiv?'lane_div':'lane';
        c.dir=isDiv?null:(y<medRow?'A':'B');
        if(isDiv){c.color='white_lane';c.axis='road';}}
      if(!isDiv)laneRowsEW.push(y);}
    for(let x=0;x<W;x++){const c=grid[medRow][x];c.o='ew';c.g='median';c.color='yellow_direction';c.axis='road';c.dir=null;}
    for(let j=0;j<bandNS;j++){const x=c0+j;
      if(x===medCol){for(let y=0;y<H;y++){const c=grid[y][x];if(c.g==='side'){c.o='ns';c.g='median';c.color='yellow_direction';c.axis='road';}}continue;}
      const isDiv=divAt(j,halfNS);
      for(let y=0;y<H;y++){const c=grid[y][x];
        if(c.g!=='side')continue;         // EW band + box already claimed
        c.o='ns';c.g=isDiv?'lane_div':'lane';
        c.dir=isDiv?null:(x<medCol?'A':'B');
        if(isDiv){c.color='white_lane';c.axis='road';}}
      if(!isDiv)laneColsNS.push(x);}
    // THE BOX: rows r0..r1 x cols c0..c1 -> clean asphalt, nothing painted
    for(let y=r0;y<=r1;y++)for(let x=c0;x<=c1;x++){const c=grid[y][x];
      c.g='box';c.o=null;c.dir=null;c.color=null;c.axis=null;c.mk=null;}
    // CROSSWALKS at the four box edges (never inside the box)
    for(let y=r0;y<=r1;y++){grid[y][c0-cw].g='crosswalk';grid[y][c0-cw].o='ew';grid[y][c0-cw].color=null;
      grid[y][c1+cw].g='crosswalk';grid[y][c1+cw].o='ew';grid[y][c1+cw].color=null;}
    for(let x=c0;x<=c1;x++){grid[r0-cw][x].g='crosswalk';grid[r0-cw][x].o='ns';grid[r0-cw][x].color=null;
      grid[r1+cw][x].g='crosswalk';grid[r1+cw][x].o='ns';grid[r1+cw][x].color=null;}
    // POCKETS: innermost lane per approach, ending one cell before its crosswalk
    const innerA=medRow-1, innerB=medRow+1;   // EW inner lane rows
    const innerL=medCol-1, innerR=medCol+1;   // NS inner lane cols
    const mark=(cells,arrow)=>{cells.forEach(([x,y],i)=>{const c=grid[y][x];
      if(c.g!=='lane')return;c.mk=(i%3===1)?arrow:'pocket_edge';});};
    const west=[],east=[],north=[],south=[];
    for(let k=0;k<PLx;k++){west.push([c0-cw-1-k,innerB]);east.push([c1+cw+1+k,innerA]);}
    for(let k=0;k<PLy;k++){north.push([innerL,r0-cw-1-k]);south.push([innerR,r1+cw+1+k]);}
    mark(west,'turn_arrow_left_e');mark(east,'turn_arrow_left_w');
    mark(north,'turn_arrow_left_s');mark(south,'turn_arrow_left_n');
    // corner lamps (LAMP HEIGHT LAW: majors get 4)
    const lampH=(Math.max(lanesEW,lanesNS)>=3)?4:3;
    for(const [ly,lx] of [[r0-cw-1,c0-cw-1],[r0-cw-1,c1+cw+1],[r1+cw+1,c0-cw-1],[r1+cw+1,c1+cw+1]]){
      if(grid[ly]&&grid[ly][lx]&&grid[ly][lx].g==='side')placeProp(grid[ly][lx],{p:'street_lamp',hTiles:lampH,state:'dead'});}
    return {type:'intersection',W,H,grid,meta:{lanesEW,lanesNS,box:[c0,r0,c1,r1],
      crosswalks:4,pocketLenX:PLx,pocketLenY:PLy,medRow,medCol}};
  }
  // PROCEDURAL BUILT LOT (Paolo 7/18/26: "those can be randomly generated
  // throughout the map... this is a procedural generated world game"). Every
  // district that used to have NO recipe (return null -> blank desert lot) now
  // GENERATES from its build ARCHETYPE: footprints + parking + fence + greenery
  // laid on the plot, deterministic per (seed,cell). Semantic ground only, art
  // pools resolve at bake exactly like every other recipe. ~9 archetype rules
  // cover 60 landmark types instead of 60 hand-authored templates.
  function genBuiltLot(seed,W,opts){
    const o=opts||{}; const r=rng(seed);
    const A=o.archetype||'civic';
    const H=Math.max(12,Math.floor(W*0.6));
    const base=(A==='green')?'turf':(A==='water')?'water':(A==='extraction')?'rock':
               (A==='industrial'||A==='utility')?'gravel_yard':'lot_ground';
    const grid=[];
    for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++)row.push({g:base,props:[]});grid.push(row);}
    const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
    const rect=(x0,y0,w,h,g,prop)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(inb(x,y)){grid[y][x].g=g;grid[y][x].props=prop?[prop]:[];}};
    const bldg=(x0,y0,w,h)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(inb(x,y)){grid[y][x].g='building_pad';grid[y][x].props=[{p:'building',impassable:true}];}};
    const fence=()=>{for(let x=0;x<W;x++){grid[0][x].props.push({p:'fence',impassable:true});grid[H-1][x].props.push({p:'fence',impassable:true});}
      for(let y=0;y<H;y++){grid[y][0].props.push({p:'fence',impassable:true});grid[y][W-1].props.push({p:'fence',impassable:true});}};
    const trees=(n)=>{for(let k=0;k<n;k++){const x=1+((r()*(W-2))|0),y=1+((r()*(H-2))|0);if(grid[y][x].g!=='building_pad'){grid[y][x].g='turf';grid[y][x].props=[{p:'tree'}];}}};
    const mid=(W>>1), midH=(H>>1);
    switch(A){
      case 'civic':{ const bw=Math.floor(W*0.5),bh=Math.floor(H*0.34),bx=((W-bw)/2)|0;
        rect(0,2+bh,W,H-(2+bh),'parking_concrete'); bldg(bx,2,bw,bh); trees(6); break; }
      case 'bigbox':{ const bw=Math.floor(W*0.62),bh=Math.floor(H*0.4),bx=((W-bw)/2)|0;
        rect(0,2+bh,W,H-(2+bh),'parking_concrete'); bldg(bx,2,bw,bh); trees(3); break; }
      case 'institutional':{ const pad=2,cols=2,rows=2,cw=((W-pad*3)/cols)|0,ch=((H-pad*3)/rows)|0;
        for(let ry=0;ry<rows;ry++)for(let cx=0;cx<cols;cx++){if(r()<0.2)continue;
          bldg(pad+cx*(cw+pad),pad+ry*(ch+pad),Math.max(2,cw-((r()*3)|0)),Math.max(2,ch-((r()*3)|0)));}
        rect(mid-1,0,2,H,'path'); rect(0,midH-1,W,2,'path'); trees(8); break; }
      case 'industrial':{ const ap=Math.floor(H*0.22); rect(0,0,W,ap,'drive_concrete');
        let y=ap+1; while(y<H-3){const sh=Math.min(H-1-y,3+((r()*4)|0)); bldg(3,y,W-6,sh); y+=sh+2;} fence(); break; }
      case 'utility':{ for(let k=0;k<5+((r()*4)|0);k++){const w=2+((r()*3)|0),h=2+((r()*3)|0);
          const x=2+((r()*Math.max(1,W-4-w))|0),y=2+((r()*Math.max(1,H-4-h))|0); rect(x,y,w,h,'equipment_pad',{p:'tank',impassable:true});} fence(); break; }
      case 'landmark':{ rect(0,0,W,H,'plaza'); const bw=Math.floor(W*0.5),bh=Math.floor(H*0.5);
        bldg(((W-bw)/2)|0,((H-bh)/2)|0,bw,bh); trees(10); break; }
      case 'green':{ for(let y=0;y<H;y++){const px=mid+Math.round(Math.sin(y*0.4)*(W*0.22));
          if(inb(px,y)){grid[y][px].g='path';if(inb(px+1,y))grid[y][px+1].g='path';}} bldg(2,2,4,3); trees(22); break; }
      case 'water':{ break; }
      case 'extraction':{ for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.max(Math.abs(x-mid)/Math.max(1,mid),Math.abs(y-midH)/Math.max(1,midH));
          grid[y][x].g=d<0.35?'pit_floor':d<0.7?'pit_bench':'rock';} break; }
      case 'rail':{ const rx=mid; for(let y=0;y<H;y++){grid[y][rx].g='rail_bed';
          if(inb(rx-1,y))grid[y][rx-1].g='rail_ballast'; if(inb(rx+1,y))grid[y][rx+1].g='rail_ballast';} break; }
      default:{ const bw=Math.floor(W*0.4),bh=Math.floor(H*0.3);
        bldg(((W-bw)/2)|0,2,bw,bh); rect(0,2+bh,W,H-(2+bh),'parking_concrete'); }
    }
    return {W,H,grid,meta:{type:'builtlot',archetype:A,lanes:0,sidewalk:0,median:0,wrecks:0,crosswalk:0,
      pending:['building art per archetype','signage','yard props']}};
  }
  const RECIPES={
    intersection:(seed,W,o)=>genIntersection(seed,W,o),
    builtlot:(seed,W,o)=>genBuiltLot(seed,W,o||{}),
    street:(seed,W,o)=>{
      const b=genStreet(seed,W,o);
      // CENTER TURN LANE (7/14, pools blessed): opts.centerTurn converts the
      // median band into a two-way-left-turn lane, 2 cells wide (twlt_T/B rows).
      if(o&&o.centerTurn){
        const rows=[];
        for(let y=0;y<b.H;y++)if(b.grid[y].some(c=>c.g==='median'))rows.push(y);
        if(rows.length){
          const mid=rows[Math.floor(rows.length/2)];
          for(const y of rows)for(let x=0;x<b.W;x++)if(b.grid[y][x].g==='median')b.grid[y][x].g=(y<=mid)?'twlt_T':'twlt_B';
          // ensure exactly 2 rows read as the lane: widen single-row medians
          if(rows.length===1){
            const y2=Math.min(b.H-1,rows[0]+1);
            for(let x=0;x<b.W;x++){const g=b.grid[y2][x].g;if(g!=='side'&&g!=='crosswalk')b.grid[y2][x].g='twlt_B';}
          }
          b.meta.centerTurn=true;
        }
      }
      return b;
    },
    freeway:(seed,W,o)=>genStreet(seed,W,Object.assign({lanes:5,median:2,sidewalk:1,intersection:false},o)),
    underpass:(seed,W,o)=>genStreet(seed,W,Object.assign({lanes:2,lampSpacing:14,intersection:false},o)),
    residential:(seed,W,o)=>genStreet(seed,W,Object.assign({lanes:1,median:1,sidewalk:1,wrecks:1},o)),
    desert:(seed,W,o)=>genDesert(seed,W,o||{}),
    mountain:(seed,W,o)=>genMountain(seed,W,o||{}),
    wash:(seed,W,o)=>genWash(seed,W,o||{}),
    solar:(seed,W,o)=>genSolar(seed,W,o||{}),
    farm:(seed,W,o)=>genFarm(seed,W,o||{}),
    airfield:(seed,W,o)=>genAirfield(seed,W,o||{}),
    sewer_entrance:(seed,W,o)=>({type:'sewer_entrance',W,H:0,grid:null,meta:{stub:'street recipe + manhole entrance cell; pending'}}),
  };
  function generate(type,seed,W,opts){
    if(!RECIPES[type])throw new Error('unknown block type '+type);
    return RECIPES[type](seed,W||28,opts||{});
  }
  return {generate,LANE_W,placeProp,sidewalkLegal,auditSidewalks,auditLines,
    SIDEWALK_LEGAL,SIDEWALK_PROPOSED,types:Object.keys(RECIPES)};
})();
if(typeof module!=='undefined')module.exports=BOH_BLOCKGEN;

/* ==== engine/bohemia_floorplan.js ==== */
// BOHEMIA FLOORPLAN (7/18/26) — the ENTERABLE rung of the world model.
// The valley -> district -> plot -> building ladder had no bottom rung: a
// building was a solid footprint you could not go inside. This generates the
// INTERIOR: given a footprint (W x H fine tiles) + a zone + seed, it BSP-splits
// the space into rooms, walls the gaps, carves a door graph that GUARANTEES
// every room is reachable, and cuts a street-facing entrance. Zoning assigns
// room roles the Shadows-of-Doubt way (the room by the street door gets the
// public role, back rooms go private/service). Deterministic per (seed,W,H,zone).
// Semantic only: 'floor'/'wall'/'door' + role labels; art resolves at bake, the
// same contract as every other generator.
//
// 7/26/26 — INTERIOR-MATCHES-EXTERIOR LAW (Paolo 7/19, LOCKED: "if your interior

  // AISLE flanked by ~18ft-deep (≈7-tile) stall banks — a double-loaded bay.

   per-building authoring. That matters here more than anywhere: Bohemia has 48
   district generators making buildings procedurally. Anything needing a human
   to place a door sensor is dead on arrival. It is also the algorithm the file
   ALREADY uses — homeFootprints() and KIT.footprints() are both flood fills, so
   this is the shape the codebase is already in, not a new idea bolted on.

   real geometry, so a diagonal must never merge two rooms. Getting this wrong

    if(ROADSET[at(x-1,y)])out.push('W'); if(ROADSET[at(x+1,y)])out.push('E'); return out; }
  function buildLandlockConnect(m){
    var N=m.n, extra={}, touchesCache={}, key=function(x,y){return x+','+y;};
    function isBuilt(d){ return !!DISTGEN[d]; }  // only real auto-factory districts relay
    function touches(x,y){ var k=key(x,y); if(k in touchesCache)return touchesCache[k];
      return touchesCache[k]=rawStreetEdges(m,x,y).length>0; }
    function addEdge(k,e){ (extra[k]=extra[k]||{})[e]=1; }
    var DIRS=[['N',0,-1],['S',0,1],['E',1,0],['W',-1,0]], OPP={N:'S',S:'N',E:'W',W:'E'};
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var cell=m.at(x,y); if(!cell||!isBuilt(cell.district)||touches(x,y))continue;
      var fam=familyOf(cell.district);
      var seen={}; seen[key(x,y)]=1;
      var q=[{x:x,y:y,path:[]}], head=0, found=null;
      while(head<q.length && !found){

          var e=DIRS[i][0], nx=cur.x+DIRS[i][1], ny=cur.y+DIRS[i][2], nk=key(nx,ny);
          if(seen[nk])continue; var nc=m.at(nx,ny); if(!nc||familyOf(nc.district)!==fam)continue;

      }

         said it: "make sure I can't be locked in any certain district ever
         again it's so fucking creepy").
         THE SAME-FAMILY RELAY ABOVE IS THE REALISTIC PATH and it stays first:
         a walled subdivision reaching the road through the subdivision next door
         is how Sun Belt tracts actually connect. But it can only help a cell
         that HAS a same-family neighbour. A landlocked school, drive-in or
         estate has none, so it got nothing at all - 27 cells in the canon valley
         came out with no street edge AND no relay, which is a sealed box you can
         stand inside and never leave.
         SO THERE IS A SECOND PASS, and it is deliberately less picky than the
         first: if family loyalty cannot find you a road, take ANY built
         neighbour. Relaying through a district of another kind is less true to
         real Vegas than relaying through your own kind - and it is enormously
         truer than a prison. Realism loses to reachability, once, at the end,
         and only for the cells that would otherwise have nothing. */

        while(h2<q2.length && !found){
          var cur2=q2[h2++];
          for(var j=0;j<4;j++){
            var e2=DIRS[j][0], mx=cur2.x+DIRS[j][1], my=cur2.y+DIRS[j][2], mk=key(mx,my);
            if(seen2[mk])continue; var mc=m.at(mx,my); if(!mc||!isBuilt(mc.district))continue;
            seen2[mk]=1;

            var np2={x:mx,y:my,path:cur2.path.concat([hop2])};
            if(touches(mx,my)){ found=np2; break; }
            q2.push(np2);
          }
        }
      }
      /* AND A THIRD PASS, FOR THE SEVEN CELLS EVEN THAT COULD NOT SAVE. Some
         built districts sit in a pocket whose whole connected run of built cells
         never touches a road - three estates in the north-east, a commercial, a
         farm and two suburbs down in the south-west corner. No relay through
         built ground can reach a street because there is no street to reach that
         way; what is between them and the road is BARE DESERT.
         That is precisely what the LANDMARK ACCESS SPUR in the overmap law
         exists for - "carves a desert-only driveway to the nearest street for
         isolated cells the relay can't reach, never touches built content" - so
         this pass crosses anything, and the desert crossing IS the spur. It runs
         last and only for cells that would otherwise be sealed, so it never
         takes a shortcut through somebody's plot that a built relay could have
         served properly. */
      if(!found){
        var seen3={}; seen3[key(x,y)]=1;
        var q3=[{x:x,y:y,path:[]}], h3=0;

          var cur3=q3[h3++];
          if(cur3.path.length>16) continue;              // a spur is a driveway, not a highway
          for(var t=0;t<4;t++){
            var e3=DIRS[t][0], ax=cur3.x+DIRS[t][1], ay=cur3.y+DIRS[t][2], ak=key(ax,ay);
            if(seen3[ak])continue; var ac=m.at(ax,ay); if(!ac)continue;
            seen3[ak]=1;
            var hop3={fromX:cur3.x,fromY:cur3.y,edge:e3,toX:ax,toY:ay};
            var np3={x:ax,y:ay,path:cur3.path.concat([hop3])};
            if(touches(ax,ay)){ found=np3; break; }

        addEdge(key(hop.toX,hop.toY),OPP[hop.edge]);

    var out={}; for(var k in extra) out[k]=Object.keys(extra[k]); return out;
  }

  // COSMETIC CONNECT (7/22/26, from the 7/21 Vegas-urbanism research thread — real Sun Belt
  // subdivisions don't fully interconnect: Summerlin's model is loop/cul-de-sac streets with
  // only the OCCASIONAL deliberate through-connector between adjacent tracts, for privacy and
  // lot yield, not full-mesh streets). Unlike buildLandlockConnect (mandatory — a landlocked
  // cell MUST reach a street somehow), this is a LOW-probability optional bonus applied ONLY
  // between two suburb-family cells that ALREADY independently touch a real street: some
  // adjacent subdivisions get a real through-connector between them, most don't, matching how
  // an actual neighborhood reads from the air (mostly walled-off tracts, the occasional
  // deliberate cut-through). Deterministic per (seed via coords), so it's reproducible.
  var COSMETIC_CONNECT_CHANCE=0.25;
  function cosmeticChance(x,y,dx,dy){
    var h=((x*2246822519)^(y*3266489917)^((dx+2)*668265263)^((dy+2)*374761393))>>>0;
    h=Math.imul(h^h>>>15,2246822507); h=Math.imul(h^h>>>13,3266489909);
    return ((h^h>>>16)>>>0)/4294967296;

  function buildCosmeticConnect(m){
    var N=m.n, extra={}, key=function(x,y){return x+','+y;}, touchesCache={};
    function isBuilt(d){ return !!DISTGEN[d]; }
    function touches(x,y){ var k=key(x,y); if(k in touchesCache)return touchesCache[k];
      return touchesCache[k]=rawStreetEdges(m,x,y).length>0; }
    function addEdge(k,e){ (extra[k]=extra[k]||{})[e]=1; }
    var PAIRS=[['S',0,1],['E',1,0]], OPP={N:'S',S:'N',E:'W',W:'E'};  // each unordered pair visited once
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var cell=m.at(x,y); if(!cell||!isBuilt(cell.district)||!SUBURB_FAMILY[cell.district])continue;
      if(!touches(x,y))continue;                          // only street-fronting cells get the cosmetic knob
      for(var i=0;i<PAIRS.length;i++){
        var e=PAIRS[i][0], nx=x+PAIRS[i][1], ny=y+PAIRS[i][2];
        var nc=m.at(nx,ny); if(!nc||!SUBURB_FAMILY[nc.district]||!touches(nx,ny))continue;
        if(cosmeticChance(x,y,PAIRS[i][1],PAIRS[i][2])<COSMETIC_CONNECT_CHANCE){

    }
    var out={}; for(var k in extra) out[k]=Object.keys(extra[k]); return out;
  }

  // ENTRANCE SIDE (7/26): which wall the interior's street door gets cut into.
  // It used to be hardcoded 'S' for every building in the valley, so a store
  // whose only real access is the north aisle still got its door on a blind
  // south wall backed against a fence — the interior contradicted the exterior
  // it is supposed to match. Now the side is READ OFF THE PLOT: score each of
  // the four sides by the exterior tiles actually lying against it, a declared
  // PORTAL tile (the dossier's own door) outranking plain walkable ground, and
  // ties broken S>E>W>N — the same primary-street ordering the STREET-AWARE /
  // DRIVABLE ACCESS LAW uses everywhere else. Pure geometry over the generated
  // plot: no canon invented, nothing placed.
  var SIDE_ORDER=['S','E','W','N'];
  function entranceSide(f,probe){
    // probe(x,y) -> {solid:bool, portal:bool} for an EXTERIOR tile, or null off-plot

      S:function(cb){for(var x=f.x;x<f.x+f.w;x++)cb(x,f.y+f.h);},
      N:function(cb){for(var x=f.x;x<f.x+f.w;x++)cb(x,f.y-1);},
      W:function(cb){for(var y=f.y;y<f.y+f.h;y++)cb(f.x-1,y);},
      E:function(cb){for(var y=f.y;y<f.y+f.h;y++)cb(f.x+f.w,y);}

      var side=SIDE_ORDER[i],score=0;
      strips[side](function(x,y){ var p=probe(x,y); if(!p)return;

    }
    return bestScore>0?best:'S';         // walled in on all four sides: fall back to canon south
  }

  // build archetype -> interior zone (the floorplan's room grammar)
  var ZONE = {civic:'civic', bigbox:'retail', institutional:'institutional',
    industrial:'warehouse', utility:'office', landmark:'landmark',
    green:'default', water:'default', rail:'default', extraction:'default'};
  // cell-types that are a building footprint we can put an interior inside
  var FOOTPRINT = {building_pad:1, storefront_pad:1, shed_pad:1};

  // connected-component bounding boxes of footprint cells on a block grid
  function footprints(block){
    var grid=block.grid, H=block.H, W=block.W, seen={}, out=[];
    var is=function(x,y){return x>=0&&y>=0&&x<W&&y<H&&grid[y][x]&&FOOTPRINT[grid[y][x].g];};
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      if(!is(x,y)||seen[x+','+y])continue;

        if(px<x0)x0=px; if(py<y0)y0=py; if(px>x1)x1=px; if(py>y1)y1=py;

    }

  // LOCATION QUERY (7/24/26): the missing link between "the world is real" and
  // anything actually FINDING something in it. Quests reference districts only
  // as narrative flavor today ("tie faction leaders to their district") with
  // zero binding to a real coordinate; the master loop's territory AI has real
  // adjacency now but no way to ask "which district is a courthouse"; nothing
  // anywhere can answer "nearest police station from here." Cheap (w.at() only,
  // never w.plot() — no content generates just to answer a location query) and
  // predicate-based so it's content-agnostic: it names WHERE things are, never
  // WHICH quest/faction/agent cares, same separation MECHANISM-MINE draws
  // everywhere else in this engine.
  function findDistricts(m,predicate){
    var N=m.n, out=[];

  function world(seed){
    seed=(seed>>>0)||1;

      var mand=buildLandlockConnect(m), cosmetic=buildCosmeticConnect(m), out={};
      for(var k in mand) out[k]=mand[k].slice();

        cosmetic[k2].forEach(function(e){set[e]=1;}); out[k2]=Object.keys(set); }

       plot costs ~190 KB, so walking the valley climbed toward ~1.8 GB and the phone
       died long before the far side. The mobile render contract has a memory clause
       and this was the thing that would break it.

       go, and a released cell costs nothing to get back because the world is
       DETERMINISTIC — regenerating it yields the identical grid, which the gate

        var links=rl.all;

    for (var d2 = -TILE; d2 < TILE; d2 += 14) { cx.beginPath(); cx.moveTo(d2, 0); cx.lineTo(d2 + TILE, TILE); cx.stroke(); }
    cx.fillStyle = 'rgba(0,0,0,0.55)'; cx.fillRect(6, 6, Math.min(116, d.length * 7 + 8), 14);
    cx.fillStyle = '#c79a3f'; cx.font = '10px ui-monospace,monospace'; cx.fillText(String(d).toUpperCase(), 10, 16);
    return 'reserved';
  }

  /* ------------------------------------------------------------------------
     THE WHOLE VALLEY, one flat image at 1 pixel per cell. A phone draws this and
     scales it up; the MAP tab draws the same tones cell by cell. Same numbers,
     same order, one function.
     ---------------------------------------------------------------------- */
  function paintValley(world, cx, n) {
    n = n || (world && world.n) || 0;
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      cx.fillStyle = toneOf(world, x, y);
      cx.fillRect(x, y, 1, 1);
    }
    return n;
  }

  /* ------------------------------------------------------------------------
     PINS. Handed the placements the quest manager already made, this groups them
     by cell so a stack of quests on one tile reads as a stack instead of three
     pins drawn on top of each other. It DECIDES NOTHING: a quest with no
     placement produces no pin and is counted as unplaced, because inventing a
     location is the one thing the map must never do.
     ---------------------------------------------------------------------- */
  function pinsFrom(placements, isOpen) {
    var byCell = {}, out = [], unplaced = 0;
    (placements || []).forEach(function (p) {
      if (!p || p.x == null || p.y == null) { unplaced++; return; }
      if (isOpen && !isOpen(p.questId)) return;
      var k = p.x + ',' + p.y;
      if (!byCell[k]) { byCell[k] = { x: p.x, y: p.y, quests: [], channels: {} }; out.push(byCell[k]); }
      byCell[k].quests.push(p.questId);
      byCell[k].channels[p.channel || 'feed'] = 1;
    });
    out.sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });
    out.forEach(function (c) { c.count = c.quests.length; c.channel = c.channels.inperson ? 'inperson' : 'feed'; });
    return { pins: out, unplaced: unplaced, cells: out.length,
             total: out.reduce(function (s, c) { return s + c.count; }, 0) };
  }

  var API = { TILE: TILE, FILL: FILL, ROADCOL: ROADCOL, ROAD: ROAD, TERRAIN: TERRAIN,
              FABRIC: FABRIC, VOID: VOID, UNBUILT: UNBUILT,
              toneOf: toneOf, describe: describe, paintCell: paintCell,

</script>
<script>

// ===== MAP TAB — the valley aerial, live, read-only =====
// ONE VALLEY (7/26/26, WORLD lane). This was 1337 while the game itself boots
// bohemia_loop.js on the text seed 'bohemia' — two different valleys, so the map
// Paolo explored was never the map the phone plays, and a quest cast to X29 Y77
// pointed at a tile that only existed in the other world. The seed below IS the
// engine's own hashSeed('bohemia'), computed by the engine at build time (see
// SEED_NOTE in tools/bohemia_map_tab.py) and baked as a fixed literal so the map
// stays reproducible. Change the game's seed text and rerun the tool; never
// hand-type a number here.
var SEED = 2691674296;
var W = BohemiaWorld.world(SEED);
var N = W.n;

// district-type -> the global its generator module exported (matches DISTGEN in bohemia_world.js)
var MODMAP = {
  suburb:'BohemiaSuburb', gated:'BohemiaSuburb', estate:'BohemiaSuburb', apartment:'BohemiaApartment',
  commercial:'BohemiaCommercial', industrial:'BohemiaIndustrial', medical:'BohemiaMedical',
  solar:'BohemiaSolar', park:'BohemiaPark', wash:'BohemiaWash', cemetery:'BohemiaCemetery',
  drivein:'BohemiaDrivein', golf:'BohemiaGolf', stadium:'BohemiaStadium', truckstop:'BohemiaTruckstop',
  school:'BohemiaSchool', firestation:'BohemiaFirestation', swapmeet:'BohemiaSwapmeet',
  storage:'BohemiaStorage', watertreat:'BohemiaWatertreat', boneyard:'BohemiaBoneyard',
  policestation:'BohemiaPolicestation', library:'BohemiaLibrary', landfill:'BohemiaLandfill',
  railyard:'BohemiaRailyard', substation:'BohemiaSubstation', chapel:'BohemiaChapel',
  courthouse:'BohemiaCourthouse', jail:'BohemiaJail', farm:'BohemiaFarm', downtown:'BohemiaDowntown',
  trailer:'BohemiaTrailer', warehouse:'BohemiaWarehouse', waterpark:'BohemiaWaterpark', mall:'BohemiaMall',
  cityhall:'BohemiaCityhall', battery:'BohemiaBattery', terminal:'BohemiaTerminal', arterial:'BohemiaArterial', freeway:'BohemiaFreeway', desert:'BohemiaDesert', mountain:'BohemiaMountain', water:'BohemiaWater', airport:'BohemiaAirfield', airbase:'BohemiaAirfield'
};
function modOf(dist){ var n = MODMAP[dist]; return n ? window[n] : null; }

// THE ONE MAP (Paolo 7/27): these tables used to be a SECOND COPY, pasted here
// from tools/bohemia_aerial.js with a comment admitting it. Copies drift, and this
// exact class of drift already put the MAP tab on a different valley from the game
// for months. They now come from engine/bohemia_valleymap.js, which is the one copy
// the phone's map app reads too. Law: laws/BOHEMIA_ADDENDUM_ONE_MAP_7_27_26.md
var VM = BohemiaValleyMap;
var FILL = VM.FILL, ROADCOL = VM.ROADCOL, ROAD = VM.ROAD, TERRAIN = VM.TERRAIN, FABRIC = VM.FABRIC;

function rng(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1103515245+12345)>>>0; return s/4294967296; }; }
function seedOf(ox,oy){ return ((ox*73856093)^(oy*19349663))>>>0; }

// ---- per-cell render, cached at NATIVE 128x128 tile resolution (1 tile = 1 canvas px) ----
var cellCache = {};
function renderCell(ox, oy){
  var key = ox+','+oy;
  var hit = cellCache[key]; if (hit) return hit;
  var cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
  // the SHARED painter — the same pixels the phone's map app draws for this cell
  VM.paintCell(W, ox, oy, cv.getContext('2d'));
  cellCache[key] = cv; return cv;
}

// ---- pan / zoom / tap-to-inspect (same pointer/wheel pattern as the CITY tab) ----
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var HUD = document.getElementById('hud');
// ZMIN low enough to see the WHOLE valley at once (N=96) — Paolo 7/21: "if I zoom out a lot it
// make me feel good about the different views." Below FAR_ZOOM there's no legible per-tile
// detail anyway, so we skip the per-cell canvas entirely and paint a flat, honest tone
// (road / terrain / reserved-landmark / built city fabric) straight onto the main canvas — cheap
// enough to pan the entire valley smoothly, and it reads as a clean minimap, not a muddy blur.
var px = N / 2, py = N / 2, Z = 48, ZMIN = 3, ZMAX = 128, FAR_ZOOM = 16;

function draw(){
  var w = cv.width, h = cv.height;
  ctx.fillStyle = '#0d0b08'; ctx.fillRect(0, 0, w, h);
  var far = Z < FAR_ZOOM;
  ctx.imageSmoothingEnabled = far;
  var x0 = Math.max(0, Math.floor(px - w / Z / 2)), x1 = Math.min(N - 1, Math.ceil(px + w / Z / 2));
  var y0 = Math.max(0, Math.floor(py - h / Z / 2)), y1 = Math.min(N - 1, Math.ceil(py + h / Z / 2));
  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
    var sx = Math.round((x - px) * Z + w / 2), sy = Math.round((y - py) * Z + h / 2), zc = Math.ceil(Z);
    if (far) {
      ctx.fillStyle = VM.toneOf(W, x, y); ctx.fillRect(sx, sy, zc, zc);
    } else {
      var bmp = renderCell(x, y);
      ctx.drawImage(bmp, sx, sy, zc, zc);
    }
  }
  if (highlightMatches) {
    ctx.fillStyle = '#f0cd78'; ctx.strokeStyle = '#1a1610'; ctx.lineWidth = 1;
    var r = Math.max(3, Math.min(7, Z * 0.18));
    for (var hi = 0; hi < highlightMatches.length; hi++) {
      var hm = highlightMatches[hi];
      var hsx = (hm.x - px) * Z + w / 2 + Z / 2, hsy = (hm.y - py) * Z + h / 2 + Z / 2;
      if (hsx < -r || hsx > w + r || hsy < -r || hsy > h + r) continue;
      ctx.beginPath(); ctx.arc(hsx, hsy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
  if (sel) {
    ctx.strokeStyle = '#f0cd78'; ctx.lineWidth = 2;
    ctx.strokeRect(Math.round((sel[0] - px) * Z + w / 2), Math.round((sel[1] - py) * Z + h / 2), Math.ceil(Z), Math.ceil(Z));
  }
}
function resize(){ cv.width = cv.clientWidth; cv.height = cv.clientHeight; draw(); }
window.addEventListener('resize', resize);

var sel = null;
var highlightMatches = null, highlightLabel = '';
function refreshHUD(){
  if (!sel) {
    HUD.textContent = highlightMatches
      ? highlightMatches.length + ' ' + highlightLabel + ' shown on the map — drag/zoom to look, tap the map to clear.'
      : 'The valley, live — every district rendered by its own real generator. Drag to pan, wheel/pinch to zoom, tap a cell to inspect it.';
    return;
  }
  var c = W.at(sel[0], sel[1]);
  if (!c) { HUD.textContent = '(' + sel[0] + ',' + sel[1] + ') off the map'; return; }
  var mod = modOf(c.district);
  var desc = mod && mod.notes && mod.notes.summary ? mod.notes.summary :
    (ROAD[c.district] ? 'a mile arterial / freeway — the street grid' :
     TERRAIN[c.district] ? 'undeveloped terrain, no street access needed' :
     'a bespoke landmark type — reserved, not yet in the auto-factory');
  var tail = highlightMatches ? '  ·  ' + highlightMatches.length + ' ' + highlightLabel + ' shown' : '';
  HUD.textContent = '(' + sel[0] + ',' + sel[1] + ') ' + c.district.toUpperCase() + ' — ' + desc + tail;
}

var down = false, sx0 = 0, sy0 = 0, spx = 0, spy = 0, moved = 0;
cv.addEventListener('pointerdown', function(e){ down = true; sx0 = e.clientX; sy0 = e.clientY; spx = px; spy = py; moved = 0; cv.setPointerCapture(e.pointerId); if (findPanel.style.display === 'block') findPanel.style.display = 'none'; });
cv.addEventListener('pointermove', function(e){ if (!down) return; var dx = e.clientX - sx0, dy = e.clientY - sy0; moved += Math.abs(dx) + Math.abs(dy); px = spx - dx / Z; py = spy - dy / Z; draw(); });
cv.addEventListener('pointerup', function(e){
  down = false;
  if (moved < 6) {
    var w = cv.width, h = cv.height;
    var wx = Math.floor(px + (e.offsetX - w / 2) / Z), wy = Math.floor(py + (e.offsetY - h / 2) / Z);
    sel = [wx, wy]; highlightMatches = null; refreshHUD(); draw();
  }
});
cv.addEventListener('wheel', function(e){ e.preventDefault(); var f = e.deltaY < 0 ? 1.15 : 1 / 1.15; Z = Math.max(ZMIN, Math.min(ZMAX, Z * f)); draw(); }, {passive: false});
var pinchD = null;
cv.addEventListener('touchmove', function(e){
  if (e.touches.length === 2) {
    e.preventDefault();
    var dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    var d = Math.hypot(dx, dy);
    if (pinchD) Z = Math.max(ZMIN, Math.min(ZMAX, Z * (d / pinchD)));
    pinchD = d; draw();
  }
}, {passive: false});
cv.addEventListener('touchend', function(){ pinchD = null; });

resize(); refreshHUD(); draw();

// ---- FIND (7/24/26): the first live consumer of world().districtsOfType/
// nearestDistrictOfType — read-only, matches the MAP tab's own tier (never
// build/demolish, just find and look). Lists every district TYPE that
// actually exists in this valley (queried once, not guessed), tap one to
// jump the camera to the nearest instance from wherever you're currently
// looking. Proves the location-query API on the real surface, not just a gate.
var findBtn = document.getElementById('findbtn'), findPanel = document.getElementById('findpanel');
var TYPE_LABEL = {
  suburb:'Suburb', gated:'Gated Suburb', estate:'Estate', apartment:'Apartment Complex',
  commercial:'Commercial', industrial:'Industrial', medical:'Hospital', solar:'Solar Farm',
  park:'Park', wash:'Flood Wash', cemetery:'Cemetery', drivein:'Drive-In', golf:'Golf Course',
  stadium:'Stadium', truckstop:'Truck Stop', school:'School', firestation:'Fire Station',
  swapmeet:'Swap Meet', storage:'Self-Storage', watertreat:'Water Treatment', boneyard:'Salvage Yard',
  policestation:'Police Station', library:'Library', landfill:'Landfill', railyard:'Railyard',
  substation:'Substation', chapel:'Church', courthouse:'Courthouse', jail:'Jail', farm:'Farm',
  downtown:'Downtown', trailer:'Trailer Park', warehouse:'Warehouse', waterpark:'Water Park',
  mall:'Mall', cityhall:'City Hall', battery:'Battery Storage', terminal:'Transit Terminal'
};
/* THE GROUND ITSELF IS FINDABLE (7/26). Terrain and roads are real generated ground
   now, and they are the biggest things in the valley, so FIND lists them alongside the
   districts. They are SURFACES, so they come from surfaceCellsOfType, not districtsOfType. */
var SURFACE_LABEL = { mountain:'Mountains', desert:'Open Desert', water:'The Lake',
                      arterial:'Mile Road', freeway:'Freeway' };
function buildFindList(){
  var present = [];
  for (var stype in SURFACE_LABEL) {
    var sn = W.surfaceCellsOfType(stype).length;
    if (sn > 0) present.push({type:stype, label:SURFACE_LABEL[stype], n:sn, surface:true});
  }
  for (var type in MODMAP) {
    var n = W.districtsOfType(type).length;
    if (n > 0) present.push({type:type, label:TYPE_LABEL[type] || type, n:n});
  }
  present.sort(function(a,b){ return a.label < b.label ? -1 : a.label > b.label ? 1 : 0; });
  findPanel.innerHTML = '';
  present.forEach(function(item){
    var row = document.createElement('div');
    row.className = 'finditem';
    row.textContent = item.label + '  ·  ' + item.n;
    row.addEventListener('pointerup', function(){
      var nearest = item.surface ? W.nearestSurfaceOfType(px, py, item.type)
                                 : W.nearestDistrictOfType(px, py, item.type);
      highlightMatches = item.surface ? W.surfaceCellsOfType(item.type)
                                      : W.districtsOfType(item.type);
      highlightLabel = item.label;
      if (nearest) { px = nearest.x; py = nearest.y; sel = [nearest.x, nearest.y]; }
      findPanel.style.display = 'none';
      refreshHUD(); draw();
    });
    findPanel.appendChild(row);
  });
}
findBtn.addEventListener('pointerup', function(e){
  e.stopPropagation();
  var open = findPanel.style.display === 'block';
  if (open) { findPanel.style.display = 'none'; return; }
  if (!findPanel.childElementCount) buildFindList();
  findPanel.style.display = 'block';
});

</script>

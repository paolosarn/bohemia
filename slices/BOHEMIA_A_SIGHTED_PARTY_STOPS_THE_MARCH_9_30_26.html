<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The March Stops</title>
<style>
:root{--bg:#0b0d0c;--ink:#cfd6cc;--dim:#6f7a70;--red:#d8352a;--amber:#d9a441;--ok:#7fb069;--line:#1d2320}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}h1{font-size:20px;letter-spacing:.08em;margin:6px 0 2px;text-transform:uppercase}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.flip{display:flex;gap:8px;margin:10px 0}.flip button,.bar button{flex:1;padding:13px 4px;background:#141816;color:var(--ink);border:1px solid var(--line);font:inherit;letter-spacing:.08em}
.flip button.on{border-color:var(--red);color:#fff;background:#1c1210}
.map{position:relative;height:300px;border:1px solid var(--line);background:linear-gradient(#0f1210,#0c0e0d);overflow:hidden}
.road{position:absolute;left:0;right:0;top:140px;height:22px;background:#171b18;border-top:1px dashed #2b322d;border-bottom:1px dashed #2b322d}
.me{position:absolute;top:143px;width:16px;height:16px;background:var(--ok);transform:translateX(-8px)}
.foe{position:absolute;top:141px;width:18px;height:18px;background:var(--red);transform:translateX(-9px);opacity:.9}
.sight{position:absolute;top:120px;height:62px;border:1px dashed #44503f;pointer-events:none}
.foe.seen{outline:2px solid var(--red);outline-offset:4px;animation:p .5s steps(2) infinite}@keyframes p{50%{outline-color:transparent}}
.state{margin-top:10px;padding:8px 10px;border-left:3px solid var(--line);min-height:40px;font-size:13px}.state.stop{border-color:var(--red);color:#f0908a}
.bar{display:flex;gap:8px;margin-top:8px}.bar button:disabled{opacity:.35}
.note{color:var(--dim);font-size:11px;margin-top:12px}
</style></head><body><div class="wrap">
<h1>The march stops</h1>
<div class="sub">MODS, from KEEP list. Draft of a default, not in the game. Battle Brothers players install a mod so the march stops when a party comes into view. Here it is the default. Press MARCH.</div>
<div class="flip"><button id="on" class="on">STOPS ON SIGHT</button><button id="off">KEEPS WALKING</button></div>
<div class="map" id="map"><div class="road"></div><div class="sight" id="sight"></div><div class="me" id="me"></div><div class="foe" id="foe"></div></div>
<div class="state" id="state">Waiting.</div>
<div class="bar"><button id="go">MARCH</button><button id="wait" disabled>WAIT</button><button id="on2" disabled>GO ON</button></div>
<div class="note" id="note"></div></div>
<script>
var W,me=20,foeX=0,sightR=110,stopMode=true,running=false,stopped=false,ticks=0,timer=null,hit=false;
var $=function(i){return document.getElementById(i);};
function size(){W=$('map').clientWidth;foeX=W-70;draw();}
function draw(){$('me').style.left=me+'px';$('foe').style.left=foeX+'px';$('sight').style.left=(me-4)+'px';$('sight').style.width=(sightR+8)+'px';
  $('foe').className='foe'+(foeX-me<=sightR?' seen':'');}
function say(t,c){$('state').textContent=t;$('state').className='state'+(c?' '+c:'');}
function reset(){clearInterval(timer);running=false;stopped=false;hit=false;me=20;$('go').disabled=false;$('wait').disabled=true;$('on2').disabled=true;size();say('Waiting.');$('note').textContent='';}
/* one step every beat: 120 BPM is 500 ms */
function step(){
  if(stopped)return;
  if(foeX-me<=sightR&&stopMode){stopped=true;say('A PARTY IS IN SIGHT. The march stopped by itself, before they saw you. WAIT lets them pass, GO ON keeps walking.','stop');
    $('wait').disabled=false;$('on2').disabled=false;return;}
  me+=20;ticks++;
  if(foeX-me<=20){clearInterval(timer);running=false;hit=true;say(stopMode?'You walked into them.':'You never saw them coming. You walked into them.','stop');
    $('note').textContent='Without the stop, the player finds out when it is too late. That is why it is the most named mod.';draw();return;}
  draw();
}
$('go').onclick=function(){reset();running=true;$('go').disabled=true;say('Marching. One step a beat.');timer=setInterval(step,500);};
$('wait').onclick=function(){if(!stopped)return;stopped=false;$('wait').disabled=true;$('on2').disabled=true;
  clearInterval(timer);var n=0;say('You wait. The party passes on.');
  var t=setInterval(function(){foeX-=14;draw();if(++n>=6||foeX<0){clearInterval(t);foeX=-40;say('They are gone. The road is clear. Press MARCH to walk on.');$('go').disabled=false;me=me;running=false;$('note').textContent='Waiting costs time, never a fight you did not choose.';}},250);};
$('on2').onclick=function(){if(!stopped)return;stopped=false;sightR=0;say('You go on. You chose it with your eyes open.');$('wait').disabled=true;$('on2').disabled=true;};
function mode(m){stopMode=m;sightR=110;$('on').className=m?'on':'';$('off').className=m?'':'on';reset();}
$('on').onclick=function(){mode(true);};$('off').onclick=function(){mode(false);};
window.onresize=size;size();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Company</title>
<!-- ============================================================================
     THE COMPANY SCREEN  (RUN TWO, row [the roster screen], 10/9/26; REBUILT by UI 10/25/26, row [the company screen,
     Battle Brothers simple], rule 172, carrying [a dismiss button], rule 171; one lane owns the screen from here)

     Paolo 10/25: 'find screenshots of how Battle Brothers' company menu works, because they really simplify how easy it
     can look... you're over complicating it, it's really hard to navigate your equipment, the levelling up... and then we
     need to improve upon that.' And: 'there's not a dismiss button, bro, what if I want to dismiss people.'
     Battle Brothers' screen (records/BOHEMIA_PAOLO_THE_COMPANY_SCREEN_AS_SIMPLE_AS_BATTLE_BROTHERS_10_25_26.md, recall
     until Grok ask 41 lands): one man at a time, everything about him in one place, the stash always beside him, one
     click to equip with the comparison before it, the level-up its own short moment.

     ONE SCREEN, MEASURED (tools/bohemia_ui_company_screen_count.js; the 10/25 screen on his phone: 132 things open, 169
     with a man picked, 2.3 screens tall, the stranger's path 11 taps and 2 scrolls and no dismiss):
     - THE LINE IS THE ROSTER STRIP: FRONT and BACK, nine places each, every man once, his face where he stands (rule
       147(b)); drag a face to move him; a man with a level waiting wears Battle Brothers' plus.
     - TAP A MAN AND THE SCREEN IS HIM: his 3D body in his gear with the slots around it (HEAD, MAIN HAND, BODY on one
       side, ACCESSORY, OFF HAND, AMMO on the other), his two bag slots under him, his eight numbers as icons
       (UI's stat icons), his name, trade, level, wage and XP on one line. A swipe across him is the next man.
     - THE STASH BESIDE HIM, every piece with its one number, green when it beats what he wears; tabs ALL, WEAPONS,
       ARMOUR and SORT. ONE TAP SHOWS THE COMPARISON (on the slot it would go in and in the one line), THE SECOND TAP
       PUTS IT ON and his old one goes back to the stash. Tap his slot and the stash is cut to what fits it; tap the
       slot again and it comes off. On a computer the comparison is under the mouse and a right-click puts it on
       (Battle Brothers' own), Tab/D and A step through the men, Escape takes back the last tap.
     - THE LEVEL-UP IS ITS OWN SHORT MOMENT: a man with a level waiting shows his eight numbers as the picks, each with
       what it rolled on his stars; three taps, RAISE THEM; then the PERK tab opens itself and one tap takes the perk.
     - DISMISS on him, one confirm, never on YOU: his gear back to the stash, his name off the wage bill (he goes in
       the map's bohemia.walked.v1 with dismissed:true, the list the bill, the fight, the marker and the roster count
       already read), he walks off the map's marker, and the phone's feed says it.

     HOW THE GAME PLUGS IT IN: engine/bohemia_crew_door.js frames this page and posts {type:'BOHEMIA_ROSTER_OPEN', company,
     roster, field, origin, day, select}. It posts back {type:'BOHEMIA_ROSTER', act:'formation'|'equip'|'bag'|'raise'|
     'perk'|'dismiss'|'done', ...}. Every change is kept the moment it happens, and the fight gets it
     (__WHO_YOU_HIRE_FIGHTS__). Gates: gates/the_company_screen_battle_brothers_simple_gate.js and RUN TWO's roster gates.
     ============================================================================ -->
<style>
:root{--bg:#120e0a;--plate:#2a2119;--plate2:#1c1611;--ink:#e9dcc4;--dim:#a8977c;--gold:#d9a85a;--line:#3a2f24;--up:#8fd16a;--dn:#e07a5f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:max(6px,env(safe-area-inset-top)) 12px 6px;background:var(--plate2);border-bottom:1px solid var(--line)}
#bar .t{flex:1;font-weight:700;letter-spacing:1px;font-size:12px}
#done{min-width:72px;min-height:44px;background:var(--plate);border:1px solid var(--line);border-radius:6px;font-weight:700}
#cols{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"strip" "man" "said" "stash";padding:0 12px 12px;gap:4px}
/* THE ROSTER STRIP: the line, nine places a row, every man his face */
#strip{grid-area:strip;margin:0 -6px}
#lines{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:4px;row-gap:3px;margin-top:6px}
.ln{font-size:9px;letter-spacing:.5px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
/* every man a full thumb (--cw, 44 points on a phone): nine 44s do not sit across 390, so an EMPTY place in the line is
   narrower and takes what is left; the places keep their order (where a man stands is where he fights); a row of nine
   men is the one case that shrinks them */
.line{--cw:46px;display:flex;gap:2px;min-width:0}   /* 46 with its edge: the face inside is 44 */
.cell.full{flex:0 1 var(--cw);min-width:0}
.cell:not(.full){flex:1 1 14px;min-width:0}
.cell{height:var(--cw);background:#16110c;border:1px solid var(--line);border-radius:3px;position:relative;touch-action:none;overflow:hidden}
.cell.full{background:linear-gradient(#2e241a,#1d1610);border-color:#4a3b2c}
.cell.sel{outline:2px solid var(--gold);outline-offset:-1px}
.cell.over{outline:2px dashed var(--gold)}
.cell canvas.head{position:absolute;left:50%;top:0;height:100%;width:auto;aspect-ratio:1;transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
.cell b{position:absolute;left:0;right:0;bottom:0;font-size:7px;line-height:9px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden}
.cell i.up{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:7px;background:var(--gold);color:#120c06;font:700 11px/13px ui-monospace,monospace;text-align:center;font-style:normal;pointer-events:none}
.cell.laid{border-color:#6e2a20}
.cell.laid canvas.head{filter:grayscale(.8) brightness(.7)}
.cell i.days{position:absolute;top:1px;right:1px;padding:0 2px;background:#5a1c12;color:#fbe9dc;font:700 8px/11px ui-monospace,monospace;font-style:normal;pointer-events:none}
#hurtrow{display:none;grid-template-columns:auto 1fr;column-gap:4px;align-items:center;margin-top:3px}
#hurtrow.on{display:grid}
#hurt.line{justify-content:flex-start}
/* HIM */
#man{grid-area:man;touch-action:pan-y}
#card{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--plate2);position:relative}
.who{display:flex;align-items:flex-start;gap:8px}
.who .id{flex:1;min-width:0}
.nm{color:var(--gold);font-weight:700;letter-spacing:1px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--dim);font-size:10px;letter-spacing:.3px}
.xpbar{height:5px;margin-top:3px;background:#16110c;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.trait{font-size:10px;color:#d9c8a6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pain{font-size:10px;font-style:italic;color:#d9c8a6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dismiss,#letgo,#keep{min-height:44px;padding:0 10px;background:#22130f;color:#e8b4a2;border:1px solid #6e2a20;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.8px;flex:0 0 auto}
.ask{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.ask b{font-size:10px;color:#e8b4a2;letter-spacing:.5px;text-align:right}
.ask .row{display:flex;gap:4px}
#letgo{background:#5a1c12;color:#f8e0d0}
#keep{background:var(--plate);color:var(--ink);border-color:var(--line)}
/* the paper doll: his body in the middle, the slots around it, the two bag slots under him */
.doll{display:grid;grid-template-columns:62px 1fr 62px;gap:4px;margin-top:6px;align-items:start}
.doll .side{display:flex;flex-direction:column;gap:4px}
.doll .mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.rbody,.face.big{width:72px;height:124px;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 92%,rgba(0,0,0,.45) 0 22%,transparent 23%);touch-action:pan-y;cursor:pointer}
.gslot{position:relative;height:56px;border:1px dashed var(--line);border-radius:3px;padding:2px;font-size:8px;text-align:center;touch-action:none;background:#16110c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;overflow:hidden}
.gslot.full{border-style:solid;background:linear-gradient(#2e241a,#1d1610)}
.gslot>i{position:absolute;top:1px;left:2px;right:2px;font-style:normal;color:var(--dim);font-size:7px;letter-spacing:.3px;text-align:left;white-space:nowrap;overflow:hidden}
.gslot img.pk{height:22px;width:auto;max-width:90%;object-fit:contain;image-rendering:pixelated;margin-top:6px}
.gslot canvas,.gslot .bm-icon{width:26px;height:26px;image-rendering:pixelated;margin-top:6px}
.gslot b.v{font-size:9px;font-weight:700;color:var(--ink);letter-spacing:.2px;line-height:1}
.gslot b.arm{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.2px;line-height:1}
.gslot b.arm.rd{color:var(--ink)}
.gslot.pick,.gslot.cmp{outline:2px solid var(--gold);outline-offset:-1px}
.gslot.over{outline:2px dashed var(--gold)}
.gslot em.d{position:absolute;right:2px;bottom:1px;font-style:normal;font-size:9px;font-weight:700}
.gslot.both{opacity:.55;border-style:solid}
.gslot img.ghost,.gslot canvas.ghost{opacity:.6;filter:grayscale(1)}
.gslot.flat{cursor:default}
.bagrow{display:grid;grid-template-columns:52px 52px;gap:4px}
.bagrow .gslot{height:48px}
.up{color:var(--up)} .dn{color:var(--dn)}
/* his numbers: eight icons and eight numbers */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:6px}
.stats>div{display:flex;align-items:center;gap:3px;min-height:30px;white-space:nowrap;padding:2px 4px;background:#16110c;border:1px solid var(--line);border-radius:3px;font-size:12px;font-weight:700}
.stats>div>span:first-child{display:inline-flex;align-items:center;font-size:0}
.stats .stars{color:var(--gold);letter-spacing:-1px;font-size:9px}
.gain{color:var(--up);font-size:10px}
.stats .worn{font-size:10px;margin-left:3px}   /* RUN TWO __THE_SHOP_SAYS_WHAT_IT_DOES__: the gear's part of the number */
/* the level-up moment: the numbers are the picks */
.levelup{margin-top:6px}
.levelup>b{display:block;color:var(--gold);font-size:11px;letter-spacing:1px;margin-bottom:4px}
.lugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.lugrid button{position:relative;min-height:44px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:3px;align-items:center;background:#16110c;border:1px solid var(--line);border-radius:3px;padding:2px 4px;text-align:left}
.lugrid button>span:first-child{grid-row:1 / 3;display:inline-flex;align-items:center;font-size:0}
.lugrid button .v{font-size:12px;font-weight:700;white-space:nowrap}
.lugrid button .v b{color:var(--up);font-size:12px;margin-left:2px}
.lugrid button small{font-size:7px;letter-spacing:.2px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lugrid button i{position:absolute;top:1px;right:2px;font-style:normal;color:var(--gold);font-size:7px;letter-spacing:-1px}
.lugrid button.on{border-color:var(--gold);background:linear-gradient(#5a4320,#3a2b16)}
.pick{display:block;width:100%;min-height:44px;margin-top:4px;background:linear-gradient(#5a4320,#3a2b16);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-weight:700;letter-spacing:1px}
.pick:disabled{opacity:.55}
.hurtbox{margin-top:6px;padding:4px 6px;border:1px solid #6e2a20;border-radius:4px;background:#22130f;font-size:10px}
.hurtbox b{color:var(--dn);letter-spacing:1px}
.hurtbox i{display:block;font-style:normal;color:var(--dim)}
.perks{margin-top:6px;font-size:10px;color:var(--dim)}
/* the one line: what happened, or the comparison before the second tap */
#said{grid-area:said;height:44px;overflow:hidden;font-size:10px;line-height:1.35;color:var(--dim);padding:2px 2px 0}   /* a fixed three lines: the comparison under a mouse never moves the stash out from under it */
#said b{color:var(--ink)} #said b.up{color:var(--up)} #said b.dn{color:var(--dn)}
/* THE STASH */
#stash{grid-area:stash}
#tabs{display:flex;gap:3px;align-items:center}
#tabs .n{flex:1;font-size:9px;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
#tabs button{min-height:44px;padding:0 8px;text-align:left;background:var(--plate);border:1px solid var(--line);border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px}
#tabs button.on{border-color:var(--gold);color:var(--gold)}
#tabs button.perk{background:linear-gradient(#5a4320,#3a2b16);color:var(--gold);border-color:var(--gold)}
#bag{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-top:4px;max-height:40vh;overflow-y:auto;align-content:start}
#bag .slot{position:relative;height:54px;background:linear-gradient(#2e241a,#1d1610);border:1px solid #4a3b2c;border-radius:3px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:pointer}
#bag .slot canvas,#bag .slot img,#bag .slot .bm-icon{width:30px;height:30px;image-rendering:pixelated;pointer-events:none}
#bag .slot b{font-size:10px;font-weight:700;line-height:1;pointer-events:none}
#bag .slot.sel{outline:2px solid var(--gold);outline-offset:-1px}
#bag .slot.off{border-style:dashed;color:var(--dim);font-size:9px}
#bag .none{grid-column:1/-1;color:var(--dim);font-size:10px;padding:6px 2px}
.plist{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.plist button{min-height:44px;background:#1d1610;border:1px solid var(--line);border-radius:3px;font-size:10px;text-align:left;padding:3px 5px}
.plist button i{display:block;font-style:normal;color:var(--dim);font-size:8px}
#ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85;display:none;padding:4px 6px;background:#2e241a;border:1px solid var(--gold);border-radius:3px;font-size:10px}
canvas[data-face=fresh]{image-rendering:auto}   /* the fresh portrait is a render: a 128 shown at 44 css px scales smooth, never nearest (RUN TWO 10/18) */
/* A PHONE ON ITS SIDE, A TABLET, A COMPUTER: Battle Brothers' own shape, him on the left, the stash on the right, the
   line along the bottom; the cells grow to a thumb and a half */
@media (min-width:700px){
  #cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"man stash" "man said" "strip strip";grid-template-rows:auto 1fr auto;align-items:start;column-gap:14px}   /* the comparison line under the stash, beside the piece the mouse is on */
  #strip{margin:0}
  #bag{max-height:none;grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
  .line{--cw:52px}
}
@media (min-width:1100px){
  #cols{grid-template-columns:minmax(0,560px) minmax(0,560px);justify-content:center;padding:16px 24px;column-gap:24px;row-gap:10px}
  #strip{justify-self:center;width:min(100%,760px)} .line{--cw:72px} .cell b{font-size:9px;line-height:11px}
  html body .nm{font-size:20px} html body .sub,html body .trait,html body .pain{font-size:13px} html body .gslot>i{font-size:10px} html body .gslot b.v,html body .gslot b.arm{font-size:13px}
  html body #said{font-size:13px;height:56px} html body #tabs button{font-size:13px;min-height:44px} html body #tabs .n{font-size:12px} html body #bag .slot b{font-size:13px}
  html body .lugrid button{min-height:52px} html body .lugrid button small{font-size:10px} html body .lugrid button .v,html body .lugrid button .v b{font-size:16px} html body .levelup>b{font-size:14px}
  html body .stats>div{font-size:17px} html body #bar .t{font-size:15px}
  html body .plist button{font-size:13px} html body .plist button i{font-size:11px} html body #dismiss,html body #letgo,html body #keep{font-size:13px;min-height:44px}
  .doll{grid-template-columns:76px 1fr 76px} .gslot{height:72px} .bagrow{grid-template-columns:64px 64px} .bagrow .gslot{height:64px}
  .rbody,.face.big{width:144px;height:248px}
  .stats>div{min-height:36px;font-size:14px}
  #bag .slot{height:64px}
}
</style>
</head>
<body>
<div id="bar"><span class="t" id="title">YOUR COMPANY</span><button id="done">DONE</button></div>
<div id="cols">
<div id="strip">
<div id="lines"><div class="ln">FRONT</div><div class="line" id="front"></div><div class="ln">BACK</div><div class="line" id="back"></div></div>
<div id="hurtrow"><div class="ln" id="hurth">LAID UP</div><div class="line" id="hurt"></div></div>
</div>
<div id="man"><div id="card"></div></div>
<div id="said"></div>
<div id="stash"><div id="tabs"></div><div id="bag"></div></div>
</div>
<div id="ghost"></div>
<script src="../engine/bohemia_roster.js"></script>
<script src="../engine/bohemia_people_mix.js"></script>  <!-- RUN TWO [no two people alike]: a hired man is one of the valley's rolled people, his own body and face -->
<script src="../engine/bohemia_crew_faces.js"></script>
<script src="../engine/bohemia_rig_bodies.js"></script>  <!-- RUN TWO [the 3D models on your screens]: his whole body, the model his face came from -->
<script src="../engine/bohemia_idles.js"></script>  <!-- __EVERYBODY_IDLES__ (ANIMATION, rule 130(a)): the man on his card breathes and idles -->
<script src="../engine/bohemia_long_injury.js"></script>
<script src="../engine/bohemia_bag_sort.js"></script>
<script src="../engine/bohemia_camp.js"></script>
<script src="../engine/bohemia_wages.js"></script>  <!-- RUN TWO [money teaches]: a hired man's night is his food and his pay -->  <!-- RUN TWO [the camp and the retinue]: the stash grows with the cart -->
<script src="bohemia_ui_materials.js"></script>
<script>
(function(){
'use strict';
var C = window.BohemiaRoster, N = C.SLOTS_PER_ROW, BAG_SLOTS = (window.BohemiaCamp ? BohemiaCamp.stashSlots() : 36),   /* RUN TWO __THE_CAMP__: 36, and 12 a step of the cart */
    BAGKEY = 'bohemia.bag.v1', FKEY = 'bohemia.formation.v1';
var S = {crew:[], bag:[], front:[], back:[], sel:0, standalone:(window.parent===window), sheets:{}, tab:'all', cmp:null, pick:null, ask:null};
var GLYPH = {weapon:'⚔', body:'⛨', head:'∩', shield:'▣'};
function post(act, o){ var m = {type:'BOHEMIA_ROSTER', act:act}; for(var k in (o||{})) m[k] = o[k];
  window.__rosterLog = (window.__rosterLog||[]); window.__rosterLog.push(m);
  if(!S.standalone) try{ window.parent.postMessage(m,'*'); }catch(e){} }
/* THE WARDROBE MAKES A SOUND NOW (row [the soundscape], 10/9). 'equip' ("CLOTHES GO ON") has
   been an approved, frozen bank event since this lane's first SFX batch -- its own why already
   said "the wardrobe is a whole system that never made a sound" -- and nothing on this screen
   ever posted it. Zero new content, same precedent as the clinic's door: a ratio or a wire, never
   a new recipe, over an already-judged sound. */
function sfx(ev){ window.__rosterLog = (window.__rosterLog||[]); window.__rosterLog.push({type:'BOHEMIA_SFX', act:'sfx', ev:ev});
  if(!S.standalone) try{ window.parent.postMessage({type:'BOHEMIA_SFX', ev:ev},'*'); }catch(e){} }
/* the one line: a sentence, or (the comparison) a few words with the numbers in ink */
function say(t, html){ var el = document.getElementById('said'); if(html) el.innerHTML = t; else el.textContent = t; }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function saveBag(){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.bag)); }catch(e){} post('bag', {bag:S.bag.slice()}); }
/* CLIMBING: what each man has earned, kept by name until the game's save holds it */
var CKEY = 'bohemia.climb.v1';
function saveClimb(){ var o = {}; S.crew.forEach(function(m){ o[m.name] = {xp:m.xp, level:m.level, points:m.points||0, perks:m.perks.slice(), stats:m.stats, gear:m.gear, hurt:m.hurt||null, mark:m.mark||null, dead:!!m.dead, rolls:m.rolls||[]}; });
  try{ localStorage.setItem(CKEY, JSON.stringify(o)); }catch(e){} handOver(); }   /* __WHO_YOU_HIRE_FIGHTS__: what he wears is the fight's too */
function loadClimb(){ var o = {}; try{ o = JSON.parse(localStorage.getItem(CKEY)||'{}') || {}; }catch(e){}
  S.crew.forEach(function(m){ var c = o[m.name]; if(!c) return; m.xp = c.xp; m.level = c.level; m.points = c.points; m.perks = c.perks || []; if(c.stats) m.stats = c.stats; if(c.gear) m.gear = c.gear; m.hurt = c.hurt || null; m.mark = c.mark || null; m.dead = !!c.dead; m.rolls = Array.isArray(c.rolls) ? c.rolls : []; }); }
/* the fight's recap hands each man his XP (COMBAT counts it the Battle Brothers way); he climbs here */
function afterFight(rows){
  var ups = [];
  var hurt = [];
  (rows||[]).forEach(function(r){ var m = S.crew.filter(function(x){ return x.name === r.name; })[0]; if(!m) return;
    if(r.dead && !m.main){ m.dead = true; hurt.push(m.name + ' is dead'); return; }
    /* STRUCK DOWN AND LIVED (COMBAT [struck down]): laid up the fight's days, and the wiki's permanent mark for good */
    if(r.down && !r.main && r.injury){ m.hurt = {days:r.laidUpDays || r.injury.days || 0, of:r.laidUpDays || r.injury.days || 0};

  say(doer(m, 'takes') + ' the ' + shortName(it) + (off ? (s === 'main' ? ' in both hands; the ' + shortName(off) + ' goes in the stash.' : '; the ' + shortName(off) + ' takes both hands, so it goes in the stash.') : old ? '; the ' + shortName(old) + ' goes in the stash.' : '.')); draw();   /* RUN TWO rule 194(c): the weapon takes both hands, never the shield */
}
/* __TWO_HANDS__: a man kept from before this rule with a long gun and a shield puts the shield in the stash */
function twoHandsKept(){
  var moved = 0;
  S.crew.forEach(function(m){ if(m.gear && m.gear.main && m.gear.off && C.twoHanded(m.gear.main) && S.bag.length < BAG_SLOTS){ S.bag.push(m.gear.off); m.gear.off = null; moved++; } });
  if(moved){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.bag)); }catch(e){} }
  return moved;
}
function unequip(slot){
  var m = S.crew[S.sel], it = m && m.gear[slot]; if(!it) return;
  if(S.bag.length >= BAG_SLOTS){ say('Your stash is full.'); return; }
  if(it.keep == null) it.keep = true;   /* worn, so chosen: never sold as junk unless let go */
  m.gear[slot] = null; S.bag.push(it); S.cmp = null; S.pick = null; saveBag(); keep(); post('equip', {who:m.idx, name:m.name, slot:slot, item:null}); sfx('equip'); say(doer(m, 'puts') + ' down the ' + shortName(it) + '. It is in the stash.'); draw();
}
/* ==== __A_DISMISS_BUTTON__ (rule 171). BATTLE BROTHERS' WAY FIRST (the wiki's Mood page, reference/library/grok/wiki/CORE_WIKITEXT.md:
   'dismissed men without compensation' is one of the common moods that sink the rest of the company; the brother's gear stays
   with the company, recall, Grok ask 41 to verify). OURS: the batteries are the money and this company has no mood yet, so
   there is no payout to choose and nobody sulks; he takes his pay and walks. His gear comes back to the stash (what does not
   fit in the 36 walks off on him, and the line says so); he is gone from the line, the fight's hand-over and the roster's
   count; he goes in the map's walked list (bohemia.walked.v1, dismissed:true), the very list the nightly bill (crewCount), the
   fight's door (__WHO_YOU_HIRE_FIGHTS__), the enemy's sizing (rosterMen) and the map's marker (mapCrewLooks) already read,
   so his wage stops and he walks off the map; the phone's feed says it. ==== */
function gearOf(m){ var out = []; ['main','off','body','head','bag1','bag2'].forEach(function(s){ if(m.gear && m.gear[s]) out.push({slot:s, it:m.gear[s]}); }); return out; }
function upFind(name){ try{ for(var w = window, k = 0; w && k < 6; k++){ if(w[name]) return w[name];
  var f = w.document && w.document.getElementById('cityFrame'); if(f && f.contentWindow && f.contentWindow[name]) return f.contentWindow[name];
  if(w.parent === w) break; w = w.parent; } }catch(e){} return null; }
function dismiss(i){
  var m = S.crew[i]; if(!m || m.main) return false;
  var back = [], kept = [], at = order().indexOf(i);
  gearOf(m).forEach(function(g){ if(S.bag.length < BAG_SLOTS){ if(g.it.keep == null) g.it.keep = true; S.bag.push(g.it); back.push(g.it); } else kept.push(g.it); m.gear[g.slot] = null; });
  /* the line loses him, and every index past his moves down one */
  ['front','back'].forEach(function(row){ S[row] = S[row].map(function(ix){ return ix == null || ix === i ? null : ix > i ? ix - 1 : ix; }); });
  S.crew.splice(i, 1);
  try{ var w = JSON.parse(localStorage.getItem(WKEY) || '[]') || []; w.push({ name: m.name, look: m.look || null, hired: !!m.hired, dismissed: true, day: S.today || null });
    localStorage.setItem(WKEY, JSON.stringify(w)); }catch(e){}
  var o = order(); S.sel = o.length ? o[Math.min(o.length - 1, Math.max(0, at))] : 0;   /* the man who stood next to him in the strip */
  S.ask = null; S.cmp = null; S.pick = null; S.raise = null; S.talked = null;
  saveBag(); saveClimb(); saveForm();
  var words = m.name + ' took his pay and walked.' + (back.length ? ' His ' + back.map(shortName).join(', ') + (back.length === 1 ? ' is' : ' are') + ' in the stash.' : '') + (kept.length ? ' The stash was full: he walked off in his ' + kept.map(shortName).join(', ') + '.' : '');   /* draft:true */
  post('dismiss', {name:m.name, back:back.map(function(x){ return x.id; }), kept:kept.map(function(x){ return x.id; })}); sfx('equip');
  try{ var F = upFind('BOHEMIA_FEED'); if(F && F.push) F.push({ who: '@thecrew', txt: m.name + ' is out. You let him go. ' + (back.length ? 'Left his gear.' : 'Took nothing.'), kind: 'mine', draft: true }); }catch(e){}   /* the phone's feed says it (draft:true) */
  try{ var D = upFind('DAY'); if(D && D.happened) D.happened(m.name + ' was let go.', 'crew'); }catch(e){}
  window.__DISMISSED = { name: m.name, back: back.length, kept: kept.length, n: (window.__DISMISSED ? window.__DISMISSED.n : 0) + 1 };
  say(words); draw(); return true;
}
/* ==== end __A_DISMISS_BUTTON__ ==== */
function moveMan(fromRow, fromI, toRow, toI){
  if(fromRow === 'hurt'){ var hm = S.crew[fromI]; say(hm.name + ' is laid up ' + hm.hurt.days + ' more days. He cannot stand in the line.'); post('refused', {who:hm.name}); return; }
  var a = S[fromRow][fromI], b = S[toRow][toI];
  S[toRow][toI] = a; S[fromRow][fromI] = b; saveForm(); say(S.crew[a].name + ' moves to the ' + toRow + '.'); draw();
}
/* ONE DRAG for everything: a man between the lines, an item from the stash onto a slot */
(function(){
  var src = null, x0 = 0, y0 = 0, ghost = document.getElementById('ghost'), over = null;
  document.addEventListener('pointerdown', function(e){
    var d = e.target.closest('[data-drag]'); S.dragged = false; if(!d) return;
    src = d.dataset.drag; x0 = e.clientX; y0 = e.clientY;
  });
  document.addEventListener('pointermove', function(e){
    if(!src) return;
    if(!S.dragged && Math.hypot(e.clientX-x0, e.clientY-y0) > 8){ S.dragged = true; ghost.style.display = 'block';
      var p = src.split(':'); ghost.textContent = p[0]==='man' ? S.crew[p[1] === 'hurt' ? +p[2] : S[p[1]][+p[2]]].name : p[0]==='bag' ? S.bag[+p[1]].name : S.crew[S.sel].gear[p[1]].name; }
    if(!S.dragged) return;
    e.preventDefault();
    ghost.style.left = (e.clientX + 8) + 'px'; ghost.style.top = (e.clientY + 8) + 'px';
    var t = document.elementFromPoint(e.clientX, e.clientY), dz = t && t.closest('[data-drop]');
    if(over && over !== dz) over.classList.remove('over'); over = dz; if(dz) dz.classList.add('over');
  }, {passive:false});
  document.addEventListener('pointerup', function(e){
    if(!src) return; var s = src; src = null; ghost.style.display = 'none'; if(over) over.classList.remove('over');
    var p = s.split(':');
    if(!S.dragged){
      if(p[0] === 'man') choose(p[1] === 'hurt' ? +p[2] : S[p[1]][+p[2]]);
      return;
    }
    var t = document.elementFromPoint(e.clientX, e.clientY), dz = t && t.closest('[data-drop]');
    setTimeout(function(){ S.dragged = false; }, 0);
    if(!dz) return; var q = dz.dataset.drop.split(':');
    if(p[0] === 'man' && (q[0] === 'front' || q[0] === 'back')) moveMan(p[1], +p[2], q[0], +q[1]);
    else if(p[0] === 'bag' && q[0] === 'gear') equip(+p[1], q[1]);
  });
})();
/* A SWIPE ACROSS HIM IS THE NEXT MAN (rule 172(b), better than Battle Brothers on a phone): a finger that crosses him sideways
   more than 48 points, and more sideways than down, steps through the line in the strip's order */
var SWIPE = { x: 0, y: 0, on: false, moved: false };
(function(){
  var man = document.getElementById('man');
  man.addEventListener('pointerdown', function(e){ if(e.target.closest('[data-drag],button')) return; SWIPE.on = true; SWIPE.moved = false; SWIPE.x = e.clientX; SWIPE.y = e.clientY; });
  man.addEventListener('pointerup', function(e){ if(!SWIPE.on) return; SWIPE.on = false; var dx = e.clientX - SWIPE.x, dy = e.clientY - SWIPE.y;
    if(Math.abs(dx) > 48 && Math.abs(dx) > 1.6 * Math.abs(dy)){ SWIPE.moved = true; setTimeout(function(){ SWIPE.moved = false; }, 0); step(dx < 0 ? 1 : -1); } });
  man.addEventListener('pointercancel', function(){ SWIPE.on = false; });
})();
/* Escape (and the keys): take back the last tap: the dismiss question, the comparison, the cut stash; else nothing */
function cancel(){ if(S.ask != null){ S.ask = null; say(''); draw(); return true; } if(S.cmp != null || S.pick){ S.cmp = null; S.pick = null; say(''); draw(); return true; } return false; }
var LOADED = false;
/* __THE_SPOILS__ (RUN TWO [the end of the fight, the loot, the stash], 10/24): a man comes in at the level his origin or the post
   gave him, with that level's XP and the perk points it earned unspent (Battle Brothers' recruits: a level a point to 11), so
   the spoils' LEVEL UP and this screen's climb agree; measured, manOf dealt every man level 1 and the fight a level-3 man.
   His kept climb (loadClimb) still wins once he has one. */
function startLevel(m, lv){ lv = lv | 0; if(m && lv > 1){ m.level = lv; m.xp = C.xpFor(lv);
  var pp = (C.data.xp && C.data.xp.per_level && C.data.xp.per_level.value.perk_points) || 1; m.points = Math.min(lv, 11) - 1; m.points *= pp; } return m; }
/* __EVERY_ORIGIN_STARTS_LIKE_ITSELF__ (RUN TWO's block in UI's file, NOTE on UI's board; rule 184(a), Paolo 10/25: 'a gilded god with
   three stars in the stats that actually matter... it's just one regular guy'): a man his origin rolled at the door
   (engine/bohemia_origin_start.js, once a game) walks in as rolled: his body with his door levels taken, his stars, his kit
   and his bag, the perks his levels bought (only the points he has not spent wait) */
function rolledIn(man, m){
  if(m.stats) man.stats = Object.assign({}, m.stats); if(m.stars) man.stars = Object.assign({}, m.stars);
  if(Array.isArray(m.perks)){ man.perks = m.perks.slice(); man.points = Math.max(0, (man.points | 0) - m.perks.length); }
  var g = m.gear || {}, bag = Array.isArray(g.bag) ? g.bag : [];
  if(m.gear) man.gear = {main:C.itemOf('weapon', g.main), off:C.itemOf('shield', g.off), body:C.itemOf('body', g.body), head:C.itemOf('head', g.head),
    bag1:C.itemOf('weapon', bag[0]) || C.itemOf('shield', bag[0]), bag2:C.itemOf('weapon', bag[1]) || C.itemOf('shield', bag[1])};
  if(m.line) man.pain = m.line;   /* the line his origin gives him (draft:true) */
  man.rolled = true; return man;
}
function open(o){
  o = o || {};
  if(!LOADED){ S.pending = o; return; }   /* the door's post can come before the company's files are read: it waits for them */
  if(Array.isArray(o.crew) && o.crew.length) S.crew = o.crew;
  /* THE COMPANY THE ORIGIN BUILT (TUNING's change 9, rule 133): the men the origin gave him, each in the place in the line the
     fight gives him (ours.crew's place, his origin's background and level over it: the fight's own mapping), so a crew of
     three is three on this screen too; his roster cap with it */
  else if(Array.isArray(o.company) && o.company.length && !S.fromOrigin){
    /* __THE_DOORS_COMPANY_WINS__ (RUN TWO [every origin starts like itself], 10/25, NOTE on UI's board): MEASURED on the computer, the
       page's own boot opened before the crew door's post (its files read before the frame's load event), built the default twelve
       and saved their climb; the origin's men then arrived and loadClimb put the default YOU's level-1 numbers and rags back on
       the Lone Wolf (level 1, a pistol and a padded vest under his three stars). The default's own save is undone first */
    if(S.defaultCrew){ try{ if(S.climbBefore == null) localStorage.removeItem(CKEY); else localStorage.setItem(CKEY, S.climbBefore); }catch(e){} S.defaultCrew = false; }
    var defs = (C.data.ours && C.data.ours.crew && C.data.ours.crew.value) || [];
    S.crew = o.company.map(function(m, i){ var d = Object.assign({}, defs[i % Math.max(1, defs.length)] || {});
      if(i >= defs.length){ d.main = false; d.name = (d.name || 'MAN') + ' II'; }
      if(m && m.background) d.background = m.background; if(m && m.level) d.level = m.level;
      var man = startLevel(C.manOf(d, i), d.level); if(m && m.rolled) rolledIn(man, m); return man; });
    S.fromOrigin = true; if(o.roster) S.cap = o.roster;
  }
  if(o.field) S.field = o.field;   /* EYES [eyes: one company number]: how many fight, named, beside how many he can have */
  else if(!S.crew.length){ try{ S.climbBefore = localStorage.getItem(CKEY); }catch(e){} S.crew = C.startingCrew(); S.defaultCrew = true; }   /* __THE_DOORS_COMPANY_WINS__: what the climb was before the default's save */
  /* men hired at the posts (the settlement screen keeps them here until the game's save does):
     same stats and stars as on the card he was hired from */
  try{ var hired = JSON.parse(localStorage.getItem('bohemia.hired.v1') || '[]');
    hired.forEach(function(def){ if(S.crew.some(function(m){ return m.name === def.name && m.hired; })) return;
      var m = startLevel(C.manOf(def, S.crew.length), def.level); m.hired = true; if(def.stats) m.stats = def.stats; if(def.stars) m.stars = def.stars; if(def.look) m.look = def.look;
      if(def.trait) m.trait = def.trait; if(Array.isArray(def.traits)) m.traits = def.traits.slice();   /* the trait he was hired with (RUN TWO [the trait before you hire], 10/24) */
      var g = def.gear || {};   /* he walks in wearing what he held at the post (RUN TWO [the hire shows the whole man], 10/24) */
      m.gear = {main:C.itemOf('weapon', g.main), off:C.itemOf('shield', g.off), body:C.itemOf('body', g.body), head:C.itemOf('head', g.head)};   /* RUN TWO __THE_RARE_MAN_AT_THE_POST__: a rare man walks in with his shield and helm on (an ordinary hire carries none: null as before) */
      if(def.line) m.pain = def.line; S.crew.push(m); }); }catch(e){}
  /* __WHO_YOU_HIRE_FIGHTS__: a man who walked (or was let go) is not on this screen */
  var wn = walkedNames(); if(wn.length) S.crew = S.crew.filter(function(m){ return m.main || wn.indexOf(m.name) < 0; });
  if(o.origin) S.origin = o.origin;
  if(o.day) S.today = o.day | 0;   /* the map's day, from the door: a laid-up man's days count by it */
  if(Array.isArray(o.bag)) S.bag = o.bag.slice(0, BAG_SLOTS); else { try{ var b = JSON.parse(localStorage.getItem(BAGKEY)||'[]'); if(Array.isArray(b)) S.bag = b; }catch(e){} }
  var f = o.formation; if(!f){ try{ f = JSON.parse(localStorage.getItem(FKEY)||'null'); }catch(e){} }
  if(f && f.front && f.front.length === N && f.back && f.back.length === N && [].concat(f.front, f.back).every(function(i){ return i == null || S.crew[i]; })){ S.front = f.front.slice(); S.back = f.back.slice(); }
  else defaultForm();
  loadClimb(); benchHurt(); twoHandsKept();
  /* a man who joined since the line was set takes the first empty slot, front first */
  S.crew.forEach(function(m, i){ if(laid(m) || m.dead || S.front.indexOf(i) >= 0 || S.back.indexOf(i) >= 0) return;   /* never a laid-up or dead man (he stood in the line AND the laid-up strip, measured 10/18) */
    var j = S.front.indexOf(null); if(j >= 0){ S.front[j] = i; return; } j = S.back.indexOf(null); if(j >= 0) S.back[j] = i; });
  S.sel = S.front.concat(S.back).filter(function(i){ return i != null; })[0] || 0;
  S.ready = true; draw();
  afterTheFights(); healToToday();
  if(o.select){ var si = S.crew.findIndex(function(m){ return m.name === o.select; }); if(si >= 0) choose(si); }   /* __THE_SPOILS__: open on the man he tapped */
  keep();   /* __WHO_YOU_HIRE_FIGHTS__: the screen he sees is the company the fight gets, from the first look */
  if(Array.isArray(o.fight)) afterFight(o.fight);
}
window.BohemiaRosterScreen = {open:open, state:S, formation:formation, afterFight:afterFight, company:company, dayPassed:dayPassed, dismiss:dismiss, choose:choose, step:step, cancel:cancel, order:order};
window.addEventListener('message', function(e){ var d = e.data||{}; if(d.type === 'BOHEMIA_ROSTER_OPEN') open(d); if(d.type === 'BOHEMIA_FIGHT_OVER' && Array.isArray(d.crew)) afterFight(d.crew); if(d.type === 'BOHEMIA_DAY') dayPassed(d.days || 1); });
document.getElementById('done').addEventListener('click', function(){ post('done', {formation:formation(), company:company()}); say('Back to it.'); });
C.load().then(function(){ LOADED = true; open(S.pending || {}); }).catch(function(err){ say('The company did not load.'); });
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Company</title>
<!-- ============================================================================
     THE ROSTER SCREEN  (RUN TWO, row [the roster screen], 10/9/26)

     Paolo, the sixth votes: formation and gear are the depth. Rule 69: every character from the
     bank. Grok GROK_75: the layout before the fight is the formation. Battle Brothers' own screen:
     two battle lines of nine (front, back), a man's page with his stats and their stars, his gear
     slots, the stash under it.

     YOUR MEN IN TWO ROWS you can drag between; tap a man and his card opens: the face and body from
     the fight's own sheets (slices/fight_people/), name, background, level, wage, the eight stats
     with stars, his four gear slots, his perks, his one pain line. YOUR BAG (the same 36 slots the
     market fills) sits under it: drag an item onto a gear slot (or tap it) and he wears it, and what
     he wore goes back in the bag.
     ONE CREW SCREEN (RUN TWO [who you hire fights, one crew screen], 10/24, rule 147(b); his 'why is it
     showing me the crew twice?'): each man once, his face on the line; tap him and his page opens under
     the line with his four slots FILLED; tap a slot and the bag opens inside his page cut to what fits
     it; tap one and they swap, TAKE OFF empties the slot. (The 10/18 rows, WHO IS WEARING WHAT, are gone.)
     Every change is kept the moment it happens, and the fight gets it (__WHO_YOU_HIRE_FIGHTS__).

     HOW THE GAME PLUGS IT IN: frame this page and post {type:'BOHEMIA_ROSTER_OPEN', crew?, bag?,
     formation?}. It posts back {type:'BOHEMIA_ROSTER', act:'formation', formation:{front:[idx|null x9],
     back:[...]}} (exactly what COMBAT [your formation] reads), act:'equip' {who, slot, item},
     act:'bag' {bag}, act:'done'. Standalone it runs on the fight's starting crew (ours.json) and the
     bag this phone kept. Gate: gates/roster_screen_gate.js
     ============================================================================ -->
<style>
:root{--bg:#120e0a;--plate:#2a2119;--plate2:#1c1611;--ink:#e9dcc4;--dim:#a8977c;--gold:#d9a85a;--line:#3a2f24}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent;user-select:none}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--plate2);border-bottom:1px solid var(--line)}
#bar .t{flex:1;font-weight:700;letter-spacing:1px}
#sortbag{display:block;margin:0 12px 6px;min-height:44px;padding:0 14px;background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:700;letter-spacing:1px}
#done{min-width:76px;min-height:44px;background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:700}
.h{margin:12px 12px 4px;font-size:11px;letter-spacing:1px;color:var(--dim)}
#lines{overflow-x:auto;padding:0 12px 4px}
.line{display:grid;grid-template-columns:repeat(9,48px);gap:4px;margin-bottom:4px;width:max-content}
.ln{font-size:10px;color:var(--dim);margin:4px 0 2px}
.cell{width:48px;height:64px;background:#16110c;border:1px solid var(--line);border-radius:3px;position:relative;touch-action:none;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.cell.full{background:linear-gradient(#2e241a,#1d1610);border-color:#4a3b2c}
.cell.sel{border-color:var(--gold)}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.cell canvas.head{inset:auto;top:1px;left:1px;width:calc(100% - 2px);height:auto;aspect-ratio:1;border-radius:2px}
.cell b{position:absolute;left:0;right:0;bottom:1px;font-size:8px;text-align:center;pointer-events:none;color:var(--ink);text-shadow:0 1px 0 #000}
.cell.over{outline:2px solid var(--gold)}
#card{margin:8px 12px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--plate2)}
.top{display:flex;gap:10px}
.face{width:72px;height:72px;flex:0 0 72px;border:1px solid var(--line);border-radius:4px;image-rendering:pixelated;background:#0b0907}
.rbody{width:72px;height:124px;flex:0 0 72px;border:1px solid var(--line);border-radius:4px;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 92%,rgba(0,0,0,.45) 0 22%,transparent 23%),#0b0907;touch-action:manipulation;cursor:pointer}
.nm{color:var(--gold);font-weight:700;letter-spacing:1px}
.sub{color:var(--dim);font-size:11px}
.pain{margin-top:4px;font-style:italic}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:8px;font-size:11px}
.stats div{display:flex;justify-content:space-between}
.stars{color:var(--gold);letter-spacing:-1px;margin-left:4px}
.trait{font-size:11px;color:#d9c8a6;letter-spacing:.5px;margin-top:2px}
.gear{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.gslot{min-height:58px;border:1px dashed var(--line);border-radius:3px;padding:3px;font-size:9px;text-align:center;touch-action:none;background:#16110c}
.gslot.full{border-style:solid;background:linear-gradient(#2e241a,#1d1610)}
.gslot i{display:block;font-style:normal;color:var(--dim);font-size:9px}
.gslot.over{outline:2px solid var(--gold)}
.gear.bags{margin-top:4px}
.gear.bags .gslot{min-height:58px}
.gear.bags .bagh{grid-column:3 / span 2;align-self:center;font-size:9px;line-height:1.3;color:var(--dim);letter-spacing:.5px;padding:0 4px}
.hurtbox{margin-top:8px;padding:6px 8px;border:1px solid #6e2a20;border-radius:4px;background:#22130f;font-size:11px}
.hurtbox b{color:#e07a5f;letter-spacing:1px}
.hurtbox i{display:block;font-style:normal;color:var(--dim)}
.cell.laid{filter:grayscale(.8) brightness(.7);border-color:#6e2a20}
.perks{margin-top:8px;font-size:11px;color:var(--dim)}
.xpbar{height:6px;margin-top:4px;background:#16110c;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.gain{color:#8fd16a;margin-left:4px}
.pick{display:block;width:100%;min-height:44px;margin-top:6px;background:linear-gradient(#5a4320,#3a2b16);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font:inherit;font-weight:700;letter-spacing:1px}
.levelup{margin-top:8px;padding:8px;border:1px solid var(--gold);border-radius:4px;background:#1d1610}
.levelup>b{color:var(--gold);font-size:11px;letter-spacing:1px}
.lugrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.lugrid button{min-height:44px;display:flex;align-items:center;gap:6px;background:#16110c;color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;font-size:10px;padding:4px 6px;text-align:left}
.lugrid button span{flex:1}
.lugrid button b{color:#8fd16a;font-size:13px}
.lugrid button i{font-style:normal;color:var(--gold);font-size:9px}
.lugrid button.on{border-color:var(--gold);background:linear-gradient(#5a4320,#3a2b16)}
.pick:disabled{opacity:.55}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.plist button{min-height:44px;background:#1d1610;color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;font-size:10px;text-align:left;padding:4px}
.plist button i{display:block;font-style:normal;color:var(--dim);font-size:9px}
#bag{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 12px 24px}
.slot{aspect-ratio:1;min-height:44px;background:#16110c;border:1px solid var(--line);border-radius:3px;color:var(--ink);font:inherit;font-size:9px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.slot.full{background:linear-gradient(#2e241a,#1d1610);border-color:#4a3b2c}
.slot i{font-style:normal;font-size:15px;color:var(--gold);line-height:1}
canvas[data-face=fresh]{image-rendering:auto}   /* the fresh portrait is a render: a 128 shown at 44 to 72 css px scales smooth, never nearest (RUN TWO 10/18) */
/* __ONE_CREW_SCREEN__ (rule 147(b)): his four slots on his page, each with what he wears; a tap opens the bag cut to it */
.gslot{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;cursor:pointer;min-height:64px}
.gslot.pick{outline:2px solid var(--gold);outline-offset:-1px}
.gslot .gn{font-size:9px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gslot img.pk{width:auto;height:20px;max-width:90%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 1px 0 #000)}
.gslot .bm-icon,.gslot canvas{width:22px;height:22px;image-rendering:pixelated}
.gslot b.arm{display:block;font-weight:700;color:var(--gold);font-size:9px;letter-spacing:.3px;line-height:1.15;white-space:normal}
.gslot b.arm.rd{color:var(--ink);font-weight:400}
/* __TWO_HANDS__ (rule 149): the off hand under a long gun is the gun's, greyed */
.gslot.both{opacity:.55;border-style:solid}
.gslot img.ghost,.gslot canvas.ghost{opacity:.6;filter:grayscale(1)}
.gslot i.hands{display:block;font-style:normal;font-size:8px;letter-spacing:.5px;color:var(--dim)}
#picker{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--gold);border-radius:4px;background:#1a140e}
#picker .slot{width:52px;flex:0 0 52px;min-height:52px;font-size:8px;border-color:#4a3b2c}
#picker .slot.off{border-style:dashed;color:var(--dim)}
#picker .none{align-self:center;color:var(--dim);font-size:10px;padding:0 4px}
#ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85;display:none;padding:4px 6px;background:#2e241a;border:1px solid var(--gold);border-radius:3px;font-size:10px}
#said{margin:0 12px;color:var(--dim);font-size:11px;min-height:16px}
/* THE CREW SCREEN AT FOURTEEN (RUN TWO, his 10/18 'when you got one person... three... six... up to 14 people'; rule 117).
   A full company reads in one look and nothing ever scrolls sideways:
   - a phone upright cannot hold nine 44-point cells across (9 x 44 = 396 > 390), so THE LINE stands up: FRONT and BACK
     side by side, the nine places top to bottom, every man a face and his whole name; the laid-up strip wraps the same way
   - a laptop is the phone's view with room: two columns, the line and who wears what on the left, the man's card and the
     bag on the right, both at a size a person reads (the bag's slots stop growing past 64) */
.nmx{display:none}
@media (max-width:489px){
  #lines{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"lf lb" "f b";column-gap:6px;overflow:visible}
  #lines > .ln:first-child{grid-area:lf} #front{grid-area:f} #lines > .ln:nth-child(3){grid-area:lb} #back{grid-area:b}
  #front,#back{display:flex;flex-direction:column;gap:4px;width:auto}
  #hurt{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:auto}
  #front .cell,#back .cell,#hurt .cell{width:100%;height:48px}
  #front .cell canvas.head,#back .cell canvas.head,#hurt .cell canvas.head{width:44px;height:44px;top:1px;left:1px}
  #front .cell b,#back .cell b,#hurt .cell b{left:50px;right:4px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;text-align:left;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
  .nmx{display:inline;margin-right:6px}
}
@media (min-width:1100px){
  #cols{display:grid;grid-template-columns:minmax(0,640px) 440px;justify-content:center;column-gap:24px;align-items:start}
  #right{position:sticky;top:64px}
  #bag{grid-template-columns:repeat(6,minmax(44px,64px));justify-content:start}
}
</style>
</head>
<body>
<div id="bar"><span class="t" id="title">YOUR COMPANY</span><button id="done">DONE</button></div>
<div id="cols"><div id="left">
<div class="h">YOUR LINE. TAP A MAN FOR HIS GEAR. DRAG HIM TO MOVE HIM. FRONT FIGHTS, BACK SHOOTS.</div>
<div id="lines"><div class="ln">FRONT</div><div class="line" id="front"></div><div class="ln">BACK</div><div class="line" id="back"></div></div>
<div class="ln" id="hurth" style="margin:0 12px;display:none">LAID UP. HE HEALS ON THE ROAD; HE CANNOT STAND IN THE LINE.</div>
<div class="line" id="hurt" style="margin:0 12px 6px"></div>
</div><div id="right">
<div id="card"></div>
<div id="said"></div>
<div class="h" id="bagh">YOUR BAG</div>
<button id="sortbag" type="button">SORT THE BAG</button>
<div id="bag"></div>
</div></div>
<div id="ghost"></div>
<script src="../engine/bohemia_roster.js"></script>
<script src="../engine/bohemia_people_mix.js"></script>  <!-- RUN TWO [no two people alike]: a hired man is one of the valley's rolled people, his own body and face -->
<script src="../engine/bohemia_crew_faces.js"></script>
<script src="../engine/bohemia_rig_bodies.js"></script>  <!-- RUN TWO [the 3D models on your screens]: his whole body, the model his face came from -->
<script src="../engine/bohemia_idles.js"></script>  <!-- __EVERYBODY_IDLES__ (ANIMATION, rule 130(a)): the man on his card breathes and idles -->
<script src="../engine/bohemia_long_injury.js"></script>
<script src="../engine/bohemia_bag_sort.js"></script>
<script src="../engine/bohemia_camp.js"></script>
<script src="../engine/bohemia_wages.js"></script>  <!-- RUN TWO [money teaches]: a hired man's night is his food and his pay -->  <!-- RUN TWO [the camp and the retinue]: the stash grows with the cart -->
<script src="bohemia_ui_materials.js"></script>
<script>
(function(){
'use strict';
var C = window.BohemiaRoster, N = C.SLOTS_PER_ROW, BAG_SLOTS = (window.BohemiaCamp ? BohemiaCamp.stashSlots() : 36),   /* RUN TWO __THE_CAMP__: 36, and 12 a step of the cart */
    BAGKEY = 'bohemia.bag.v1', FKEY = 'bohemia.formation.v1';
var S = {crew:[], bag:[], front:[], back:[], sel:0, standalone:(window.parent===window), sheets:{}};
var GLYPH = {weapon:'⚔', body:'⛨', head:'∩', shield:'▣'};
function post(act, o){ var m = {type:'BOHEMIA_ROSTER', act:act}; for(var k in (o||{})) m[k] = o[k];
  window.__rosterLog = (window.__rosterLog||[]); window.__rosterLog.push(m);
  if(!S.standalone) try{ window.parent.postMessage(m,'*'); }catch(e){} }
/* THE WARDROBE MAKES A SOUND NOW (row [the soundscape], 10/9). 'equip' ("CLOTHES GO ON") has
   been an approved, frozen bank event since this lane's first SFX batch -- its own why already
   said "the wardrobe is a whole system that never made a sound" -- and nothing on this screen
   ever posted it. Zero new content, same precedent as the clinic's door: a ratio or a wire, never
   a new recipe, over an already-judged sound. */
function sfx(ev){ window.__rosterLog = (window.__rosterLog||[]); window.__rosterLog.push({type:'BOHEMIA_SFX', act:'sfx', ev:ev});
  if(!S.standalone) try{ window.parent.postMessage({type:'BOHEMIA_SFX', ev:ev},'*'); }catch(e){} }
function say(t){ document.getElementById('said').textContent = t; }
function saveBag(){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.bag)); }catch(e){} post('bag', {bag:S.bag.slice()}); }
/* CLIMBING: what each man has earned, kept by name until the game's save holds it */
var CKEY = 'bohemia.climb.v1';
function saveClimb(){ var o = {}; S.crew.forEach(function(m){ o[m.name] = {xp:m.xp, level:m.level, points:m.points||0, perks:m.perks.slice(), stats:m.stats, gear:m.gear, hurt:m.hurt||null, mark:m.mark||null, dead:!!m.dead, rolls:m.rolls||[]}; });
  try{ localStorage.setItem(CKEY, JSON.stringify(o)); }catch(e){} handOver(); }   /* __WHO_YOU_HIRE_FIGHTS__: what he wears is the fight's too */
function loadClimb(){ var o = {}; try{ o = JSON.parse(localStorage.getItem(CKEY)||'{}') || {}; }catch(e){}
  S.crew.forEach(function(m){ var c = o[m.name]; if(!c) return; m.xp = c.xp; m.level = c.level; m.points = c.points; m.perks = c.perks || []; if(c.stats) m.stats = c.stats; if(c.gear) m.gear = c.gear; m.hurt = c.hurt || null; m.mark = c.mark || null; m.dead = !!c.dead; m.rolls = Array.isArray(c.rolls) ? c.rolls : []; }); }
/* the fight's recap hands each man his XP (COMBAT counts it the Battle Brothers way); he climbs here */
function afterFight(rows){
  var ups = [];
  var hurt = [];
  (rows||[]).forEach(function(r){ var m = S.crew.filter(function(x){ return x.name === r.name; })[0]; if(!m) return;
    if(r.dead && !m.main){ m.dead = true; hurt.push(m.name + ' is dead'); return; }
    /* STRUCK DOWN AND LIVED (COMBAT [struck down]): laid up the fight's days, and the wiki's permanent mark for good */
    if(r.down && !r.main && r.injury){ m.hurt = {days:r.laidUpDays || r.injury.days || 0, of:r.laidUpDays || r.injury.days || 0};
      m.mark = {id:r.injury.id, name:r.injury.name, line:r.injury.line}; hurt.push(m.name + ' is laid up ' + m.hurt.days + ' days'); }
    var g = C.grant(m, r.xpGained); m.gained = {}; g.gains.forEach(function(x){ for(var k in x) m.gained[k] = (m.gained[k]||0) + x[k]; });
    if(g.to > g.from) ups.push(m.name + ' is level ' + g.to); });
  benchHurt(); saveClimb(); saveForm(); var first = S.crew.findIndex(function(m){ return ((m.rolls && m.rolls.length) || m.points > 0) && !m.dead; }); if(first >= 0) S.sel = first;
  var lh = S.crew.findIndex(function(m){ return m.hurt && m.hurt.days > 0; }); if(first < 0 && lh >= 0) S.sel = lh;
  say((hurt.length ? hurt.join('. ') + '. ' : '') + (ups.length ? ups.join('. ') + '. Pick his stats and his perk.' : 'Nobody climbed this time.')); draw(); return ups;
}
/* a laid-up or dead man leaves the line; a healed one takes the first empty slot, front first */
function laid(m){ return m && m.hurt && m.hurt.days > 0; }
function benchHurt(){
  ['front','back'].forEach(function(row){ S[row] = S[row].map(function(ix){ return ix != null && (laid(S.crew[ix]) || S.crew[ix].dead) ? null : ix; }); });
  S.crew.forEach(function(m, i){ if(laid(m) || m.dead || S.front.indexOf(i) >= 0 || S.back.indexOf(i) >= 0) return;
    var j = S.front.indexOf(null); if(j >= 0){ S.front[j] = i; return; } j = S.back.indexOf(null); if(j >= 0) S.back[j] = i; });
}
/* a day on the road: each laid-up man one day closer (PEOPLE's healDay); the mark never clears */
function dayPassed(n){
  n = n || 1; var back = [];
  S.crew.forEach(function(m){ if(!laid(m)) return; for(var k=0;k<n;k++){ var f = window.BohemiaLongInjury ? BohemiaLongInjury.healDay({days:m.hurt.days}) : {days:m.hurt.days-1}; m.hurt.days = f.days; }
    if(m.hurt.days === 0) back.push(m.name); });
  benchHurt(); saveClimb(); saveForm(); if(back.length) say(back.join(', ') + ' can stand in the line again.'); draw(); return back;
}
/* what the clinic would charge to halve his days (the settlement's [the clinic] rule, no town's trait here) */
function clinicPrice(m){ return Math.max(1, Math.round(20 * m.hurt.days * (1 + (m.level - 1) * 0.2) / 10));
}
function company(){ return C.company(S.crew.filter(function(m){ return !m.dead && !laid(m); })); }
function formation(){ return {front:S.front.slice(), back:S.back.slice()}; }
function saveForm(){ try{ localStorage.setItem(FKEY, JSON.stringify(formation())); }catch(e){} post('formation', {formation:formation()}); handOver(); }
/* ==== __WHO_YOU_HIRE_FIGHTS__ (RUN TWO [who you hire fights, one crew screen], rule 147(a), Paolo 10/24: 'I hired new people
   and put them in my crew and they were on the line, but when it was battle time they weren't there; also I bought a weapon
   and put it in my crew slot'). MEASURED: (1) the line and the gear reached the game only on DONE, and the fight never read
   them anyway (the shell handed it the origin's men: RUN's half, __WHO_YOU_HIRE_FIGHTS__ in the alpha's nfOpts); (2) a gun
   put in a man's hand was saved NOWHERE: the bag lost it, his gear lived only in this page, and the next open dealt him his
   old kit, so a bought weapon vanished. NOW EVERY CHANGE IS KEPT THE MOMENT IT HAPPENS: his gear by name (the climb file),
   and THE HAND-OVER, the men on the line in the order the fight reads them (YOU first) with the line in those men's
   numbers, the very thing the shell passes as opts.company and opts.formation. ==== */
var HKEY = 'bohemia.company.v1', LKEY = 'bohemia.company.line.v1';
function handOver(){
  if(!S.ready) return null;
  var on = S.front.concat(S.back).filter(function(i){ return i != null && S.crew[i] && !S.crew[i].dead && !laid(S.crew[i]); });
  var main = S.crew.findIndex(function(m){ return m.main; });
  var order = S.crew.map(function(m, i){ return i; }).filter(function(i){ return on.indexOf(i) >= 0; });
  if(main >= 0 && order.indexOf(main) > 0){ order.splice(order.indexOf(main), 1); order.unshift(main); }   /* YOU are the fight's first man */
  var num = {}; order.forEach(function(ci, k){ num[ci] = k; });
  var at = function(row){ return S[row].map(function(ci){ return ci != null && num[ci] != null ? num[ci] : null; }); };
  var co = C.company(order.map(function(i){ return S.crew[i]; })), line = {front:at('front'), back:at('back'), origin:S.origin || null, men:co.map(function(m){ return m.name; }),
    known: S.crew.map(function(m){ return m.name; }),   /* every man this screen knows, the dead and the benched too: the door never adds one back */
    /* a man laid up waits on the bench with the day he can stand again, so the door brings him back that day even if this
       screen is not opened (the map's day, from the door) */
    bench: S.crew.filter(function(m){ return laid(m) && !m.dead; }).map(function(m){ return {man: C.company([m])[0], until: S.today && m.hurt.day0 != null ? (m.hurt.day0 | 0) + (m.hurt.days | 0) : null}; }),
    today: S.today || null};
  try{ localStorage.setItem(HKEY, JSON.stringify(co)); localStorage.setItem(LKEY, JSON.stringify(line)); }catch(e){}
  window.__HANDOVER = {company:co, line:line, n:(window.__HANDOVER ? window.__HANDOVER.n : 0) + 1};
  return window.__HANDOVER;
}
function keep(){ saveClimb(); }

      var n2 = document.createElement('i'); n2.textContent = String(al ? String(it.nums).replace(/\s+reach \d+/, '') : it.nums).replace(/\s+2 hands/i, ''); d.appendChild(n2); d.dataset.drag = 'gear:' + sl;   /* the reach is his arm's in the fight, below; the row's own number would contradict it */
      if(al){ var ar = document.createElement('b'); ar.className = 'arm'; ar.dataset.reach = al.reach; ar.textContent = al.reach; d.appendChild(ar);
        if(al.rounds){ var rd = document.createElement('b'); rd.className = 'arm rd'; rd.textContent = al.rounds; d.appendChild(rd); } } }
    else if(sl === 'off' && both){ var gp = itemPic(m.gear.main, 22); gp.classList.remove('bm-icon'); gp.classList.add('ghost'); d.appendChild(gp); var bh = document.createElement('div'); bh.className = 'gn'; bh.textContent = 'BOTH HANDS'; d.appendChild(bh);
      d.setAttribute('aria-label', m.name + ' ' + SLOT_NAME[sl] + ': both hands on the ' + shortName(m.gear.main)); }
    else { var e = document.createElement('div'); e.textContent = '—'; d.appendChild(e); }
    if(sl === 'main' && it && C.twoHanded(it)){ var two = document.createElement('i'); two.className = 'hands'; two.textContent = 'TWO HANDS'; d.appendChild(two); }
    d.addEventListener('click', function(){ if(S.dragged) return; togglePick(S.sel, sl); });   /* the bag, cut to what fits, opens here */
    return d;
  };
  ['main','off','body','head'].forEach(function(sl){ g.appendChild(slotEl(sl)); });
  el.appendChild(g);
  /* __TWO_BAG_SLOTS__: his two bag slots, under his hands */
  var gb = document.createElement('div'); gb.className = 'gear bags'; gb.id = 'bags';
  BAG_GEAR.forEach(function(sl){ gb.appendChild(slotEl(sl)); });
  var bh = document.createElement('div'); bh.className = 'bagh'; bh.textContent = 'HIS BAG: A SECOND WEAPON OR A SHIELD, CARRIED INTO THE FIGHT'; gb.appendChild(bh);
  el.appendChild(gb);
  if(S.pick && S.pick.man === S.sel) el.appendChild(pickerFor(m, S.sel, S.pick.slot));
  if(m.mark){ var hb = document.createElement('div'); hb.className = 'hurtbox';
    var h1 = document.createElement('b'); h1.textContent = laid(m) ? 'LAID UP ' + m.hurt.days + ' OF ' + m.hurt.of + ' DAYS' : 'HEALED, BUT MARKED'; hb.appendChild(h1);
    var h2 = document.createElement('i'); h2.className = 'mark'; h2.textContent = 'FOR GOOD: ' + m.mark.name.toUpperCase() + (m.mark.line ? ', ' + m.mark.line : ''); hb.appendChild(h2);
    if(laid(m)){ var h3 = document.createElement('i'); h3.className = 'clinic'; h3.textContent = 'The clinic halves it for ' + clinicPrice(m) + ' batteries.'; hb.appendChild(h3); }
    el.appendChild(hb); }
  var pk = document.createElement('div'); pk.className = 'perks';
  pk.textContent = m.perks.length ? 'PERKS: ' + m.perks.map(C.perkName).join(', ') : 'PERKS: none yet. Level 2 picks the first one.';
  el.appendChild(pk);
  /* A PERK POINT TO SPEND: Battle Brothers' tiers, the next tier opens after each one taken */
  if(m.points > 0){
    var b = document.createElement('button'); b.className = 'pick'; b.id = 'pick';
    b.textContent = 'PICK A PERK (' + m.points + ' TO SPEND)'; el.appendChild(b);
    var pl = document.createElement('div'); pl.className = 'plist'; pl.style.display = S.picking ? 'grid' : 'none'; el.appendChild(pl);
    b.addEventListener('click', function(){ S.picking = !S.picking; pl.style.display = S.picking ? 'grid' : 'none'; });
    C.perkChoices(m).forEach(function(r){ var x = document.createElement('button'); x.dataset.perk = r.id;
      x.textContent = r.name; var i2 = document.createElement('i'); i2.textContent = r.skin; x.appendChild(i2);
      x.addEventListener('click', function(){ if(!C.takePerk(m, r.id)) return; S.picking = m.points > 0; saveClimb(); post('perk', {who:m.name, perk:r.id}); sfx('equip'); say(m.name + ' took ' + r.name + '.'); drawCard(); });
      pl.appendChild(x); });
  }
}
function drawBag(){
  var sb = document.getElementById('sortbag'); if(sb) sb.style.display = S.bag.length > 1 && window.BohemiaBagSort ? '' : 'none';
  document.getElementById('bagh').textContent = 'YOUR BAG  ' + S.bag.length + ' / ' + BAG_SLOTS + '   DRAG ONE ONTO A SLOT ABOVE, OR TAP IT AND HE PUTS IT ON';   /* EYES [the bag line], rule 150: the sentence ends */
  var el = document.getElementById('bag'); el.textContent = '';
  for(var i=0;i<BAG_SLOTS;i++){
    var it = S.bag[i], b = document.createElement('div'); b.className = 'slot' + (it ? ' full' : '');
    if(it){ var g = document.createElement('i'); g.textContent = GLYPH[it.kind] || '◆'; b.appendChild(g);
      var n = document.createElement('span'); n.textContent = it.name.replace(/^(a|an) /,'').split(' ').slice(-1)[0]; b.appendChild(n);
      b.dataset.drag = 'bag:' + i; b.setAttribute('aria-label', it.name);
      (function(ix){ b.addEventListener('click', function(){ if(!S.dragged) equip(ix); }); })(i);
      try{ if(window.BohemiaMaterials && BohemiaMaterials.itemIcon){ var ic = BohemiaMaterials.itemIcon(it, 26); b.replaceChild(ic, g); } }catch(e){}
    }
    el.appendChild(b);
  }
}
/* he wears it; what he wore goes back in the bag */
function equip(bi, slot){
  var m = S.crew[S.sel], it = S.bag[bi]; if(!m || !it) return;
  var s = slot || C.slotFor(it);
  if(slot && !fits(it, slot)){ say(BAG_GEAR.indexOf(slot) >= 0 ? 'A bag slot holds a weapon or a shield.' : 'That does not go there.'); return; }
  /* __TWO_HANDS__ (RUN TWO [two hands], rule 149): a long gun takes both hands, so the shield goes to the bag; a shield in a
     hand that holds a long gun sends the gun to the bag (Battle Brothers' way). Never past the bag's 36. */
  var freed = null;
  if(s === 'main' && C.twoHanded(it) && m.gear.off) freed = 'off';
  if(s === 'off' && m.gear.main && C.twoHanded(m.gear.main)) freed = 'main';
  var old = m.gear[s];
  if(S.bag.length - 1 + (old ? 1 : 0) + (freed ? 1 : 0) > BAG_SLOTS){ say('Your bag is full.'); return; }
  var off = freed ? m.gear[freed] : null; if(freed) m.gear[freed] = null;
  /* a piece a man has worn is one you chose: SELL THE JUNK leaves it alone unless you let it go (RUN TWO 10/25, rule 164 item 18) */
  [it, old, off].forEach(function(x){ if(x && x.keep == null) x.keep = true; });
  m.gear[s] = it; S.bag.splice(bi, 1); if(old) S.bag.push(old); if(off) S.bag.push(off);
  saveBag(); keep(); post('equip', {who:m.idx, name:m.name, slot:s, item:it}); if(off) post('equip', {who:m.idx, name:m.name, slot:freed, item:null}); sfx('equip');
  say(m.name + ' takes ' + it.name + (off ? (s === 'main' ? ' in both hands; ' : '; ') + off.name + ' goes in the bag.' : '.')); draw();
}
/* __TWO_HANDS__: a man kept from before this rule with a long gun and a shield puts the shield in the bag */
function twoHandsKept(){
  var moved = 0;
  S.crew.forEach(function(m){ if(m.gear && m.gear.main && m.gear.off && C.twoHanded(m.gear.main) && S.bag.length < BAG_SLOTS){ S.bag.push(m.gear.off); m.gear.off = null; moved++; } });
  if(moved){ try{ localStorage.setItem(BAGKEY, JSON.stringify(S.bag)); }catch(e){} }
  return moved;
}
function unequip(slot){
  var m = S.crew[S.sel], it = m && m.gear[slot]; if(!it) return;
  if(S.bag.length >= BAG_SLOTS){ say('Your bag is full.'); return; }
  if(it.keep == null) it.keep = true;   /* worn, so chosen: never sold as junk unless let go */
  m.gear[slot] = null; S.bag.push(it); saveBag(); keep(); post('equip', {who:m.idx, name:m.name, slot:slot, item:null}); sfx('equip'); say(m.name + ' puts down ' + it.name + '.'); draw();
}
function moveMan(fromRow, fromI, toRow, toI){
  if(fromRow === 'hurt'){ var hm = S.crew[fromI]; say(hm.name + ' is laid up ' + hm.hurt.days + ' more days. He cannot stand in the line.'); post('refused', {who:hm.name}); return; }
  var a = S[fromRow][fromI], b = S[toRow][toI];
  S[toRow][toI] = a; S[fromRow][fromI] = b; saveForm(); say(S.crew[a].name + ' moves to the ' + toRow + '.'); draw();
}
/* ONE DRAG for everything: a man between the lines, an item from the bag onto a gear slot */
(function(){
  var src = null, x0 = 0, y0 = 0, ghost = document.getElementById('ghost'), over = null;
  document.addEventListener('pointerdown', function(e){
    var d = e.target.closest('[data-drag]'); S.dragged = false; if(!d) return;
    src = d.dataset.drag; x0 = e.clientX; y0 = e.clientY;
  });
  document.addEventListener('pointermove', function(e){
    if(!src) return;
    if(!S.dragged && Math.hypot(e.clientX-x0, e.clientY-y0) > 8){ S.dragged = true; ghost.style.display = 'block';
      var p = src.split(':'); ghost.textContent = p[0]==='man' ? S.crew[p[1] === 'hurt' ? +p[2] : S[p[1]][+p[2]]].name : p[0]==='bag' ? S.bag[+p[1]].name : S.crew[S.sel].gear[p[1]].name; }
    if(!S.dragged) return;
    e.preventDefault();
    ghost.style.left = (e.clientX + 8) + 'px'; ghost.style.top = (e.clientY + 8) + 'px';
    var t = document.elementFromPoint(e.clientX, e.clientY), dz = t && t.closest('[data-drop]');
    if(over && over !== dz) over.classList.remove('over'); over = dz; if(dz) dz.classList.add('over');
  }, {passive:false});
  document.addEventListener('pointerup', function(e){
    if(!src) return; var s = src; src = null; ghost.style.display = 'none'; if(over) over.classList.remove('over');
    var p = s.split(':');
    if(!S.dragged){
      if(p[0] === 'man'){ var was = S.sel; S.sel = p[1] === 'hurt' ? +p[2] : S[p[1]][+p[2]]; if(S.sel !== was) S.pick = null; draw(); reveal(); }
      return;
    }
    var t = document.elementFromPoint(e.clientX, e.clientY), dz = t && t.closest('[data-drop]');
    setTimeout(function(){ S.dragged = false; }, 0);
    if(!dz) return; var q = dz.dataset.drop.split(':');
    if(p[0] === 'man' && (q[0] === 'front' || q[0] === 'back')) moveMan(p[1], +p[2], q[0], +q[1]);
    else if(p[0] === 'bag' && q[0] === 'gear') equip(+p[1], q[1]);
  });
})();
var LOADED = false;
/* __THE_SPOILS__ (RUN TWO [the end of the fight, the loot, the stash], 10/24): a man comes in at the level his origin or the post
   gave him, with that level's XP and the perk points it earned unspent (Battle Brothers' recruits: a level a point to 11), so
   the spoils' LEVEL UP and this screen's climb agree; measured, manOf dealt every man level 1 and the fight a level-3 man.
   His kept climb (loadClimb) still wins once he has one. */
function startLevel(m, lv){ lv = lv | 0; if(m && lv > 1){ m.level = lv; m.xp = C.xpFor(lv);
  var pp = (C.data.xp && C.data.xp.per_level && C.data.xp.per_level.value.perk_points) || 1; m.points = Math.min(lv, 11) - 1; m.points *= pp; } return m; }
function open(o){
  o = o || {};
  if(!LOADED){ S.pending = o; return; }   /* the door's post can come before the company's files are read: it waits for them */
  if(Array.isArray(o.crew) && o.crew.length) S.crew = o.crew;
  /* THE COMPANY THE ORIGIN BUILT (TUNING's change 9, rule 133): the men the origin gave him, each in the place in the line the
     fight gives him (ours.crew's place, his origin's background and level over it: the fight's own mapping), so a crew of
     three is three on this screen too; his roster cap with it */
  else if(Array.isArray(o.company) && o.company.length && !S.fromOrigin){
    var defs = (C.data.ours && C.data.ours.crew && C.data.ours.crew.value) || [];
    S.crew = o.company.map(function(m, i){ var d = Object.assign({}, defs[i % Math.max(1, defs.length)] || {});
      if(i >= defs.length){ d.main = false; d.name = (d.name || 'MAN') + ' II'; }
      if(m && m.background) d.background = m.background; if(m && m.level) d.level = m.level;
      return startLevel(C.manOf(d, i), d.level); });
    S.fromOrigin = true; if(o.roster) S.cap = o.roster;
  }
  if(o.field) S.field = o.field;   /* EYES [eyes: one company number]: how many fight, named, beside how many he can have */
  else if(!S.crew.length) S.crew = C.startingCrew();
  /* men hired at the posts (the settlement screen keeps them here until the game's save does):
     same stats and stars as on the card he was hired from */
  try{ var hired = JSON.parse(localStorage.getItem('bohemia.hired.v1') || '[]');
    hired.forEach(function(def){ if(S.crew.some(function(m){ return m.name === def.name && m.hired; })) return;
      var m = startLevel(C.manOf(def, S.crew.length), def.level); m.hired = true; if(def.stats) m.stats = def.stats; if(def.stars) m.stars = def.stars; if(def.look) m.look = def.look;
      if(def.trait) m.trait = def.trait; if(Array.isArray(def.traits)) m.traits = def.traits.slice();   /* the trait he was hired with (RUN TWO [the trait before you hire], 10/24) */
      var g = def.gear || {};   /* he walks in wearing what he held at the post (RUN TWO [the hire shows the whole man], 10/24) */
      m.gear = {main:C.itemOf('weapon', g.main), off:null, body:C.itemOf('body', g.body), head:null}; S.crew.push(m); }); }catch(e){}
  /* __WHO_YOU_HIRE_FIGHTS__: a man who walked is not on this screen (he stood on it, and in the fight's count, after he left) */
  var wn = walkedNames(); if(wn.length) S.crew = S.crew.filter(function(m){ return m.main || wn.indexOf(m.name) < 0; });
  if(o.origin) S.origin = o.origin;
  if(o.day) S.today = o.day | 0;   /* the map's day, from the door: a laid-up man's days count by it */
  if(Array.isArray(o.bag)) S.bag = o.bag.slice(0, BAG_SLOTS); else { try{ var b = JSON.parse(localStorage.getItem(BAGKEY)||'[]'); if(Array.isArray(b)) S.bag = b; }catch(e){} }
  var f = o.formation; if(!f){ try{ f = JSON.parse(localStorage.getItem(FKEY)||'null'); }catch(e){} }
  if(f && f.front && f.front.length === N && f.back && f.back.length === N && [].concat(f.front, f.back).every(function(i){ return i == null || S.crew[i]; })){ S.front = f.front.slice(); S.back = f.back.slice(); }
  else defaultForm();
  loadClimb(); benchHurt(); twoHandsKept();
  /* a man who joined since the line was set takes the first empty slot, front first */
  S.crew.forEach(function(m, i){ if(laid(m) || m.dead || S.front.indexOf(i) >= 0 || S.back.indexOf(i) >= 0) return;   /* never a laid-up or dead man (he stood in the line AND the laid-up strip, measured 10/18) */
    var j = S.front.indexOf(null); if(j >= 0){ S.front[j] = i; return; } j = S.back.indexOf(null); if(j >= 0) S.back[j] = i; });
  S.sel = S.front.concat(S.back).filter(function(i){ return i != null; })[0] || 0;
  S.ready = true; draw();
  afterTheFights(); healToToday();
  if(o.select){ var si = S.crew.findIndex(function(m){ return m.name === o.select; }); if(si >= 0){ S.sel = si; draw(); } }   /* __THE_SPOILS__: open on the man he tapped */
  keep();   /* __WHO_YOU_HIRE_FIGHTS__: the screen he sees is the company the fight gets, from the first look */
  if(Array.isArray(o.fight)) afterFight(o.fight);
}
window.BohemiaRosterScreen = {open:open, state:S, formation:formation, afterFight:afterFight, company:company, dayPassed:dayPassed};
window.addEventListener('message', function(e){ var d = e.data||{}; if(d.type === 'BOHEMIA_ROSTER_OPEN') open(d); if(d.type === 'BOHEMIA_FIGHT_OVER' && Array.isArray(d.crew)) afterFight(d.crew); if(d.type === 'BOHEMIA_DAY') dayPassed(d.days || 1); });
document.getElementById('sortbag').addEventListener('click', function(){ if(!window.BohemiaBagSort) return; S.bag = BohemiaBagSort.sort(S.bag); saveBag(); post('sort', {bag:S.bag.map(function(i){ return i.id; })}); say('Sorted: weapons, armour, heads, then the rest.'); draw(); });   /* RUN TWO [the bag sorts] */
document.getElementById('done').addEventListener('click', function(){ post('done', {formation:formation(), company:company()}); say('Back to it.'); });
C.load().then(function(){ LOADED = true; open(S.pending || {}); }).catch(function(err){ say('The company did not load.'); });
})();
</script>

<title>Scavenge</title>
<!-- ============================================================================
   BOHEMIA -- SCAVENGE, THE BLOCK PLAYS THE SONG: THE PAGE (SCAVENGE 2, 11/10/26, rule 444(c), ask line 570; the skeleton is
   SCAVENGE's, 11/7, rule 426(b)). PAOLO 11/10: 'the scavenge mini game needs a little more love. I feel the skeleton, I
   appreciate it, but it's not rhythm based; out of everything I want that to be the most rhythm based minigame'.
   The rules: slices/bohemia_scavenge_game.js; the dial's bands: engine/bohemia_dial.js; the gate:
   gates/scavenge_is_the_rhythm_gate.js; the record and its research: records/BOHEMIA_SCAVENGE_TWO_THE_BLOCK_PLAYS_THE_SONG_11_10_26.md.
   THE SKELETON, KEPT: THE BLOCK'S OWN BOARD, dealt and baked by the fight's own page in the mode the camp already uses
   (slices/BOHEMIA_FIGHT.html __THE_CAMP_ON_THE_BOARD__, FIGHT_OPTS.campBoard), on the options a fight on this block is handed (the
   shell's nfOpts, asked and put back). Nothing in the fight's file is changed. The crew are the men that board deals for the
   company, from their own sheets (slices/fight_rig/), at the fight's man size: the ground may zoom, the person may not. Up to six
   lit spots, one thing or nothing a spot, LEAVE any time, nothing scrolls (rule 402).
   THE RHYTHM, NEW: every spot is a short PHRASE of the song the shell is playing (its own beat, window.BOHEMIA_BEAT; its own root
   and scale, MUS.fac()), four to eight beats at 120 BPM. BEATS COME TO THE MAN: born at the thing, they reach the end of the
   dial's track and ride it to the middle in two beats; he taps as each crosses (a house: on the beat; the detector: it beeps a
   bar, he taps the bar back; the siphon: hold and let go on the beat). The dial's own bands judge every tap.
   THE BEAT IS SEEN AS WELL AS HEARD: the picture is the truth and the judge (the beads, the needle, the lamps, the whole crew
   stepping on the beat); the sounds are booked AHEAD on the audio clock so they are heard on the picture (the way to the ear
   taken off: a phone's speaker, a Bluetooth ear where the browser reports it); and THE ALLOWANCE follows the middle of his own
   taps for the lag nothing reports. Sound off, it plays the same.
   THE SOUNDS ARE STRUCK THINGS, NEVER NOISE (NO SAND): a hollow door, a boot on dirt, a steel jerrycan (a free bar's own
   partials), a bubble in a hose (Minnaert), the detector's own oscillator. No voice.
   OPENED BY: the settlement screen's lot ('Search the lot', four hours, once), which pays each find through its own lines.
   BENCH: BOHEMIA_SCAVENGE.html?bench=suburb (&seed=N, &night=1, &pkg=0..4, &left=N): a template board of that kind, no map.
   Hands back: parent.scavDone / postMessage({type:'BOHEMIA_SCAVENGE_DONE', finds:[{kind, zone, got, outcome, greedMult}], ...})
   and window.__SCAV_DONE; window.SCAV.state() for the gate.
   ============================================================================ -->
<style>
@font-face{font-family:BohemiaCasing;src:url(fonts/BohemiaCasing-Regular.woff2) format('woff2');font-display:swap}
:root{--ink:#2a2520;--paper:#ece4d0;--ember:#ff965c;--amber:#e6a84a;--plate:#261e1a;--rim:#7a6a52;--dim:#a89c84}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2219;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg,#mid,#g{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg,#mid{pointer-events:none}
#plate{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:132px;background:rgba(38,30,26,.96);
  border:2px solid var(--rim);border-radius:6px;padding:6px;font:13px/1 BohemiaCasing,ui-monospace,monospace;color:var(--paper);box-sizing:border-box}
#plate .t{background:var(--paper);color:var(--ink);padding:6px 6px 5px;font-size:15px;letter-spacing:1px;border-radius:3px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:baseline}
#plate .t b{font-weight:400;font-size:13px;min-width:1px}
#plate .t b.hot{color:#b3401c}
#plate .r{display:flex;justify-content:space-between;padding:4px 5px;margin:2px 0;border-radius:3px;background:rgba(236,228,208,.08)}
#plate .r.on{background:var(--amber);color:var(--ink)}
#plate .r.none{opacity:.35}
#plate .f{display:flex;flex-wrap:wrap;gap:3px;min-height:22px;margin:5px 0 4px}
#plate .f i{font-style:normal;font-size:10px;background:var(--paper);color:var(--ink);border-radius:2px;padding:4px 3px 3px;line-height:1}
#plate .f i.kill{background:var(--ember)}
#leave{display:block;width:100%;min-height:44px;margin-top:2px;border:0;border-radius:4px;background:rgba(236,228,208,.16);color:var(--paper);
  font:15px BohemiaCasing,ui-monospace,monospace;letter-spacing:1px}
#wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#wait b{width:14px;height:14px;border-radius:50%;background:var(--amber);opacity:.25;animation:p .5s infinite alternate}
@keyframes p{to{opacity:.9}}
</style>

<body>

</div>
<script src="../engine/bohemia_dial.js"></script>
<script src="bohemia_scavenge_game.js"></script>
<script>
(function () {
  'use strict';
  var D = window.BohemiaDial, R = window.BohemiaScavengeGame;
  /* THREE SHEETS OF GLASS (rule 400: nothing redrawn that did not change): the board, painted once a view; the lit spots and their

  var cv = document.getElementById('g'), g = cv.getContext('2d'), cvB = document.getElementById('bg'), cvM = document.getElementById('mid'), gM = cvM.getContext('2d');

    finds: [], log: [], err: null, done: null, sheets: {}, pkg: 1, bakeMs: 0, seed: 7, song: null, clk: CLK,
    cels: {}, slow: [], booked: [], gap: 0, combo: 0, best: 0, offs: [], lag: 0, lag0: 0, first: true, lat: 0, heard: 0, nextBeat: 0, tags: [], pop: null, hop: null, fade: null, hold: null,
    perf: { n: 0, work: 0, worst: 0, over20: 0, over34: 0, gap: 0 } };

  /* ------------------------------------------------------------------ the board: the fight's own dealer and bake (its camp mode) */
  function topWin() { try { if (window.top && window.top !== window && window.top.document) return window.top; } catch (e) {} return null; }
  function shellOpts(ask) {
    var T = topWin(), o = null;
    try { if (T && typeof T.nfOpts === 'function') {
      var keep = { h: T.__NF_HANDED, c: T.__NF_COND, a: T.__NF_ARENA, d: T.NF ? T.NF.day : undefined };   /* the door is asked, never walked through */
      try { o = T.nfOpts(JSON.parse(JSON.stringify(ask))); } finally { T.__NF_HANDED = keep.h; T.__NF_COND = keep.c; T.__NF_ARENA = keep.a; if (T.NF && keep.d !== undefined) T.NF.day = keep.d; } } } catch (e) { o = null; }
    if (!o) o = { district: ask.district || 'suburb', kind: ask.kind || ask.district || 'suburb', cell: ask.at ? { gx: ask.at[0], gy: ask.at[1] } : null, night: !!(ask.world && ask.world.night) };
    o = JSON.parse(JSON.stringify(o));
    if (ask.__deal != null) o.deal = ask.__deal >>> 0;
    if (ask.seed != null) o.seed = ask.seed >>> 0;
    o.keep = false; o.resume = false; o.odds = false; o.teach = false; o.deploy = false;
    return o;
  }
  /* what the board is, read off the dealt fight the moment it is dealt (before its men are cleared for the bake) */
  function readFight(cw) {
    var F = cw.eval('FIGHT'), FS = F.S, tiles = [], crew = [];
    for (var y = 0; y < FS.h; y++) { var row = []; for (var x = 0; x < FS.w; x++) {
      var c = FS.cover[y][x], pass = true, lvl = 0, roof = null; try { pass = !!F._t.passable(x, y); } catch (e) {} try { lvl = F.level(x, y) | 0; } catch (e) {}
      try { roof = typeof F.isRoof === 'function' ? !!F.isRoof(x, y) : null; } catch (e) { roof = null; }   /* the fight's own test: a house's roof, never a dune or a rise */
      var fam = null; try { var bn = typeof F.blockNameAt === 'function' ? F.blockNameAt(x, y) : null; fam = bn ? String(bn).split('.')[0] : null; } catch (e) { fam = null; }   /* the block it is cut from: built ground or land */
      row.push({ lvl: lvl, roof: roof, fam: fam, laid: !!(FS.boardDef && FS.boardDef.laid), pass: pass, terr: FS.terrain[y][x], cover: c ? (typeof c === 'string' ? c : (c.piece || c.name || 'cover')) : '' }); } tiles.push(row); }   /* the fight keeps a tile's cover as the piece's name */
    /* a board laid from the map draws its dead cars as pieces (car_kerb, car_lane), not cover: they are cars all the same */
    try { var LD = FS.boardDef && FS.boardDef.laid; if (LD && Array.isArray(LD.sprites)) LD.sprites.forEach(function (q) {
      if (!q || !/^car_/.test(q.name || '') || !q.tiles) return;   /* never a carport: that is a house */ var tx = (q.tiles[0] | 0) - (LD.ring | 0), ty = (q.tiles[1] | 0) - (LD.ring | 0);
      if (tiles[ty] && tiles[ty][tx] && !tiles[ty][tx].cover) tiles[ty][tx].cover = q.name; }); } catch (e) {}
    (FS.units || []).forEach(function (u) { if (!u || u.side !== 'you' || u.dead) return; var L = null; try { L = cw.lookOf(u); } catch (e) { L = null; } if (!L || !L.file) return;
      crew.push({ name: u.name, x: u.x, y: u.y, file: L.file, w: L.w, h: L.h, foot: L.foot }); });
    return { w: FS.w, h: FS.h, tiles: tiles, crew: crew, name: FS.boardDef ? FS.boardDef.name : null, laid: !!(FS.boardDef && FS.boardDef.laid), night: !!FS.night };
  }
  function bake(opts) {
    return new Promise(function (ok, no) {
      var f = document.createElement('iframe'), seen = null, t0 = performance.now();
      S.bakeF = f;   /* __SEARCH_THE_LOT_ANSWERS__: the board's page sits in the TOP page; it goes when this page goes (pagehide below) */
      f.title = 'the board'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:fixed;left:-12000px;top:0;width:480px;height:320px;border:0;visibility:hidden;pointer-events:none;z-index:-5';
      opts.campBoard = { tw: 160, dead: [], pick: function (grid) {
        try { seen = readFight(f.contentWindow); } catch (e) { seen = { err: String(e && e.message || e) }; }
        return { x: 0, y: 0, w: 1, h: 1, n: 1, win: { x: 0, y: 0, w: grid.w, h: grid.h } }; } };
      var set = function () { try { var cw = f.contentWindow; if (cw && cw.location && /BOHEMIA_FIGHT/.test(cw.location.href) && !cw.FIGHT_OPTS) cw.FIGHT_OPTS = opts; } catch (e) {} };
      var iv = setInterval(set, 4);
      f.addEventListener('load', function () { set(); clearInterval(iv); });
      /* beside the map, where a fight's page sits, when there is a map (a board laid from the map's block asks its parent for it) */
      var home = document; try { var T = topWin(); if (T && T.document.getElementById('cityFrame')) home = T.document; } catch (e) {}
      f.src = new URL('BOHEMIA_FIGHT.html', location.href).href;
      (home.body || home.documentElement).appendChild(f);
      var poll = setInterval(function () {
        var R0 = null; try { R0 = f.contentWindow.__CAMP_BOARD; } catch (e) {}
        if (!R0 && performance.now() - t0 < 45000) return;
        clearInterval(poll);
        if (!R0 || R0.err || !(R0.day || R0.night) || !seen || seen.err) { cleanup(); no(new Error((R0 && R0.err) || (seen && seen.err) || 'the board did not come')); return; }
        var src = (seen.night && R0.night) || R0.day || R0.night, c = document.createElement('canvas');
        c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0);
        var out = { board: seen, img: c, tw: R0.tw, th: R0.th || R0.tw * 364 / 515, ms: Math.round(performance.now() - t0) };
        cleanup(); ok(out);
      }, 100);
      function cleanup() { if (S.bakeF === f) S.bakeF = null; try { if (f.contentWindow && f.contentWindow.__fightLetGo) f.contentWindow.__fightLetGo(); } catch (e) {} try { f.remove(); } catch (e) {} }
    });
  }

  /* how light each tile's own ground is on the baked board (its middle, averaged): the detector is for dirt and yards, never the
     asphalt (the dealt board names one ground for the whole board, so the picture is the only place a road is written down) */
  function lumaOf(B, img, tw, th) {
    var c = document.createElement('canvas'); c.width = B.w * 4; c.height = B.h * 4; var x2 = c.getContext('2d'); x2.imageSmoothingEnabled = true;
    x2.drawImage(img, 0, 0, B.w * tw, B.h * th, 0, 0, c.width, c.height);
    var d = x2.getImageData(0, 0, c.width, c.height).data;
    for (var y = 0; y < B.h; y++) for (var x = 0; x < B.w; x++) { var L = 0, n = 0;
      for (var v = 1; v < 3; v++) for (var u = 1; u < 3; u++) { var i = ((y * 4 + v) * c.width + x * 4 + u) * 4; L += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
      B.tiles[y][x].luma = Math.round(L / n); }
  }

  /* ------------------------------------------------------------------ the view: the ground may zoom, the person may not */
  var W = 0, H = 0, DPR = 1;
  function size() {
    DPR = Math.min(3, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    [cv, cvB, cvM].forEach(function (c) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }); S.bgFor = null; S.midFor = null; S.cels = {};
  }
  function plateRect() { var p = document.getElementById('plate'); if (p.hidden) return null; var r = p.getBoundingClientRect(); return { l: r.left - 10, t: r.top - 10, r: r.right, b: r.bottom }; }
  function makeView(B) {
    /* upright, a phone: about six and a half tiles across, the board from the top of the glass and the plate in the strip under it;
       on its side and on a laptop: about seventy tiles of ground on the glass. The man stays the fight's man at every size. */
    var portrait = H > W * 1.15, T = portrait ? Math.max(44, Math.min(96, W / 6.4)) : Math.max(44, Math.min(96, Math.sqrt(W * H / (70 * S.AR))));
    var cols = W / T, rows = H / (T * S.AR);
    /* the crew at the left of the glass, the block opening out to the right of them (they stand on their line, as a fight deals them) */
    var c = R.centroid(B.crew), x0 = Math.min.apply(null, B.crew.map(function (m) { return m.x; })), cy = c.y * 0.6 + B.h / 2 * 0.4;
    var vx = Math.max(0, Math.min(B.w - cols, x0 - 0.35)), vy = rows >= B.h ? 0 : Math.max(0, Math.min(B.h - rows, cy + 0.5 - rows / 2));
    if (cols > B.w) vx = (B.w - cols) / 2;
    return { T: T, Th: T * S.AR, x: vx, y: vy, cols: cols, rows: rows };
  }
  function scr(x, y) { var V = S.view; return { x: (x - V.x) * V.T, y: (y - V.y) * V.Th }; }   /* board tiles (corner) -> css px */
  function feetOf(x, y) { return scr(x + 0.5, y + 0.9); }
  function onGlass(x, y, pad) { var p = scr(x + 0.5, y + 0.5), P = plateRect(); pad = pad || 0;
    if (p.x < pad || p.y < pad + 30 || p.x > W - pad || p.y > H - pad) return false;
    if (P && p.x > P.l - 20 && p.y > P.t - 40) return false; return true; }

  /* ------------------------------------------------------------------ start */
  S.start = function (o) {
    o = o || {}; S.o = o; S.pkg = o.pkg != null ? Math.max(0, Math.min(4, o.pkg | 0)) : 1;
    S.phase = 'baking'; size();
    /* __SEARCH_THE_LOT_ANSWERS__ (TOWN FIX 11/9, rule 438(b)): while the block's board bakes (seconds on a phone) the plate is on the glass
       already, saying SCAVENGE, and LEAVE works; a LEAVE before the board comes spends nothing (the town gives the four hours back) */
    try { document.getElementById('plate').hidden = false; plate(); } catch (e) {}
    var opts = o.fightOpts ? JSON.parse(JSON.stringify(o.fightOpts)) : shellOpts(o.ask || {});
    if (o.night != null) opts.night = !!o.night;
    return bake(opts).then(function (b) {
      S.board = b.board; S.img = b.img; S.tw = b.tw; S.th = b.th; S.AR = b.th / b.tw; S.bakeMs = b.ms;
      lumaOf(S.board, S.img, S.tw, S.th);
      document.getElementById('plate').hidden = false;
      S.view = makeView(S.board);
      var n = o.left == null ? R.MAX_SPOTS : Math.max(0, Math.min(R.MAX_SPOTS, o.left | 0));
      S.seed = (o.seed || opts.deal || opts.seed || 7) >>> 0;

        keep: function (s) { return onGlass(s.x, s.y, 24) && onGlass(s.sx, s.sy, 24); } }).map(function (s) { s.state = 'open'; return s; });
      S.men = S.board.crew.filter(function (c) { return onGlass(c.x, c.y, -40); }).map(function (c, i) {
        return { i: i, name: c.name, x: c.x, y: c.y, file: c.file, w: c.w, h: c.h, foot: c.foot, dir: 0, pose: 'stand', busy: false }; });
      if (!S.men.length) S.men = S.board.crew.slice(0, 1).map(function (c, i) { return { i: i, name: c.name, x: c.x, y: c.y, file: c.file, w: c.w, h: c.h, foot: c.foot, dir: 0, pose: 'stand', busy: false }; });
      S.men.forEach(function (m) { sheet(m.file); });
      document.getElementById('wait').style.display = 'none';
      readShell(); S.phase = S.spots.length ? 'play' : 'empty';
      plate();
      if (!S.spots.length) setTimeout(function () { finish('nothing to search'); }, CLK.bm * 4);
      requestAnimationFrame(frame);
      return S.state();
    }).catch(function (e) { S.err = String(e && e.message || e); S.phase = 'failed'; finish('the board did not come'); return S.state(); });
  };
  /* a man's sheet, and his standing poses cut out the moment it is in (one sheet a task: never a slow frame in the play) */
  function sheet(file) { if (S.sheets[file]) return S.sheets[file]; var im = new Image();
    im.onload = function () { try { S.men.forEach(function (m) { if (m.file === file) precut(m, [m.dir], [0, CLIP.walk[0], CLIP.walk[3]]); }); } catch (e) {} };
    im.src = 'fight_rig/' + file; S.sheets[file] = im; return im; }
  function precut(m, dirs, cols) { dirs.forEach(function (d) { cols.forEach(function (c) { cel(m, c, d); }); }); }

  /* ------------------------------------------------------------------ the plate (the phone's frame says SCAVENGE) */
  function plate() {
    ['house', 'ground', 'car'].forEach(function (k) {
      var row = document.querySelector('#plate .r[data-k="' + k + '"]'), n = S.spots.filter(function (s) { return s.kind === k && s.state === 'open'; }).length,
        all = S.spots.filter(function (s) { return s.kind === k; }).length;
      row.lastChild.textContent = 'x' + n; row.classList.toggle('on', !!(S.act && S.act.spot.kind === k)); row.classList.toggle('none', !all);
    });
    var f = document.getElementById('found'); f.innerHTML = '';
    S.finds.forEach(function (r) { if (!r.got) return; var i = document.createElement('i'); i.textContent = GOOD[r.got] || r.got; if (r.zone === 'kill') i.className = 'kill'; f.appendChild(i); });
    var c = document.getElementById('combo'); c.textContent = S.combo >= 2 ? 'x' + S.combo : ''; c.className = S.combo >= R.COMBO_STEPS[0] ? 'hot' : '';   /* the combo across spots: felt, never paid */
  }

  /* ------------------------------------------------------------------ THE CLOCK IS THE SONG'S (rule 158: window.BOHEMIA_BEAT, the one
     beat the shell books as HEARD; alone, this page's own 120). The beat count runs on from the page's first frame; only its phase
     is the song's. Read between spots, never inside a phrase: a phrase's beats keep the times they were given. */
  function beatAt(t) { return (t - CLK.t0) / CLK.bm; }
  function beatNow() { return beatAt(performance.now()); }
  function msAt(b) { return CLK.t0 + b * CLK.bm; }
  function readShell() {
    var T = topWin(); if (!T) return;
    try { var B = T.BOHEMIA_BEAT, st = B && typeof B.now === 'function' ? B.now() : null;
      if (st && st.beatMs > 0) { var t0 = performance.now() - (st.beatInBar + st.phase) * st.beatMs, bar = 4 * st.beatMs;
        CLK.t0 = t0 + Math.round((CLK.t0 - t0) / bar) * bar; CLK.bm = st.beatMs; CLK.src = st.src || 'song'; } } catch (e) {}
    /* the song that is playing: its root and its scale are the phrase's notes (read, never changed) */
    try { var f = T.eval('typeof MUS !== "undefined" && MUS && MUS.fac ? (function () { var f = MUS.fac(); return f ? { name: f.n || f.name || null, root: f.root, scale: f.scale } : null; })() : null');
      if (f && f.scale && f.scale.length && f.root > 0) S.song = { name: f.name, root: f.root | 0, scale: Array.prototype.slice.call(f.scale) }; } catch (e) {}
  }

      plank(ph.word.text, cx, cy + (G.up ? -Rr * 0.55 : Rr * 0.55) - (G.up ? 10 : -10) * wq, ZCOL[ph.word.zone] || '#ece4d0', ph.word.zone === 'miss' ? '#f2ece1' : '#2a2520'); }
    g.restore();
  }

  /* ------------------------------------------------------------------ the end: the finds go home through the screen that opened this */
  function finish(why) {
    if (S.done) return S.done;
    try { if (S.offs.length >= R.LAG.FROM) localStorage.setItem('boh.scav.lag', String(Math.round(S.lag))); } catch (e) {}
    try { if (S.out && S.out.g) { var A0 = S.out.AC, g0 = S.out.g; g0.gain.setTargetAtTime(0.0001, A0.currentTime + 0.5, 0.08); setTimeout(function () { try { g0.disconnect(); } catch (e) {} }, 1500); } } catch (e) {}
    var out = { type: 'BOHEMIA_SCAVENGE_DONE', why: why, finds: S.finds.map(function (r) { return { kind: r.kind, zone: r.zone, got: r.got, outcome: r.outcome, greedMult: r.greedMult, word: r.word }; }),
      spots: S.spots.length, played: S.finds.length, board: S.board ? S.board.name : null, err: S.err, combo: S.best };
    S.done = out; window.__SCAV_DONE = out;
    try { if (window.parent && window.parent !== window) { if (typeof window.parent.scavDone === 'function') window.parent.scavDone(out); else window.parent.postMessage(out, '*'); } } catch (e) {}
    setTimeout(function () { S.phase = 'closed'; }, 0);
    if (AGAIN) setTimeout(function () { var u = new URL(location.href); u.searchParams.set('seed', String((+(u.searchParams.get('seed') || 11) % 97) + 1)); location.replace(u.href); }, 1800);   /* the bench deals another block */
    return out;
  }
  S.finish = finish;
  S.state = function () {
    var A = S.act, ph = A && A.ph;
    return { phase: S.phase, err: S.err, pkg: S.pkg, beat: +beatNow().toFixed(3), now: performance.now(), clock: { t0: CLK.t0, bm: CLK.bm, src: CLK.src }, song: S.song || R.SONG,
      lag: S.lag, lat: S.lat, heard: S.heard, combo: S.combo, best: S.best, perf: Object.assign({}, S.perf), slow: S.slow.slice(),
      board: S.board ? { name: S.board.name, w: S.board.w, h: S.board.h, laid: S.board.laid, crew: S.board.crew.length } : null,
      view: S.view, tw: S.tw, bakeMs: S.bakeMs, men: S.men.map(function (m) { return { name: m.name, x: +m.x.toFixed(2), y: +m.y.toFixed(2), busy: m.busy, pose: m.pose }; }),
      spots: S.spots.map(function (s) { var t = S.board.tiles[s.y][s.x], st = S.board.tiles[s.sy][s.sx], p = scr(s.x + 0.5, s.y + 0.5);
        return { id: s.id, kind: s.kind, x: s.x, y: s.y, sx: s.sx, sy: s.sy, state: s.state, tile: t, stand: st, px: Math.round(p.x), py: Math.round(p.y), tiles: s.tiles || null }; }),
      act: A ? { spot: A.spot.id, kind: A.spot.kind, phase: A.phase, b0: ph ? ph.b0 : null, open: ph ? ph.open : null, lead: ph ? ph.P.lead : null, beats: ph ? ph.P.beats : null, row: ph ? ph.P.row : null,
        holds: ph ? ph.P.holds : null, call: ph ? ph.P.call.map(function (c) { return { b: c.b, at: msAt(ph.b0 + c.b), step: c.step }; }) : null, strays: ph ? ph.strays : 0, holding: !!(ph && ph.hold),
        notes: ph ? ph.notes.map(function (n) { return { i: n.i, b: n.b, type: n.type, at: n.at, born: n.born, hz: n.hz, res: n.res ? { zone: n.res.zone, ms: n.res.ms, word: n.res.word } : null }; }) : null,
        geo: A.geo ? { cx: A.geo.cx, cy: A.geo.cy, R: A.geo.R, up: A.geo.up, s: A.geo.s } : null } : null,
      finds: S.finds.slice(), log: S.log.slice(-60), done: S.done };
  };

  /* ------------------------------------------------------------------ input: anywhere on the glass */
  /* WHEN THE GLASS FELT IT: the event's own time stamp (a busy page gets round to a touch some ms after it happened; judging on
     the handler's time would put that wait on his thumb) */
  function stamp(e) { var now = performance.now(), t = e && e.timeStamp; return t > 0 && t <= now + 4 && now - t < 2000 ? t : now; }   /* (a stamp that is not this clock's, an old browser's, is not used) */
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); var t = stamp(e), o = out(); if (o && o.AC.state === 'suspended') try { o.AC.resume(); } catch (_e) {}
    if (S.act && S.act.phase === 'phrase' && S.act.spot.kind === 'car') { if (S.hold != null) return; S.hold = e.pointerId; }
    press('down', e.clientX, e.clientY, t); });
  function lift(e) { if (S.hold == null || e.pointerId !== S.hold) return; S.hold = null; press('up', e.clientX, e.clientY, stamp(e)); }
  window.addEventListener('pointerup', lift);
  window.addEventListener('pointercancel', lift);
  document.getElementById('leave').addEventListener('click', function () { if (S.phase === 'baking') return finish('left early'); finish('left'); });
  /* a board still baking in the top page when this page goes (LEAVE, the town gave up on it) is let go with it, never left running there */
  window.addEventListener('pagehide', function () { var f = S.bakeF; S.bakeF = null; if (!f) return; try { if (f.contentWindow && f.contentWindow.__fightLetGo) f.contentWindow.__fightLetGo(); } catch (e) {} try { f.remove(); } catch (e) {} });
  window.addEventListener('resize', function () { size(); if (S.board) { var keep = S.view; S.view = makeView(S.board); if (!S.view) S.view = keep;
    if (S.act && S.act.geo) S.act.geo = geoOf(S.act); S.fade = null; } });   /* a phone turned mid-phrase: the dial goes with the man */
  size();

  /* the bench: a template board of that kind, no map (&again=1: when a block is done or left, another is dealt: the VOTE card) */
  var q = new URLSearchParams(location.search); AGAIN = !!q.get('bench') && q.get('again') === '1';
  if (q.get('bench')) S.start({ fightOpts: { seed: +(q.get('seed') || 11), kind: q.get('bench'), district: q.get('bench'), night: q.get('night') === '1', deploy: false, odds: false, teach: false, keep: false, resume: false },
    pkg: q.get('pkg') != null ? +q.get('pkg') : 1, seed: +(q.get('seed') || 11), left: q.get('left') != null ? +q.get('left') : null });
})();
</script>
